      - name: 拉取上游代码并打补丁
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/temp_rep

          # 推送函数：使用远端当前 SHA 建立显式 lease，避免无条件覆盖分支。
          retry_push() {
            local remote_url="$1"
            local refspec="$2"
            local max_retries=3
            local retry_delay=10
            local branch="${refspec#HEAD:refs/heads/}"
            local remote_sha expected lease current
