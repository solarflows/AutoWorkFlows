# Reusable workflow: compile-packages
# 使用自建 SDK 编译指定的软件包列表 (替代 v1 的 compile-passwall + compile-packages)
# 由 firmware-build-unified.yml 调用
name: Compile Packages

on:
  workflow_call:
    inputs:
      # ── 矩阵 target 完整描述 ──
      matrix_target:             { required: true, type: string }
      matrix_repo:               { required: false, type: string, default: '' }
      matrix_ref:                { required: false, type: string, default: '' }
      matrix_config:             { required: true, type: string }
      matrix_packages_branch:    { required: true, type: string }
      matrix_passwall_repo:      { required: true, type: string }
      matrix_passwall_tag:        { required: true, type: string }
      matrix_firmware_release_repo: { required: false, type: string, default: '' }
      matrix_build_sdk_ib:       { required: false, type: boolean, default: false }
      matrix_artifacts_release_repo: { required: true, type: string }
      matrix_artifacts_release_tag:  { required: true, type: string }
      matrix_sdk_packages:       { required: false, type: string, default: '*' }
      # ── 默认值（workflow 内置）──
      defaults_repo:             { required: false, type: string, default: 'solarflows/AutoWorkflows' }
      packages_feed_repo:        { required: false, type: string, default: 'solarflows/openwrt-packages' }
      packages_feed_name:        { required: false, type: string, default: 'solarflows' }
      # ── 全局上下文 ──
      version:                   { required: true, type: string }
      sdk_version:               { required: true, type: string }
    secrets:
      ACCESS_TOKEN:              { required: true }
      APK_BUILD_KEY:             { required: false }
      USIGN_KEY:                 { required: false }

env:
  TZ: Asia/Shanghai

jobs:
  compile-packages:
    name: Compile ${{ inputs.matrix_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: packages-release-${{ inputs.matrix_target }}-${{ inputs.matrix_passwall_repo }}-${{ inputs.matrix_passwall_tag }}
      cancel-in-progress: false
    env:
      # 刻意加前缀: 裸 TARGET/HOST 会被 autoconf 的 AX_ENABLE_BUILDDIR 当作 builddir 名
      IMMWRT_TARGET: ${{ inputs.matrix_target }}
    steps:
      - name: Checkout defaults repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.defaults_repo }}
          path: AutoWorkFlows

      - name: Checkout packages feed repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.packages_feed_repo }}
          ref: ${{ inputs.matrix_packages_branch }}
          path: pkgs-feed
          fetch-depth: 1

      - name: Resolve SDK file name
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TAG="${{ inputs.matrix_artifacts_release_tag }}"
          REPO="${{ inputs.matrix_artifacts_release_repo }}"

          mkdir -p /tmp/sdk_index
          (cd /tmp/sdk_index && gh release download "$TAG" --repo "$REPO" --pattern "sdk-index.json" 2>/dev/null) || {
            echo "::error::sdk-index.json 不存在，SDK 增量路径不可用（需先跑 full 生成 SDK）"
            exit 1
          }

          # index.json 的 key 是源码 VERSION_NUMBER (如 21.02.7 / SNAPSHOT-20260801),
          # 与本次 run 的 inputs.sdk_version (构建时间戳) 无关,故取 built_at 最新的一条.
          VERSION=$(jq -r 'to_entries | sort_by(.value.built_at) | last | .key // empty' /tmp/sdk_index/sdk-index.json)
          SDK_FILE=$(jq -r --arg v "$VERSION" '.[$v].file // empty' /tmp/sdk_index/sdk-index.json)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK index.json 中无可用版本"
            jq . /tmp/sdk_index/sdk-index.json
            exit 1
          fi
          echo "📌 选用最新 SDK 版本: ${VERSION}"
          SDK_SHA256=$(jq -r --arg v "$VERSION" '.[$v].sha256 // empty' /tmp/sdk_index/sdk-index.json)
          SDK_SOURCE_SHA=$(jq -r --arg v "$VERSION" '.[$v].source_sha // empty' /tmp/sdk_index/sdk-index.json)
          if [ -z "$SDK_SHA256" ] || [ -z "$SDK_SOURCE_SHA" ]; then
            echo "::error::SDK index.json 的 ${VERSION} 记录缺少 sha256 或 source_sha"
            exit 1
          fi

          echo "sdk_file=${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "sdk_sha256=${SDK_SHA256}" >> $GITHUB_OUTPUT
          echo "sdk_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sdk_source_sha=${SDK_SOURCE_SHA}" >> $GITHUB_OUTPUT
          echo "📋 SDK: ${SDK_FILE}"

      - name: Download SDK tarball
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          mkdir -p sdk-dl
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern "${{ steps.resolve.outputs.sdk_file }}" \
            --pattern "${{ steps.resolve.outputs.sdk_file }}.sha256" \
            --dir sdk-dl/ 2>/dev/null || {
              gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
                --repo "${{ inputs.matrix_artifacts_release_repo }}" \
                --pattern "${{ steps.resolve.outputs.sdk_file }}" \
                --dir sdk-dl/
              (cd sdk-dl && sha256sum "${{ steps.resolve.outputs.sdk_file }}" > "${{ steps.resolve.outputs.sdk_file }}.sha256")
            }
          cd sdk-dl
          sha256sum -c "${{ steps.resolve.outputs.sdk_file }}.sha256" || {
            echo "::error::SDK tarball 损坏"
            exit 1
          }

      - name: Extract SDK
        run: |
          mkdir -p sdk
          tar xf sdk-dl/${{ steps.resolve.outputs.sdk_file }} -C sdk/ --strip-components=1
          echo "SDK 解包完成"
          ls sdk/

      - name: Setup Signing Key
        id: signing_key
        env:
          APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
          USIGN_KEY:     ${{ secrets.USIGN_KEY }}
        run: |
          set -euo pipefail
          # 包管理器从 SDK 的 Config-build.in 探测 (convert-config.pl 把 .config 转成
          # Kconfig 格式: CONFIG_USE_APK=y → "config USE_APK ... default y"; 21.02 无此
          # 选项), 而非 targets.json 的静态字段 (分支升级到 snapshot 会失效)。
          if grep -q '^config USE_APK' sdk/Config-build.in 2>/dev/null; then
            USE_APK=true
          else
            USE_APK=false
          fi
          echo "use_apk=${USE_APK}" >> $GITHUB_OUTPUT

          if [ "$USE_APK" = "true" ]; then
            # ════════════ APK 签名 (ECDSA/RSA PEM) ════════════
            SIGN_MODE="apk"
            if [ -z "$APK_BUILD_KEY" ]; then
              echo "::warning::APK_BUILD_KEY secret 未设置 — 产物未签名, 设备 apk add 需 --allow-untrusted"
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出字节数/指纹不输出内容。
            printf '%s' "$APK_BUILD_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > private-key.pem
            chmod 600 private-key.pem
            sed -i 's/\r$//' private-key.pem

            echo "🔍 验证密钥格式..."
            if openssl ec -in private-key.pem -check -noout 2>/dev/null; then
              echo "✅ ECDSA 私钥格式验证通过"
            elif openssl rsa -in private-key.pem -check -noout 2>/dev/null; then
              echo "::warning::APK_BUILD_KEY 是 RSA 密钥, ImmortalWrt APK 构建系统默认使用 ECDSA prime256v1"
              echo "::notice::建议重新生成 ECDSA 密钥: openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            else
              KEY_HEADER=$(head -c 50 private-key.pem 2>/dev/null)
              echo "::error::APK_BUILD_KEY 不是有效的 PEM 格式私钥 (需要 ECDSA prime256v1 或 RSA)"
              echo "::notice::密钥头部(仅 PEM header, 不含密钥): ${KEY_HEADER}"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续以完成 SDK 编译"
              rm -f private-key.pem
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi

            openssl ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null || \
              openssl rsa -in private-key.pem -pubout -out public-key.pem
            chmod 644 public-key.pem
            echo "✅ 公钥已派生 → public-key.pem"
            FP=$(openssl sha256 < public-key.pem | awk '{print $NF}')
          else
            # ════════════ IPK 签名 (usign Ed25519) ════════════
            SIGN_MODE="usign"
            # usign 私钥文件 = "untrusted comment: ..." 头 + base64(104 字节 seckey 结构)。
            # seckey 结构: pkalg[2]+kdfalg[2]+kdfrounds[4]+salt[16]+checksum[8]+fingerprint[8]+seckey[64]。
            # USIGN_KEY 存完整 key-build 文件内容, 由本地直接导入 (gh secret set USIGN_KEY < key-build)。
            if [ -z "$USIGN_KEY" ]; then
              echo "::warning::USIGN_KEY secret 未设置 — 构建系统将生成随机 usign 密钥, 设备 opkg install 需 --force-checksum"
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出指纹不输出内容。
            printf '%s\n' "$USIGN_KEY" > key-build
            chmod 600 key-build
            sed -i 's/\r$//' key-build

            # 校验 seckey 结构(104 字节)并派生公钥(42 字节)+指纹。
            # 二进制经文件管道处理, 不经 bash 变量 (bash 变量无法存 NUL 字节)。
            KEY_B64=$(grep -v '^untrusted comment:' key-build | tr -d '\n')
            printf '%s' "$KEY_B64" | base64 -d > .seckey.bin 2>/dev/null
            KEY_BYTES=$(wc -c < .seckey.bin)
            if [ "$KEY_BYTES" != "104" ]; then
              echo "::error::USIGN_KEY 不是有效的 usign 私钥 (seckey 结构 ${KEY_BYTES} 字节, 期望 104)"
              echo "::notice::请导入本地 key-build 文件: gh secret set USIGN_KEY --repo <repo> < key-build"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续"
              rm -f key-build .seckey.bin
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 指纹 = seckey 结构 offset 32..40 (8 字节), 与 usign -F 输出一致。
            FP=$(dd if=.seckey.bin bs=1 skip=32 count=8 2>/dev/null | od -An -tx1 | tr -d ' \n')
            # 公钥 = "Ed" + fingerprint[8] + pubkey[32] (pubkey 在 offset 72..104), 与 usign -G 输出一致。
            {
              printf 'untrusted comment: public key %s\n' "$FP"
              { printf 'Ed'; dd if=.seckey.bin bs=1 skip=32 count=8 2>/dev/null; dd if=.seckey.bin bs=1 skip=72 count=32 2>/dev/null; } | base64 -w 0
              printf '\n'
            } > key-build.pub
            chmod 644 key-build.pub
            rm -f .seckey.bin
            echo "📏 usign 私钥已注入 (104 字节结构, 不输出内容), 指纹 ${FP}"
          fi

          echo "sign_mode=${SIGN_MODE}" >> $GITHUB_OUTPUT
          echo "fingerprint=${FP}" >> $GITHUB_OUTPUT
          echo "🔑 ${SIGN_MODE} 签名密钥已注入 (指纹: ${FP:0:16}...)"

      - name: Resolve SDK packages
        id: resolve-pkgs
        run: |
          SDK_PKGS="${{ inputs.matrix_sdk_packages }}"
          if [ "$SDK_PKGS" = "*" ]; then
            CONFIG_FILE="AutoWorkFlows/openwrt-configs/immortalwrt/${{ inputs.matrix_config }}/sdk.config"
            if [ -f "$CONFIG_FILE" ]; then
              # 提取 CONFIG_PACKAGE_*=y 的包名,处理多子包目录折叠
              SDK_PKGS=$(grep '^CONFIG_PACKAGE_.*=[ym]' "$CONFIG_FILE" | sed 's/CONFIG_PACKAGE_\(.*\)=[ym]/\1/' | tr '\n' ' ')
              SDK_PKGS=$(echo "$SDK_PKGS" | sed 's/shadowsocksr-libev-ssr-[^ ]*/shadowsocksr-libev/g')
              SDK_PKGS=$(echo "$SDK_PKGS" | sed 's/simple-obfs-client/simple-obfs/g')
              SDK_PKGS=$(echo "$SDK_PKGS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
              # 传给 make 的列表: 移除 luci-i18n-* (随父 luci app 自动编译)
              BUILD_PKGS=$(echo "$SDK_PKGS" | sed 's/luci-i18n-[^ ]*//g' | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
            else
              echo "::warning::sdk.config 不存在"
              SDK_PKGS=""
              BUILD_PKGS=""
            fi
          else
            BUILD_PKGS="$SDK_PKGS"
          fi
          echo "packages=${BUILD_PKGS}" >> $GITHUB_OUTPUT
          echo "collect_packages=${SDK_PKGS}" >> $GITHUB_OUTPUT

      - name: Build packages via SDK
        if: steps.resolve-pkgs.outputs.packages != ''
        id: compile
        run: |
          PACKAGES="${{ steps.resolve-pkgs.outputs.packages }}"
          echo "📦 待编译: ${PACKAGES}"

          # 直接在 host 上使用自建 SDK (已含工具链,无需 docker 镜像)
          # 这也实现了「不再依赖 ghcr.io/openwrt/sdk:* 上游 Docker 容器」的目标
          cd sdk

          # Match scripts/docker/sdk-test (本地复现脚本): put the local feed in
          # package/ as a core-level overlay. OpenWrt keeps core packages ahead of
          # upstream feed copies.
          rm -rf "package/${{ inputs.packages_feed_name }}"
          cp -rlf "${{ github.workspace }}/pkgs-feed" "package/${{ inputs.packages_feed_name }}"
          test -f "package/${{ inputs.packages_feed_name }}/Makefile" || {
            echo "::error::本地 packages feed 未正确复制到 SDK"
            exit 1
          }

          # 签名: 密钥放在 SDK 根目录 (构建系统读取 ./private-key.pem 或 ./key-build)
          if [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ] && [ -f ../private-key.pem ]; then
            cp ../private-key.pem ./private-key.pem
            chmod 600 ./private-key.pem
            cp ../public-key.pem ./public-key.pem 2>/dev/null || true
            echo "🔑 SDK 软件包签名启用 (APK 密钥已注入 SDK 根目录)"
          elif [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ]; then
            echo "::warning::SDK 软件包未签名 (密钥缺失或无效), 设备 apk add 需 --allow-untrusted"
          else
            # IPK usign 路径: key-build 文件放 SDK 根目录 (构建系统读取 ./key-build)
            if [ -f ../key-build ]; then
              cp ../key-build ./key-build
              chmod 600 ./key-build
              cp ../key-build.pub ./key-build.pub 2>/dev/null || true
              echo "🔑 SDK 软件包 IPK 签名启用 (usign 密钥已注入 SDK 根目录)"
            else
              echo "::warning::SDK 软件包未签名 (usign 密钥缺失), 设备 opkg install 需 --force-checksum"
            fi
          fi

          echo "::group::📋 Configure feeds (local overlay first)"
          ./scripts/feeds update -a 2>&1
          ./scripts/feeds install -a 2>&1
          make defconfig 2>&1
          echo "::endgroup::"

          FAILED_PACKAGES=""
          # Compile each requested package and fail after collecting diagnostics.
          for pkg in $PACKAGES; do
            echo "::group::📦 Compile $pkg"
            make package/"$pkg"/download V=s 2>&1
            if ! make package/"$pkg"/compile \
              BUILD_LOG=1 V=s -j$(nproc 2>/dev/null || echo 4) 2>&1; then
              echo "::error::⚠️ $pkg build failed"
              FAILED_PACKAGES="$FAILED_PACKAGES $pkg"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED_PACKAGES" ]; then
            echo "::error::SDK packages failed:$FAILED_PACKAGES"
            exit 1
          fi

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p upload
          SDK_PKGS="${{ steps.resolve-pkgs.outputs.collect_packages }}"
          if [ -z "$SDK_PKGS" ]; then
            echo "⚠️ 无软件包列表,跳过收集"
          else
            for pkg in $SDK_PKGS; do
              find sdk/bin/packages/ -type f \( \
                -name "${pkg}_*.ipk" -o \
                -name "${pkg}_*.apk" -o \
                -name "${pkg}*.ipk" -o \
                -name "${pkg}*.apk" \
              \) -exec cp {} upload/ \; 2>/dev/null || true
            done
          fi
          if [ -f public-key.pem ]; then
            cp public-key.pem upload/solarflows-apk-public.pem
          elif [ -f key-build.pub ]; then
            cp key-build.pub upload/solarflows-usign-public.pub
          fi
          PACKAGE_COUNT=$(find upload/ -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | wc -l)
          FILE_COUNT=$(find upload/ -type f 2>/dev/null | wc -l)
          echo "package_count=${PACKAGE_COUNT}" >> $GITHUB_OUTPUT
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "📦 收集到 ${PACKAGE_COUNT} 个软件包, ${FILE_COUNT} 个文件"

          # ── 目录树: 整理好的 upload/ 交付物 (编译后 bin/ 已被过滤, 只展示最终整理结果) ──
          # 可选诊断展示: 管道失败(如 head 截断触发 SIGPIPE)不阻断构建
          echo ""
          echo "📂 upload/ 完整目录结构 (整理后):"
          echo '```text'
          find upload -print 2>/dev/null | sort | sed 's|^upload|.|' | head -200 || true
          echo '```'

      - name: Generate build info
        if: steps.artifacts.outputs.package_count > 0
        run: |
          PKG_COMMIT=$(git -C pkgs-feed rev-parse --short HEAD)
          PKG_COMMIT_FULL=$(git -C pkgs-feed rev-parse HEAD)
          PKG_FORMAT="${{ steps.signing_key.outputs.use_apk == 'true' && 'apk' || 'ipk' }}"
          cat > build-info.json <<JSONEOF
          {
            "target": "${IMMWRT_TARGET}",
            "config": "${{ inputs.matrix_config }}",
            "packages_repo": "${{ inputs.packages_feed_repo }}",
            "packages_branch": "${{ inputs.matrix_packages_branch }}",
            "packages_sha": "${PKG_COMMIT_FULL}",
            "packages_commit": "${PKG_COMMIT}",
            "packages_format": "${PKG_FORMAT}",
            "sdk_version": "${{ inputs.sdk_version }}",
            "sdk_file": "${{ steps.resolve.outputs.sdk_file }}",
            "build_mode": "sdk",
            "release_tag": "${{ inputs.version }}",
            "passwall_repo": "${{ inputs.matrix_passwall_repo }}",
            "passwall_tag": "${{ inputs.matrix_passwall_tag }}",
            "release_repo": "${{ inputs.matrix_passwall_repo }}",
            "use_apk": ${{ steps.signing_key.outputs.use_apk }},
            "signing_key_fingerprint": "${{ steps.signing_key.outputs.fingerprint || 'none' }}",
            "signing_mode": "${{ steps.signing_key.outputs.sign_mode || 'none' }}",
            "file_count": "${{ steps.artifacts.outputs.file_count }}",
            "timestamp": "$(TZ=$TZ date +'%Y-%m-%d %H:%M:%S')"
          }
          JSONEOF

      - name: Upload packages artifact
        if: steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-packages
          path: upload/
          retention-days: 7

      - name: Upload build info
        if: steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-build-info
          path: build-info.json
          retention-days: 7

      - name: Resolve IB file for combined build
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        id: resolve-ib
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ib_index
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern ib-index.json --dir /tmp/ib_index
          VERSION="${{ steps.resolve.outputs.sdk_version }}"
          SDK_SOURCE_SHA="${{ steps.resolve.outputs.sdk_source_sha }}"
          IB_FILE=$(jq -r --arg v "$VERSION" --arg src "$SDK_SOURCE_SHA" \
            '.[$v] | select(.source_sha == $src) | .file // empty' /tmp/ib_index/ib-index.json)
          [ -n "$IB_FILE" ] || {
            echo "::error::没有与 SDK ${VERSION} (${SDK_SOURCE_SHA}) 同源的 IB"
            exit 1
          }
          echo "ib_file=$IB_FILE" >> "$GITHUB_OUTPUT"
          echo "ib_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and extract IB for combined build
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ib-dl ib
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern "${{ steps.resolve-ib.outputs.ib_file }}" \
            --pattern "${{ steps.resolve-ib.outputs.ib_file }}.sha256" \
            --dir ib-dl
          (cd ib-dl && sha256sum -c "${{ steps.resolve-ib.outputs.ib_file }}.sha256")
          tar xf "ib-dl/${{ steps.resolve-ib.outputs.ib_file }}" -C ib --strip-components=1
          mkdir -p ib/packages
          find upload -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} ib/packages/ \;

      - name: Build firmware via IB from SDK packages
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        id: build-ib
        run: |
          set -euo pipefail
          SEED_DIR="AutoWorkFlows/openwrt-configs/immortalwrt/${{ inputs.matrix_config }}"
          PACKAGES=$(find "$SEED_DIR" -type f -name '*.seed' -print0 | xargs -0 cat | \
            grep -E '^CONFIG_PACKAGE_[a-zA-Z0-9_-]+=y$' | \
            sed -E 's/CONFIG_PACKAGE_([^=]+)=y/\1/' | sort -u | tr '\n' ' ')
          # IB 固件签名: 与 SDK 共用同一对密钥 (通过 BUILD_KEY_APK_* 注入 make image)
          # fingerprint=none 表示密钥缺失/无效, IB 固件同样跳过签名
          SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
          if [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ] && [ "$SIGN_FP" != "none" ] && [ -n "$SIGN_FP" ] && [ -f private-key.pem ]; then
            export BUILD_KEY_APK_SEC="${GITHUB_WORKSPACE}/private-key.pem"
            export BUILD_KEY_APK_PUB="${GITHUB_WORKSPACE}/public-key.pem"
            echo "🔑 IB 固件签名启用 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ]; then
            echo "::warning::IB 固件未签名 (密钥缺失或无效), 设备 apk add 需 --allow-untrusted"
          else
            # IPK usign 路径: IB 读取根目录 key-build 文件签名 (make image 内同源码树)
            if [ "$SIGN_FP" != "none" ] && [ -n "$SIGN_FP" ] && [ -f key-build ]; then
              cp key-build ib/key-build
              chmod 600 ib/key-build
              cp key-build.pub ib/key-build.pub 2>/dev/null || true
              echo "🔑 IB 固件 IPK 签名启用 (usign 公钥指纹 ${SIGN_FP:0:16}...)"
            else
              echo "::warning::IB 固件未签名 (usign 密钥缺失), 设备 opkg install 需 --force-checksum"
            fi
          fi
          mkdir -p ib/release/firmware
          cd ib
          make image PACKAGES="$PACKAGES" 2>&1 | tee ib-build.log
          find bin/targets -type f -not -path '*/packages/*' -exec cp {} release/firmware/ \;
          test -n "$(find release/firmware -type f -print -quit)" || {
            echo "::error::IB 未生成固件"
            exit 1
          }

      - name: Upload combined firmware artifact
        if: success() && inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.matrix_target }}-sdk-ib-firmware
          path: ib/release/firmware
          retention-days: 7

      - name: Publish combined firmware
        if: success() && inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0 && inputs.matrix_firmware_release_repo != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
          SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
          if [ "$SIGN_MODE" = "apk" ]; then
            SIGN_LINE="- 签名: ✅ APK 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "usign" ]; then
            SIGN_LINE="- 签名: ✅ usign 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "random" ]; then
            SIGN_LINE="- 签名: ⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
          else
            SIGN_LINE="- 签名: ❌ 未签名"
          fi
          cat > combined-release.md <<EOF
          ## ${{ inputs.matrix_target }} SDK + IB

          - 软件版本: ${{ inputs.version }}
          - IB 基线版本: ${{ steps.resolve-ib.outputs.ib_version }}
          - packages: ${{ inputs.matrix_packages_branch }} @ $(git -C pkgs-feed rev-parse --short HEAD)
          ${SIGN_LINE}
          EOF
          TAG="${{ inputs.version }}"
          REPO="${{ inputs.matrix_firmware_release_repo }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" ib/release/firmware/* --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file combined-release.md --draft=false
          else
            gh release create "$TAG" --repo "$REPO" --title "${{ inputs.matrix_target }} Build $TAG" \
              --notes-file combined-release.md ib/release/firmware/*
          fi

      - name: Publish SDK packages
        if: steps.artifacts.outputs.package_count > 0
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t PACKAGE_FILES < <(find upload -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.pem' \))
          [ "${#PACKAGE_FILES[@]}" -gt 0 ] || { echo "::error::SDK 产物目录为空"; exit 1; }
          PACKAGE_REPO="${{ inputs.matrix_passwall_repo }}"
          PACKAGE_TAG="${{ inputs.matrix_passwall_tag }}"
          PACKAGE_COMMIT=$(jq -r '.packages_commit' build-info.json)
          PACKAGE_SHA=$(jq -r '.packages_sha' build-info.json)
          PACKAGE_FORMAT=$(jq -r '.packages_format' build-info.json)
          if gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            gh release upload "$PACKAGE_TAG" --repo "$PACKAGE_REPO" "${PACKAGE_FILES[@]}" --clobber
            EXISTING=$(gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --json body --jq '.body // ""')
            SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
            SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
            if [ "$SIGN_MODE" = "apk" ]; then
              SIGN_TEXT="✅ APK 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "usign" ]; then
              SIGN_TEXT="✅ usign 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "random" ]; then
              SIGN_TEXT="⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
            else
              SIGN_TEXT="❌ 未签名"
            fi
            printf '%b\n' "${EXISTING}\n\n---\n### ${IMMWRT_TARGET} - SDK 构建 (.${PACKAGE_FORMAT})\n- commit: [\`${PACKAGE_COMMIT}\`](${PACKAGE_REPO}/commit/${PACKAGE_SHA}) - $(TZ=$TZ date +'%Y-%m-%d %H:%M')\n- 签名: ${SIGN_TEXT}" > release-notes.md
            gh release edit "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --notes-file release-notes.md
          else
            SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
            SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
            if [ "$SIGN_MODE" = "apk" ]; then
              SIGN_TEXT="✅ APK 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "usign" ]; then
              SIGN_TEXT="✅ usign 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "random" ]; then
              SIGN_TEXT="⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
            else
              SIGN_TEXT="❌ 未签名"
            fi
            printf '## Passwall Packages\n\n- **%s**: SDK 构建 (.%s), commit [`%s`](%s/commit/%s)\n- 签名: %s\n' \
              "$IMMWRT_TARGET" "$PACKAGE_FORMAT" "$PACKAGE_COMMIT" "$PACKAGE_REPO" "$PACKAGE_SHA" "$SIGN_TEXT" > release-notes.md
            gh release create "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --title "Passwall Packages" \
              --notes-file release-notes.md --latest=false "${PACKAGE_FILES[@]}"
          fi

      - name: Upload published state
        if: success() && steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-published-state
          path: build-info.json
          retention-days: 7

      - name: SDK Build Diagnostics
        if: failure()
        run: |
          echo "> 👈 触发/目标/版本等整体计划见 **Plan job Summary**" >> "$GITHUB_STEP_SUMMARY"
          echo "## ❌ SDK 软件包构建失败" >> "$GITHUB_STEP_SUMMARY"
          # 权威失败源: error.txt (make ERROR 宏写入 "ERROR: <pkg> failed to build.")
          # time.pl 无论命令成败都打印 "time:" 行 (scripts/time.pl), 失败日志同样以
          # "time:" 结尾, 故 compile.txt 末行是否 time: 不能判定失败; 仅保留为中断日志兜底。
          FAILED_PKGS=""
          if [ -d sdk/logs ]; then
            # 1) error.txt 权威源
            for errfile in $(find sdk/logs -name 'error.txt' -type f 2>/dev/null | sort); do
              while IFS= read -r line; do
                pkg=$(echo "$line" | sed -n 's/.*ERROR: \(.*\) failed to build.*/\1/p' | sed 's/ \[[^]]*\]$//')
                [ -n "$pkg" ] && FAILED_PKGS="$FAILED_PKGS $pkg"
              done < "$errfile"
            done
            # 2) 兜底: 末行不含 time: 的 compile.txt (日志被中断如 OOM, 无 error.txt)
            for logfile in $(find sdk/logs -name 'compile.txt' -type f 2>/dev/null | sort); do
              LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
              if ! echo "$LAST_LINE" | grep -q '^time:'; then
                PKG=$(echo "$logfile" | sed 's|.*logs/||; s|/compile.txt||')
                FAILED_PKGS="$FAILED_PKGS $PKG"
              fi
            done
          fi

          if [ -n "$FAILED_PKGS" ]; then
            FAILED_PKGS=$(echo "$FAILED_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            PKG_COUNT=$(echo "$FAILED_PKGS" | wc -l)
            echo "共 ${PKG_COUNT} 个软件包编译失败" >> "$GITHUB_STEP_SUMMARY"
            for pkg in $FAILED_PKGS; do
              echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              # 完整输出日志, 不截断/过滤; 仅对超大文件 (>300KB) 保护显示尾部 1000 行
              for LOGFILE in "sdk/logs/$pkg/compile.txt" "sdk/logs/$pkg/host-compile.txt" "sdk/logs/$pkg/download.txt"; do
                [ -f "$LOGFILE" ] || continue
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "▍$LOGFILE ▍" >> "$GITHUB_STEP_SUMMARY"
                SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 300000 ]; then
                  echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行; 完整内容见 artifact]" >> "$GITHUB_STEP_SUMMARY"
                  tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                else
                  cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -50 sdk/ib-build.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi