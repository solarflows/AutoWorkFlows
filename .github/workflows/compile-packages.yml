# Reusable workflow: compile-packages
# 使用自建 SDK 编译指定的软件包列表 (替代 v1 的 compile-passwall + compile-packages)
# 由 firmware-build-unified.yml 调用
name: Compile Packages

on:
  workflow_call:
    inputs:
      # ── 矩阵 target 完整描述 ──
      matrix_target:             { required: true, type: string }
      matrix_repo:               { required: false, type: string, default: '' }
      matrix_ref:                { required: false, type: string, default: '' }
      matrix_config:             { required: true, type: string }
      matrix_packages_branch:    { required: true, type: string }
      matrix_passwall_repo:      { required: true, type: string }
      matrix_passwall_tag:        { required: true, type: string }
      matrix_firmware_release_repo: { required: false, type: string, default: '' }
      matrix_build_sdk_ib:       { required: false, type: boolean, default: false }
      matrix_artifacts_release_repo: { required: true, type: string }
      matrix_artifacts_release_tag:  { required: true, type: string }
      matrix_sdk_packages:       { required: false, type: string, default: '*' }
      # ── 默认值（workflow 内置）──
      defaults_repo:             { required: false, type: string, default: 'solarflows/AutoWorkflows' }
      packages_feed_repo:        { required: false, type: string, default: 'solarflows/openwrt-packages' }
      packages_feed_name:        { required: false, type: string, default: 'solarflows' }
      # ── 全局上下文 ──
      version:                   { required: true, type: string }
      sdk_version:               { required: true, type: string }
      cache_strategy:            { required: false, type: string, default: 'smart' }
    secrets:
      ACCESS_TOKEN:              { required: true }
      APK_BUILD_KEY:             { required: false }
      USIGN_KEY:                 { required: false }

env:
  TZ: Asia/Shanghai

jobs:
  compile-packages:
    name: Compile ${{ inputs.matrix_target }}
    runs-on: ubuntu-24.04
    # qualcommax 首次构建 golang host 工具链耗时显著更长:
    # run 31860987009 在 120 分钟时仍处于 haproxy 依赖编译阶段。
    timeout-minutes: ${{ inputs.matrix_target == 'qualcommax' && 240 || 120 }}
    concurrency:
      group: packages-release-${{ inputs.matrix_target }}-${{ inputs.matrix_passwall_repo }}-${{ inputs.matrix_passwall_tag }}
      cancel-in-progress: false
    env:
      # 刻意加前缀: 裸 TARGET/HOST 会被 autoconf 的 AX_ENABLE_BUILDDIR 当作 builddir 名
      IMMWRT_TARGET: ${{ inputs.matrix_target }}
    steps:
      - name: Checkout defaults repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.defaults_repo }}
          path: AutoWorkFlows

      - name: Checkout packages feed repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.packages_feed_repo }}
          ref: ${{ inputs.matrix_packages_branch }}
          path: pkgs-feed
          fetch-depth: 1

      - name: Resolve SDK file name
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TAG="${{ inputs.matrix_artifacts_release_tag }}"
          REPO="${{ inputs.matrix_artifacts_release_repo }}"

          mkdir -p /tmp/sdk_index
          (cd /tmp/sdk_index && gh release download "$TAG" --repo "$REPO" --pattern "sdk-index.json" 2>/dev/null) || {
            echo "::error::sdk-index.json 不存在，SDK 增量路径不可用（需先跑 full 生成 SDK）"
            exit 1
          }

          # index.json 的 key 是源码 VERSION_NUMBER (如 21.02.7 / SNAPSHOT-20260801),
          # 与本次 run 的 inputs.sdk_version (构建时间戳) 无关,故取 built_at 最新的一条.
          VERSION=$(jq -r 'to_entries | sort_by(.value.built_at) | last | .key // empty' /tmp/sdk_index/sdk-index.json)
          SDK_FILE=$(jq -r --arg v "$VERSION" '.[$v].file // empty' /tmp/sdk_index/sdk-index.json)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::SDK index.json 中无可用版本"
            jq . /tmp/sdk_index/sdk-index.json
            exit 1
          fi
          echo "📌 选用最新 SDK 版本: ${VERSION}"
          SDK_SHA256=$(jq -r --arg v "$VERSION" '.[$v].sha256 // empty' /tmp/sdk_index/sdk-index.json)
          SDK_SOURCE_SHA=$(jq -r --arg v "$VERSION" '.[$v].source_sha // empty' /tmp/sdk_index/sdk-index.json)
          if [ -z "$SDK_SHA256" ] || [ -z "$SDK_SOURCE_SHA" ]; then
            echo "::error::SDK index.json 的 ${VERSION} 记录缺少 sha256 或 source_sha"
            exit 1
          fi

          echo "sdk_file=${SDK_FILE}" >> $GITHUB_OUTPUT
          echo "sdk_sha256=${SDK_SHA256}" >> $GITHUB_OUTPUT
          echo "sdk_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sdk_source_sha=${SDK_SOURCE_SHA}" >> $GITHUB_OUTPUT
          echo "📋 SDK: ${SDK_FILE}"

      - name: Download SDK tarball
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          mkdir -p sdk-dl
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern "${{ steps.resolve.outputs.sdk_file }}" \
            --pattern "${{ steps.resolve.outputs.sdk_file }}.sha256" \
            --dir sdk-dl/ 2>/dev/null || {
              gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
                --repo "${{ inputs.matrix_artifacts_release_repo }}" \
                --pattern "${{ steps.resolve.outputs.sdk_file }}" \
                --dir sdk-dl/
              (cd sdk-dl && sha256sum "${{ steps.resolve.outputs.sdk_file }}" > "${{ steps.resolve.outputs.sdk_file }}.sha256")
            }
          cd sdk-dl
          sha256sum -c "${{ steps.resolve.outputs.sdk_file }}.sha256" || {
            echo "::error::SDK tarball 损坏"
            exit 1
          }

      # ───────── 解压 SDK 与恢复 ccache ─────────
      # 架构设计说明：
      # 将 SDK 直接解压到 openwrt/ 而非 sdk/ 目录，使 SDK 增量编译的工作区结构
      # 与 compile-firmware.yml 全量编译完全同构（TOPDIR 均为 openwrt）。
      # 这使 OpenWrt 官方 rules.mk 原生导出的 CCACHE_DIR=$(TOPDIR)/.ccache
      # 在两套工作流中天然指向相同的 openwrt/.ccache，彻底消除 GitHub Actions
      # actions/cache 因 path 字符串不同导致的 Cache Version 签名不匹配和跨目录软链接开销。
      - name: Extract SDK
        run: |
          mkdir -p openwrt
          tar xf sdk-dl/${{ steps.resolve.outputs.sdk_file }} -C openwrt/ --strip-components=1
          echo "SDK 解包完成 (解压至 openwrt/ 对齐全量编译目录树)"
          ls openwrt/

      # ───────── SDK 专用工具缓存（先专用、未命中时独立回退全量）─────────
      # Actions Cache 的 version 由 path 列表参与计算，不能把不同 path 的
      # SDK cache 与 full toolchain cache 放进同一个 restore-keys。先恢复 SDK
      # 自有快照；只有完全未命中时，第二个 restore 才使用 full workflow 的
      # 原样 path，避免把“前缀命中”误当成 SDK 专用缓存。
      - name: Find SDK and shared cache snapshots
        id: sdk-cache-lookup
        if: inputs.cache_strategy != 'no-cache' && inputs.cache_strategy != 'clean-all'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # actions/cache/restore exposes only cache-hit; it does not expose the
          # key selected by restore-keys. Resolve an accessible immutable key first,
          # then restore that key exactly. If the API lookup fails or misses, do not
          # assume an SDK snapshot was restored; use the independent full fallback.
          set -uo pipefail
          CACHE_STRATEGY="${{ inputs.cache_strategy }}"
          REPO="${{ github.repository }}"
          CURRENT_REF="${GITHUB_REF:-}"
          DEFAULT_BRANCH=$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name' 2>/dev/null)
          if [ -n "$DEFAULT_BRANCH" ]; then
            DEFAULT_REF="refs/heads/${DEFAULT_BRANCH}"
          else
            DEFAULT_REF=""
            echo "⚠️ 无法读取默认分支, 仅查询当前 ref: ${CURRENT_REF:-unknown}" >&2
          fi

          lookup_cache() {
            local prefix="$1"
            local cache_json lookup_rc
            cache_json=$(gh cache list --repo "$REPO" --key "$prefix" --limit 100 \
              --sort created_at --order desc --json key,ref,createdAt 2>/dev/null)
            lookup_rc=$?
            if [ "$lookup_rc" -ne 0 ]; then
              return 2
            fi
            printf '%s\n' "$cache_json" | jq -r \
              --arg current "$CURRENT_REF" --arg default_ref "$DEFAULT_REF" '
                [ .[] | select(.ref == $current or (.ref == $default_ref and $default_ref != "")) ]
                | sort_by(.createdAt)
                | if length == 0 then empty else last | [.key, .ref] | @tsv end
              '
          }

          resolve_cache() {
            local label="$1" prefix="$2" fallback_key="$3" result rc key ref
            result=$(lookup_cache "$prefix")
            rc=$?
            if [ "$rc" -eq 0 ] && [ -n "$result" ]; then
              IFS=$'\t' read -r key ref <<< "$result"
              echo "${label}_found=true" >> "$GITHUB_OUTPUT"
              echo "${label}_key=$key" >> "$GITHUB_OUTPUT"
              echo "${label}_ref=$ref" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_key=$key" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_keys=" >> "$GITHUB_OUTPUT"
              echo "✅ 找到 ${label} 缓存: ${key} (${ref})"
            elif [ "$rc" -eq 2 ]; then
              echo "${label}_found=false" >> "$GITHUB_OUTPUT"
              echo "${label}_key=" >> "$GITHUB_OUTPUT"
              echo "${label}_ref=" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_key=$fallback_key" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_keys=${prefix}" >> "$GITHUB_OUTPUT"
              echo "${label}_lookup=failed" >> "$GITHUB_OUTPUT"
              echo "⚠️ 查询 ${label} 缓存失败, 将尝试 restore-keys: ${prefix}" >&2
            else
              echo "${label}_found=false" >> "$GITHUB_OUTPUT"
              echo "${label}_key=" >> "$GITHUB_OUTPUT"
              echo "${label}_ref=" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_key=$fallback_key" >> "$GITHUB_OUTPUT"
              echo "${label}_restore_keys=${prefix}" >> "$GITHUB_OUTPUT"
              echo "${label}_lookup=miss" >> "$GITHUB_OUTPUT"
              echo "ℹ️ 未找到可访问的 ${label} 缓存"
            fi
          }

          SDK_PREFIX="immwrt-v2-sdk-hostpkg-${IMMWRT_TARGET}-${{ steps.resolve.outputs.sdk_source_sha }}-"
          FULL_PREFIX="immwrt-v2-toolchain-${IMMWRT_TARGET}-"
          CCACHE_PREFIX="immwrt-v2-ccache-${IMMWRT_TARGET}-"
          resolve_cache sdk "$SDK_PREFIX" "${SDK_PREFIX}${GITHUB_RUN_ID}"
          resolve_cache full "${FULL_PREFIX}" "${FULL_PREFIX}sdk-fallback-${GITHUB_RUN_ID}"
          resolve_cache ccache "$CCACHE_PREFIX" "${CCACHE_PREFIX}${GITHUB_RUN_ID}"

      - name: Restore SDK hostpkg cache
        id: cache-hostpkg-restore
        if: steps.sdk-cache-lookup.outputs.sdk_found == 'true' && inputs.cache_strategy != 'clean-toolchain'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          # The public restore action exposes only cache-hit. Resolve the
          # immutable snapshot key first, then restore it exactly.
          key: ${{ steps.sdk-cache-lookup.outputs.sdk_restore_key }}
          path: |
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/target-*/host
            openwrt/dl/cargo
            openwrt/dl/rustc
            openwrt/tmp/go-build

      - name: Restore full toolchain cache for SDK fallback
        id: cache-sdk-toolchain-fallback
        # Use the full cache only when the source-specific SDK snapshot was not
        # restored exactly. The path list remains identical to the full producer.
        if: (steps.sdk-cache-lookup.outputs.sdk_found != 'true' || steps.cache-hostpkg-restore.outputs.cache-hit != 'true') && inputs.cache_strategy != 'no-cache' && inputs.cache_strategy != 'clean-all' && inputs.cache_strategy != 'clean-toolchain'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.sdk-cache-lookup.outputs.full_restore_key }}
          restore-keys: ${{ steps.sdk-cache-lookup.outputs.full_restore_keys }}
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      # ───────── ccache 共享恢复（与 compile-firmware 完全同构）─────────
      # SDK 只消费全量工作流维护的共享 ccache，不保存或清理 immwrt-v2-ccache-*。
      # 两边都使用 openwrt/.ccache；rules.mk 原生导出 CCACHE_DIR/CCACHE_BASEDIR，
      # 因而同一 target 的对象可以被 SDK 增量构建复用，清理权仍归 full executor。
      - name: Restore ccache
        id: cache-cc-restore
        if: inputs.cache_strategy != 'no-cache' && inputs.cache_strategy != 'clean-all' && inputs.cache_strategy != 'clean-ccache'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.sdk-cache-lookup.outputs.ccache_restore_key }}
          restore-keys: ${{ steps.sdk-cache-lookup.outputs.ccache_restore_keys }}
          path: openwrt/.ccache

      - name: Setup Signing Key
        id: signing_key
        env:
          APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
          USIGN_KEY:     ${{ secrets.USIGN_KEY }}
        run: |
          set -euo pipefail
          # 包管理器从 SDK 的 Config-build.in 探测 (convert-config.pl 把 .config 转成
          # Kconfig 格式: CONFIG_USE_APK=y → "config USE_APK ... default y"; 21.02 无此
          # 选项), 而非 targets.json 的静态字段 (分支升级到 snapshot 会失效)。
          if grep -q '^config USE_APK' openwrt/Config-build.in 2>/dev/null; then
            USE_APK=true
          else
            USE_APK=false
          fi
          echo "use_apk=${USE_APK}" >> $GITHUB_OUTPUT

          if [ "$USE_APK" = "true" ]; then
            # ════════════ APK 签名 (ECDSA/RSA PEM) ════════════
            SIGN_MODE="apk"
            if [ -z "$APK_BUILD_KEY" ]; then
              echo "::warning::APK_BUILD_KEY secret 未设置 — 产物未签名, 设备 apk add 需 --allow-untrusted"
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出字节数/指纹不输出内容。
            printf '%s' "$APK_BUILD_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > private-key.pem
            chmod 600 private-key.pem
            sed -i 's/\r$//' private-key.pem

            echo "🔍 验证密钥格式..."
            if openssl ec -in private-key.pem -check -noout 2>/dev/null; then
              echo "✅ ECDSA 私钥格式验证通过"
            elif openssl rsa -in private-key.pem -check -noout 2>/dev/null; then
              echo "::warning::APK_BUILD_KEY 是 RSA 密钥, ImmortalWrt APK 构建系统默认使用 ECDSA prime256v1"
              echo "::notice::建议重新生成 ECDSA 密钥: openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            else
              KEY_HEADER=$(head -c 50 private-key.pem 2>/dev/null)
              echo "::error::APK_BUILD_KEY 不是有效的 PEM 格式私钥 (需要 ECDSA prime256v1 或 RSA)"
              echo "::notice::密钥头部(仅 PEM header, 不含密钥): ${KEY_HEADER}"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续以完成 SDK 编译"
              rm -f private-key.pem
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi

            openssl ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null || \
              openssl rsa -in private-key.pem -pubout -out public-key.pem
            chmod 644 public-key.pem
            echo "✅ 公钥已派生 → public-key.pem"
            FP=$(openssl sha256 < public-key.pem | awk '{print $NF}')
          else
            # ════════════ IPK 签名 (usign Ed25519) ════════════
            SIGN_MODE="usign"
            # usign 私钥文件 = "untrusted comment: ..." 头 + base64(104 字节 seckey 结构)。
            # seckey 结构: pkalg[2]+kdfalg[2]+kdfrounds[4]+salt[16]+checksum[8]+fingerprint[8]+seckey[64]。
            # USIGN_KEY 存完整 key-build 文件内容, 由本地直接导入 (gh secret set USIGN_KEY < key-build)。
            if [ -z "$USIGN_KEY" ]; then
              echo "::warning::USIGN_KEY secret 未设置 — 构建系统将生成随机 usign 密钥, 设备 opkg install 需 --force-checksum"
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出指纹不输出内容。
            printf '%s\n' "$USIGN_KEY" > key-build
            chmod 600 key-build
            sed -i 's/\r$//' key-build

            # 校验 seckey 结构(104 字节)并派生公钥(42 字节)+指纹。
            # 二进制经文件管道处理, 不经 bash 变量 (bash 变量无法存 NUL 字节)。
            KEY_B64=$(grep -v '^untrusted comment:' key-build | tr -d '\n')
            printf '%s' "$KEY_B64" | base64 -d > .seckey.bin 2>/dev/null
            KEY_BYTES=$(wc -c < .seckey.bin)
            if [ "$KEY_BYTES" != "104" ]; then
              echo "::error::USIGN_KEY 不是有效的 usign 私钥 (seckey 结构 ${KEY_BYTES} 字节, 期望 104)"
              echo "::notice::请导入本地 key-build 文件: gh secret set USIGN_KEY --repo <repo> < key-build"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续"
              rm -f key-build .seckey.bin
              echo "sign_mode=random" >> $GITHUB_OUTPUT
              echo "fingerprint=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            # 指纹 = seckey 结构 offset 32..40 (8 字节), 与 usign -F 输出一致。
            FP=$(dd if=.seckey.bin bs=1 skip=32 count=8 2>/dev/null | od -An -tx1 | tr -d ' \n')
            # 公钥 = "Ed" + fingerprint[8] + pubkey[32] (pubkey 在 offset 72..104), 与 usign -G 输出一致。
            {
              printf 'untrusted comment: public key %s\n' "$FP"
              { printf 'Ed'; dd if=.seckey.bin bs=1 skip=32 count=8 2>/dev/null; dd if=.seckey.bin bs=1 skip=72 count=32 2>/dev/null; } | base64 -w 0
              printf '\n'
            } > key-build.pub
            chmod 644 key-build.pub
            rm -f .seckey.bin
            echo "📏 usign 私钥已注入 (104 字节结构, 不输出内容), 指纹 ${FP}"
          fi

          echo "sign_mode=${SIGN_MODE}" >> $GITHUB_OUTPUT
          echo "fingerprint=${FP}" >> $GITHUB_OUTPUT
          echo "🔑 ${SIGN_MODE} 签名密钥已注入 (指纹: ${FP:0:16}...)"

      - name: Resolve SDK packages
        id: resolve-pkgs
        run: |
          SDK_PKGS="${{ inputs.matrix_sdk_packages }}"
          if [ "$SDK_PKGS" = "*" ]; then
            CONFIG_FILE="AutoWorkFlows/openwrt-configs/immortalwrt/${{ inputs.matrix_config }}/sdk.config"
            if [ -f "$CONFIG_FILE" ]; then
              # 只提取小写包名; CONFIG_PACKAGE_ 前缀也覆盖 INCLUDE/Basic_Core
              # 等大写 Kconfig 选择项, 这些选项不是可直接 make 的包目录。
              SDK_PKGS=$(grep -E '^CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]*=[ym]$' "$CONFIG_FILE" | sed -E 's/CONFIG_PACKAGE_(.*)=[ym]/\1/' | tr '\n' ' ')
              SDK_PKGS=$(echo "$SDK_PKGS" | sed 's/shadowsocksr-libev-ssr-[^ ]*/shadowsocksr-libev/g')
              SDK_PKGS=$(echo "$SDK_PKGS" | sed 's/simple-obfs-client/simple-obfs/g')
              SDK_PKGS=$(echo "$SDK_PKGS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
              # 传给 make 的列表: 移除 luci-i18n-* (随父 luci app 自动编译)
              BUILD_PKGS=$(echo "$SDK_PKGS" | sed 's/luci-i18n-[^ ]*//g' | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
            else
              echo "::warning::sdk.config 不存在"
              SDK_PKGS=""
              BUILD_PKGS=""
            fi
          else
            BUILD_PKGS="$SDK_PKGS"
          fi
          echo "packages=${BUILD_PKGS}" >> $GITHUB_OUTPUT
          echo "collect_packages=${SDK_PKGS}" >> $GITHUB_OUTPUT

      - name: Build packages via SDK
        if: steps.resolve-pkgs.outputs.packages != ''
        id: compile
        run: |
          PACKAGES="${{ steps.resolve-pkgs.outputs.packages }}"
          echo "📦 待编译: ${PACKAGES}"

          # 直接在 host 上使用自建 SDK (已含工具链,无需 docker 镜像)
          # 解压在 openwrt/ 下与全量编译结构同构
          cd openwrt

          # Match scripts/docker/sdk-test (本地复现脚本): put the local feed in
          # package/ as a core-level overlay. OpenWrt keeps core packages ahead of
          # upstream feed copies.
          # openwrt-packages 是「软件包集合」仓库: 根目录无 Makefile, 每个包子
          # 目录才有 Makefile。故校验「递归存在至少一个 Makefile」而非根目录 Makefile。
          rm -rf "package/${{ inputs.packages_feed_name }}"
          cp -rlf "${{ github.workspace }}/pkgs-feed" "package/${{ inputs.packages_feed_name }}"
          [ -n "$(find "package/${{ inputs.packages_feed_name }}" -name Makefile -print -quit 2>/dev/null)" ] || {
            echo "::error::本地 packages feed 未正确复制到 SDK"
            exit 1
          }

          # 签名: 密钥放在 SDK 根目录 (构建系统读取 ./private-key.pem 或 ./key-build)
          if [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ] && [ -f ../private-key.pem ]; then
            cp ../private-key.pem ./private-key.pem
            chmod 600 ./private-key.pem
            cp ../public-key.pem ./public-key.pem 2>/dev/null || true
            echo "🔑 SDK 软件包签名启用 (APK 密钥已注入 SDK 根目录)"
          elif [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ]; then
            echo "::warning::SDK 软件包未签名 (密钥缺失或无效), 设备 apk add 需 --allow-untrusted"
          else
            # IPK usign 路径: key-build 文件放 SDK 根目录 (构建系统读取 ./key-build)
            if [ -f ../key-build ]; then
              cp ../key-build ./key-build
              chmod 600 ./key-build
              cp ../key-build.pub ./key-build.pub 2>/dev/null || true
              echo "🔑 SDK 软件包 IPK 签名启用 (usign 密钥已注入 SDK 根目录)"
            else
              echo "::warning::SDK 软件包未签名 (usign 密钥缺失), 设备 opkg install 需 --force-checksum"
            fi
          fi

          echo "::group::📋 Configure feeds (local overlay first)"
          ./scripts/feeds update -a 2>&1
          ./scripts/feeds install -a 2>&1

          # ── ccache: 复用 SDK 原生机制并与全量编译共享 .ccache ──
          # SDK tarball 内置的 host/bin 工具优先于 runner 系统工具；这同时使
          # OpenWrt rules.mk 使用的裸 ccache/ccache_cc 命令在 SDK 构建中可解析。
          export PATH="$(pwd)/staging_dir/host/bin:${PATH}"
          # 源码佐证 (openwrt 21.02.7):
          #  tools/Makefile: CONFIG_SDK=y → tools-y += ccache (SDK 必含 ccache 二进制)
          #  target/sdk/Makefile: SDK_DIRS 打包整个 staging_dir/host (含 bin/ccache, bin/ccache_cc)
          #  target/sdk/convert-config.pl: 仅过滤 SIGNED_PACKAGES/PACKAGE/TARGET → CONFIG_CCACHE=y 保留
          #  rules.mk: CONFIG_CCACHE=y 时自动 TARGET_CC:=ccache_cc + export CCACHE_BASEDIR=$(TOPDIR)
          #            + CCACHE_DIR=$(TOPDIR)/.ccache → 路径归一化原生支持, TOPDIR 均为 openwrt,
          #            共享命中同一缓存, 无需手工 base_dir。
          CCACHE_ENABLED=false
          CCACHE_AVAILABLE=false
          # 兼容 OpenWrt 21.02 (有 ccache_cc 独立包装器) 与新版本/SNAPSHOT (直接 ccache 二进制)
          if [ -x staging_dir/host/bin/ccache ] \
             && grep -q '^config CCACHE' Config-build.in 2>/dev/null; then
            CCACHE_AVAILABLE=true
          else
            echo "⚠️ SDK 无完整 ccache 支持 (二进制/包装器或 CONFIG_CCACHE 选项缺失)"
          fi

          make defconfig 2>&1

          # defconfig 可能覆盖 SDK 原始配置; 必须在最后一次 defconfig 后确认。
          if [ "$CCACHE_AVAILABLE" = "true" ]; then
            # OpenWrt 的 scripts/config 是 Kconfig 源码目录，不是 Linux 内核式
            # 的可执行脚本；直接更新 .config，再由 conf/defconfig 校验并补全配置。
            if grep -q '^CONFIG_CCACHE=y$' .config; then
              :
            elif grep -q '^# CONFIG_CCACHE is not set$' .config; then
              sed -i 's/^# CONFIG_CCACHE is not set$/CONFIG_CCACHE=y/' .config
            elif grep -q '^CONFIG_CCACHE=' .config; then
              sed -i 's/^CONFIG_CCACHE=.*/CONFIG_CCACHE=y/' .config
            else
              printf '%s\n' 'CONFIG_CCACHE=y' >> .config
            fi
            make defconfig 2>&1
            if grep -q '^CONFIG_CCACHE=y$' .config; then
              export CCACHE_DIR="$(pwd)/.ccache"
              # 优先使用 staging_dir/host/bin/ccache，若无则使用系统 ccache (加 || true 避免无独立命令时阻断)
              CCACHE_BIN="$(pwd)/staging_dir/host/bin/ccache"
              [ -x "$CCACHE_BIN" ] || CCACHE_BIN="ccache"
              if command -v "$CCACHE_BIN" &>/dev/null || [ -x "$CCACHE_BIN" ]; then
                "$CCACHE_BIN" --max-size 10G 2>/dev/null || true
                "$CCACHE_BIN" --set-config=hash_dir=false 2>/dev/null || true
                # Do not override fork-specific compression (qualcommax sets
                # CCACHE_NOCOMPRESS); Actions Cache compresses its archive separately.
                "$CCACHE_BIN" --set-config=sloppiness=file_stat_matches,include_file_mtime,include_file_ctime 2>/dev/null || true
              fi
              echo "✅ SDK ccache 已启用 (CONFIG_CCACHE=y, 官方机制)"
              CCACHE_ENABLED=true
              echo "ccache_enabled=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::SDK defconfig 未保留 CONFIG_CCACHE=y, 本次编译不使用 ccache"
              echo "ccache_enabled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ccache_enabled=false" >> $GITHUB_OUTPUT
          fi

          # ── ccache 包装器变量级验证 (rules.mk val.% 目标) ──
          # 同时检查 target/host 的 C/C++ 包装器及 NOCACHE 原值，避免只验证
          # TARGET_CC 却让 TARGET_CXX 或 host 编译绕过 ccache。
          echo "🔍 ccache 包装器变量验证 (SDK):"
          TARGET_CC_VALUE=$(make -s val.TARGET_CC V=s 2>/dev/null | tail -1 || true)
          TARGET_CXX_VALUE=$(make -s val.TARGET_CXX V=s 2>/dev/null | tail -1 || true)
          HOSTCC_VALUE=$(make -s val.HOSTCC V=s 2>/dev/null | tail -1 || true)
          HOSTCXX_VALUE=$(make -s val.HOSTCXX V=s 2>/dev/null | tail -1 || true)
          TARGET_CC_NOCACHE_VALUE=$(make -s val.TARGET_CC_NOCACHE V=s 2>/dev/null | tail -1 || true)
          TARGET_CXX_NOCACHE_VALUE=$(make -s val.TARGET_CXX_NOCACHE V=s 2>/dev/null | tail -1 || true)
          HOSTCC_NOCACHE_VALUE=$(make -s val.HOSTCC_NOCACHE V=s 2>/dev/null | tail -1 || true)
          HOSTCXX_NOCACHE_VALUE=$(make -s val.HOSTCXX_NOCACHE V=s 2>/dev/null | tail -1 || true)
          printf 'TARGET_CC=%s\nTARGET_CXX=%s\nHOSTCC=%s\nHOSTCXX=%s\n' \
            "$TARGET_CC_VALUE" "$TARGET_CXX_VALUE" "$HOSTCC_VALUE" "$HOSTCXX_VALUE"
          printf 'TARGET_CC_NOCACHE=%s\nTARGET_CXX_NOCACHE=%s\nHOSTCC_NOCACHE=%s\nHOSTCXX_NOCACHE=%s\n' \
            "$TARGET_CC_NOCACHE_VALUE" "$TARGET_CXX_NOCACHE_VALUE" \
            "$HOSTCC_NOCACHE_VALUE" "$HOSTCXX_NOCACHE_VALUE"

          is_ccache_wrapper() {
            printf '%s\n' "$1" | grep -qE '(^|[[:space:]/])ccache(_cc|_cxx)?([[:space:]]|$)'
          }
          is_plain_compiler() {
            [ -n "$1" ] && ! printf '%s\n' "$1" | grep -q 'ccache'
          }
          WRAPPERS_VALID=false
          if [ "$CCACHE_ENABLED" = "true" ] \
             && is_ccache_wrapper "$TARGET_CC_VALUE" \
             && is_ccache_wrapper "$TARGET_CXX_VALUE" \
             && is_ccache_wrapper "$HOSTCC_VALUE" \
             && is_ccache_wrapper "$HOSTCXX_VALUE" \
             && is_plain_compiler "$TARGET_CC_NOCACHE_VALUE" \
             && is_plain_compiler "$TARGET_CXX_NOCACHE_VALUE" \
             && is_plain_compiler "$HOSTCC_NOCACHE_VALUE" \
             && is_plain_compiler "$HOSTCXX_NOCACHE_VALUE"; then
            WRAPPERS_VALID=true
          fi
          if [ "$WRAPPERS_VALID" = true ]; then
            echo "ccache_wrapper_valid=true" >> $GITHUB_OUTPUT
            echo "✅ SDK target/host C/C++ 编译器均由 ccache 接管, NOCACHE 变量保持裸编译器"
          else
            echo "ccache_wrapper_valid=false" >> $GITHUB_OUTPUT
            echo "::warning::SDK ccache 包装器变量验证失败, 禁止保存共享 ccache"
          fi
          echo "📌 下方编译循环已用 V=sc (仅摘要+命令), 完整分包日志由 BUILD_LOG=1 写入 logs/<pkg>/compile.txt"
          echo "::endgroup::"

          FAILED_PACKAGES=""
          # Compile each requested package and fail after collecting diagnostics.
          for pkg in $PACKAGES; do
            echo "::group::📦 Compile $pkg"
            make package/"$pkg"/download V=sc 2>&1
            if ! make package/"$pkg"/compile \
              BUILD_LOG=1 V=sc -j$(nproc 2>/dev/null || echo 4) 2>&1; then
              echo "::error::⚠️ $pkg build failed"
              FAILED_PACKAGES="$FAILED_PACKAGES $pkg"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED_PACKAGES" ]; then
            echo "::error::SDK packages failed:$FAILED_PACKAGES"
            exit 1
          fi

      # ───────── SDK 专用 host/tool 缓存保存（仅编译成功）─────────
      # SDK 只生产和维护自己的 host/tool 快照；openwrt/.ccache 仅由全量
      # compile-firmware 维护。SDK 仍可恢复并使用共享 ccache，但不会保存或清理它。
      # rustc/go/node 等 host 工具经 SDK 自举安装到 staging_dir/hostpkg、
      # staging_dir/target-*/host, GOCACHE 在 tmp/go-build, crate 在 dl/。
      # key 绑定 SDK source SHA 并追加 run_id，利用 Actions Cache 不可覆盖的语义
      # 发布不可变快照；失败或 no-cache 不保存。
      - name: Save SDK hostpkg cache
        if: success() && inputs.cache_strategy != 'no-cache' && steps.compile.outcome == 'success'
        id: cache-hostpkg-save
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          key: immwrt-v2-sdk-hostpkg-${{ env.IMMWRT_TARGET }}-${{ steps.resolve.outputs.sdk_source_sha }}-${{ github.run_id }}
          path: |
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/target-*/host
            openwrt/dl/cargo
            openwrt/dl/rustc
            openwrt/tmp/go-build

      # ───────── 清理远端 SDK hostpkg 缓存（保留最近 N 份）─────────
      # hostpkg 快照按 SDK source SHA 区分，每个版本内容不同，不能按 ccache
      # 的 latest-only 规则一刀切。显式排除本轮 key，避免依赖 createdAt 排序。
      # 与全量 immwrt-v2-toolchain-* / immwrt-v2-ccache-* 前缀完全隔离。
      - name: Purge stale SDK hostpkg snapshots
        id: hostpkg-purge
        if: success() && inputs.cache_strategy != 'no-cache' && steps.cache-hostpkg-save.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PREFIX="immwrt-v2-sdk-hostpkg-${IMMWRT_TARGET}-"
          CURRENT="${PREFIX}${{ steps.resolve.outputs.sdk_source_sha }}-${{ github.run_id }}"
          KEEP_TOTAL=3
          KEEP_OLD=$((KEEP_TOTAL - 1))
          HOSTPKG_LIST=$(gh cache list --repo "$REPO" --key "$PREFIX" --limit 100 --json id,key,createdAt)
          HOSTPKG_RC=$?
          HOSTPKG_IDS=""
          if [ "$HOSTPKG_RC" -eq 0 ]; then
            # Keep the current snapshot plus at most KEEP_OLD older snapshots.
            # Exclude the current key from deletion even if cache listing is delayed.
            HOSTPKG_IDS=$(echo "$HOSTPKG_LIST" | jq -r --arg current "$CURRENT" --argjson keep "$KEEP_OLD" '
              [ .[] | select(.key != $current) ]
              | sort_by(.createdAt)
              | if length > $keep then .[0:(length - $keep)] else [] end
              | .[].id
            ')
          fi
          if [ "$HOSTPKG_RC" -ne 0 ]; then
            echo "⚠️ 获取 SDK hostpkg 列表失败 (rc=${HOSTPKG_RC}), 保留旧缓存" >&2
          elif [ -n "$HOSTPKG_IDS" ]; then
            echo "$HOSTPKG_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO" \
              || echo "⚠️ 部分 SDK hostpkg 删除失败, 本轮成果仍已保存" >&2
          else
            echo "ℹ️ 无旧 SDK hostpkg 缓存 (保留最近 ${KEEP_TOTAL} 份,含当前快照)"
          fi

      # ───────── 编译耗时与日志统计 ─────────
      - name: 📊 Build Log Analysis
        id: build-log-analysis
        if: always() && steps.compile.outcome == 'success'
        run: |
          cd openwrt
          # 一次性提取所有 compile.txt 末行，再用 awk 分流统计
          TAIL_ALL=$(find logs -name 'compile.txt' -print0 2>/dev/null | xargs -0 tail -qn1 2>/dev/null || true)
          TOTAL=$(find logs -name 'compile.txt' 2>/dev/null | wc -l)
          INCOMPLETE=$((TOTAL - $(echo "$TAIL_ALL" | grep -c '^time: ' || true)))
          EMPTY=$(find logs -name 'compile.txt' -size 0 2>/dev/null | wc -l)
          echo "$TAIL_ALL" | grep '^time: ' | awk -F'#' 'NF==4' > build_time_clean.log || true

          echo "📊 SDK compile.txt: 总计 ${TOTAL}, 未完成 ${INCOMPLETE}, 空 ${EMPTY}"

          # ── 缓存命中信息 (供 summary 展示) ──
          # cache-hit 只能确认 exact-key 命中；前缀回退时公开 action 不提供实际 key，
          # 因此展示预查到的 key，或明确标注 prefix/best-effort，禁止引用内部 state。
          CC_LOOKUP_KEY="${{ steps.sdk-cache-lookup.outputs.ccache_key || '' }}"
          CC_LOOKUP_PREFIX="${{ steps.sdk-cache-lookup.outputs.ccache_restore_keys || '' }}"
          if [ -n "$CC_LOOKUP_KEY" ]; then
            CC_RESTORE_KEY="$CC_LOOKUP_KEY"
          elif [ "${{ steps.cache-cc-restore.outputs.cache-hit || 'false' }}" = "true" ]; then
            CC_RESTORE_KEY="$CC_LOOKUP_PREFIX (exact key unavailable)"
          elif [ -n "$CC_LOOKUP_PREFIX" ]; then
            CC_RESTORE_KEY="$CC_LOOKUP_PREFIX (prefix/best-effort)"
          else
            CC_RESTORE_KEY="未命中"
          fi

          SDK_RESTORE_KEY="${{ steps.sdk-cache-lookup.outputs.sdk_key || '' }}"
          [ -n "$SDK_RESTORE_KEY" ] || SDK_RESTORE_KEY="未命中"
          FULL_LOOKUP_KEY="${{ steps.sdk-cache-lookup.outputs.full_key || '' }}"
          FULL_LOOKUP_PREFIX="${{ steps.sdk-cache-lookup.outputs.full_restore_keys || '' }}"
          if [ "${{ steps.cache-sdk-toolchain-fallback.outcome || 'skipped' }}" = "skipped" ]; then
            FULL_FALLBACK_KEY="未使用"
          elif [ -n "$FULL_LOOKUP_KEY" ]; then
            FULL_FALLBACK_KEY="$FULL_LOOKUP_KEY"
          elif [ -n "$FULL_LOOKUP_PREFIX" ]; then
            FULL_FALLBACK_KEY="$FULL_LOOKUP_PREFIX (prefix/best-effort)"
          else
            FULL_FALLBACK_KEY="未命中"
          fi
          # save action 无 cache-primary-key 输出, 直接展示写入的 key (已知值)
          SDK_SAVE_KEY="immwrt-v2-sdk-hostpkg-${IMMWRT_TARGET}-${{ steps.resolve.outputs.sdk_source_sha }}-${{ github.run_id }}"
          SDK_SAVE_STATE="${{ steps.cache-hostpkg-save.outcome == 'success' && '✅ 已保存' || '未保存' }}"

          # Each GitHub Actions step has a fresh shell. Persist the values used by
          # the following ccache Stats step through explicit step outputs.
          echo "ccache_restore_key=${CC_RESTORE_KEY}" >> "$GITHUB_OUTPUT"
          echo "sdk_restore_key=${SDK_RESTORE_KEY}" >> "$GITHUB_OUTPUT"
          echo "full_fallback_key=${FULL_FALLBACK_KEY}" >> "$GITHUB_OUTPUT"
          echo "sdk_save_key=${SDK_SAVE_KEY}" >> "$GITHUB_OUTPUT"
          echo "sdk_save_state=${SDK_SAVE_STATE}" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### 📊 SDK 软件包编译耗时 Top 5"
            echo '```text'
            awk -F'#' '{
              pkg=$1; sub(/^time: /, "", pkg); sub(/\/compile$/, "", pkg);
              real=$2;
              printf "%8.2fs  %s\n", real, pkg
            }' build_time_clean.log 2>/dev/null | sort -rn 2>/dev/null | head -5 || echo "无耗时数据"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # ── 缓存状态表 (ccache + hostpkg 恢复/保存) ──
          {
            echo ""
            echo "### 📦 缓存命中 (SDK 增量编译)"
            echo "| 缓存 | 恢复来源 | 保存 key |"
            echo "|---|---|---|"
            echo "| **ccache** (C/C++ 对象) | \`${CC_RESTORE_KEY}\` | 仅恢复,由 full workflow 保存和清理 |"
            echo "| **SDK host/tool** (rustc/go/node) | \`${SDK_RESTORE_KEY}\` | \`${SDK_SAVE_KEY}\` (${SDK_SAVE_STATE}) |"
            echo "| **full toolchain fallback** | \`${FULL_FALLBACK_KEY}\` | 仅恢复,不由 SDK 保存 |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────── ccache 统计与诊断展示 ─────────
      # 规范: 原始 ccache -s 输出保留在 CI 终端 (echo "$CC_RAW"),
      # summary note 只放提炼后的整洁指标表 (含命中率/恢复来源/保存 key)。
      - name: 📈 ccache Stats
        if: always() && steps.compile.outputs.ccache_enabled == 'true'
        run: |
          cd openwrt
          export CCACHE_DIR="$(pwd)/.ccache"
          echo "╔══════════════════════════════════════╗"
          echo "║  📈 SDK ccache 统计与命中分析         ║"
          echo "╚══════════════════════════════════════╝"
          CCACHE_BIN="$(pwd)/staging_dir/host/bin/ccache"
          [ -x "$CCACHE_BIN" ] || CCACHE_BIN="ccache"
          CC_RAW=""
          if command -v "$CCACHE_BIN" &>/dev/null || [ -x "$CCACHE_BIN" ]; then
            CC_RAW=$("$CCACHE_BIN" -s 2>/dev/null || true)
          fi
          # 原始输出保留到 CI 终端, 供详细诊断
          echo "$CC_RAW"

          # 提取核心指标 (兼容 ccache 5.x / 6.x 输出格式)
          HITS_DIRECT=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache hit \(direct\)|Direct):\s*\K[0-9]+' | head -1 || echo "?")
          HITS_PREP=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache hit \(preprocessed\)|Preprocessed):\s*\K[0-9]+' | head -1 || echo "?")
          MISSES=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache miss|Misses):\s*\K[0-9]+' | head -1 || echo "?")
          CACHE_SIZE=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache size \(|Cache size \()G(?:B|iB)\):\s*\K[0-9.]+' | head -1 || echo "?")
          DISK_USAGE_HUMAN=$(du -sh ".ccache" 2>/dev/null | cut -f1 || echo "N/A")

          # 命中率: 优先 ccache 5.x 的 "cache hit rate" 行, 兼容 6.x 的 Hits 汇总
          HIT_RATE=$(echo "$CC_RAW" | grep -oP 'cache hit rate\s+\K[0-9.]+ ?%' | head -1 || echo "?")
          if [ "$HIT_RATE" = "?" ]; then
            HITS_TOTAL=$(echo "$CC_RAW" | grep -oP '^\s*Hits:\s+\K[0-9]+' | head -1 || echo "?")
            CALLS_TOTAL=$(echo "$CC_RAW" | grep -oP '^\s*Hits:\s+[0-9]+ / \K[0-9]+' | head -1 || echo "?")
            if [[ "$HITS_TOTAL" =~ ^[0-9]+$ ]] && [[ "$CALLS_TOTAL" =~ ^[0-9]+$ ]] && [ "$CALLS_TOTAL" -gt 0 ]; then
              HIT_RATE=$(awk -v h="$HITS_TOTAL" -v t="$CALLS_TOTAL" 'BEGIN{printf "%.1f%%", h/t*100}')
            fi
          fi

          RESTORE_KEY="${{ steps.build-log-analysis.outputs.ccache_restore_key || '未命中' }}"

          {
            echo ""
            echo "### 📈 ccache 缓存统计 (SDK 增量编译)"
            echo ""
            echo "| 指标 | 值 |"
            echo "|---|---|"
            echo "| 命中率 | **${HIT_RATE}** |"
            echo "| Direct hits | ${HITS_DIRECT} |"
            echo "| Preprocessed | ${HITS_PREP} |"
            echo "| Misses | ${MISSES} |"
            echo "| 缓存大小 | ${CACHE_SIZE:-?}G (磁盘 ${DISK_USAGE_HUMAN}) |"
            echo "| 恢复来源 | \`${RESTORE_KEY}\` |"
            echo "| 保存策略 | 仅恢复,不保存 (full workflow 维护共享 ccache) |"
            echo "| 包装器接管 | ${{ steps.compile.outputs.ccache_wrapper_valid == 'true' && '✅ 已接管' || '⚠️ 未接管' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p upload
          SDK_PKGS="${{ steps.resolve-pkgs.outputs.collect_packages }}"
          if [ -z "$SDK_PKGS" ]; then
            echo "⚠️ 无软件包列表,跳过收集"
          else
            for pkg in $SDK_PKGS; do
              find openwrt/bin/packages/ -type f \( \
                -name "${pkg}_*.ipk" -o \
                -name "${pkg}_*.apk" -o \
                -name "${pkg}*.ipk" -o \
                -name "${pkg}*.apk" \
              \) -exec cp {} upload/ \; 2>/dev/null || true
            done
          fi
          if [ -f public-key.pem ]; then
            cp public-key.pem upload/solarflows-apk-public.pem
          elif [ -f key-build.pub ]; then
            cp key-build.pub upload/solarflows-usign-public.pub
          fi
          PACKAGE_COUNT=$(find upload/ -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | wc -l)
          FILE_COUNT=$(find upload/ -type f 2>/dev/null | wc -l)
          echo "package_count=${PACKAGE_COUNT}" >> $GITHUB_OUTPUT
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "📦 收集到 ${PACKAGE_COUNT} 个软件包, ${FILE_COUNT} 个文件"

          # ── 目录树: 整理好的 upload/ 交付物 (编译后 bin/ 已被过滤, 只展示最终整理结果) ──
          # 可选诊断展示: 管道失败(如 head 截断触发 SIGPIPE)不阻断构建
          echo ""
          echo "📂 upload/ 完整目录结构 (整理后):"
          echo '```text'
          find upload -print 2>/dev/null | sort | sed 's|^upload|.|' | head -200 || true
          echo '```'

      - name: Generate build info
        if: steps.artifacts.outputs.package_count > 0
        run: |
          PKG_COMMIT=$(git -C pkgs-feed rev-parse --short HEAD)
          PKG_COMMIT_FULL=$(git -C pkgs-feed rev-parse HEAD)
          PKG_FORMAT="${{ steps.signing_key.outputs.use_apk == 'true' && 'apk' || 'ipk' }}"
          cat > build-info.json <<JSONEOF
          {
            "target": "${IMMWRT_TARGET}",
            "config": "${{ inputs.matrix_config }}",
            "packages_repo": "${{ inputs.packages_feed_repo }}",
            "packages_branch": "${{ inputs.matrix_packages_branch }}",
            "packages_sha": "${PKG_COMMIT_FULL}",
            "packages_commit": "${PKG_COMMIT}",
            "packages_format": "${PKG_FORMAT}",
            "sdk_version": "${{ inputs.sdk_version }}",
            "sdk_file": "${{ steps.resolve.outputs.sdk_file }}",
            "build_mode": "sdk",
            "release_tag": "${{ inputs.version }}",
            "passwall_repo": "${{ inputs.matrix_passwall_repo }}",
            "passwall_tag": "${{ inputs.matrix_passwall_tag }}",
            "release_repo": "${{ inputs.matrix_passwall_repo }}",
            "use_apk": ${{ steps.signing_key.outputs.use_apk }},
            "signing_key_fingerprint": "${{ steps.signing_key.outputs.fingerprint || 'none' }}",
            "signing_mode": "${{ steps.signing_key.outputs.sign_mode || 'none' }}",
            "file_count": "${{ steps.artifacts.outputs.file_count }}",
            "timestamp": "$(TZ=$TZ date +'%Y-%m-%d %H:%M:%S')"
          }
          JSONEOF

      - name: Upload packages artifact
        if: steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-packages
          path: upload/
          retention-days: 7

      - name: Upload build info
        if: steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-build-info
          path: build-info.json
          retention-days: 7

      - name: Resolve IB file for combined build
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        id: resolve-ib
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ib_index
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern ib-index.json --dir /tmp/ib_index
          VERSION="${{ steps.resolve.outputs.sdk_version }}"
          SDK_SOURCE_SHA="${{ steps.resolve.outputs.sdk_source_sha }}"
          IB_FILE=$(jq -r --arg v "$VERSION" --arg src "$SDK_SOURCE_SHA" \
            '.[$v] | select(.source_sha == $src) | .file // empty' /tmp/ib_index/ib-index.json)
          [ -n "$IB_FILE" ] || {
            echo "::error::没有与 SDK ${VERSION} (${SDK_SOURCE_SHA}) 同源的 IB"
            exit 1
          }
          echo "ib_file=$IB_FILE" >> "$GITHUB_OUTPUT"
          echo "ib_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and extract IB for combined build
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ib-dl ib
          gh release download "${{ inputs.matrix_artifacts_release_tag }}" \
            --repo "${{ inputs.matrix_artifacts_release_repo }}" \
            --pattern "${{ steps.resolve-ib.outputs.ib_file }}" \
            --pattern "${{ steps.resolve-ib.outputs.ib_file }}.sha256" \
            --dir ib-dl
          (cd ib-dl && sha256sum -c "${{ steps.resolve-ib.outputs.ib_file }}.sha256")
          tar xf "ib-dl/${{ steps.resolve-ib.outputs.ib_file }}" -C ib --strip-components=1
          mkdir -p ib/packages
          find upload -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} ib/packages/ \;

          # ── 同名包冲突检测 (仅警告, 不改变覆盖/选择行为) ──
          # IPK 命名: <name>_<version>_<arch>.ipk; APK 命名: <name>-<version>.apk (版本以数字开头)。
          # 同版本 → cp 覆盖, 固件用 SDK 新内容; 不同版本 → 索引并存, opkg 按版本比较选较高者。
          for f in upload/*.ipk upload/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *.ipk) pkg_name="${base%%_*}" ;;
              *.apk) pkg_name="${base%%-[0-9]*}" ;;
              *) continue ;;
            esac
            [ -n "$pkg_name" ] && [ "$pkg_name" != "$base" ] || continue
            dup=$(find ib/packages -maxdepth 1 -type f \( -name "${pkg_name}_*.ipk" -o -name "${pkg_name}-*.apk" \) 2>/dev/null | head -1)
            if [ -n "$dup" ] && [ "$(basename "$dup")" = "$base" ]; then
              echo "ℹ️ 同名同版本覆盖: ${base} (SDK 新内容覆盖 IB 预置)"
            elif [ -n "$dup" ]; then
              echo "::warning::同名不同版本: SDK=${base} vs IB预置=$(basename "$dup") — opkg 将按版本比较选择较高者"
            fi
          done

      - name: Build firmware via IB from SDK packages
        if: inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        id: build-ib
        run: |
          set -euo pipefail
          SEED_DIR="AutoWorkFlows/openwrt-configs/immortalwrt/${{ inputs.matrix_config }}"
          PACKAGES=$(find "$SEED_DIR" -type f -name '*.seed' -print0 | xargs -0 cat | \
            grep -E '^CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]+=y$' | \
            sed -E 's/CONFIG_PACKAGE_([^=]+)=y/\1/' | sort -u | tr '\n' ' ')
          # IB 固件签名: 与 SDK 共用同一对密钥 (通过 BUILD_KEY_APK_* 注入 make image)
          # fingerprint=none 表示密钥缺失/无效, IB 固件同样跳过签名
          SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
          if [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ] && [ "$SIGN_FP" != "none" ] && [ -n "$SIGN_FP" ] && [ -f private-key.pem ]; then
            export BUILD_KEY_APK_SEC="${GITHUB_WORKSPACE}/private-key.pem"
            export BUILD_KEY_APK_PUB="${GITHUB_WORKSPACE}/public-key.pem"
            echo "🔑 IB 固件签名启用 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "${{ steps.signing_key.outputs.use_apk }}" = "true" ]; then
            echo "::warning::IB 固件未签名 (密钥缺失或无效), 设备 apk add 需 --allow-untrusted"
          else
            # IPK usign 路径: IB 读取根目录 key-build 文件签名 (make image 内同源码树)
            if [ "$SIGN_FP" != "none" ] && [ -n "$SIGN_FP" ] && [ -f key-build ]; then
              cp key-build ib/key-build
              chmod 600 ib/key-build
              cp key-build.pub ib/key-build.pub 2>/dev/null || true
              echo "🔑 IB 固件 IPK 签名启用 (usign 公钥指纹 ${SIGN_FP:0:16}...)"
            else
              echo "::warning::IB 固件未签名 (usign 密钥缺失), 设备 opkg install 需 --force-checksum"
            fi
          fi
          mkdir -p ib/release/firmware
          # ── 设备 PROFILE 提取 (IB 不传 PROFILE 时仅构建第一个设备) ──
          # 源码佐证: target/imagebuilder/files/Makefile USER_PROFILE ?= $(firstword $(PROFILE_NAMES));
          # include/image.mk ifdef IB → DEVICE_CHECK_PROFILE 只匹配传入的 PROFILE。
          # 故从 seed 提取全部设备行, 逐个 PROFILE 构建。兼容两种格式:
          #   mt798x:    CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_jcg_q30-pro=y
          #   qualcommax: CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y
          PROFILES=$(grep -hoE '^CONFIG_TARGET_(DEVICE_)?[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_-]+=y$' "$SEED_DIR"/*.seed \
            | sed -E 's/^CONFIG_TARGET_(DEVICE_)?.*_DEVICE_([^=]+)=y/\2/' | sort -u | tr '\n' ' ')
          if [ -z "$PROFILES" ]; then
            echo "⚠️ seed 未提取到设备列表, 回退默认 (IB 仅构建首个设备)"
            PROFILES="_default_"
          else
            echo "📋 IB 设备 PROFILE 列表: $PROFILES"
          fi
          cd ib
          for prof in $PROFILES; do
            echo "::group::📦 IB build PROFILE=${prof}"
            if [ "$prof" = "_default_" ]; then
              make image PACKAGES="$PACKAGES" 2>&1 | tee ib-build.log
            else
              make image PACKAGES="$PACKAGES" PROFILE="$prof" 2>&1 | tee "ib-build-${prof}.log"
            fi
            echo "::endgroup::"
          done
          find bin/targets -type f -not -path '*/packages/*' -exec cp {} release/firmware/ \;
          test -n "$(find release/firmware -type f -print -quit)" || {
            echo "::error::IB 未生成固件"
            exit 1
          }

      - name: Upload combined firmware artifact
        if: success() && inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.matrix_target }}-sdk-ib-firmware
          path: ib/release/firmware
          retention-days: 7

      - name: Publish combined firmware
        if: success() && inputs.matrix_build_sdk_ib == true && steps.artifacts.outputs.package_count > 0 && inputs.matrix_firmware_release_repo != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
          SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
          if [ "$SIGN_MODE" = "apk" ]; then
            SIGN_LINE="- 签名: ✅ APK 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "usign" ]; then
            SIGN_LINE="- 签名: ✅ usign 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "random" ]; then
            SIGN_LINE="- 签名: ⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
          else
            SIGN_LINE="- 签名: ❌ 未签名"
          fi
          cat > combined-release.md <<EOF
          ## 📦 ${{ inputs.matrix_target }} 固件 (IB 增量构建)

          - **构建类型**: ⚡ ImageBuilder 重打包 (SDK 增量编译插件 + IB 固件组装)
          - **软件版本**: ${{ inputs.version }}
          - **IB 基线版本**: ${{ steps.resolve-ib.outputs.ib_version }}
          - **软件包 Feed**: \`${{ inputs.matrix_packages_branch }}\` @ $(git -C pkgs-feed rev-parse --short HEAD)
          - **已打包插件数量**: ${{ steps.artifacts.outputs.package_count }} 个
          ${SIGN_LINE}
          EOF
          TAG="${{ inputs.version }}"
          REPO="${{ inputs.matrix_firmware_release_repo }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" ib/release/firmware/* --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file combined-release.md --draft=false
          else
            gh release create "$TAG" --repo "$REPO" --title "${{ inputs.matrix_target }} Build $TAG (IB 增量)" \
              --notes-file combined-release.md ib/release/firmware/*
          fi

      - name: Publish SDK packages
        if: steps.artifacts.outputs.package_count > 0
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t PACKAGE_FILES < <(find upload -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.pem' \))
          [ "${#PACKAGE_FILES[@]}" -gt 0 ] || { echo "::error::SDK 产物目录为空"; exit 1; }
          PACKAGE_REPO="${{ inputs.matrix_passwall_repo }}"
          PACKAGE_TAG="${{ inputs.matrix_passwall_tag }}"
          PACKAGE_COMMIT=$(jq -r '.packages_commit' build-info.json)
          PACKAGE_SHA=$(jq -r '.packages_sha' build-info.json)
          PACKAGE_FORMAT=$(jq -r '.packages_format' build-info.json)
          if gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            gh release upload "$PACKAGE_TAG" --repo "$PACKAGE_REPO" "${PACKAGE_FILES[@]}" --clobber
            EXISTING=$(gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --json body --jq '.body // ""')
            SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
            SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
            if [ "$SIGN_MODE" = "apk" ]; then
              SIGN_TEXT="✅ APK 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "usign" ]; then
              SIGN_TEXT="✅ usign 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "random" ]; then
              SIGN_TEXT="⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
            else
              SIGN_TEXT="❌ 未签名"
            fi
            printf '%b\n' "${EXISTING}\n\n---\n### 📦 ${IMMWRT_TARGET} - SDK 增量构建 (.${PACKAGE_FORMAT})\n- **构建类型**: ⚡ 自建 SDK 独立编译 (增量编译插件)\n- **commit**: [\`${PACKAGE_COMMIT}\`](${PACKAGE_REPO}/commit/${PACKAGE_SHA}) - $(TZ=$TZ date +'%Y-%m-%d %H:%M')\n- **签名**: ${SIGN_TEXT}" > release-notes.md
            gh release edit "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --notes-file release-notes.md
          else
            SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
            SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
            if [ "$SIGN_MODE" = "apk" ]; then
              SIGN_TEXT="✅ APK 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "usign" ]; then
              SIGN_TEXT="✅ usign 已签名 (指纹 ${SIGN_FP:0:16}...)"
            elif [ "$SIGN_MODE" = "random" ]; then
              SIGN_TEXT="⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
            else
              SIGN_TEXT="❌ 未签名"
            fi
            printf '## Passwall Packages\n\n- **%s**: ⚡ SDK 增量构建 (.%s), commit [`%s`](%s/commit/%s)\n- **签名**: %s\n' \
              "$IMMWRT_TARGET" "$PACKAGE_FORMAT" "$PACKAGE_COMMIT" "$PACKAGE_REPO" "$PACKAGE_SHA" "$SIGN_TEXT" > release-notes.md
            gh release create "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --title "Passwall Packages" \
              --notes-file release-notes.md --latest=false "${PACKAGE_FILES[@]}"
          fi

      - name: Upload published state
        if: success() && steps.artifacts.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-published-state
          path: build-info.json
          retention-days: 7

      # ───────── 失败日志归档（与全量 compile-firmware 同款, 补齐 SDK 路径缺口）─────────
      # 诊断步骤的 "完整内容见 artifact" 必须真正有 artifact 可查:
      # openwrt/logs/** (BUILD_LOG=1 各包 compile/error/download) + .config + IB 构建日志。
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-build-log
          path: |
            openwrt/logs/**
            openwrt/.config
            ib/ib-build*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: SDK Build Diagnostics
        if: failure()
        run: |
          echo "> 👈 触发/目标/版本等整体计划见 **Plan job Summary**" >> "$GITHUB_STEP_SUMMARY"
          echo "## ❌ SDK 软件包构建失败" >> "$GITHUB_STEP_SUMMARY"
          # 权威失败源: error.txt (make ERROR 宏写入 "ERROR: <pkg> failed to build.")
          # time.pl 无论命令成败都打印 "time:" 行 (scripts/time.pl), 失败日志同样以
          # "time:" 结尾, 故 compile.txt 末行是否 time: 不能判定失败; 仅保留为中断日志兜底。
          FAILED_PKGS=""
          if [ -d openwrt/logs ]; then
            # 1) error.txt 权威源
            for errfile in $(find openwrt/logs -name 'error.txt' -type f 2>/dev/null | sort); do
              while IFS= read -r line; do
                pkg=$(echo "$line" | sed -n 's/.*ERROR: \(.*\) failed to build.*/\1/p' | sed 's/ \[[^]]*\]$//')
                [ -n "$pkg" ] && FAILED_PKGS="$FAILED_PKGS $pkg"
              done < "$errfile"
            done
            # 2) 兜底: 末行不含 time: 的 compile.txt (日志被中断如 OOM, 无 error.txt)
            for logfile in $(find openwrt/logs -name 'compile.txt' -type f 2>/dev/null | sort); do
              LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
              if ! echo "$LAST_LINE" | grep -q '^time:'; then
                PKG=$(echo "$logfile" | sed 's|.*logs/||; s|/compile.txt||')
                FAILED_PKGS="$FAILED_PKGS $PKG"
              fi
            done
          fi

          if [ -n "$FAILED_PKGS" ]; then
            FAILED_PKGS=$(echo "$FAILED_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            PKG_COUNT=$(echo "$FAILED_PKGS" | wc -l)
            echo "共 ${PKG_COUNT} 个软件包编译失败" >> "$GITHUB_STEP_SUMMARY"
            for pkg in $FAILED_PKGS; do
              echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              # 完整输出日志, 不截断/过滤; 仅对超大文件 (>300KB) 保护显示尾部 1000 行
              for LOGFILE in "openwrt/logs/$pkg/compile.txt" "openwrt/logs/$pkg/host-compile.txt" "openwrt/logs/$pkg/download.txt"; do
                [ -f "$LOGFILE" ] || continue
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "▍$LOGFILE ▍" >> "$GITHUB_STEP_SUMMARY"
                SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 300000 ]; then
                  echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行; 完整内容见 artifact]" >> "$GITHUB_STEP_SUMMARY"
                  tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                else
                  cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            # IB 构建发生在 ib/ 目录 (cd ib 后 tee ib-build*.log), 不在 openwrt/ 下
            IB_LOG=$(find ib -maxdepth 1 -name 'ib-build*.log' 2>/dev/null | head -1 || true)
            if [ -n "$IB_LOG" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              echo "▍${IB_LOG} (末尾 50 行) ▍" >> "$GITHUB_STEP_SUMMARY"
              tail -50 "$IB_LOG" 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ 无可用构建日志 (openwrt/logs 与 ib/ib-build*.log 均缺失, 完整日志见 artifact)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi