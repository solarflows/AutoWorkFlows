# Reusable workflow: compile-firmware
# 全量编译 ImmortalWrt 固件 + 产出 SDK / ImageBuilder tarball 上传到 Release
# 由 firmware-build-unified.yml (plan job) 调用，workflow_call 触发
# seed/sdk.config 配置默认取自 caller 仓库 (github.repository)，可用 config_repo 覆盖
#
# ══════════ 外部调用速查 (免调试) ══════════
# 最小调用 (固件发布到 caller 仓库, seed 取 caller 的 configs/<target>/*.seed):
#
#   jobs:
#     build:
#       uses: solarflows/AutoWorkFlows/.github/workflows/compile-firmware.yml@main
#       with:
#         matrix_target: 'ipq807x'                    # 必填: seed 目录名 = target 名
#         matrix_repo:   '<owner>/<firmware-source>'  # 必填: ImmortalWrt 源码仓库
#         matrix_ref:    '<branch>'                   # 必填: 源码分支
#         matrix_packages_branch: 'qualcommax'        # 必填: solarflows/openwrt-packages 分支
#         config_path:  'configs'                     # caller 仓库 seed 根目录 (默认 openwrt-configs/immortalwrt)
#       secrets:
#         ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 发布/探测用; 跨仓库发布需 PAT
#
# 常用可选参数:
#   version / version_prefix   版本号二选一: 显式 version 优先; 空 = <prefix><YYMMDD> (prefix 默认 V)
#   matrix_release_repo        固件 Release 目标 (空 = 不发布, 产物仅 CI artifact)
#   matrix_passwall_repo/tag   软件包 Release 目标 (空 = 不发布)
#   release_type               Release 发布类型 (release 正式 | prerelease 预发布 | draft 草稿;
#                              默认 release, 作用于本次构建创建/更新的全部 Release)
#   require_signing            true = 签名密钥缺失/无效即硬失败 (默认 false = 降级 random 继续)
#   passwall_keep_versions     Passwall 同包版本保留数 (默认 3, 范围 [1,30]; 下限 1 = 有界保留)
#   collect_packages           软件包打包清单 (逗号分隔; 空 = 默认单包 luci-app-passwall; 缺包仅告警)
#   upload_artifacts           固件/SDK-IB 大工件上传开关 (默认 true; 关闭省上传耗时)
#   standard_packages_branch   标准 packages feed 分支 (空 = 回退 targets.json 编排元数据)
#   config_repo/ref            seed 来源仓库 (空 = caller 仓库 @ 触发 commit)
#   clean_cache / free_disk_space / publish_sdk_ib / skip_feed_catchup
#
# 产物去向: 固件+软件包 → Release (matrix_release_repo/matrix_passwall_repo 指定时)
#           SDK/IB → artifacts Release (matrix_artifacts_release_repo 指定时)
#           兜底 CI artifact (7 天): 固件 tarball / 软件包 / build-info
# 签名 secrets (可选): APK_BUILD_KEY (PEM ECDSA/RSA) / USIGN_KEY (usign 私钥)
# 行为要点: 构建系统选项 (DEVEL/CCACHE/BUILD_LOG) 自动检测补齐, 无需写进 seed;
#           feed 追平为纯远端对比 (不触发 CI); CRLF seed 自动转换并告警;
#           Re-run with debug → RUNNER_DEBUG=1 → 构建加 V=s 实时输出
name: Compile Firmware

on:
  workflow_call:
    inputs:
      # ── 矩阵 target 完整描述（已经合并 defaults 后的对象）──
      # 种子配置目录名恒等于 matrix_target, 不再单独传递 config。
      matrix_target:        { required: true, type: string }
      matrix_repo:          { required: true, type: string }
      matrix_ref:           { required: true, type: string }
      matrix_packages_branch: { required: true, type: string }
      standard_packages_repo: { required: false, type: string, default: 'solarflows/packages' }
      # 空值 = 回退 targets.json 的 target 编排元数据 (与 unified 传值同源,
      # 保证外部 caller 与官方构建的标准 feed 一致); 均缺失则构建开始即硬失败
      standard_packages_branch: { required: false, type: string, default: '' }
      # ── release 目标 (可选): 空值 = 不发布 Release, 产物仅上传 CI artifact (retention 7 天)。
      #    不指定 artifacts release repo 时 sdk-index.json/ib-index.json 不维护,
      #    后续 compile-packages SDK 增量路径不可用 (需先跑 full 发布 SDK)。
      matrix_release_repo:  { required: false, type: string, default: '' }
      matrix_passwall_repo: { required: false, type: string, default: '' }
      matrix_passwall_tag:  { required: false, type: string, default: '' }
      matrix_firmware_release_tag_prefix: { required: false, type: string, default: '' }
      # ── Release 发布类型 (运行级, 作用于本次创建/更新的全部 Release:
      #    固件 / Passwall 软件包 / SDK-IB artifacts) ──
      # release = 正式 (默认, 非 draft 非 prerelease)
      # prerelease = 预发布; draft = 草稿 (发布后需人工 publish)
      release_type:         { required: false, type: string, default: 'release' }
      # ── 发布安全开关 ──
      # require_signing = true 时, 签名密钥缺失/无效直接硬失败, 阻止随机密钥或
      # 未签名产物发布到 Release; 默认 false = 既有"降级 random + 构建继续"语义
      # (刻意设计, 见 Setup Signing Key 注释)。
      require_signing:          { required: false, type: boolean, default: false }
      # Passwall 包同包版本收敛保留数 (与 artifacts_keep_versions 对称的可控项;
      # 范围 [1,30], 下限 1 = 有界保留是刻意设计, 不提供"全留"禁用)
      passwall_keep_versions:   { required: false, type: number, default: 3 }
      matrix_artifacts_release_repo: { required: false, type: string, default: '' }
      matrix_artifacts_release_tag:  { required: false, type: string, default: '' }
      matrix_artifacts_keep_versions: { required: false, type: number, default: 7 }
      matrix_config_sha:    { required: false, type: string, default: '' }
      # ── 默认值（workflow 内置;调用方不传则用这里,见 firmware-build-unified env）──
      defaults_repo:        { required: false, type: string, default: 'solarflows/AutoWorkflows' }
      defaults_ref:         { required: false, type: string, default: 'main' }
      packages_feed_repo:   { required: false, type: string, default: 'solarflows/openwrt-packages' }
      packages_feed_name:   { required: false, type: string, default: 'solarflows' }
      # ── 配置来源 (seed / sdk.config); 空值 = 当前运行仓库 (caller) ──
      # config_repo 空 → caller 仓库 @ github.sha (run 触发 commit, 不可变,
      #   与 plan 的 sparse checkout 钉死同一 commit, 消除长等待窗口内的 ref 漂移)
      # config_repo 非空 → config_ref 空 = 该仓库默认分支; 显式传 = 锁定 ref
      config_repo:  { required: false, type: string, default: '' }
      config_ref:   { required: false, type: string, default: '' }
      config_path:  { required: false, type: string, default: 'openwrt-configs/immortalwrt' }
      # ── 全局上下文 ──
      # version 与 version_prefix 二选一: 显式 version 优先 (向后兼容);
      # version 空 → 按 version_prefix 自动生成 <prefix><YYMMDD> (上海时区)。
      # prefix 白名单 [A-Za-z0-9._-] (空 = 纯日期版本), 非法字符降级 'V'。
      version:              { required: false, type: string, default: '' }
      version_prefix:       { required: false, type: string, default: 'V' }
      # ── 软件包打包 (release/passwall 工件与 Passwall Packages Release) ──
      # 逗号分隔包名; 空 = 默认单包 luci-app-passwall。前缀匹配覆盖子包与
      # 变体 (ssr-local / geoip-full 等); 缺包仅告警不报错 (未启用/未编译)。
      collect_packages:     { required: false, type: string, default: '' }
      # ── 工件上传开关: 固件 tarball 与 SDK/IB 归档体积大 (上传下载耗时),
      #    可关; published-state (状态回写依赖) 与 build-info 不受控 ──
      upload_artifacts:     { required: false, type: boolean, default: true }
      # 构建日志 artifact (logs/ 分包日志 + build.log): 失败恒上传 (诊断需要);
      # 成功时也上传 (默认, 供 stamp 判定/耗时分析), 可关省 artifact 存储
      upload_build_log:     { required: false, type: boolean, default: true }
      clean_cache:          { required: false, type: boolean, default: false }
      # hostpkg 快照是否包含 build_dir 门禁 stamp (rust/golang host-compile
      # 缓存闭环的必要组成; 关闭 = 退回纯 staging 快照, host 自举每轮重编)
      hostpkg_stamp_cache:  { required: false, type: boolean, default: true }
      # Summary 详细程度: auto = 外部 caller 完整 / 自身仓库调用 (编排方有
      # plan 上下文) 简洁; full/compact 显式覆盖。采集失败一律降级不阻断构建。
      summary_mode:         { required: false, type: string, default: 'auto' }
      free_disk_space:      { required: false, type: boolean, default: false }
      publish_sdk_ib:       { required: false, type: boolean, default: true }
      # 跳过编译后约 custom-feed 追平重编 (与 unified 的 skip_upstream 语义对齐)
      skip_feed_catchup:   { required: false, type: boolean, default: false }
    secrets:
      ACCESS_TOKEN:         { required: true }
      APK_BUILD_KEY:        { required: false }
      USIGN_KEY:            { required: false }
      CONFIG_TOKEN:         { required: false }

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile-firmware:
    name: Compile ${{ inputs.matrix_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    concurrency:
      group: packages-release-${{ inputs.matrix_target }}-${{ inputs.matrix_passwall_repo }}-${{ inputs.matrix_passwall_tag }}
      cancel-in-progress: false
    env:
      # 刻意不叫 TARGET/HOST/ARCH: 这些名字会被 autoconf AX_ENABLE_BUILDDIR 等宏读取,
      # 导致 configure 把 build 树建到 ./$TARGET/ 而非 ./$host/ (libffi 因此 InstallDev 失败)
      IMMWRT_TARGET: ${{ inputs.matrix_target }}
      # 配置根目录 (seed/sdk.config 来源): 默认 caller 仓库, 可用 config_repo 覆盖
      CONFIG_ROOT: ${{ github.workspace }}/CallerConfig/${{ inputs.config_path }}
    steps:
      # ── 前置参数校验 (fail-fast): 纯参数校验不依赖文件系统, 先于所有 checkout。
      #    拦住 required 穿透的空字符串 / 格式非法 / repo 不可达 (拼错或无权限),
      #    避免构建数小时后发布步骤才失败。
      - name: Validate inputs
        id: validate-inputs
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ERRORS=()
          fail() { ERRORS+=("$1"); }
          validate_repo() {
            local value="$1" name="$2"
            [ -n "$value" ] || return 0
            case "$value" in
              */*) ;;
              *) fail "${name} 格式无效: '${value}' (应为 owner/repo)" ;;
            esac
          }
          validate_name() {
            local value="$1" name="$2"
            [ -n "$value" ] || return 0
            case "$value" in
              ''|*[!A-Za-z0-9._/-]*) fail "${name} 含非法字符: '${value}'" ;;
            esac
          }

          # ── 非空校验 (required 穿透空字符串的兜底) ──
          [ -n "${{ inputs.matrix_target }}" ] || fail "matrix_target 为空"
          [ -n "${{ inputs.matrix_repo }}" ] || fail "matrix_repo 为空"
          [ -n "${{ inputs.matrix_ref }}" ] || fail "matrix_ref 为空"
          [ -n "${{ inputs.matrix_packages_branch }}" ] || fail "matrix_packages_branch 为空"

          # ── 格式校验 ──
          validate_name "${{ inputs.matrix_target }}" "matrix_target"
          validate_repo "${{ inputs.matrix_repo }}" "matrix_repo"
          validate_name "${{ inputs.matrix_ref }}" "matrix_ref"
          validate_name "${{ inputs.matrix_packages_branch }}" "matrix_packages_branch"
          validate_repo "${{ inputs.matrix_release_repo }}" "matrix_release_repo"
          validate_repo "${{ inputs.matrix_passwall_repo }}" "matrix_passwall_repo"
          validate_repo "${{ inputs.matrix_artifacts_release_repo }}" "matrix_artifacts_release_repo"
          validate_name "${{ inputs.matrix_passwall_tag }}" "matrix_passwall_tag"
          validate_name "${{ inputs.matrix_artifacts_release_tag }}" "matrix_artifacts_release_tag"
          validate_name "${{ inputs.matrix_firmware_release_tag_prefix }}" "matrix_firmware_release_tag_prefix"
          case "${{ inputs.release_type }}" in
            release|prerelease|draft) ;;
            *) fail "release_type 非法: '${{ inputs.release_type }}' (可选 release|prerelease|draft)" ;;
          esac
          case "${{ inputs.config_path }}" in
            /*|*..*) fail "config_path 非法: '${{ inputs.config_path }}' (禁止绝对路径与 ..)" ;;
          esac
          # collect_packages: 逗号分隔包名, 逐 token 白名单 (拦拼错/夹带 shell 元字符)
          COLLECT_INPUT="${{ inputs.collect_packages }}"
          if [ -n "$COLLECT_INPUT" ]; then
            for token in $(printf '%s' "$COLLECT_INPUT" | tr ',' ' '); do
              case "$token" in
                ''|*[!A-Za-z0-9+._-]*) fail "collect_packages 含非法包名: '${token}' (逗号分隔, 包名字符集 [A-Za-z0-9+._-])" ;;
              esac
            done
          fi
          KEEP_V="${{ inputs.matrix_artifacts_keep_versions }}"
          case "$KEEP_V" in
            ''|*[!0-9]*) fail "matrix_artifacts_keep_versions 非数字: '${KEEP_V}'" ;;
            *)
              # 下限 1 为刻意设计: 写入方自约束"有界保留" (防资产无限累积),
              # 0/禁用 = 放弃收敛, 不提供。
              if [ "$KEEP_V" -lt 1 ] || [ "$KEEP_V" -gt 30 ]; then
                fail "matrix_artifacts_keep_versions 超出范围 [1,30]: ${KEEP_V}"
              fi
              ;;
          esac
          PW_KEEP="${{ inputs.passwall_keep_versions }}"
          case "$PW_KEEP" in
            ''|*[!0-9]*) fail "passwall_keep_versions 非数字: '${PW_KEEP}'" ;;
            *)
              # 下限 1 同上: 有界保留是收敛的立项前提 (G14), 不提供禁用档。
              if [ "$PW_KEEP" -lt 1 ] || [ "$PW_KEEP" -gt 30 ]; then
                fail "passwall_keep_versions 超出范围 [1,30]: ${PW_KEEP}"
              fi
              ;;
          esac

          # ── 可达性探测 (repo 类参数非空时; 拦住拼错/无权限, 防几小时后发布才失败) ──
          for repo_entry in \
            "matrix_repo:${{ inputs.matrix_repo }}" \
            "matrix_release_repo:${{ inputs.matrix_release_repo }}" \
            "matrix_passwall_repo:${{ inputs.matrix_passwall_repo }}" \
            "matrix_artifacts_release_repo:${{ inputs.matrix_artifacts_release_repo }}"; do
            name="${repo_entry%%:*}"
            repo="${repo_entry#*:}"
            [ -n "$repo" ] || continue
            if ! gh repo view "$repo" --json name >/dev/null 2>&1; then
              fail "${name} 不可达 (不存在或 ACCESS_TOKEN 无读权限): ${repo}"
            fi
          done

          if [ "${#ERRORS[@]}" -gt 0 ]; then
            for e in "${ERRORS[@]}"; do echo "::error::${e}"; done
            echo "::error::参数校验失败 (${#ERRORS[@]} 项), 构建未开始即终止"
            exit 1
          fi

          # ── 版本号解析: 显式 version 优先; 空则按 version_prefix 自动生成 ──
          # version 进 release tag 与产物文件名, 白名单校验防注入;
          # prefix 同规则 (空 = 纯日期版本), 非法降级默认 'V' 并告警。
          # 注意: 此处必须读 inputs.version —— RESOLVED_VERSION 由本步骤末尾
          # 写入 GITHUB_ENV, 此时尚不存在 (自引用恒空 = 显式 version 被静默丢弃)
          VERSION_INPUT="${{ inputs.version }}"
          VERSION_PREFIX="${{ inputs.version_prefix }}"
          case "$VERSION_PREFIX" in
            *[!A-Za-z0-9._-]*)
              echo "::warning::version_prefix 含非法字符: '${VERSION_PREFIX}', 降级为默认 'V'"
              VERSION_PREFIX="V"
              ;;
          esac
          if [ -n "$VERSION_INPUT" ]; then
            case "$VERSION_INPUT" in
              *[!A-Za-z0-9._-]*)
                echo "::error::version 含非法字符: '${VERSION_INPUT}'"
                exit 1
                ;;
            esac
            RESOLVED_VERSION="$VERSION_INPUT"
            echo "ℹ️ 使用传入版本号: ${RESOLVED_VERSION}"
          else
            RESOLVED_VERSION="${VERSION_PREFIX}$(TZ=${{ env.TZ }} date +'%y%m%d')"
            echo "ℹ️ version 未传入, 自动生成: ${RESOLVED_VERSION} (前缀 '${VERSION_PREFIX}')"
          fi
          echo "RESOLVED_VERSION=${RESOLVED_VERSION}" >> "$GITHUB_ENV"

          # ── hostpkg 快照 path 列表拼装 (单一事实来源) ──
          # restore/save 四处统一引用本输出, 构造上保证 path 一致性 (cache
          # version hash 对 path 列表敏感, 手抄多处易漂移致快照永不命中)。
          # hostpkg_stamp_cache=false 剔除 build_dir 两根 (退回纯 staging 快照,
          # rust/golang host-compile 每轮重编, 快照体积回到裁剪基线)。
          # rust 的 HOST_BUILD_DIR 被包 Makefile 覆盖到 build_dir/target-*/host/
          # (golang 用默认 build_dir/hostpkg/), 两根都必须覆盖。
          # 注意: EOF 块内路径行必须顶格 —— toolkit getInput 会 trim 首尾空白。
          if [ "${{ inputs.hostpkg_stamp_cache }}" = "true" ]; then
            {
              echo "hostpkg_cache_paths<<EOF"
              echo "openwrt/staging_dir/hostpkg"
              echo "openwrt/staging_dir/target-*/host"
              echo "openwrt/build_dir/hostpkg"
              echo "openwrt/build_dir/target-*/host"
              echo "openwrt/dl/cargo"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "hostpkg_cache_paths<<EOF"
              echo "openwrt/staging_dir/hostpkg"
              echo "openwrt/staging_dir/target-*/host"
              echo "openwrt/dl/cargo"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          # ── Summary 模式判定: 外部 caller 直调 = full (run 页无 plan 上下文,
          #     executor summary 是唯一报告); 自身仓库调用 (编排方 summary 已有
          #     触发/目标/版本/路由决策) = compact 去重。显式 full/compact 覆盖。
          #     非法值降级 auto 并告警 (不阻断: summary 是增强功能)。
          SUMMARY_COMPACT=false
          case "${{ inputs.summary_mode }}" in
            full) ;;
            compact) SUMMARY_COMPACT=true ;;
            auto|'')
              if [ "${{ github.repository }}" = "solarflows/AutoWorkflows" ]; then
                SUMMARY_COMPACT=true
              fi
              ;;
            *)
              echo "::warning::summary_mode 非法: '${{ inputs.summary_mode }}' (auto/full/compact), 降级 auto"
              if [ "${{ github.repository }}" = "solarflows/AutoWorkflows" ]; then
                SUMMARY_COMPACT=true
              fi
              ;;
          esac
          echo "summary_compact=${SUMMARY_COMPACT}" >> "$GITHUB_OUTPUT"
          echo "SUMMARY_COMPACT=${SUMMARY_COMPACT}" >> "$GITHUB_ENV"
          echo "ℹ️ Summary 模式: ${SUMMARY_COMPACT} (mode=${{ inputs.summary_mode }}, caller=${{ github.repository }})"

          echo "✅ 参数校验通过"

      - name: Checkout defaults repo (AutoWorkflows)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.defaults_repo }}
          ref: ${{ inputs.defaults_ref }}
          path: AutoWorkFlows

      - name: Checkout config source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.config_repo || github.repository }}
          # config_repo 空 → github.sha (run 触发 commit, 不可变); 非空 → config_ref
          # (空 = config_repo 默认分支)。表达式语义: a && b || c 按 JS 真值返回操作数。
          ref: ${{ inputs.config_repo == '' && github.sha || inputs.config_ref }}
          token: ${{ secrets.CONFIG_TOKEN || github.token }}
          path: CallerConfig
          sparse-checkout: |
            ${{ inputs.config_path }}

      - name: Validate config source
        run: |
          set -euo pipefail
          CONFIG_REPO="${{ inputs.config_repo || github.repository }}"
          CONFIG_REF="${{ inputs.config_repo == '' && github.sha || inputs.config_ref }}"
          [ -n "$CONFIG_REF" ] || CONFIG_REF="(default branch)"
          SEED_DIR="${CONFIG_ROOT}/${{ inputs.matrix_target }}"
          if [ ! -d "$SEED_DIR" ]; then
            echo "::error::配置目录不存在: ${SEED_DIR} (config_repo=${CONFIG_REPO}, config_path=${{ inputs.config_path }}, target=${{ inputs.matrix_target }})"
            exit 1
          fi
          if ! ls "$SEED_DIR"/*.seed >/dev/null 2>&1; then
            echo "::error::配置目录无 *.seed 文件: ${SEED_DIR} (config_repo=${CONFIG_REPO})"
            exit 1
          fi
          echo "✅ 配置来源: ${CONFIG_REPO} @ ${CONFIG_REF} → ${SEED_DIR}"
          ls "$SEED_DIR"/*.seed | xargs -n1 basename | sed 's/^/  📄 /'

          # ── CRLF 检测: Windows 换行会污染 Kconfig 值 (CONFIG_FOO=y\r 被当作
          # 值的一部分), defconfig 不报错但行为异常; 检出即 dos2unix 转换
          # (幂等) + warning 指明文件, 让 caller 在源头仓库修复 ──
          # grep rc=1 (无 CRLF) 是预期状态; -I 排除二进制
          CRLF_FILES=$(grep -rlI $'\r' "$SEED_DIR" --include='*.seed' --include='sdk.config' 2>/dev/null || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "::warning::检测到 CRLF 换行, 已自动转换 (dos2unix): ${CRLF_FILES}"
            printf '%s\n' "$CRLF_FILES" | xargs -r dos2unix
          fi

      - name: Checkout Source Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.matrix_repo }}
          ref: ${{ inputs.matrix_ref }}
          path: openwrt
          fetch-depth: 1

      - name: Get source & clone packages
        id: clone_packages
        env:
          STANDARD_PACKAGES_REPO: ${{ inputs.standard_packages_repo }}
          STANDARD_PACKAGES_BRANCH: ${{ inputs.standard_packages_branch }}
        run: |
          set -euo pipefail
          cd openwrt
          SHA=$(git rev-parse --short HEAD)
          SHA_FULL=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "sha_full=${SHA_FULL}" >> $GITHUB_OUTPUT

          # ── standard_packages_branch 回退链: 显式传 > targets.json 编排元数据 > 硬失败 ──
          # 不回退 matrix_packages_branch (custom feed 与标准 feed 是两个仓库,
          # 分支名无必然关联, 同名仅是 ipq 系的巧合); targets.json 与 unified
          # 传值同源, 外部 caller 回退读它 = 与官方构建 feed 一致
          if [ -z "$STANDARD_PACKAGES_BRANCH" ]; then
            TARGETS_JSON="../AutoWorkFlows/openwrt-configs/immortalwrt/targets.json"
            [ -f "$TARGETS_JSON" ] || { echo "::error::targets.json 不存在: ${TARGETS_JSON}"; exit 1; }
            STANDARD_PACKAGES_BRANCH=$(jq -r --arg t "${{ inputs.matrix_target }}" \
              '.targets[] | select(.target == $t) | .standard_packages_branch // empty' \
              "$TARGETS_JSON" || true)
            if [ -n "$STANDARD_PACKAGES_BRANCH" ]; then
              echo "ℹ️ standard_packages_branch 未传入, 回退 targets.json: ${STANDARD_PACKAGES_BRANCH}"
            else
              echo "::error::standard_packages_branch 未传入且 targets.json 中 target=${{ inputs.matrix_target }} 未配置该字段; 请显式传入或补充 targets.json"
              exit 1
            fi
          fi
          echo "standard_packages_branch=${STANDARD_PACKAGES_BRANCH}" >> $GITHUB_OUTPUT

          case "$STANDARD_PACKAGES_REPO" in
            */*) ;;
            *) echo "::error::标准 packages 仓库格式无效: $STANDARD_PACKAGES_REPO"; exit 1 ;;
          esac
          case "$STANDARD_PACKAGES_BRANCH" in
            ''|*[!A-Za-z0-9._/-]*) echo "::error::标准 packages 分支名无效: $STANDARD_PACKAGES_BRANCH"; exit 1 ;;
          esac
          STANDARD_FEED_URL="https://github.com/${STANDARD_PACKAGES_REPO}.git"
          if grep -Eq '^src-git[[:space:]]+packages[[:space:]]' feeds.conf.default; then
            sed -i -E "s|^src-git[[:space:]]+packages[[:space:]].*$|src-git packages ${STANDARD_FEED_URL};${STANDARD_PACKAGES_BRANCH}|" feeds.conf.default
          else
            printf '%s\n' "src-git packages ${STANDARD_FEED_URL};${STANDARD_PACKAGES_BRANCH}" >> feeds.conf.default
          fi

          git clone --depth 1 https://github.com/${{ inputs.packages_feed_repo }}.git package/${{ inputs.packages_feed_name }} -b ${{ inputs.matrix_packages_branch }}
          PKG_SHA=$(git -C package/${{ inputs.packages_feed_name }} rev-parse --short HEAD)
          PKG_SHA_FULL=$(git -C package/${{ inputs.packages_feed_name }} rev-parse HEAD)
          echo "packages_sha=${PKG_SHA}" >> $GITHUB_OUTPUT
          echo "packages_sha_full=${PKG_SHA_FULL}" >> $GITHUB_OUTPUT

          # ───────── 磁盘空间监控（第 1 阶段：初始状态）─────────
      # 刻意设计: 4 阶段磁盘监控用于诊断空间不足/缓存膨胀, 数据写入 outputs 供最后汇总表
      - name: 💽 Disk space · Initial
        id: disk-1
        # 采集类步骤: 失败只降级不阻断 (outputs 缺失时消费方有 || 0 兜底)
        continue-on-error: true
        run: |
          echo "📊 初始磁盘空间（克隆后，环境准备前）"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "📊 openwrt/ : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"

      - name: Compute toolchain hash
        id: toolchain_hash
        run: |
          # The checkout is intentionally shallow, so git log can return no
          # result even when the current tree contains the relevant sources.
          # Hash the current tree objects instead; this is stable at depth=1.
          TOOLS_TREE=$(git -C openwrt rev-parse HEAD:tools 2>/dev/null || echo "missing")
          TOOLCHAIN_TREE=$(git -C openwrt rev-parse HEAD:toolchain 2>/dev/null || echo "missing")
          HASH=$(printf '%s\n%s\n' "$TOOLS_TREE" "$TOOLCHAIN_TREE" | sha256sum | cut -c1-16)
          if [ "${{ inputs.clean_cache }}" = "true" ]; then
            # Cache keys are immutable. A clean rebuild must write a new snapshot
            # even when the source hash has not changed since the previous clean run.
            HASH="force-${HASH}-${GITHUB_RUN_ID}"
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Prepare Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          run_bounded() {
            local label="$1"
            local seconds="$2"
            shift 2
            echo "▶️ ${label} (超时 ${seconds}s)"
            if timeout --signal=TERM --kill-after=30s "$seconds" "$@"; then
              echo "✅ ${label} 完成"
            else
              local status=$?
              if [ "$status" -eq 124 ]; then
                echo "::error::${label} 超时 (${seconds}s)"
              else
                echo "::error::${label} 失败，退出码: ${status}"
              fi
              return "$status"
            fi
          }

          run_bounded "禁用 snap 自动更新与锁定无关包" 30 bash -c '
            set -euo pipefail
            echo "🛑 停止并屏蔽 snapd 守护进程与定时刷新..."
            sudo snap set system refresh.hold="forever" 2>/dev/null || true
            sudo systemctl mask --now snapd.service snapd.socket snapd.seeded.service snapd.refresh.timer 2>/dev/null || true
            echo "🔒 锁定 firefox 与 snapd 包版本，防止 apt full-upgrade 触发 snap 更新..."
            sudo apt-mark hold firefox snapd 2>/dev/null || true
          '

          run_bounded "更新 apt 索引" 600 sudo -E apt-get update

          # ── 声明式依赖安装 (替代 build-scripts.immortalwrt.org 外部脚本, 消除 SPOF) ──
          # 包列表 = init_build_environment.sh noble 主列表 ∪ immortalwrt/docker
          # Dockerfile.base 依赖; runner 已预装部分由 APT 状态机幂等跳过 (零网络零解压)。
          # 刻意不做的 (外部脚本面向实体机, runner 上无意义或有风险):
          #   apt full-upgrade / 测速换源 / 换 sources.list (runner 镜像每周滚动)
          #   PPA 与外部源 (git/gh/node/go/clang 为 runner 预装, 版本等价或更新)
          #   upx/padjffs2/po2lmo 外部二进制 (tools/upx 与 luci-base 构建期自举;
          #    padjffs2 仅 jffs2 镜像需要, 本仓库 target 均为 squashfs)
          run_bounded "安装 OpenWrt 编译依赖" 900 \
            sudo -E apt-get -yqq --no-install-recommends install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang-18 cmake cpio curl \
            device-tree-compiler dos2unix ecj fakeroot fastjar file flex gawk \
            g++-multilib gcc-multilib genisoimage gettext gnutls-dev gperf \
            haveged help2man intltool irqbalance jq lib32gcc-s1 libc6-dev-i386 \
            libclang-18-dev libdw-dev libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld-18 \
            locales llvm-18 lrzsz msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf pv pwgen python3 python3-pip python3-cryptography \
            python3-docutils python3-ply python3-pyelftools python3-requests \
            qemu-utils quilt re2c rsync scons sharutils signify-openbsd \
            squashfs-tools subversion swig texinfo uglifyjs unzip upx-ucl \
            vim wget xmlto xxd zlib1g-dev zstd
          # 32 位 host 汇编头 (init 脚本等价逻辑, 幂等)
          [ -e /usr/include/asm ] || \
            sudo ln -svf "/usr/include/$(gcc -dumpmachine)/asm" /usr/include/asm

      # ───────── 磁盘空间监控（第 2 阶段：环境准备后）─────────
      - name: 💽 Disk space · After env prep
        id: disk-2
        # 采集类步骤: 失败只降级不阻断 (outputs 缺失时消费方有 || 0 兜底)
        continue-on-error: true
        run: |
          echo "📊 环境准备后磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"

      - name: Free Disk Space
        if: inputs.free_disk_space == true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # ───────── 工具链缓存恢复（独立 restore, 仅非 clean 模式）─────────
      # 刻意设计: 拆为独立 restore + save(见 Purge 前) 而非一体式 actions/cache@v5。
      # clean_cache=true 时跳过 restore(不下载旧缓存), 实现真正的刷新。
      # save 仅构建成功时触发(if: success()), 避免失败半成品污染缓存 key。
      - name: Restore toolchain cache
        id: cache-tc-restore
        if: inputs.clean_cache != true
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-${{ steps.toolchain_hash.outputs.hash }}
          restore-keys: |
            immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      - name: Restore ccache
        if: inputs.clean_cache != true
        id: cache-cc
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          restore-keys: |
            immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-
          path: openwrt/.ccache

      # ───────── 缓存恢复与状态上报 ─────────
      # 刻意设计: 诊断性质步骤(v1 遗产), 缓存恢复失败不应阻塞后续构建,
      # 故 continue-on-error: true, 由 ccache Stats 步骤做指标报告
      - name: Verify & report cache status
        id: cache-refresh
        continue-on-error: true
        run: |
          CLEAN_CACHE="${{ inputs.clean_cache }}"
          # clean_cache=true: restore 已跳过(见上一步), 本地残留一并清空
          if [ "$CLEAN_CACHE" = "true" ]; then
            CCACHE_BIN="$(pwd)/openwrt/staging_dir/host/bin/ccache"
            [ -x "$CCACHE_BIN" ] || CCACHE_BIN="$(command -v ccache 2>/dev/null || true)"
            [ -n "$CCACHE_BIN" ] && "$CCACHE_BIN" -C 2>/dev/null || true
            rm -rf openwrt/.ccache 2>/dev/null || true
          fi

          TOOLCHAIN_RESTORED=false
          if [ "$CLEAN_CACHE" != "true" ] \
             && [ -d openwrt/staging_dir ] \
             && [ "$(find openwrt/staging_dir -type d -name stamp -not -path '*target*' 2>/dev/null | head -1)" ]; then
            TOOLCHAIN_RESTORED=true
          fi
          echo "toolchain_restored=${TOOLCHAIN_RESTORED}" >> $GITHUB_OUTPUT
          echo "toolchain_exact=${{ steps.cache-tc-restore.outputs.cache-hit || 'false' }}" >> $GITHUB_OUTPUT

          CCACHE_RESTORED=false
          if [ "$CLEAN_CACHE" != "true" ] \
             && [ -d openwrt/.ccache ] \
             && [ "$(find openwrt/.ccache -type f 2>/dev/null | head -1)" ]; then
            CCACHE_RESTORED=true
          fi
          echo "ccache_restored=${CCACHE_RESTORED}" >> $GITHUB_OUTPUT

      # ───────── SDK hostpkg 缓存恢复 (rust/golang host-compile 闭环) ─────────
      # 修复断点 A: 此前该 namespace 只存不取。恢复 staging 侧编译器产物 +
      # build_dir 门禁 stamp (.prepared/.configured/.built), 配合 Prepare
      # toolchain 的拓扑 touch 使 host-compile 秒级跳过。
      # 位置在 Verify 之后: 避免 staging_dir/hostpkg/stamp 污染
      # TOOLCHAIN_RESTORED 检测 (toolchain miss + hostpkg hit 时误报)。
      # path 引用 validate-inputs 拼装输出, 与 save 端严格同源。
      - name: Restore SDK hostpkg cache
        id: cache-hostpkg-restore
        if: inputs.clean_cache != true
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: immwrt-v2-sdk-hostpkg-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          restore-keys: |
            immwrt-v2-sdk-hostpkg-${{ env.IMMWRT_TARGET }}-
          path: ${{ steps.validate-inputs.outputs.hostpkg_cache_paths }}

      # ───────── 更新 feeds（源码 + 软件包索引）─────────
      - name: Update Feeds & Packages
        id: update-feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          STANDARD_PACKAGES_SHA=$(git -C feeds/packages rev-parse HEAD)
          echo "standard_packages_sha=${STANDARD_PACKAGES_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 标准 packages feed 实际版本: ${STANDARD_PACKAGES_SHA}"

          # ── 目录树: 各 feed 是否已 install (排除 .git/中间产物) ──
          # 可选诊断展示: 管道失败(如 head 截断触发 SIGPIPE)不阻断构建
          echo ""
          echo "📂 openwrt/package/ 目录树 (feeds install 后):"
          echo '```text'
          find package -maxdepth 3 \
            -not -path '*/.git/*' -not -path '*/staging_dir*' -not -path '*/build_dir*' \
            -print 2>/dev/null | sort | sed 's|^package|.|' | head -80 || true
          echo '```'

      - name: Apply Configuration
        id: apply_config
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  ⚙️ Apply Configuration               ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          SEED_DIR="${CONFIG_ROOT}/${{ inputs.matrix_target }}"
          echo "📄 合并种子配置: $SEED_DIR"
          find "$SEED_DIR" -type f -name '*.seed' | sort | while read -r f; do
            echo "  + $(basename "$f")" >&2
            if [ ! -s "$f" ]; then
              echo "    ⚠️ 跳过空文件" >&2
              continue
            fi
            cat "$f"
            [ -z "$(tail -c1 "$f")" ] || echo
            true
          done > .config
          sed -i 's/\r$//; s/\xef\xbb\xbf//g' .config
          echo "✅ 已生成 .config ($(wc -l < .config) 行)"

          # ── 构建系统基础选项检测补齐 (不依赖 caller seed 声明) ──
          # 逐项检测缺失才追加 (不重复追加已有项, 防 make 校验变严后重复定义报错);
          # CONFIG_DEVEL=y 必须先于 CCACHE/BUILD_LOG (Kconfig "if DEVEL" 可见性,
          # 缺 DEVEL 时 defconfig 会把后两者当未知符号丢弃)。
          # CONFIG_AUTOREMOVE: .prepared stamp 文件名寻址模式切换 ——
          # include/depends.mk 中 AUTOREMOVE=y → find_md5_reproducible (纯内容
          # 哈希, feed 同 commit 跨 run 稳定); 未设 → find_md5 (含源码 mtime,
          # CI 每轮全新 clone feed → 哈希必变 → stamp 文件名不匹配 → host-compile
          # 每轮 rm -rf 重编)。是 build_dir 门禁 stamp 缓存闭环的必要条件。
          # 匹配容忍尾随空白/行内注释 (caller seed 常见 "CONFIG_X=y  # 注释" 格式,
          # 严格 $ 行尾匹配会误报缺失并重复追加 — run 38112393097 实证)。
          AUTO_FIXED=""
          for OPT in CONFIG_DEVEL CONFIG_CCACHE CONFIG_BUILD_LOG CONFIG_AUTOREMOVE; do
            if ! grep -qE "^${OPT}=y([[:space:]#]|$)" .config; then
              printf '%s=y\n' "$OPT" >> .config
              AUTO_FIXED="${AUTO_FIXED} ${OPT}=y"
            fi
          done
          if [ -n "$AUTO_FIXED" ]; then
            echo "::warning::seed 缺少构建系统基础选项, 已自动补齐:${AUTO_FIXED} (建议在 seed 中显式声明)"
          else
            echo "✅ 构建系统基础选项齐备 (DEVEL/CCACHE/BUILD_LOG)"
          fi

          echo "📋 ======== 种子配置 (.config) ========"
          cat .config
          echo "🔧 运行 make defconfig (超时 5 分钟)..."
          timeout 300 make defconfig || {
            echo "❌ make defconfig 超时或失败，请检查 .config 语法"
            exit 1
          }
          echo "📋 ======== defconfig 后 .config ========"
          cat .config

          # ── 原始版本号 (patch 前), 用作 SDK/IB tarball 版本标识 ──
          # 陷阱: 不能直接 grep/cut version.mk —— 上游 version.mk 的 VERSION_NUMBER
          # 可能是 make 表达式 (如 $(call qstrip,$(CONFIG_VERSION_NUMBER))), 直接截取
          # 会把表达式当版本号注入后续 shell 脚本 / index.json, 导致 command not
          # found (exit 127)。(见 docs/openwrt-build-pitfalls.md § Make 表达式版本号)
          # 解析顺序: ① .config 的 CONFIG_VERSION_NUMBER (纯字符串)
          #         ② version.mk 首行字面量 (无 $ 表达式)
          #         ③ $(if ...,...,<fallback>) 的兜底字面量 (如 21.02-SNAPSHOT)
          #         ④ 兜底 SNAPSHOT
          VERSION="${{ env.RESOLVED_VERSION }}"
          ORIG_VER=$(grep -m1 '^CONFIG_VERSION_NUMBER=' .config 2>/dev/null | cut -d'"' -f2 | tr -d '[:space:]' || true)
          if [ -z "$ORIG_VER" ]; then
            LITERAL=$(sed -n 's/^VERSION_NUMBER:=//p' include/version.mk | head -1 | tr -d '[:space:]')
            case "$LITERAL" in
              \$*|*'$('*) ;;                    # make 表达式 → 跳过
              *) ORIG_VER="$LITERAL" ;;
            esac
          fi
          if [ -z "$ORIG_VER" ]; then
            # $(if $(VERSION_NUMBER),$(VERSION_NUMBER),<fallback>) → 取兜底字面量
            FALLBACK=$(sed -n 's/^VERSION_NUMBER:=//p' include/version.mk | sed -n '2p' \
              | sed -E 's/.*,[[:space:]]*([^,()]*)\)[[:space:]]*$/\1/' | tr -d '[:space:]')
            case "$FALLBACK" in
              \$*|*'$('*) ;;                    # 仍是表达式 → 兜底 SNAPSHOT
              *) ORIG_VER="$FALLBACK" ;;
            esac
          fi
          ORIG_VER="${ORIG_VER:-SNAPSHOT}"

          if echo "$ORIG_VER" | grep -qi 'snapshot'; then
            SOURCE_VER="${ORIG_VER}-$(TZ=$TZ date +'%Y%m%d')"
          else
            SOURCE_VER="$ORIG_VER"
          fi
          # patch 后生效版本号 (与下方 version.mk sed 相同变换): 上游 SDK/IB 文件名
          # 由本次构建生成, 内嵌的 <version>- 前缀是 patch 后的值, 需用它匹配剥离
          PATCHED_VER=$(printf '%s' "$ORIG_VER" | sed "s/SNAPSHOT/${VERSION}/g")
          echo "source_version=${SOURCE_VER}" >> $GITHUB_OUTPUT
          echo "original_version=${ORIG_VER}" >> $GITHUB_OUTPUT
          echo "patched_version=${PATCHED_VER}" >> $GITHUB_OUTPUT
          echo "🏷️ source_version: ${SOURCE_VER} | original: ${ORIG_VER} | patched: ${PATCHED_VER}"

          sed -i "/^VERSION_NUMBER:=/s/SNAPSHOT/${VERSION}/g" include/version.mk
          echo "📋 version.mk:"
          grep 'VERSION_NUMBER' include/version.mk || true
          sed -i 's/^IMG_PREFIX_VERNUM:=.*/IMG_PREFIX_VERNUM:=$(call sanitize,$(VERSION_NUMBER))-/' include/image.mk
          echo "📋 image.mk IMG_PREFIX_VERNUM:"
          grep 'IMG_PREFIX_VERNUM' include/image.mk || true

          # ── 包管理器探测 (决定签名机制) ──
          # APK (main/SNAPSHOT) 与 IPK (21.02) 的签名机制不同: APK 用 openssl PEM,
          # IPK 用 usign Ed25519。不能依赖 targets.json 的静态 apk_signing 字段,
          # 因为分支升级到 snapshot 后该字段会失效。以 .config 实际值为准动态判断。
          if grep -q '^CONFIG_USE_APK=y' .config; then
            USE_APK=true
          else
            USE_APK=false
          fi
          echo "use_apk=${USE_APK}" >> $GITHUB_OUTPUT
          echo "📦 包管理器: $([ "$USE_APK" = "true" ] && echo APK || echo IPK/opkg)"

      # ════════════ 签名密钥注入（在 make defconfig 之后、编译之前）════════════
      # 密钥生成时机: OpenWrt 的 APK private-key.pem / usign key-build 均在 package/index
      # 签名阶段才生成, 而非 make defconfig 时。故注入只需在编译前, 放在 Apply
      # Configuration (含 defconfig) 之后即可, 且能读到 .config 的 CONFIG_USE_APK。
      # 单个步骤按 use_apk 按需使用对应密钥; 输出 sign_mode(apk/usign/random) 供发布说明。
      - name: Setup Signing Key
        id: signing_key
        env:
          APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
          USIGN_KEY:     ${{ secrets.USIGN_KEY }}
        run: |
          set -euo pipefail
          USE_APK="${{ steps.apply_config.outputs.use_apk }}"

          # random 降级兜底 (刻意设计, require_signing=false 默认): 缺钥/坏钥只告警、
          # 构建继续——试跑或无密钥仓库不应被阻断, 产物由构建系统随机密钥签名,
          # 设备端需 --allow-untrusted/--force-checksum。require_signing=true 时
          # 该兜底改为硬失败, 阻止随机密钥/未签名产物进入 Release。
          random_fallback() {
            echo "sign_mode=random" >> "$GITHUB_OUTPUT"
            echo "fingerprint=none" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.require_signing }}" = "true" ]; then
              echo "::error::require_signing=true: 签名密钥缺失或无效, 拒绝继续构建"
              exit 1
            fi
            exit 0
          }

          if [ "$USE_APK" = "true" ]; then
            # ════════════ APK 签名 (ECDSA/RSA PEM) ════════════
            SIGN_MODE="apk"
            if [ -z "$APK_BUILD_KEY" ]; then
              echo "::warning::APK_BUILD_KEY secret 未设置 — 构建系统将生成随机密钥, 设备 apk add 需 --allow-untrusted"
              random_fallback
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出字节数/指纹不输出内容。
            printf '%s' "$APK_BUILD_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > openwrt/private-key.pem
            chmod 600 openwrt/private-key.pem
            sed -i 's/\r$//' openwrt/private-key.pem
            echo "📏 密钥文件: $(wc -c < openwrt/private-key.pem) 字节 (不输出内容)"

            echo "🔍 验证密钥格式..."
            if openssl ec -in openwrt/private-key.pem -check -noout 2>/dev/null; then
              echo "✅ ECDSA 私钥格式验证通过"
            elif openssl rsa -in openwrt/private-key.pem -check -noout 2>/dev/null; then
              echo "::warning::APK_BUILD_KEY 是 RSA 密钥, ImmortalWrt APK 构建系统默认使用 ECDSA prime256v1"
              echo "::notice::建议重新生成 ECDSA 密钥: openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            else
              KEY_HEADER=$(head -c 50 openwrt/private-key.pem 2>/dev/null)
              echo "::error::APK_BUILD_KEY 不是有效的 PEM 格式私钥 (需要 ECDSA prime256v1 或 RSA)"
              echo "::notice::密钥头部(仅 PEM header, 不含密钥): ${KEY_HEADER}"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续"
              rm -f openwrt/private-key.pem
              random_fallback
            fi

            openssl ec -in openwrt/private-key.pem -pubout -out openwrt/public-key.pem 2>/dev/null || \
              openssl rsa -in openwrt/private-key.pem -pubout -out openwrt/public-key.pem
            chmod 644 openwrt/public-key.pem
            echo "✅ 公钥已派生 → openwrt/public-key.pem"
            FP=$(openssl sha256 < openwrt/public-key.pem | awk '{print $NF}')
          else
            # ════════════ IPK 签名 (usign Ed25519) ════════════
            SIGN_MODE="usign"
            # usign 私钥文件 = "untrusted comment: ..." 头 + base64(104 字节 seckey 结构)。
            # seckey 结构: pkalg[2]+kdfalg[2]+kdfrounds[4]+salt[16]+checksum[8]+fingerprint[8]+seckey[64]。
            # USIGN_KEY 存完整 key-build 文件内容, 由本地直接导入 (gh secret set USIGN_KEY < key-build)。
            if [ -z "$USIGN_KEY" ]; then
              echo "::warning::USIGN_KEY secret 未设置 — 构建系统将生成随机 usign 密钥, 设备 opkg install 需 --force-checksum"
              random_fallback
            fi
            # 防泄漏: printf 而非 echo, chmod 600, 只输出指纹不输出内容。
            printf '%s\n' "$USIGN_KEY" > openwrt/key-build
            chmod 600 openwrt/key-build
            sed -i 's/\r$//' openwrt/key-build

            # 校验 seckey 结构(104 字节)并派生公钥(42 字节)+指纹。
            # 二进制经文件管道处理, 不经 bash 变量 (bash 变量无法存 NUL 字节)。
            KEY_B64=$(grep -v '^untrusted comment:' openwrt/key-build | tr -d '\n')
            printf '%s' "$KEY_B64" | base64 -d > openwrt/.seckey.bin 2>/dev/null
            KEY_BYTES=$(wc -c < openwrt/.seckey.bin)
            if [ "$KEY_BYTES" != "104" ]; then
              echo "::error::USIGN_KEY 不是有效的 usign 私钥 (seckey 结构 ${KEY_BYTES} 字节, 期望 104)"
              echo "::notice::请导入本地 key-build 文件: gh secret set USIGN_KEY --repo <repo> < key-build"
              echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续"
              rm -f openwrt/key-build openwrt/.seckey.bin
              random_fallback
            fi
            # 指纹 = seckey 结构 offset 32..40 (8 字节), 与 usign -F 输出一致。
            FP=$(dd if=openwrt/.seckey.bin bs=1 skip=32 count=8 2>/dev/null | od -An -tx1 | tr -d ' \n')
            # 公钥 = "Ed" + fingerprint[8] + pubkey[32] (pubkey 在 offset 72..104), 与 usign -G 输出一致。
            {
              printf 'untrusted comment: public key %s\n' "$FP"
              { printf 'Ed'; dd if=openwrt/.seckey.bin bs=1 skip=32 count=8 2>/dev/null; dd if=openwrt/.seckey.bin bs=1 skip=72 count=32 2>/dev/null; } | base64 -w 0
              printf '\n'
            } > openwrt/key-build.pub
            chmod 644 openwrt/key-build.pub
            rm -f openwrt/.seckey.bin
            echo "📏 usign 私钥已注入 (104 字节结构, 不输出内容), 指纹 ${FP}"
          fi

          echo "sign_mode=${SIGN_MODE}" >> $GITHUB_OUTPUT
          echo "fingerprint=${FP}" >> $GITHUB_OUTPUT
          echo "🔑 ${SIGN_MODE} 签名密钥已注入 (指纹: ${FP:0:16}...)"

      # ───────── 下载源码包（dl/ 目录）─────────
      # 刻意设计: 并行下载失败时降级单线程重试; 清理 <1KB 的残缺文件(下载失败残留)
      - name: 📥 Download Source Packages
        run: |
          cd openwrt
          export CURL_OPTIONS="--connect-timeout 10 --retry 1 --max-time 180"
          timeout 1800 make download -j$(nproc) || {
            echo "⚠️ make download 并行失败,重试单线程..."
            timeout 3600 make download -j1 || { echo "❌ make download 彻底失败"; exit 1; }
          }
          find dl -maxdepth 1 -type f -size -1024c -print -exec rm -f {} \; 2>/dev/null || true

          # ── dl/ 用统计而非树: 文件上千, 展开无意义 ──
          echo ""
          echo "📂 dl/ 下载缓存: $(find dl -type f 2>/dev/null | wc -l) 个文件, $(du -sh dl 2>/dev/null | cut -f1 || echo N/A)"

      # ───────── 磁盘空间监控（第 3 阶段：编译前）─────────
      - name: 💽 Disk space · Before build
        id: disk-3
        # 采集类步骤: 失败只降级不阻断 (outputs 缺失时消费方有 || 0 兜底)
        continue-on-error: true
        run: |
          echo "📊 编译前磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "  📂 openwrt/        : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ staging_dir/  : $(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ .ccache/      : $(du -sh openwrt/.ccache 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ dl/           : $(du -sh openwrt/dl 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    └─ build_dir/    : $(du -sh openwrt/build_dir 2>/dev/null | cut -f1 || echo 'N/A')"

      # ───────── 工具链预编译（确保 OpenWrt 自带 ccache 可用）─────────
      # 刻意设计: 仅当 host ccache 不可用时编译 tools/ccache 以提供 ccache 命令。
      # 若缓存已命中且 ccache 可用，刷新 stamp 后立即跳过，严禁显式调用
      # tools/compile toolchain/compile，避免绕过顶层 stamp 导致无 build_dir 全量重编。
      - name: 🔧 Prepare toolchain & ccache
        id: prepare_toolchain
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  🔧 Prepare toolchain & ccache       ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          export CCACHE_DIR="$(pwd)/.ccache"
          NPROC=$(($(nproc) + 1))

          CCACHE_BIN="$(pwd)/staging_dir/host/bin/ccache"
          ccache_is_usable() {
            [ -x "$CCACHE_BIN" ] && "$CCACHE_BIN" --version >/dev/null 2>&1
          }

          TOOLCHAIN_RESTORED="${{ steps.cache-refresh.outputs.toolchain_restored || 'false' }}"

          # 关键修复: make defconfig 在此步骤前执行，其更新的 .config 时间戳晚于早期解压的 stamp。
          # 若工具链缓存已恢复，必须在 defconfig 后刷新 stamp 与 tmp/.build 时间戳，
          # 确保 stamp 比 .config 更晚，使 OpenWrt 能真正命中缓存并跳过已完成的工具与工具链。
          # 刷新条件扩展: toolchain 或 hostpkg 任一恢复即需刷新 —— feeds update
          # 在 restore 之后全新 clone, feed mtime 晚于缓存内 stamp, 不刷新则
          # rdep (timestamp.pl) 判定源码更新触发重编 (断点 C)。
          HOSTPKG_RESTORED=false
          if [ -d build_dir/hostpkg ] || ls -d build_dir/target-*/host >/dev/null 2>&1; then
            HOSTPKG_RESTORED=true
          fi
          if { [ "$TOOLCHAIN_RESTORED" = "true" ] || [ "$HOSTPKG_RESTORED" = "true" ]; } \
             && [ -d staging_dir ]; then
            echo "🔄 在 defconfig 与 feeds update 后刷新工具链及 hostpkg stamp 时间戳..."
            mkdir -p tmp && echo "1" > tmp/.build && touch tmp/.build

            # 1. build_dir 门禁 stamp 按依赖链拓扑顺序刷新:
            #    .prepared* → .configured → .built (make 要求后置 stamp 更晚;
            #    glob '.prepared*' 同时命中 rdep 的 .prepared_*_check 文件)。
            #    rust 的 HOST_BUILD_DIR 被包 Makefile 覆盖到 build_dir/target-*/host/
            #    (golang 用默认 build_dir/hostpkg/), 两根都必须覆盖。
            HOSTPKG_STAMP_ROOTS=""
            [ -d build_dir/hostpkg ] && HOSTPKG_STAMP_ROOTS="build_dir/hostpkg"
            for d in build_dir/target-*/host; do
              [ -d "$d" ] && HOSTPKG_STAMP_ROOTS="${HOSTPKG_STAMP_ROOTS:+$HOSTPKG_STAMP_ROOTS }$d"
            done
            if [ -n "$HOSTPKG_STAMP_ROOTS" ]; then
              for stamp in '.prepared*' '.configured*' '.built*'; do
                find $HOSTPKG_STAMP_ROOTS -maxdepth 2 -type f -name "$stamp" -exec touch {} + 2>/dev/null || true
              done
            fi

            # 2. staging_dir 下 host 工具与工具链 stamp 刷新 (精确匹配 host*/stamp
            #    与 toolchain*/stamp: 覆盖 staging_dir/hostpkg/stamp 与
            #    staging_dir/target-*/host/stamp, 绝不触碰 target 根下的目标包 stamp)
            find staging_dir \( -path '*/host*/stamp' -o -path '*/toolchain*/stamp' \) -type d 2>/dev/null | while read -r d; do
              find "$d" -type f -exec touch {} +
            done

            if ccache_is_usable; then
              for cmd in gcc g++ cc c++; do
                ln -sf ccache "staging_dir/host/bin/$cmd" 2>/dev/null || true
              done
            fi
          fi

          # ── hostpkg stamp 状态探针 (C24 残余排查: golang 系 make -q 判定差异) ──
          # 列出 restore+touch 后的 stamp 文件名 (含内容寻址哈希) 与 mtime 顺序,
          # 供与 make 实际求值行为对比 (rebuild_check 的 make -q 判定输出在
          # logs/<pkg>/check-*.txt, 仅 build-log artifact 可见)。
          # 采集类探针: 失败只告警不阻断。
          echo "📋 hostpkg stamp 实况 (restore+touch 后):"
          find build_dir/hostpkg build_dir/target-*/host -maxdepth 2 -type f \
            -name '.*' -printf '%T+ %p\n' 2>/dev/null | LC_ALL=C sort || \
            echo "  (无 stamp 文件或目录不存在)"

          # 关键优化: 若 ccache 已可用且工具链缓存已恢复，跳过预编译直接进入固件构建，
          # 依赖顶层 Makefile 目标 world 的 stamp 机制秒级跳过工具链。
          if ccache_is_usable && [ "$TOOLCHAIN_RESTORED" = "true" ]; then
            echo "✅ 已发现可用的 OpenWrt ccache 且工具链已恢复，完全复用缓存，跳过预编译"
            echo "🔧 OpenWrt ccache: ${CCACHE_BIN}"
            "$CCACHE_BIN" --version
            echo "toolchain_prepared=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 仅当 ccache 缺失或损坏时，重置 ccache 目标标记重新构建 ccache 自身，
          # 绝不暴力删除整个 staging_dir/host，避免摧毁缓存中已就绪的其它 host 工具。
          if ! ccache_is_usable; then
            echo "⚠️ OpenWrt host ccache 缺失或不可执行，重置 ccache 目标标记并构建..."
            rm -f staging_dir/host/stamp/.*ccache* staging_dir/host/bin/ccache* 2>/dev/null || true
            rm -rf build_dir/host/ccache* 2>/dev/null || true

            # ── 仅构建 OpenWrt ccache 自身提供编译加速 ──
            echo "🔨 并行构建 OpenWrt ccache (${NPROC} 线程)..."
            set +o pipefail
            make -j"${NPROC}" tools/ccache/compile 2>&1 | tee toolchain-prebuild.log
            CC_PRE_EXIT=${PIPESTATUS[0]}
            set -o pipefail

            if [ "$CC_PRE_EXIT" -ne 0 ]; then
              echo "⚠️ ccache 并行构建失败，回退到单线程详细日志重试 (make -j1 V=sc)..."
              set +o pipefail
              make -j1 V=sc tools/ccache/compile 2>&1 | tee -a toolchain-prebuild.log
              set -o pipefail
            fi

            CCACHE_BIN="$(pwd)/staging_dir/host/bin/ccache"
            if ! ccache_is_usable; then
              echo "::error::OpenWrt ccache 构建失败: ${CCACHE_BIN}"
              echo "::error::请检查 toolchain-prebuild.log 中的 tools/ccache/compile 输出"
              exit 1
            fi
            for cmd in gcc g++ cc c++; do
              ln -sf ccache "staging_dir/host/bin/$cmd" 2>/dev/null || true
            done
            echo "✅ OpenWrt ccache 已就绪"
          fi

          # 无论是新编 ccache 还是冷缓存，工具链的主体编译统一交由后续 5. Build Firmware
          # 中的 make 默认目标 world 执行，由顶层 stamp 守门并受 BUILD_LOG=1 规范记录，
          # 绝不在此显式调用 tools/compile toolchain/compile 造成绕过 stamp 重新全编译。
          echo "🔧 OpenWrt ccache: ${CCACHE_BIN}"
          "$CCACHE_BIN" --version
          echo "toolchain_prepared=true" >> "$GITHUB_OUTPUT"

      - name: 🔨 5. Build Firmware
        id: build
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  🔨 5. Build Firmware                ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          export CCACHE_DIR="$(pwd)/.ccache"
          CCACHE_BIN="$(pwd)/staging_dir/host/bin/ccache"
          if [ ! -x "$CCACHE_BIN" ] || ! "$CCACHE_BIN" --version >/dev/null 2>&1; then
            echo "::error::工具链预编译步骤未提供可执行的 OpenWrt ccache: ${CCACHE_BIN}"
            exit 1
          fi
          echo "🔧 使用 ccache: $CCACHE_BIN"
          "$CCACHE_BIN" --max-size 10G
          # compiler_check 不设: rules.mk 会 export CCACHE_COMPILERCHECK
          # (环境变量 > 配置文件), 此处 --set-config 会被静默覆盖, 属死配置。
          # CC/CXX 包装也不 export: CONFIG_CCACHE=y 时 rules.mk 自动
          # TARGET_CC:=ccache_cc / HOSTCC:=ccache $(HOSTCC), 官方机制已覆盖
          # 目标侧(MAKE_FLAGS 传 TARGET_CONFIGURE_OPTS)与 host 侧(HOSTCC)。
          "$CCACHE_BIN" --set-config=hash_dir=false
          # 路径归一化由 rules.mk 原生机制处理 (export CCACHE_BASEDIR=$(TOPDIR)),
          # 与 compile-packages (SDK TOPDIR=openwrt/) 天然一致, 无需额外 base_dir。
          # Do not force compression here: qualcommax exports CCACHE_NOCOMPRESS,
          # and Actions Cache compresses the archive independently. Keep only the
          # existing hash/mtime policy until an A/B build justifies changing it.
          "$CCACHE_BIN" --set-config=sloppiness=file_stat_matches,include_file_mtime,include_file_ctime
          # ── ccache 包装器变量级验证 (rules.mk val.% 目标, 秒级零成本) ──
          # 同时检查 C/C++ 的 target/host 包装器及其 NOCACHE 原值，避免只验证
          # TARGET_CC 却让 TARGET_CXX 或 host 编译绕过 ccache。
          echo "🔍 ccache 包装器变量验证 (make val):"
          TARGET_CC_VALUE=$(make -s val.TARGET_CC V=s 2>/dev/null | tail -1 || true)
          TARGET_CXX_VALUE=$(make -s val.TARGET_CXX V=s 2>/dev/null | tail -1 || true)
          HOSTCC_VALUE=$(make -s val.HOSTCC V=s 2>/dev/null | tail -1 || true)
          HOSTCXX_VALUE=$(make -s val.HOSTCXX V=s 2>/dev/null | tail -1 || true)
          TARGET_CC_NOCACHE_VALUE=$(make -s val.TARGET_CC_NOCACHE V=s 2>/dev/null | tail -1 || true)
          TARGET_CXX_NOCACHE_VALUE=$(make -s val.TARGET_CXX_NOCACHE V=s 2>/dev/null | tail -1 || true)
          HOSTCC_NOCACHE_VALUE=$(make -s val.HOSTCC_NOCACHE V=s 2>/dev/null | tail -1 || true)
          HOSTCXX_NOCACHE_VALUE=$(make -s val.HOSTCXX_NOCACHE V=s 2>/dev/null | tail -1 || true)
          printf 'TARGET_CC=%s\nTARGET_CXX=%s\nHOSTCC=%s\nHOSTCXX=%s\n' \
            "$TARGET_CC_VALUE" "$TARGET_CXX_VALUE" "$HOSTCC_VALUE" "$HOSTCXX_VALUE"
          printf 'TARGET_CC_NOCACHE=%s\nTARGET_CXX_NOCACHE=%s\nHOSTCC_NOCACHE=%s\nHOSTCXX_NOCACHE=%s\n' \
            "$TARGET_CC_NOCACHE_VALUE" "$TARGET_CXX_NOCACHE_VALUE" \
            "$HOSTCC_NOCACHE_VALUE" "$HOSTCXX_NOCACHE_VALUE"

          is_ccache_wrapper() {
            printf '%s\n' "$1" | grep -qE '(^|[[:space:]/])ccache(_cc|_cxx)?([[:space:]]|$)'
          }
          is_plain_compiler() {
            [ -n "$1" ] && ! printf '%s\n' "$1" | grep -q 'ccache'
          }
          WRAPPERS_VALID=false
          if is_ccache_wrapper "$TARGET_CC_VALUE" && is_ccache_wrapper "$TARGET_CXX_VALUE" \
             && is_ccache_wrapper "$HOSTCC_VALUE" && is_ccache_wrapper "$HOSTCXX_VALUE" \
             && is_plain_compiler "$TARGET_CC_NOCACHE_VALUE" \
             && is_plain_compiler "$TARGET_CXX_NOCACHE_VALUE" \
             && is_plain_compiler "$HOSTCC_NOCACHE_VALUE" \
             && is_plain_compiler "$HOSTCXX_NOCACHE_VALUE"; then
            WRAPPERS_VALID=true
          fi
          if [ "$WRAPPERS_VALID" = true ]; then
            echo "ccache_wrapper_valid=true" >> $GITHUB_OUTPUT
            echo "✅ target/host C/C++ 编译器均由 ccache 接管, NOCACHE 变量保持裸编译器"
          else
            echo "ccache_wrapper_valid=false" >> $GITHUB_OUTPUT
            echo "::warning::ccache 包装器变量验证失败, 禁止保存共享 ccache"
          fi
          ls -la staging_dir/host/bin/ccache_cc staging_dir/host/bin/ccache_cxx 2>/dev/null || true
          MAKE_EXIT=1
          echo "make_exit=${MAKE_EXIT}" >> $GITHUB_OUTPUT
          START_TIME=$(date +%s)
          # RUNNER_DEBUG=1 (Re-run with debug) 时加 V=s: 终端实时输出每条
          # 编译命令 (logs/ 文件不受影响, BUILD_LOG=1 恒开), 便于交互式排查
          DEBUG_VERBOSE=""
          [ "${RUNNER_DEBUG:-0}" = "1" ] && DEBUG_VERBOSE="V=s"
          set +o pipefail
          # BUILD_LOG=1: 显式声明每包详细日志 (logs/<pkg>/*.txt), 不依赖 .config 的 CONFIG_BUILD_LOG
          make BUILD_LOG=1 ${DEBUG_VERBOSE} -j$(($(nproc) + 1)) -k 2>&1 | tee build.log
          MAKE_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          END_TIME=$(date +%s)
          echo "make_exit=${MAKE_EXIT}" >> $GITHUB_OUTPUT
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "⏱️ 本步骤耗时: $(printf '%dh %dm %ds' $(((END_TIME-START_TIME)/3600)) $((((END_TIME-START_TIME)%3600)/60)) $(((END_TIME-START_TIME)%60)))"

      # ───────── ccache 行为级验证（抓取真实编译命令前缀）─────────
      # 刻意设计: 首轮 make 无 V=s (SUBMAKE -s 抑制命令回显), 日志看不到编译命令;
      # 此诊断步骤强制 clean+重编一个轻量 C 包 (jansson) 并 V=sc 抓取前缀。
      # ccache 命中使重编仅需数秒; continue-on-error 纯诊断不阻塞构建。
      - name: 🔍 Verify ccache wrapping
        if: always() && !cancelled() && steps.prepare_toolchain.outputs.toolchain_prepared == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd openwrt
          echo "🔍 实编译抓取 ccache 命令前缀 (jansson, V=sc):"
          make package/libs/jansson/clean 2>/dev/null || true
          make package/libs/jansson/compile V=sc BUILD_LOG=1 2>&1 | tee /tmp/ccache-prefix.log || true
          echo ""
          echo "── 捕获的 ccache 相关命令 (前 8 行) ──"
          grep -E "ccache(_cc|_cxx| gcc| g\+\+)" /tmp/ccache-prefix.log | head -8 || echo "(未捕获到 ccache 命令)"
          echo ""
          echo "判定: 目标包应见 ccache_cc (包装交叉 gcc); 若见 ccache gcc 或裸 gcc 则为环境泄漏。"

      # ───────── 重试编译（并行失败后更新仓库再试, 保留初次日志 logs.1）─────────
      # 刻意设计: 失败后先 git pull 最新源码再重试(上游可能已修),
      # logs/ → logs.1/ 保留初次轮日志用于对比诊断; 单线程轮用 V=sc 输出完整日志
      - name: 🔁 Retry build
        if: always() && !cancelled() && steps.prepare_toolchain.outputs.toolchain_prepared == 'true' && steps.build.outputs.make_exit != '0'
        id: retry
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  🔁 Retry build (更新仓库后重试)      ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          # CC/CXX 包装由官方 CONFIG_CCACHE 机制处理 (rules.mk), 无需环境 export
          cp build.log build.1.log || echo "⚠️ 备份 build.log 失败: $?"
          rm -rf logs.1
          [ -d logs ] && mv logs logs.1 || echo "ℹ️ 无初次 logs 目录可保留"
          echo "⚠️ 并行编译有错误 → 更新仓库后重试..."
          git pull origin ${{ inputs.matrix_ref }} || echo "⚠️ 源码 pull 失败: $? (可能无远端更新或非分支引用)"
          git -C package/${{ inputs.packages_feed_name }} pull origin ${{ inputs.matrix_packages_branch }} || echo "⚠️ packages pull 失败: $?"
          ./scripts/feeds update -a && ./scripts/feeds install -a
          STANDARD_PACKAGES_SHA=$(git -C feeds/packages rev-parse HEAD)
          echo "standard_packages_sha=${STANDARD_PACKAGES_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 重试后标准 packages feed 实际版本: ${STANDARD_PACKAGES_SHA}"
          START_TIME=$(date +%s)
          RETRY_EXIT=1
          set +o pipefail
          make BUILD_LOG=1 -j$(nproc) -k 2>&1 | tee build.log
          RETRY_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$RETRY_EXIT" -ne 0 ]; then
            echo "⚠️ 并行重试仍有错误 → 单线程最后一搏 (V=sc 完整日志)..."
            set +o pipefail
            # 刻意设计: 单线程 + V=sc 输出完整编译命令与完整日志,
            # 确保失败包的真实错误(如 configure 具体报错)不会被并行模式截断
            make BUILD_LOG=1 -j1 V=sc -k 2>&1 | tee build.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -o pipefail
          fi
          END_TIME=$(date +%s)
          echo "retry_duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          if [ "$RETRY_EXIT" -ne 0 ]; then
            echo "💥 构建彻底失败 · 请查看 build.log 及 logs/logs.1 目录"
            exit 1
          fi
          echo "✅ 重试完成"

      # ───────── Feed 追平: 编译成功后触发 custom-feed, 分支前进则原地重编一轮 ─────────
      # 刻意设计: plan 在构建开始前已触发并等待过 custom-feed, 但全量构建耗时数小时,
      # 构建周期内 feed 分支可能又前进 (custom-feed 12h cron 或上游同步推送)。此处
      # 编译成功后再触发一次并等待完成, 若本 target 消费的 feed 分支 HEAD 前进, 则
      # 拉取新内容原地增量重编一轮 (最多 1 轮, 再次的更新留待下次构建); 产物只保留
      # 最终一轮——后续打包/发布/缓存保存读取的是重编后的 bin/ 与 .ccache。stamp
      # 机制 (STAMP_PREPARED 文件名内嵌包目录 find_md5 哈希, include/package.mk)
      # 保证 feed 包内容变更会被 make 正确拾取。custom-feed 触发/等待/拉取失败仅
      # 告警跳过 (远端未变或本地未跟进, 首轮产物仍自洽); 重编失败则硬失败 (bin/
      # 已混入新旧两半产物, 不可发布), 缓存保存步骤以 outcome != 'failure' 联动跳过。
      - name: 🔄 Rebuild on feed update
        if: success() && inputs.skip_feed_catchup != 'true'
        id: feed-rebuild
        run: |
          set -euo pipefail
          cd openwrt
          FEED_DIR="package/${{ inputs.packages_feed_name }}"
          FEED_BRANCH="${{ inputs.matrix_packages_branch }}"
          BEFORE_SHA=$(git -C "$FEED_DIR" rev-parse HEAD)
          BEFORE_TREES=$(git -C "$FEED_DIR" ls-tree HEAD)
          echo "📌 构建时 feed 版本: ${BEFORE_SHA:0:7} (${FEED_BRANCH})"

          # ── 纯远端对比: 不触发 custom-feed CI (外部调用时 caller 仓库无该
          #    workflow, gh workflow run 404 连远端对比都被跳过; 自身调用时
          #    plan 已触发并等待 custom-feed 完成, 此处触发冗余)。feed 更新
          #    由 AutoWorkFlows 侧维护 (cron custom-feed.yml), 本步骤只被动
          #    检测远端变化并追平: ls-remote 对比 → fetch+reset → tree diff
          #    → 变更包目录非空才原地重编 ──
          AFTER_SHA=$(git ls-remote "https://github.com/${{ inputs.packages_feed_repo }}.git" "${FEED_BRANCH}" 2>/dev/null | cut -f1 | head -1)
          if [ -z "$AFTER_SHA" ]; then
            echo "::warning::读取远端 feed 分支 HEAD 失败, 跳过追平重编"
            exit 0
          fi
          if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
            echo "✅ feed 无更新 (${BEFORE_SHA:0:7}), 无需重编"
            exit 0
          fi

          # ── 拉取新 feed (生成型分支可能被 force 更新, fetch+reset 而非 pull) ──
          # 快照稳定性校验: custom-feed.yml 全量重生成分支在生成过程中会短暂出现
          # 中间态提交 (run 36405700929: 追平抓到 330d811 坏快照——上游源被临时
          # checkout 旧版, smartdns Makefile 回潮相对 include / ddnsto 回退 4.2.0,
          # 三 target 全挂)。fetch 后隔 5s 再 ls-remote 一次, HEAD 已变则重拉
          # (最多 3 轮), 把抓到中间态的窗口从分钟级压到秒级; 仍不稳定则用最新值。
          CATCHUP_ATTEMPT=0
          while true; do
            # 显式 refspec 强制走分支: 引用名 fetch 会优先匹配同名 tag
            # (run 36420753418: refs/tags/mt798x 幽灵 tag 指向 06-22 孤儿提交,
            # fetch origin mt798x 抓到 tag 而非分支, 快照校验重拉永远同一坏快照)
            if ! git -C "$FEED_DIR" fetch --depth 1 origin "refs/heads/${FEED_BRANCH}" \
               || ! git -C "$FEED_DIR" reset --hard FETCH_HEAD; then
              echo "::warning::拉取新 feed 失败, 跳过追平重编 (首轮产物仍自洽)"
              exit 0
            fi
            NEW_SHA=$(git -C "$FEED_DIR" rev-parse HEAD)
            CATCHUP_ATTEMPT=$((CATCHUP_ATTEMPT + 1))
            [ "$CATCHUP_ATTEMPT" -ge 3 ] && break
            sleep 5
            REMOTE_HEAD=$(git -C "$FEED_DIR" ls-remote origin "refs/heads/${FEED_BRANCH}" 2>/dev/null | cut -f1)
            if [ -z "$REMOTE_HEAD" ] || [ "$REMOTE_HEAD" = "$NEW_SHA" ]; then
              break
            fi
            echo "🟡 feed 快照不稳定 (本地 ${NEW_SHA:0:7} vs 远端 ${REMOTE_HEAD:0:7}), 重拉第 ${CATCHUP_ATTEMPT} 轮"
          done
          AFTER_TREES=$(git -C "$FEED_DIR" ls-tree HEAD)
          # 变更包目录 = 顶层 tree 条目 SHA 不同/新增/删除 (内容寻址, 同 input_trees
          # 指纹); blob 根文件 (README/lock) 不算——custom-feed 每次运行 README 带
          # 时间戳必提交 → feed HEAD 必前进, 不过滤则 SHA 闸门必开、每次构建后空转
          # 一轮 make (run 36557139597 实证: diff 仅 README+lock, 313 个 stamp 检查
          # 0 真实编译, 224s 浪费)。闸门 = 变更包目录非空才重编。
          # 注意: diff 行前缀是 "< "/"> " (含空格), grep 必须带空格——漏掉则
          # 永不匹配 → 恒跳过 → 真实包变更静默漏检 (本地三场景测试拦截)。
          CHANGED_DIRS=$(diff <(printf '%s\n' "$BEFORE_TREES") <(printf '%s\n' "$AFTER_TREES") \
            | grep -E '^[<>] 040000 tree ' | cut -f2 | sort -u || true)
          echo "packages_sha_full=${NEW_SHA}" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED_DIRS" ]; then
            # 仅元数据变更: 首轮产物与 feed 包内容自洽, 只更新 SHA 基线 (下轮 plan
            # 的逐包指纹对比同样无变更, 不会误报)
            echo "✅ feed 仅元数据变更 (无包目录 tree 变化), 跳过追平重编"
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          echo "🟡 feed 已更新: ${BEFORE_SHA:0:7} → ${NEW_SHA:0:7}, 原地重编一轮"
          echo "   变更包目录: $(printf '%s ' $CHANGED_DIRS)"

          # ── 清掉变更包的旧产物 (版本变更时新旧 ipk/apk 并存会污染发布物) ──
          if [ -n "$CHANGED_DIRS" ]; then
            for d in $CHANGED_DIRS; do
              find bin/packages -type f \
                \( -name "${d}_*.ipk" -o -name "${d}*.ipk" -o -name "${d}_*.apk" -o -name "${d}*.apk" \) \
                -delete || true
            done
          fi

          # ── 原地增量重编 (stamp 机制自动拾取变更包; 保留首轮日志为 build.2.log) ──
          # 受限 make 目标 (run 36442582547 教训): 追平轮不跑 world 的 target/install。
          # world 重入会以"全新"状态重做 install——33 设备全部重新生成 kernel FIT
          # (qualcommax FEATURES ramdisk → ROOTFS_INITRAMFS 默认 y → kernel 嵌
          # rootfs 178MB), 有 KERNEL_SIZE 限定的 10 个设备全部超限被 check-size
          # rm, sysupgrade/factory 组装依赖断裂 → target/linux failed to build。
          # 首轮 world 一气呵成时 sysupgrade 走 KDIR/tmp 路径成功, 重入则断链。
          # 本地等价语义: git pull + make 只重编变更包; 镜像不重做 (固件底层
          # 保持首轮, 包变更经 bin/packages 产物与下轮构建生效)。
          cp build.log build.2.log || echo "⚠️ 备份 build.log 失败: $?"
          START_TIME=$(date +%s)
          REBUILD_EXIT=1
          # RUNNER_DEBUG=1 (Re-run with debug) 时加 V=s (同主构建)
          DEBUG_VERBOSE=""
          [ "${RUNNER_DEBUG:-0}" = "1" ] && DEBUG_VERBOSE="V=s"
          set +o pipefail
          make BUILD_LOG=1 ${DEBUG_VERBOSE} -j$(nproc) -k package/compile package/install package/index 2>&1 | tee build.log
          REBUILD_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          END_TIME=$(date +%s)
          echo "rebuild_duration=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"
          echo "⏱️ 追平重编耗时: $((END_TIME - START_TIME))s"
          if [ "${SUMMARY_COMPACT:-false}" != "true" ]; then
            {
              echo ""
              echo "### 🔄 Feed 追平重编"
              echo ""
              echo "- **feed**: \`${FEED_BRANCH}\` ${BEFORE_SHA:0:7} → ${NEW_SHA:0:7}"
              echo "- **变更目录**: $(printf '%s ' $CHANGED_DIRS)"
              echo "- **耗时**: $((END_TIME - START_TIME))s"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$REBUILD_EXIT" -ne 0 ]; then
            echo "::error::feed 追平重编失败 (bin/ 已混入新旧产物, 不可发布), 请查看 build.log 与 logs/"
            exit 1
          fi
          echo "✅ 追平重编完成, 产物已对齐 feed ${NEW_SHA:0:7}"

      # ───────── 磁盘空间监控（第 4 阶段：编译后 + 4 阶段汇总表）─────────
      # 采集类步骤: 失败只降级不阻断 (outputs 缺失时消费方有 || 0 兜底)
      - name: 💽 Disk space · After build
        if: always()
        continue-on-error: true
        id: disk-4
        run: |
          echo "📊 编译后磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "  📂 openwrt/        : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ staging_dir/  : $(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ .ccache/      : $(du -sh openwrt/.ccache 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ dl/           : $(du -sh openwrt/dl 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    └─ build_dir/    : $(du -sh openwrt/build_dir 2>/dev/null | cut -f1 || echo 'N/A')"

          # ── 计算各阶段空间消耗差值 ──
          D1_USED=${{ steps.disk-1.outputs.used_gb || 0 }}
          D2_USED=${{ steps.disk-2.outputs.used_gb || 0 }}
          D3_USED=${{ steps.disk-3.outputs.used_gb || 0 }}
          D4_USED=${USED_GB}
          DELTA_1_2=$((D2_USED - D1_USED))
          DELTA_2_3=$((D3_USED - D2_USED))
          DELTA_3_4=$((D4_USED - D3_USED))
          fmt_delta() { local d=$1; if [ "$d" -ge 0 ]; then echo "+${d}G"; else echo "${d}G"; fi; }

          if [ "${SUMMARY_COMPACT:-false}" != "true" ]; then
            {
              echo ""
              echo "### 💽 磁盘空间变化"
              echo "| 阶段 | 总容量 | 已用 | 已用% | 阶段消耗 |"
              echo "|------|--------|------|-------|----------|"
              echo "| ① 初始 | ${TOTAL_GB}G | ${D1_USED}G | ${{ steps.disk-1.outputs.used_pct || 'N/A' }}% | — |"
              echo "| ② 环境准备后 | ${TOTAL_GB}G | ${D2_USED}G | ${{ steps.disk-2.outputs.used_pct || 'N/A' }}% | $(fmt_delta $DELTA_1_2) |"
              echo "| ③ 编译前 | ${TOTAL_GB}G | ${D3_USED}G | ${{ steps.disk-3.outputs.used_pct || 'N/A' }}% | $(fmt_delta $DELTA_2_3) |"
              echo "| ④ 编译后 | ${TOTAL_GB}G | ${D4_USED}G | ${USED_PCT}% | $(fmt_delta $DELTA_3_4) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ───────── 总耗时汇总 ─────────
      - name: ⏱️ Total Build Duration
        if: always()
        # 采集类步骤: 失败只降级不阻断 (outputs 缺失时概览块显示 N/A)
        continue-on-error: true
        id: total_duration
        run: |
          BUILD_DUR="${{ steps.build.outputs.duration || '0' }}"
          RETRY_DUR="${{ steps.retry.outputs.retry_duration || '0' }}"
          REBUILD_DUR="${{ steps.feed-rebuild.outputs.rebuild_duration || '0' }}"
          TOTAL_SEC=$((BUILD_DUR + RETRY_DUR + REBUILD_DUR))
          echo "duration=${TOTAL_SEC}" >> $GITHUB_OUTPUT
          echo "duration_fmt=$(printf '%dh %dm %ds' $((TOTAL_SEC/3600)) $(((TOTAL_SEC%3600)/60)) $((TOTAL_SEC%60)))" >> $GITHUB_OUTPUT
          echo "⏱️ 总编译耗时: $(printf '%dh %dm %ds' $((TOTAL_SEC/3600)) $(((TOTAL_SEC%3600)/60)) $((TOTAL_SEC%60))) (并行 ${BUILD_DUR}s + 重试 ${RETRY_DUR}s + 追平重编 ${REBUILD_DUR}s)"

      # ───────── 构建概览 (外部 caller 视角的 summary 头块) ─────────
      # 刻意设计: summary 采集是增强功能, continue-on-error + 块内降级,
      # 任何采集失败只 warning 不阻断构建 (数据源均为 inputs/outputs, 失败
      # 面极小; duration 缺失显示 N/A)。compact 模式同样输出 (核心块)。
      - name: 🏗️ Build Overview
        id: build-overview
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          CONFIG_REPO="${{ inputs.config_repo || github.repository }}"
          CONFIG_REF="${{ inputs.config_repo == '' && github.sha || inputs.config_ref }}"
          [ -n "$CONFIG_REF" ] || CONFIG_REF="(default branch)"
          DURATION_FMT="${{ steps.total_duration.outputs.duration_fmt || 'N/A' }}"
          {
            echo ""
            echo "## 🏗️ ${IMMWRT_TARGET} 构建概览"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 构建模式 | 🔨 全量固件编译 |"
            echo "| 版本 | \`${{ env.RESOLVED_VERSION }}\` |"
            echo "| 源码 | [\`$(echo '${{ steps.clone_packages.outputs.sha_full }}' | cut -c1-8)\`](https://github.com/${{ inputs.matrix_repo }}/commit/${{ steps.clone_packages.outputs.sha_full }}) @ ${{ inputs.matrix_ref }} |"
            echo "| 配置来源 | \`${CONFIG_REPO}\` @ \`${CONFIG_REF}\` (\`${{ inputs.config_path }}\`) |"
            echo "| 标准包 feed | [\`${{ steps.feed-rebuild.outputs.packages_sha_full || steps.clone_packages.outputs.packages_sha_full }}\`](https://github.com/${{ inputs.standard_packages_repo }}/tree/${{ inputs.standard_packages_branch }}) |"
            echo "| 编译耗时 | ${DURATION_FMT} |"
            echo "| 触发 | [\`${{ github.repository }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (\`${{ github.event_name }}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────── 编译日志统计（仅成功时运行）─────────
      # 刻意设计: 统计工具是必要的分析手段(v1 遗产), 统计每个包的编译耗时,
      # 用于定位最耗时的编译瓶颈。Top10 写入 Summary。
      # 采集类步骤: 失败只降级不阻断 (summary 是增强功能)。
      - name: 📊 Build Log Analysis
        if: success()
        continue-on-error: true
        run: |
          cd openwrt

          # 覆盖 compile / host-compile / install 三类阶段日志: host-compile 是
          # rust/golang 等宿主自举的真实耗时大头 (57min/32min), install 是 ipk
          # 打包阶段, 只看 compile.txt 会系统性漏掉它们。
          # find -print0 + mapfile 避免路径 word splitting; /dev/null 兜底保证
          # grep 恒有文件参数 (TOTAL=0 时不挂起读 stdin, -l 不会输出它)。
          mapfile -d '' LOG_FILES < <(find logs \
            \( -name 'compile.txt' -o -name 'host-compile.txt' -o -name 'install.txt' \) \
            -print0 2>/dev/null)
          TOTAL=${#LOG_FILES[@]}
          EMPTY=$(find logs \
            \( -name 'compile.txt' -o -name 'host-compile.txt' -o -name 'install.txt' \) \
            -size 0 2>/dev/null | wc -l)

          # 提取全部 time: 行 (scripts/time.pl 输出: time: <target>#<user>#<sys>#<real>)。
          # 不再 tail -qn1: 同一日志内同名阶段多次调用需全部累加。
          grep -h '^time: ' "${LOG_FILES[@]}" /dev/null 2>/dev/null | awk -F'#' 'NF==4' > build_time_clean.log || true
          COMPLETED_FILES=$(grep -l '^time: ' "${LOG_FILES[@]}" /dev/null 2>/dev/null | wc -l || true)
          INCOMPLETE=$((TOTAL - COMPLETED_FILES))

          echo "📊 构建日志: 总计 ${TOTAL}, 未完成 ${INCOMPLETE}, 空 ${EMPTY}"

          # 按真实墙钟 ($4, time.pl 第 4 字段) 降序 Top 10; $2/$3 是 User/Sys
          # CPU 核时 (旧代码 real=$2 实为 User CPU, 多核编译下严重失真)。
          # 同名 target 多条记录按列分别累加。终端恒输出; compact 模式跳过
          # summary 写入 (编排方 summary 不重复耗时细节)。
          TOP10=$(awk -F'#' '{
            t = $1; sub(/^time: /, "", t);
            user[t] += $2; sys[t] += $3; real[t] += $4;
          } END {
            for (t in real)
              printf "%10.2fs  %10.2fs  %10.2fs  %s\n", real[t], user[t], sys[t], t
          }' build_time_clean.log 2>/dev/null | sort -rn 2>/dev/null | head -10 || true)
          printf "%-12s  %-12s  %-12s  %s\n" "Real(墙钟)" "User CPU" "Sys CPU" "Target"
          echo "$TOP10"
          if [ "${SUMMARY_COMPACT:-false}" != "true" ]; then
            {
              echo ""
              echo "### 📊 编译耗时 Top 10 (按真实墙钟排序)"
              echo '```text'
              printf "%-12s  %-12s  %-12s  %s\n" "Real(墙钟)" "User CPU" "Sys CPU" "Target"
              echo "$TOP10"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ───────── ccache 统计与清理（独立步骤，不受构建成败影响）─────────
      # 刻意设计: ccache 命中率/压缩比是判断"缓存是否有效"的关键指标
      - name: 📈 ccache Stats & Cleanup
        if: always()
        continue-on-error: true
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  📈 ccache 统计与压缩测量             ║"
          echo "╚══════════════════════════════════════╝"

          CCACHE_BIN="$(pwd)/openwrt/staging_dir/host/bin/ccache"
          [ -x "$CCACHE_BIN" ] || CCACHE_BIN="$(command -v ccache 2>/dev/null || true)"
          if [ -n "$CCACHE_BIN" ] && [ -d openwrt/.ccache ]; then
            export CCACHE_DIR="$(pwd)/openwrt/.ccache"
            . AutoWorkFlows/.github/scripts/parse-ccache-stats.sh

            # ── 磁盘用量 + 压缩大小 ──
            DISK_USAGE_HUMAN=$(du -sh "openwrt/.ccache" 2>/dev/null | cut -f1)
            DISK_USAGE_BYTES=$(du -sb "openwrt/.ccache" 2>/dev/null | awk '{print $1}')
            # zstd -3 与 GitHub cache 后端同口径 (tar+zstd); 旧 gzip -1 压缩率
            # 偏差 ~15%, 与配额计量 (压缩后体积) 口径不一致
            CC_ZSTD_BYTES=$(timeout 60 tar cf - openwrt/.ccache 2>/dev/null | zstd -3 -c 2>/dev/null | wc -c 2>/dev/null || echo 0)
            CC_ZSTD_HUMAN=""
            if [ -n "$CC_ZSTD_BYTES" ] && [ "$CC_ZSTD_BYTES" -gt 0 ] && [ -n "$DISK_USAGE_BYTES" ] && [ "$DISK_USAGE_BYTES" -gt 0 ]; then
              CC_ZSTD_HUMAN=$(numfmt --to=iec "$CC_ZSTD_BYTES" 2>/dev/null || echo "${CC_ZSTD_BYTES} B")
            fi

            # ── 解析关键指标（兼容 ccache 3.x 旧格式 + 4.x/6.x 新格式）──
            CC_RAW=$("$CCACHE_BIN" -s 2>/dev/null || true)
            ccache_stats_parse "$CC_RAW"
            HITS_DIRECT="$CCACHE_STATS_HITS_DIRECT"
            HITS_PREP="$CCACHE_STATS_HITS_PREPROCESSED"
            MISSES="$CCACHE_STATS_MISSES"
            HIT_RATE="$CCACHE_STATS_HIT_RATE"
            CACHE_SIZE="$CCACHE_STATS_SIZE_GB"
            CACHE_SIZE_LABEL="$CACHE_SIZE"
            [ "$CACHE_SIZE" = "N/A" ] || CACHE_SIZE_LABEL="${CACHE_SIZE}G"
            DISK_USAGE_HUMAN="${DISK_USAGE_HUMAN:-N/A}"
            CC_ZSTD_HUMAN="${CC_ZSTD_HUMAN:-N/A}"

            # ── 终端日志 ──
            echo "📈 ccache 统计:"
            echo "  Direct hits:   ${HITS_DIRECT}"
            echo "  Preprocessed:  ${HITS_PREP}"
            echo "  Misses:        ${MISSES}"
            echo "  Hit rate:      ${HIT_RATE}"
            echo "  Cache size:    ${CACHE_SIZE_LABEL} (disk ${DISK_USAGE_HUMAN}, zstd ~${CC_ZSTD_HUMAN})"

            # ── 可缓存路径体量（配额核算依据; 仅写日志, 不改 Summary 表格式）──
            # 仓库 Actions Cache 配额 10GB，三类快照的新旧两代会短暂共存（save 先于
            # purge），故各路径体量必须留出足够余量。hostpkg 快照已裁剪 dl/rustc
            # 与 tmp/go-build（命中场景永不读取，见 C7），新增 build_dir 门禁
            # stamp 两根（KB 级）。du 为磁盘占用口径，压缩存储口径见
            # Pre-save cache budget rehearsal 步骤。
            echo "📦 可缓存路径体量 (Actions Cache 配额核算, du 口径):"
            for CACHE_GLOB in openwrt/.ccache openwrt/staging_dir/host openwrt/staging_dir/hostpkg \
                              openwrt/staging_dir/target-*/host openwrt/build_dir/hostpkg \
                              openwrt/build_dir/target-*/host openwrt/dl/cargo; do
              for MATCH in $CACHE_GLOB; do
                [ -e "$MATCH" ] || continue
                printf '  %-44s %s\n' "$MATCH" "$(du -sh "$MATCH" 2>/dev/null | cut -f1)"
              done
            done

            # ── Summary ──
            TC_HIT_LABEL=$([ "${{ steps.cache-refresh.outputs.toolchain_restored || 'false' }}" = "true" ] && echo "✅ 命中" || echo "🔨 重编")
            TC_DISK=$(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo "N/A")
            HP_RESTORE_STATE="${{ steps.cache-hostpkg-restore.outcome || 'skipped' }}"
            [ "$HP_RESTORE_STATE" = "success" ] || HP_RESTORE_STATE="跳过/失败"
            [ "${{ steps.cache-hostpkg-restore.outputs.cache-hit || 'false' }}" = "true" ] && HP_RESTORE_STATE="${HP_RESTORE_STATE} (exact hit)"
            HP_SAVE_STATE=$([ "${{ steps.cache-sdk-hostpkg-save.outcome || 'skipped' }}" = "success" ] && echo "✅ 已保存" || echo "未保存")
            echo "📈 hostpkg 快照: 恢复 ${HP_RESTORE_STATE}, 保存 ${HP_SAVE_STATE}"
            if [ "${SUMMARY_COMPACT:-false}" != "true" ]; then
              {
                echo ""
                echo "### 📈 ccache 统计"
                echo "| 项 | 命中率 | Direct hits | Preprocessed | Misses | 缓存大小 | 压缩后 |"
                echo "|---|---|---|---|---|---|---|"
                echo "| **ccache** | ${HIT_RATE} | ${HITS_DIRECT} | ${HITS_PREP} | ${MISSES} | ${CACHE_SIZE_LABEL} | ~${CC_ZSTD_HUMAN} |"
                echo "| **工具链** | — | ${TC_HIT_LABEL} | — | — | ${TC_DISK} | — |"
                echo "| **hostpkg (rust/go)** | — | 恢复: ${HP_RESTORE_STATE} | — | — | 保存: ${HP_SAVE_STATE} | — |"
              } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$CCACHE_STATS_AVAILABLE" = false ]; then
              echo "::warning title=ccache statistics::无法从 ccache -s 解析编译统计，Summary 已显示 N/A"
              printf '%s\n' '- ccache 统计输出缺少可识别的命中/未命中字段，Summary 使用 `N/A`。' >> .ci-annotations.md
            fi
          else
            echo "::warning title=ccache statistics::ccache 不可用或无缓存目录，跳过统计"
            printf '%s\n' '- ccache 统计步骤未找到可用的 ccache 或 `.ccache` 目录，已跳过统计。' >> .ci-annotations.md
          fi

      # ───────── 编译/下载错误诊断（统一处理）─────────
      # 刻意设计: 失败时自动查找失败软件包, 从 error.txt/compile.txt 判定哪个包失败,
      # 避免人工翻 build.log 大海捞针。logs=重试轮, logs.1=初次轮。
      # 权威失败源是 error.txt (make ERROR 宏写入 "ERROR: <pkg> failed to build."):
      # time.pl 无论命令成败都会打印 "time:" 行, 失败日志同样以 "time:" 结尾,
      # 故 compile.txt 末行是否 time: 不能判定失败; 仅保留该检测作为日志被中断(如 OOM)时的兜底。
      - name: 🔍 Build Error Diagnostics
        if: failure()
        # 诊断类步骤: 自身失败不掩盖原始构建错误 (降级为红叉但不改变 job 结论)
        continue-on-error: true
        run: |
          cd openwrt
          FAILED_PKGS=""
          PKG_COUNT=0

          # ── 收集失败包: 先 error.txt 权威源, 再 compile.txt 末行兜底 ──
          for ROOT in logs logs.1; do
            [ -d "$ROOT" ] || continue
            # 1) error.txt 权威源: "   ERROR: package/feeds/packages/libffi failed to build."
            for errfile in $(find "$ROOT" -name 'error.txt' -type f 2>/dev/null | sort); do
              while IFS= read -r line; do
                pkg=$(echo "$line" | sed -n 's/.*ERROR: \(.*\) failed to build.*/\1/p' | sed 's/ \[[^]]*\]$//')
                [ -n "$pkg" ] && FAILED_PKGS="$FAILED_PKGS $pkg"
              done < "$errfile"
            done
            # 2) 兜底: 末行不含 time: 的 compile.txt (日志被中断, 无 error.txt)
            for logfile in $(find "$ROOT" -name 'compile.txt' -type f 2>/dev/null | sort); do
              LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
              if ! echo "$LAST_LINE" | grep -q '^time:'; then
                PKG=$(echo "$logfile" | sed "s|$ROOT/||; s|/compile.txt||")
                FAILED_PKGS="$FAILED_PKGS $PKG"
              fi
            done
          done

          if [ -n "$FAILED_PKGS" ]; then
            # ── 编译阶段失败: 完整输出失败包日志 (不截断/过滤, 仅超大文件保护) ──
            FAILED_PKGS=$(echo "$FAILED_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            PKG_COUNT=$(echo "$FAILED_PKGS" | wc -l)
            echo "## ❌ 编译错误详情" >> "$GITHUB_STEP_SUMMARY"
            echo "共 ${PKG_COUNT} 个软件包编译失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            for pkg in $FAILED_PKGS; do
              echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              # 轮次优先级: logs.1(初次, 完整 configure 错误) > logs(重试轮)
              for LOGROOT in logs.1 logs; do
                [ -d "$LOGROOT" ] || continue
                for LOGFILE in "$LOGROOT/$pkg/compile.txt" "$LOGROOT/$pkg/host-compile.txt" "$LOGROOT/$pkg/download.txt"; do
                  [ -f "$LOGFILE" ] || continue
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "▍$LOGFILE ($( [ "$LOGROOT" = "logs.1" ] && echo 初次构建 || echo 重试 )) ▍" >> "$GITHUB_STEP_SUMMARY"
                  SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                  if [ "$SIZE" -gt 300000 ]; then
                    echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行; 完整内容见 artifact]" >> "$GITHUB_STEP_SUMMARY"
                    tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                  else
                    cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                  fi
                done
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            # ── 无 error.txt/中断日志 → 可能是下载阶段或极早期失败 ──
            HAS_DOWNLOAD_LOGS=false
            HAS_COMPILE_LOGS=false
            for ROOT in logs logs.1; do
              [ -d "$ROOT" ] || continue
              if [ -n "$(find "$ROOT" -name 'download.txt' -type f 2>/dev/null | head -1)" ]; then
                HAS_DOWNLOAD_LOGS=true
              fi
              if [ -n "$(find "$ROOT" -name 'compile.txt' -type f 2>/dev/null | head -1)" ]; then
                HAS_COMPILE_LOGS=true
              fi
            done

            if [ -s toolchain-prebuild.log ] && [ ! -s build.log ] && [ "$HAS_DOWNLOAD_LOGS" = "false" ] && [ "$HAS_COMPILE_LOGS" = "false" ]; then
              echo "## ❌ 工具链预编译失败详情" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -100 toolchain-prebuild.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ "$HAS_DOWNLOAD_LOGS" = "true" ] && [ "$HAS_COMPILE_LOGS" = "false" ]; then
              # 有 download.txt 但无 compile.txt → 下载阶段失败
              echo "## ❌ 下载失败详情" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"

              FAILED_DOWNLOAD_PKGS=""
              for ROOT in logs logs.1; do
                [ -d "$ROOT" ] || continue
                for logfile in $(find "$ROOT" -name 'download.txt' -type f 2>/dev/null | sort); do
                  LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
                  # 下载成功通常以 time: 结尾, 失败则包含错误信息
                  if ! echo "$LAST_LINE" | grep -q '^time:'; then
                    PKG=$(echo "$logfile" | sed "s|$ROOT/||; s|/download.txt||")
                    FAILED_DOWNLOAD_PKGS="$FAILED_DOWNLOAD_PKGS $PKG"
                  fi
                done
              done

              if [ -n "$FAILED_DOWNLOAD_PKGS" ]; then
                FAILED_DOWNLOAD_PKGS=$(echo "$FAILED_DOWNLOAD_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
                PKG_COUNT=$(echo "$FAILED_DOWNLOAD_PKGS" | wc -l)
                echo "共 ${PKG_COUNT} 个软件包下载失败" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"

                for pkg in $FAILED_DOWNLOAD_PKGS; do
                  echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  for LOGROOT in logs.1 logs; do
                    [ -d "$LOGROOT" ] || continue
                    LOGFILE="$LOGROOT/$pkg/download.txt"
                    [ -f "$LOGFILE" ] || continue
                    SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                    if [ "$SIZE" -gt 300000 ]; then
                      echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行]" >> "$GITHUB_STEP_SUMMARY"
                      tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                    else
                      cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                    fi
                  done
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                done
              else
                # 兜底: 从 build.log 提取下载失败信息
                FAILED_DOWNLOADS=$(grep -E '(Download failed|make\[[0-9]+\].*\[.*download\].*Error|No rule to make target.*download)' build.log 2>/dev/null | head -30 || true)

                if [ -n "$FAILED_DOWNLOADS" ]; then
                  echo "以下包下载失败：" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  echo "$FAILED_DOWNLOADS" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                else
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            else
              # 无任何日志 → 极早期失败或配置错误
              echo "## ❌ 构建失败详情" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              if [ -s build.log ]; then
                tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
              elif [ -s toolchain-prebuild.log ]; then
                tail -100 toolchain-prebuild.log >> "$GITHUB_STEP_SUMMARY"
              else
                echo "未生成 build.log 或 toolchain-prebuild.log" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # ── 提示初始构建日志（retry 时保存的 build.1.log）──
          if [ -f build.1.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 📎 初始构建日志（更新仓库前）已保存至 artifact: \`build.1.log\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          # ── 求助指引: 外部 caller 不一定知道日志 artifact 与反馈渠道 ──
          {
            echo ""
            echo "> 📎 完整构建日志 (logs/ 与 logs.1/ 分包日志): 本 run 页面 **Artifacts** 区 \`${IMMWRT_TARGET}-build-log\`"
            echo "> 🐛 构建基础设施问题反馈: [solarflows/AutoWorkflows](https://github.com/solarflows/AutoWorkflows/issues)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${SUMMARY_COMPACT:-false}" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📋 logs/ 概览" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            TOTAL_COMPILE=$(find logs logs.1 -name 'compile.txt' -type f 2>/dev/null | wc -l)
            TOTAL_DOWNLOAD=$(find logs logs.1 -name 'download.txt' -type f 2>/dev/null | wc -l)
            EMPTY_COMPILE=$(find logs logs.1 -name 'compile.txt' -type f -size 0 2>/dev/null | wc -l)
            EMPTY_DOWNLOAD=$(find logs logs.1 -name 'download.txt' -type f -size 0 2>/dev/null | wc -l)
            echo "编译日志: ${TOTAL_COMPILE} (空: ${EMPTY_COMPILE})"
            echo "下载日志: ${TOTAL_DOWNLOAD} (空: ${EMPTY_DOWNLOAD})"
            echo "失败包:   ${PKG_COUNT}"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ───────── 构建日志 artifact ─────────
      # 失败恒上传 (诊断需要); 成功时受 upload_build_log 控制 (默认开:
      # logs/ 分包日志含 rebuild_check 的 check-*.txt 判定输出, 是 stamp
      # 命中分析与耗时分布的一手数据; 关 = 省 artifact 存储)。
      - name: Upload build log
        if: always() && !cancelled() && (failure() || inputs.upload_build_log)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-build-log
          path: |
            openwrt/build.log
            openwrt/build.1.log
            openwrt/build.2.log
            openwrt/toolchain-prebuild.log
            openwrt/logs/**
            openwrt/logs.1/**
            openwrt/.config
          retention-days: 7
          if-no-files-found: ignore

      # ───────── toolchain/ccache/SDK tool 缓存保存（仅编译成功）─────────
      # full executor 维护全量 toolchain 和共享 ccache，并生产 SDK 专用
      # host/tool 快照。三类缓存使用独立 save，某一类保存失败不阻塞另外两类。
      # SDK producer 与 consumer 必须使用完全相同的 SDK path 列表。
      # 每个 namespace 仍由写入方自约束保留量（每 target 仅最新 1 份）。理由不是
      # "平台会乱删"：超配额时 GitHub 先保存新缓存、再按 last-access 从旧到新驱逐，
      # 实测 run 35313768877 中被驱逐的正是上一代、创建后从未被读取的 sdk-hostpkg
      # （3.10 GiB，与本策略等价，工具链未被波及）。自约束的价值在于把释放放在
      # 自己可控的步骤里，并保住"新快照保存成功后才删旧"的兜底语义；同时避免
      # 在陈旧代不足以吸收本轮增量（或根本不存在，如 7 天过期后）时，让平台的
      # 下一批候选落在工具链快照上（代价 40 分钟全量重编）。
      - name: Check existing toolchain snapshot
        id: cache-tc-existing
        if: always() && !cancelled() && steps.prepare_toolchain.outcome == 'success' && (steps.build.outputs.make_exit == '0' || steps.retry.outcome == 'success') && steps.feed-rebuild.outcome != 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # 工具链快照 key 由 tools/toolchain 源码树哈希决定（内容寻址），同一
          # 源码修订只对应同一份快照；该 key 已存在时重复 save 必然以
          # "Unable to reserve cache ..." 结束（Actions Cache 不可覆盖），
          # 日志上表现为误导性失败。精确命中时跳过 save，purge 仍按快照可用处理。
          TC_KEY="immwrt-v2-toolchain-${IMMWRT_TARGET}-${{ steps.toolchain_hash.outputs.hash }}"
          set +e
          TC_JSON=$(gh cache list --repo "${{ github.repository }}" --key "$TC_KEY" --limit 100 --json key)
          TC_LOOKUP_RC=$?
          set -e
          if [ "$TC_LOOKUP_RC" -ne 0 ]; then
            echo "exists=lookup-failed" >> "$GITHUB_OUTPUT"
            echo "::warning title=toolchain cache::查询工具链快照失败 (rc=${TC_LOOKUP_RC})，按未命中处理并继续保存"
            exit 0
          fi
          TC_EXISTS=$(printf '%s' "$TC_JSON" | jq -r --arg key "$TC_KEY" 'any(.[]; .key == $key)')
          if [ "$TC_EXISTS" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 工具链快照已存在，跳过重复保存: ${TC_KEY}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save toolchain cache
        if: always() && !cancelled() && steps.prepare_toolchain.outcome == 'success' && (steps.build.outputs.make_exit == '0' || steps.retry.outcome == 'success') && steps.cache-tc-existing.outputs.exists != 'true' && steps.feed-rebuild.outcome != 'failure'
        id: cache-tc-save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-${{ steps.toolchain_hash.outputs.hash }}
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      - name: Save ccache
        if: always() && !cancelled() && steps.prepare_toolchain.outcome == 'success' && (steps.build.outputs.make_exit == '0' || steps.retry.outcome == 'success') && steps.build.outputs.ccache_wrapper_valid == 'true' && steps.feed-rebuild.outcome != 'failure'
        id: cache-cc-save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          path: openwrt/.ccache

      # ───────── 保存前预算预演 (hostpkg 快照体积守卫) ─────────
      # ① du 逐路径报告 (C6 诊断); ② stamp 目录守卫: 正常仅 0 字节隐藏 stamp
      # (KB 级), 超 200MB 说明 AUTOREMOVE 未生效或清理失败, 强制剔除非 stamp
      # 文件防快照体积爆炸 (rust build 目录实测可达 8~15GB); ③ 压缩预演:
      # tar+zstd 与 GitHub cache 后端同口径, 预演值 ≈ 实际存储值上界;
      # ④ 超软预算 3072MB (实测锚定: run 38413137090 ipq807x 首代快照 546MB,
      # zstd 预演 519MB 与 GitHub 存储口径偏差 5%; 3072 ≈ 实测 5.6 倍, 吸收
      # rust/go 版本升级的编译器体积增长与 crate 依赖增长; 预算过紧会在体积
      # 正常波动时误删 dl/cargo, crate 缓存永远积累不起来 = 闭环效果打折。
      # 多轮 purge 失败的旧代残留由平台 LRU 驱逐兜底, 每轮 restore 刷新
      # last-access 保护在用快照, 预演不感知远端配额只守本轮快照体积)
      # 按重建成本升序牺牲:
      # dl/cargo (可重新下载, 分钟级) → 照常保存 (删 staging 等于放弃缓存闭环,
      # 不如让平台 LRU 驱逐兜底, C5 已实证驱逐语义可接受)。
      # 预演失败 (timeout/工具缺失) 降级 du 口径并告警, 不阻塞 save —— 预演
      # 是防御性诊断, 降级语义显式声明。
      - name: 🧹 Pre-save cache budget rehearsal
        id: cache-budget-rehearsal
        if: always() && !cancelled() && steps.prepare_toolchain.outcome == 'success' && (steps.build.outputs.make_exit == '0' || steps.retry.outcome == 'success') && steps.feed-rebuild.outcome != 'failure'
        run: |
          set -euo pipefail
          cd openwrt
          SOFT_BUDGET_MB=3072

          echo "📦 hostpkg 快照路径体量 (du 口径 = 磁盘占用, 非 GitHub 压缩存储口径):"
          for CACHE_GLOB in staging_dir/hostpkg staging_dir/target-*/host \
                            build_dir/hostpkg build_dir/target-*/host dl/cargo; do
            for MATCH in $CACHE_GLOB; do
              [ -e "$MATCH" ] || continue
              printf '  %-40s %s\n' "$MATCH" "$(du -sh "$MATCH" 2>/dev/null | cut -f1)"
            done
          done

          # ── stamp 目录守卫 ──
          HOSTPKG_STAMP_ROOTS=""
          [ -d build_dir/hostpkg ] && HOSTPKG_STAMP_ROOTS="build_dir/hostpkg"
          for d in build_dir/target-*/host; do
            [ -d "$d" ] && HOSTPKG_STAMP_ROOTS="${HOSTPKG_STAMP_ROOTS:+$HOSTPKG_STAMP_ROOTS }$d"
          done
          if [ -n "$HOSTPKG_STAMP_ROOTS" ]; then
            STAMP_MB=$(du -sm $HOSTPKG_STAMP_ROOTS 2>/dev/null | awk '{s+=$1} END {print s+0}')
            if [ "${STAMP_MB:-0}" -gt 200 ]; then
              echo "::warning::hostpkg stamp 目录 ${STAMP_MB}MB 超阈值 200MB (正常 <1MB), 强制清理非 stamp 文件"
              find $HOSTPKG_STAMP_ROOTS -mindepth 2 -maxdepth 2 \
                -not \( -type f -name '.*' -size 0 \) -exec rm -rf {} + 2>/dev/null || true
            fi
          fi

          # ── 压缩预演 + 预算决策 ──
          REHEARSAL_PATHS=""
          for p in staging_dir/hostpkg staging_dir/target-*/host \
                   build_dir/hostpkg build_dir/target-*/host dl/cargo; do
            [ -e "$p" ] && REHEARSAL_PATHS="${REHEARSAL_PATHS:+$REHEARSAL_PATHS }$p"
          done
          if [ -n "$REHEARSAL_PATHS" ]; then
            if command -v zstd >/dev/null 2>&1; then
              set +e
              SNAPSHOT_BYTES=$(timeout 90 tar cf - $REHEARSAL_PATHS 2>/dev/null | zstd -3 -c 2>/dev/null | wc -c)
              REHEARSAL_RC=$?
              set -e
            else
              REHEARSAL_RC=127
              SNAPSHOT_BYTES=""
            fi
            if [ "${REHEARSAL_RC:-1}" -ne 0 ] || [ -z "${SNAPSHOT_BYTES:-}" ]; then
              echo "::warning::压缩预演失败 (rc=${REHEARSAL_RC:-1}), 降级 du 字节口径"
              SNAPSHOT_BYTES=$(du -sb $REHEARSAL_PATHS 2>/dev/null | awk '{s+=$1} END {print s+0}')
            fi
            SNAPSHOT_MB=$((SNAPSHOT_BYTES / 1024 / 1024))
            echo "📦 hostpkg 快照压缩预演: ${SNAPSHOT_MB}MB (软预算 ${SOFT_BUDGET_MB}MB)"

            if [ "$SNAPSHOT_MB" -gt "$SOFT_BUDGET_MB" ]; then
              if [ -e dl/cargo ]; then
                echo "::warning::预演 ${SNAPSHOT_MB}MB 超软预算, 删除 dl/cargo (可重新下载, 分钟级损失)"
                rm -rf dl/cargo
                set +e
                SNAPSHOT_BYTES=$(timeout 90 tar cf - $REHEARSAL_PATHS 2>/dev/null | zstd -3 -c 2>/dev/null | wc -c)
                set -e
                SNAPSHOT_MB=$((SNAPSHOT_BYTES / 1024 / 1024))
                echo "📦 删除 dl/cargo 后预演: ${SNAPSHOT_MB}MB"
              fi
              if [ "$SNAPSHOT_MB" -gt "$SOFT_BUDGET_MB" ]; then
                echo "::warning::预演仍超软预算 (${SNAPSHOT_MB}MB), 照常保存由平台 LRU 驱逐兜底, 请人工核查体积来源"
              fi
            fi
          else
            echo "ℹ️ 无可缓存路径, 跳过预演"
          fi

      - name: Save SDK hostpkg cache
        if: always() && !cancelled() && steps.prepare_toolchain.outcome == 'success' && (steps.build.outputs.make_exit == '0' || steps.retry.outcome == 'success') && steps.feed-rebuild.outcome != 'failure'
        id: cache-sdk-hostpkg-save
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: immwrt-v2-sdk-hostpkg-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          path: ${{ steps.validate-inputs.outputs.hostpkg_cache_paths }}

      # ───────── 清理远端工具链缓存（独立维护）─────────
      # 当前 key 已先保存，清理时明确排除它；清理失败只会暂时多留旧 cache,
      # 不会删除本轮成果或影响已有可用缓存。always() 使 ccache/SDK save
      # 的独立失败不会阻塞本类 purge。
      - name: Purge stale toolchain caches
        id: cache-tc-purge
        # 快照已精确存在（save 被跳过）时同样执行清理，避免旧 key 长期滞留配额。
        if: always() && !cancelled() && (steps.cache-tc-save.outcome == 'success' || steps.cache-tc-existing.outputs.exists == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TC_PREFIX="immwrt-v2-toolchain-${IMMWRT_TARGET}-"
          TC_CURRENT="${TC_PREFIX}${{ steps.toolchain_hash.outputs.hash }}"
          TC_PATTERN="^immwrt-v2-toolchain-${IMMWRT_TARGET}-(force-[0-9a-f]{16}-[0-9]+|[0-9a-f]{16})$"
          set +e
          TC_LIST=$(gh cache list --repo "$REPO" --key "$TC_PREFIX" --limit 100 --json id,key,createdAt)
          TC_RC=$?
          TC_IDS=""
          TC_IDS_RC=0
          if [ "$TC_RC" -eq 0 ]; then
            TC_IDS=$(echo "$TC_LIST" | jq -r --arg pattern "$TC_PATTERN" --arg current "$TC_CURRENT" '[.[] | select((.key | test($pattern)) and .key != $current)] | .[].id')
            TC_IDS_RC=$?
          fi
          set -e
          if [ "$TC_RC" -ne 0 ]; then
            echo "::warning title=toolchain retention::获取工具链缓存列表失败，保留旧缓存 (rc=${TC_RC})"
            printf '%s\n' '- 工具链缓存列表获取失败，旧快照已保留。' >> .ci-annotations.md
          elif [ "$TC_IDS_RC" -ne 0 ]; then
            echo "::warning title=toolchain retention::解析工具链缓存列表失败，跳过清理"
            printf '%s\n' '- 工具链缓存列表解析失败，本轮跳过清理。' >> .ci-annotations.md
          elif [ -n "$TC_IDS" ]; then
            set +e
            echo "$TC_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO"
            DELETE_RC=$?
            set -e
            if [ "$DELETE_RC" -ne 0 ]; then
              echo "::warning title=toolchain retention::部分工具链旧快照删除失败"
              printf '%s\n' '- 部分工具链旧快照删除失败，本轮快照仍已保存。' >> .ci-annotations.md
            fi
          else
            echo "ℹ️ 无旧工具链缓存"
          fi

      # ───────── 清理远端 ccache（独立维护）─────────
      - name: Purge stale ccache snapshots
        id: cache-cc-purge
        if: always() && !cancelled() && steps.cache-cc-save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CC_PREFIX="immwrt-v2-ccache-${IMMWRT_TARGET}-"
          CC_CURRENT="${CC_PREFIX}${{ github.run_id }}"
          CC_PATTERN="^immwrt-v2-ccache-${IMMWRT_TARGET}-[0-9]+$"
          set +e
          CC_LIST=$(gh cache list --repo "$REPO" --key "$CC_PREFIX" --limit 100 --json id,key,createdAt)
          CC_RC=$?
          CC_IDS=""
          CC_IDS_RC=0
          if [ "$CC_RC" -eq 0 ]; then
            CC_IDS=$(echo "$CC_LIST" | jq -r --arg pattern "$CC_PATTERN" --arg current "$CC_CURRENT" '[.[] | select((.key | test($pattern)) and .key != $current)] | .[].id')
            CC_IDS_RC=$?
          fi
          set -e
          if [ "$CC_RC" -ne 0 ]; then
            echo "::warning title=ccache retention::获取 ccache 快照列表失败，保留旧缓存"
            printf '%s\n' '- ccache 快照清理失败，旧快照已保留。' >> .ci-annotations.md
          elif [ "$CC_IDS_RC" -ne 0 ]; then
            echo "::warning title=ccache retention::解析 ccache 列表失败，跳过清理"
            printf '%s\n' '- ccache 快照列表解析失败，本轮跳过清理。' >> .ci-annotations.md
          elif [ -n "$CC_IDS" ]; then
            set +e
            echo "$CC_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO"
            DELETE_RC=$?
            set -e
            if [ "$DELETE_RC" -ne 0 ]; then
              echo "::warning title=ccache retention::部分 ccache 旧快照删除失败"
              printf '%s\n' '- 部分 ccache 旧快照删除失败，本轮快照仍已保存。' >> .ci-annotations.md
            fi
          else
            echo "ℹ️ 无旧 ccache 缓存"
          fi

      # ───────── 清理远端 SDK hostpkg 快照（独立维护, 保留最新 1 份）─────────
      # 全量构建生产 SDK host/tool 种子快照供 SDK 增量路径恢复；该快照 full
      # executor 自己从不读取（只写不读），若 SDK 路径长期不运行则无人清理，
      # 每轮全量构建净增 0.5~1.7GB/目标。写入方必须自约束保留量，否则会触碰
      # 10GB 仓库配额并触发平台静默驱逐（见上方 Save 段说明）。
      # 保留策略与 compile-packages 的 SDK hostpkg 清理完全一致：仅保留最新 1 份，
      # 显式排除本轮 key，清理失败只告警不阻塞，两个 executor 交替写入也能收敛。
      - name: Purge stale SDK hostpkg snapshots
        id: cache-hostpkg-purge
        if: always() && !cancelled() && steps.cache-sdk-hostpkg-save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          HP_PREFIX="immwrt-v2-sdk-hostpkg-${IMMWRT_TARGET}-"
          HP_CURRENT="${HP_PREFIX}${{ github.run_id }}"
          HP_PATTERN="^immwrt-v2-sdk-hostpkg-${IMMWRT_TARGET}-[0-9]+$"
          set +e
          HP_LIST=$(gh cache list --repo "$REPO" --key "$HP_PREFIX" --limit 100 --json id,key,createdAt)
          HP_RC=$?
          HP_IDS=""
          HP_IDS_RC=0
          if [ "$HP_RC" -eq 0 ]; then
            HP_IDS=$(echo "$HP_LIST" | jq -r --arg pattern "$HP_PATTERN" --arg current "$HP_CURRENT" '[.[] | select((.key | test($pattern)) and .key != $current)] | .[].id')
            HP_IDS_RC=$?
          fi
          set -e
          if [ "$HP_RC" -ne 0 ]; then
            echo "::warning title=SDK hostpkg retention::获取 SDK hostpkg 快照列表失败，保留旧快照 (rc=${HP_RC})"
            printf '%s\n' '- SDK hostpkg 快照列表获取失败，旧快照已保留。' >> .ci-annotations.md
          elif [ "$HP_IDS_RC" -ne 0 ]; then
            echo "::warning title=SDK hostpkg retention::解析 SDK hostpkg 快照列表失败，跳过清理"
            printf '%s\n' '- SDK hostpkg 快照列表解析失败，本轮跳过清理。' >> .ci-annotations.md
          elif [ -n "$HP_IDS" ]; then
            set +e
            echo "$HP_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO"
            DELETE_RC=$?
            set -e
            if [ "$DELETE_RC" -ne 0 ]; then
              echo "::warning title=SDK hostpkg retention::部分 SDK hostpkg 旧快照删除失败"
              printf '%s\n' '- 部分 SDK hostpkg 旧快照删除失败，本轮快照仍已保存。' >> .ci-annotations.md
            fi
          else
            echo "ℹ️ 无旧 SDK hostpkg 快照 (保留最新 1 份)"
          fi

      # 缓存保存与清理不再按策略过滤: smart 与 clean_cache 均维护快照。
      # 每个 namespace 的写入方都负责把自己那一份收敛到保留上限，避免依赖
      # 平台驱逐这种不可控的兜底。

      # ════════════ 产物打包 ════════════
      # 刻意设计: 打包后输出 release/ 根目录结构(深度1), 便于人工快速核验产物完整性
      - name: 📦 Package firmware artifacts
        if: success()
        run: |
          cd openwrt
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 Package firmware artifacts        ║"
          echo "╚══════════════════════════════════════╝"
          mkdir -p release/firmware
          find bin/targets -type f \
            -not -path "*/packages/*" \
            -not -name "*-sdk-*" \
            -not -name "*-imagebuilder-*" \
            -exec cp {} release/firmware/ \; 2>/dev/null || true
          mkdir -p release/passwall
          # ── 软件包打包: collect_packages 指定清单 (逗号分隔; 空 = 默认单包 luci-app-passwall) ──
          # 逗号归一为空格 + xargs 折叠多余空白 (容忍 "a, b , c" 混合写法);
          # 前缀匹配 "<pkg>-*" / "<pkg>_*" 覆盖 apk/ipk 两种命名 (apk 无 arch 后缀,
          # ipk 带 _arch), 天然覆盖子包与变体 (ssr-local / geoip-full 等);
          # 缺包仅告警不报错 (包未被 seed 启用或产物名不匹配, 由调用方决定是否关注)。
          COLLECT_PKGS=$(printf '%s' "${{ inputs.collect_packages }}" | tr ',' ' ' | xargs)
          [ -n "$COLLECT_PKGS" ] || COLLECT_PKGS="luci-app-passwall"
          echo "📦 软件包打包清单: ${COLLECT_PKGS}"
          MISSING_PKGS=""
          for pkg in $COLLECT_PKGS; do
            FOUND=$(find bin/packages -type f \
              \( -name "${pkg}-*.ipk" -o -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" -o -name "${pkg}_*.apk" \) \
              2>/dev/null || true)
            if [ -z "$FOUND" ]; then
              MISSING_PKGS="${MISSING_PKGS} ${pkg}"
              continue
            fi
            printf '%s\n' "$FOUND" | xargs -r -I{} cp {} release/passwall/
          done
          if [ -n "$MISSING_PKGS" ]; then
            echo "::warning::以下指定包未找到产物 (未启用/未编译/名字不匹配), 已跳过:${MISSING_PKGS}"
          fi
          if [ -f public-key.pem ]; then
            cp public-key.pem release/passwall/solarflows-apk-public.pem
          elif [ -f key-build.pub ]; then
            cp key-build.pub release/passwall/solarflows-usign-public.pub
          fi
          (cd release && tar czf ../${IMMWRT_TARGET}-release.tar.gz .)

          # ── 产物完整目录树 (替换原 tree -L 1: ubuntu runner 无 tree 命令, 且深度1不完整) ──
          # 纯 find 实现, 无外部依赖; release/ 是最终交付物, 展开到最深
          # 可选诊断展示: 管道失败不阻断构建
          echo ""
          echo "📂 release/ 完整目录结构:"
          echo '```text'
          find release -print 2>/dev/null | sort | sed "s|^release|.|" | head -200 || true
          echo '```'
          echo ""
          echo "📦 产物汇总:"
          echo "  固件:    $(find release/firmware -type f 2>/dev/null | wc -l) 个文件, $(du -sh release/firmware 2>/dev/null | cut -f1)"
          echo "  Passwall: $(find release/passwall -type f 2>/dev/null | wc -l) 个文件, $(du -sh release/passwall 2>/dev/null | cut -f1)"
          echo "  tarball: $(ls -lh ${IMMWRT_TARGET}-release.tar.gz 2>/dev/null | awk '{print $5}')"

      - name: Generate build info
        if: success()
        id: build-info-step
        run: |
          set -euo pipefail
          PKG_FORMAT="${{ steps.apply_config.outputs.use_apk == 'true' && 'apk' || 'ipk' }}"
          FIRMWARE_RELEASE_TAG="${{ env.RESOLVED_VERSION }}"
          if [ -n "${{ inputs.matrix_firmware_release_tag_prefix }}" ]; then
            FIRMWARE_RELEASE_TAG="${{ inputs.matrix_firmware_release_tag_prefix }}-${{ env.RESOLVED_VERSION }}"
          fi

          # ── 从编译产物 feeds.buildinfo 提取各 feed 版本 (恢复 v1 功能) ──
          # solarflows 软件包是直接 clone 到 package/solarflows/ (非 src-git feed),
          # 不在 feeds.buildinfo 中, 故表格末尾手动附加一行 (用 packages_sha_full)。
          FEEDS_INFO=""
          FEEDS_MD_JSON=""
          # 存在性探测: feeds.buildinfo 可能不存在 (上游未生成), 属预期; || true 防 head 截断 SIGPIPE
          FW_FEEDS_FILE=$(find openwrt/bin/targets -name "feeds.buildinfo" 2>/dev/null | head -1 || true)
          if [ -f "$FW_FEEDS_FILE" ] && [ -s "$FW_FEEDS_FILE" ]; then
            # 兼容 src-git 与 src-git-full, 跳过 # 注释行/空行
            if grep -Eq '^src-git(-full)?\b' "$FW_FEEDS_FILE" 2>/dev/null; then
              FEEDS_INFO=$(jq -Rs '.' "$FW_FEEDS_FILE")
              FEEDS_MD_RAW=$(awk '{
                if ($0 ~ /^#/ || $0 ~ /^[[:space:]]*$/) next
                n=split($NF,a,"^"); url=a[1]; hash=a[2]
                if (hash == "") hash="-"
                sub(/\.git$/,"",url)
                printf "| [%s](%s/tree/%s) | `%s` |\n", $2, url, hash, hash
              }' "$FW_FEEDS_FILE")
              # 手动附加 solarflows 软件包行 (printf 生成真实换行, 避免 YAML 块多行字面量)
              # 绝对链接: 相对链接在 caller 仓库的 Release 页面会解析到错误路径 (404)
              SOLARFLOWS_ROW="| [solarflows](https://github.com/${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.feed-rebuild.outputs.packages_sha_full || steps.clone_packages.outputs.packages_sha_full }}\` |"
              if [ -n "$FEEDS_MD_RAW" ]; then
                FEEDS_MD_RAW=$(printf '%s\n%s' "$FEEDS_MD_RAW" "$SOLARFLOWS_ROW")
              else
                FEEDS_MD_RAW="$SOLARFLOWS_ROW"
              fi
              if [ -n "$FEEDS_MD_RAW" ]; then
                FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
              else
                echo "⚠️ feeds.buildinfo 格式异常, 无法解析 feed 版本"
                FEEDS_MD_JSON='""'
              fi
            else
              echo "⚠️ feeds.buildinfo 内容不完整 (无 src-git 条目), 仅记录 solarflows"
              FEEDS_INFO='""'
              FEEDS_MD_RAW="| [solarflows](${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.feed-rebuild.outputs.packages_sha_full || steps.clone_packages.outputs.packages_sha_full }}\` |"
              FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
            fi
          else
            echo "⚠️ feeds.buildinfo 缺失, 仅记录 solarflows"
            FEEDS_INFO='""'
            FEEDS_MD_RAW="| [solarflows](${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.feed-rebuild.outputs.packages_sha_full || steps.clone_packages.outputs.packages_sha_full }}\` |"
            FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
          fi

          # config_sha 由 plan 计算并通过 matrix_config_sha 传入以保证 plan↔exec↔persist 闭环一致；
          # 若外部调用方未传（向后兼容），本地回退公式现 hash caller 配置目录 (CONFIG_ROOT)：
          # AutoWorkflows 自身运行时 plan 必传 matrix_config_sha，本地回退不执行；
          # 外部 caller 直调时本地公式即 caller 配置指纹。targets.json 部分仍读
          # AutoWorkFlows（元数据），seed 目录部分改 CONFIG_ROOT。
          CONFIG_SHA="${{ inputs.matrix_config_sha }}"
          if [ -z "$CONFIG_SHA" ]; then
            TARGET_CONFIG_JSON=$(jq -c --arg t "${IMMWRT_TARGET}" '.targets[] | select(.target == $t)' "${GITHUB_WORKSPACE}/AutoWorkFlows/openwrt-configs/immortalwrt/targets.json" 2>/dev/null || echo "")
            CONFIG_SHA=$( (echo "$TARGET_CONFIG_JSON"; find "${CONFIG_ROOT}/${IMMWRT_TARGET}" -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) | sha256sum | cut -d' ' -f1 || echo "")
          fi

          # ── 构建输入指纹 (G6): 逐包 tree SHA 短哈希 + 各 feed 实际消费 commit ──
          # tree SHA 内容寻址: 目录内容不变则指纹不变 (run 36211341719 教训: 上游仓库
          # HEAD 的无关提交不应触碰构建指纹)。本地 git ls-tree 与 plan 侧 trees API 读
          # 同一 git 对象; 短哈希 7 位 (git 惯例, 千包规模碰撞 <1e-7) 控制 state 体积;
          # 标准/上游 feed 只记 seed 引用的包 (方案 A: 未引用的包不影响固件)。
          # 布局兼容: feeds/<name> 为 分类/包 (openwrt 布局) 或 包 (routing 布局),
          # 取「路径深度 ≤2 的 tree 目录」末级名作包键, 与 plan 侧 fetch_pkg_trees 同规则。
          SHORT=7
          SEED_REF_JSON=$(find "${CONFIG_ROOT}/${IMMWRT_TARGET}" -type f -name '*.seed' -print0 | xargs -0 cat | \
            grep -E '^CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]+=y$' | \
            sed -E 's/CONFIG_PACKAGE_([^=]+)=y/\1/' | grep -vE '^luci-i18n-' | sort -u | \
            jq -Rrs 'split("\n") | map(select(length > 0))')
          FEED_DIR="${GITHUB_WORKSPACE}/openwrt/package/${{ inputs.packages_feed_name }}"
          INPUT_TREES_JSON='{}'
          if [ -d "$FEED_DIR" ]; then
            # 深度 ≤2 与 plan 侧 fetch_pkg_trees 同规则 (键集不对齐会致每轮
            # 幽灵子目录键误判新增); custom feed 扁平布局下含包内子目录键,
            # 两侧一致即语义自洽; -t 必需 (递归默认只出 blob 行)
            INPUT_TREES_JSON=$(git -C "$FEED_DIR" ls-tree -r -t HEAD 2>/dev/null | \
              jq -Rrs --argjson short "$SHORT" 'split("\n") | map(select(length > 0)) | map(split("\t")) | map(select(.[0] | test("^040000 tree "))) | map(select((.[1] | split("/") | length) <= 2)) | map({(.[1] | split("/") | last): (.[0] | split(" ")[2][0:$short])}) | add // {}') || INPUT_TREES_JSON='{}'
          fi
          STD_INPUT_TREES_JSON='{}'
          UPSTREAM_INPUT_TREES_JSON='{}'
          FEEDS_SHA_JSON='{}'
          if [ -d "${GITHUB_WORKSPACE}/openwrt/feeds" ]; then
            for d in "${GITHUB_WORKSPACE}/openwrt/feeds"/*/; do
              [ -d "$d" ] || continue
              fname=$(basename "$d")
              # .tmp 是 feeds update 的中间目录, 跳过
              case "$fname" in *.tmp) continue ;; esac
              f_sha=$(git -C "$d" rev-parse HEAD 2>/dev/null) || continue
              [ -n "$f_sha" ] || continue
              FEEDS_SHA_JSON=$(echo "$FEEDS_SHA_JSON" | jq --arg n "$fname" --arg s "$f_sha" '. + {($n): $s}')
              # 逐包短哈希表 (深度 ≤2 目录), 过滤 seed 引用
              # -t 必需: ls-tree -r 递归默认只输出 blob 行, 缺 -t 则 tree 行全缺 →
              # jq 过滤 ^040000 tree 恒空 (run 36519189440: std/upstream 基线恒空,
              # ipq 系每轮"无逐包基线"全量死循环); 深度判断内联 select——原
              # map(. + {depth:...}) 数组加 object 是 jq 语法错误, 之前仅因输入
              # 恒空未触发
              FTREES=$(git -C "$d" ls-tree -r -t HEAD 2>/dev/null | \
                jq -Rrs --argjson short "$SHORT" --argjson ref "$SEED_REF_JSON" '
                  split("\n") | map(select(length > 0)) | map(split("\t"))
                  | map(select(.[0] | test("^040000 tree ")))
                  | map(select((.[1] | split("/") | length) <= 2))
                  | map({(.[1] | split("/") | last): (.[0] | split(" ")[2][0:$short])})
                  | add // {} | with_entries(select(.key as $k | $ref | index($k)))') || continue
              if [ "$fname" = "packages" ]; then
                STD_INPUT_TREES_JSON="$FTREES"
              else
                UPSTREAM_INPUT_TREES_JSON=$(echo "$UPSTREAM_INPUT_TREES_JSON" | jq --arg n "$fname" --argjson t "$FTREES" '. + {($n): $t}')
              fi
            done
          fi

          cat > build-info.json <<JSONEOF
          {
            "target": "${IMMWRT_TARGET}",
            "config": "${IMMWRT_TARGET}",
            "config_sha": "${CONFIG_SHA}",
            "source_repo": "${{ inputs.matrix_repo }}",
            "source_ref": "${{ inputs.matrix_ref }}",
            "source_sha": "${{ steps.clone_packages.outputs.sha_full }}",
            "packages_repo": "${{ inputs.packages_feed_repo }}",
            "packages_branch": "${{ inputs.matrix_packages_branch }}",
            "packages_sha": "${{ steps.feed-rebuild.outputs.packages_sha_full || steps.clone_packages.outputs.packages_sha_full }}",
            "input_trees": ${INPUT_TREES_JSON},
            "std_input_trees": ${STD_INPUT_TREES_JSON},
            "upstream_input_trees": ${UPSTREAM_INPUT_TREES_JSON},
            "feeds_sha": ${FEEDS_SHA_JSON},
            "deferred_pkgs": [],
            "standard_packages_repo": "${{ inputs.standard_packages_repo }}",
            "standard_packages_branch": "${{ steps.clone_packages.outputs.standard_packages_branch }}",
            "standard_packages_sha": "${{ steps.retry.outputs.standard_packages_sha || steps.update-feeds.outputs.standard_packages_sha }}",
            "feeds_info": ${FEEDS_INFO},
            "feeds_md": ${FEEDS_MD_JSON},
            "duration_sec": "${{ steps.total_duration.outputs.duration }}",
            "duration_fmt": "${{ steps.total_duration.outputs.duration_fmt }}",
            "toolchain_hit": "${{ steps.cache-refresh.outputs.toolchain_restored || 'false' }}",
            "toolchain_exact": "${{ steps.cache-refresh.outputs.toolchain_exact || 'false' }}",
            "ccache_hit": "${{ steps.cache-refresh.outputs.ccache_restored || 'false' }}",
            "signing_key_fingerprint": "${{ steps.signing_key.outputs.fingerprint || 'none' }}",
            "signing_mode": "${{ steps.signing_key.outputs.sign_mode || 'none' }}",
            "release_repo": "${{ inputs.matrix_release_repo }}",
            "passwall_repo": "${{ inputs.matrix_passwall_repo }}",
            "passwall_tag": "${{ inputs.matrix_passwall_tag }}",
            "release_tag": "${FIRMWARE_RELEASE_TAG}",
            "build_mode": "firmware",
            "packages_format": "${PKG_FORMAT}",
            "timestamp": "$(TZ=${TZ} date +'%Y-%m-%d %H:%M:%S')"
          }
          JSONEOF

          # ── Summary Feed 版本 (采集兜底: jq 解析失败降级告警, 不杀本步骤——
          #     build-info.json 是发布链关键产物, 不能被 summary 采集拖垮) ──
          if ! FEEDS_MD_ROWS=$(printf '%s\n' "$FEEDS_MD_JSON" | jq -r '.'); then
            echo "::warning::Feed 版本表 jq 解析失败, Summary 跳过该表 (build-info.json 不受影响)"
            FEEDS_MD_ROWS=""
          fi
          {
            echo ""
            echo "### 📌 Feed 版本"
            echo ""
            echo "| Feed | 版本 |"
            echo "|------|------|"
            [ -n "$FEEDS_MD_ROWS" ] && printf '%s\n' "$FEEDS_MD_ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        if: success()
        run: |
          SHA_SHORT="${{ steps.clone_packages.outputs.sha }}"
          # 从 build-info.json 读取 Feed 表格 (含 solarflows 行), 软件包版本不再单列, 避免重复
          # jq -r 已解码 JSON 字符串, 空值输出空串由 -n 过滤
          FEEDS_MD_JSON=$(jq -r '.feeds_md // empty' build-info.json)
          # 签名状态: 按 sign_mode 写明是否签名 + 签名模式
          SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"
          SIGN_FP="${{ steps.signing_key.outputs.fingerprint || 'none' }}"
          if [ "$SIGN_MODE" = "apk" ]; then
            SIGN_LINE="**签名**: ✅ APK 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "usign" ]; then
            SIGN_LINE="**签名**: ✅ usign 已签名 (公钥指纹 ${SIGN_FP:0:16}...)"
          elif [ "$SIGN_MODE" = "random" ]; then
            SIGN_LINE="**签名**: ⚠️ 随机密钥签名 (需 --allow-untrusted / --force-checksum)"
          else
            SIGN_LINE="**签名**: ❌ 未签名"
          fi
          # 内核版本: .config 的 CONFIG_LINUX_x_y=y (defconfig 后必然存在;
          # 缺失/无匹配时跳过该行, 不阻断 notes 生成)
          KERNEL_VER=$(grep -oP '^CONFIG_LINUX_\K[0-9]+_[0-9]+(?==y$)' openwrt/.config 2>/dev/null | head -1 | tr '_' '.') || true
          {
            echo "## ${IMMWRT_TARGET} Build"
            echo ""
            echo "**源码**: [${{ inputs.matrix_ref }}](https://github.com/${{ inputs.matrix_repo }}) @ [${SHA_SHORT}](https://github.com/${{ inputs.matrix_repo }}/commit/${{ steps.clone_packages.outputs.sha_full }})"
            if [ -n "$KERNEL_VER" ]; then
              echo "**内核**: Linux ${KERNEL_VER}"
            fi
            echo "**编译耗时**: ${{ steps.total_duration.outputs.duration_fmt }}"
            echo "${SIGN_LINE}"
            if [ -n "$FEEDS_MD_JSON" ]; then
              echo ""
              echo "### 📌 Feed 版本"
              echo ""
              echo "| Feed | 版本 |"
              echo "|------|------|"
              printf '%s\n' "$FEEDS_MD_JSON"
            fi
            if [ "$SIGN_MODE" = "usign" ] || [ "$SIGN_MODE" = "apk" ]; then
              echo ""
              echo "### 🔐 签名核验"
              echo ""
              echo "公钥随 Passwall Packages Release 发布 (\`solarflows-usign-public.pub\` / \`solarflows-apk-public.pem\`)。"
              if [ "$SIGN_MODE" = "usign" ]; then
                echo ""
                echo "固件清单核验 (sha256sums 与 sha256sums.sig 同目录):"
                echo ""
                echo '```bash'
                echo "usign -V -P solarflows-usign-public.pub -m sha256sums"
                echo '```'
              fi
            fi
            echo ""
            echo "---"
            echo "ℹ️ 完整构建报告请查看 GitHub Actions Summary。"
          } > release-body.md

      - name: Upload firmware artifact
        # 固件 tarball 体积大 (300MB+), 上传下载耗时; 发布到 Release 成功时
        # artifact 仅作兜底, 可经 upload_artifacts=false 关闭
        if: success() && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-release
          path: openwrt/${{ env.IMMWRT_TARGET }}-release.tar.gz
          retention-days: 7

      - name: Upload passwall artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-passwall
          path: openwrt/release/passwall
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build info
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-build-info
          path: |
            build-info.json
            release-body.md
          retention-days: 7

      - name: Publish firmware release
        if: success() && inputs.matrix_release_repo != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ env.RESOLVED_VERSION }}"
          if [ -n "${{ inputs.matrix_firmware_release_tag_prefix }}" ]; then
            RELEASE_TAG="${{ inputs.matrix_firmware_release_tag_prefix }}-${{ env.RESOLVED_VERSION }}"
          fi
          RELEASE_REPO="${{ inputs.matrix_release_repo }}"
          FIRMWARE_DIR="openwrt/release/firmware"
          # ── Release 类型: 运行级开关作用于本次所有 Release (固件/软件包/SDK-IB) ──
          # create 用追加 flag; edit 显式重置状态, 保证默认 release 能纠正历史
          # draft/prerelease 状态 (否则 --draft=false 之外的状态不会被清除)。
          RELEASE_TYPE="${{ inputs.release_type }}"
          CREATE_TYPE_FLAGS=()
          EDIT_TYPE_FLAGS=()
          case "$RELEASE_TYPE" in
            prerelease) CREATE_TYPE_FLAGS=(--prerelease); EDIT_TYPE_FLAGS=(--prerelease --draft=false) ;;
            draft)      CREATE_TYPE_FLAGS=(--draft);      EDIT_TYPE_FLAGS=(--draft) ;;
            *)          EDIT_TYPE_FLAGS=(--draft=false --prerelease=false) ;;
          esac
          echo "🏷️ Release 类型: ${RELEASE_TYPE}"
          [ -d "$FIRMWARE_DIR" ] && [ -n "$(find "$FIRMWARE_DIR" -maxdepth 1 -type f -print -quit)" ] || {
            echo "::error::固件目录为空，拒绝创建空 Release"
            exit 1
          }

          upload_asset_retry() {
            local tag="$1"
            local repo="$2"
            shift 2
            local uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" --repo "$repo" "$@" --clobber; then
                uploaded=true
                break
              fi
              echo "⚠️ 资产上传失败 [尝试 ${attempt}/3]: $*，等待 $((attempt * 5)) 秒后重试..."
              sleep $((attempt * 5))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::资产上传失败，已达最大重试次数: $*"
              return 1
            fi
          }

          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "📦 创建 Release: ${RELEASE_TAG} (repo: ${RELEASE_REPO})"
            # --target 钉本 run 构建的源码 commit (sha_full = matrix_repo@ref 的 HEAD,
            # 与 release_repo 同源 fork 时有效); 刻意: 共享 tag (passwall/artifacts)
            # 不传 --target, 落默认分支——它们不是 per-build 产物。
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --target "${{ steps.clone_packages.outputs.sha_full }}" \
              --title "${IMMWRT_TARGET} Build ${RELEASE_TAG}" --notes-file release-body.md \
              "${CREATE_TYPE_FLAGS[@]}"
          else
            # ── 防误覆盖 (R6 配套): 非正式 run (prerelease/draft) 复用 tag 时,
            #    不得把已转正的 Release 降级改写; 反向 (非正式→release) 是有意
            #    转正, 放行。资产 --clobber 覆盖本身是刻意设计: CI 重跑幂等,
            #    同名即同版本替换。
            if [ "$RELEASE_TYPE" != "release" ]; then
              if [ -n "$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" \
                  --json draft,prerelease --jq 'select(.draft == false and .prerelease == false) | "formal"' 2>/dev/null)" ]; then
                echo "::error::tag ${RELEASE_TAG} 已存在正式 Release, 拒绝以 ${RELEASE_TYPE} 类型覆盖 (换 version/tag 重试, 或确需降级请手动处理该 Release)"
                exit 1
              fi
            fi
            echo "📝 更新已有 Release: ${RELEASE_TAG} (repo: ${RELEASE_REPO})"
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --title "${IMMWRT_TARGET} Build ${RELEASE_TAG}" --notes-file release-body.md \
              "${EDIT_TYPE_FLAGS[@]}"
          fi

          # ── 逐文件上传固件资产 (带重试机制应对 GitHub API/存储端 500/502/超时抖动) ──
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            upload_asset_retry "$RELEASE_TAG" "$RELEASE_REPO" "$file"
          done < <(find "$FIRMWARE_DIR" -maxdepth 1 -type f | LC_ALL=C sort)

          # ── 构建元数据随 Release 永久留存 (CI artifact 仅 7 天过期) ──
          # input_trees/feeds_sha/签名指纹等溯源字段见 build-info.json 本体
          if [ -f build-info.json ]; then
            upload_asset_retry "$RELEASE_TAG" "$RELEASE_REPO" build-info.json
          else
            echo "::warning::build-info.json 缺失, 跳过附加到 Release"
          fi

      - name: Publish Passwall packages
        if: success() && inputs.matrix_passwall_repo != '' && inputs.matrix_passwall_tag != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="openwrt/release/passwall"
          mapfile -t PACKAGE_FILES < <(find "$PACKAGE_DIR" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.pem' \) 2>/dev/null)
          if [ "${#PACKAGE_FILES[@]}" -eq 0 ]; then
            echo "::warning::无 Passwall 包可发布 (编译失败或未配置)"
            exit 0
          fi
          PACKAGE_REPO="${{ inputs.matrix_passwall_repo }}"
          PACKAGE_TAG="${{ inputs.matrix_passwall_tag }}"
          # 与固件 Release 同一运行级类型 (所有 Release 一致)
          CREATE_TYPE_FLAGS=()
          EDIT_TYPE_FLAGS=()
          case "${{ inputs.release_type }}" in
            prerelease) CREATE_TYPE_FLAGS=(--prerelease); EDIT_TYPE_FLAGS=(--prerelease --draft=false) ;;
            draft)      CREATE_TYPE_FLAGS=(--draft);      EDIT_TYPE_FLAGS=(--draft) ;;
            *)          EDIT_TYPE_FLAGS=(--draft=false --prerelease=false) ;;
          esac

          upload_asset_retry() {
            local tag="$1"
            local repo="$2"
            shift 2
            local uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" --repo "$repo" "$@" --clobber; then
                uploaded=true
                break
              fi
              echo "⚠️ 资产上传失败 [尝试 ${attempt}/3]: $*，等待 $((attempt * 5)) 秒后重试..."
              sleep $((attempt * 5))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::资产上传失败，已达最大重试次数: $*"
              return 1
            fi
          }

          if ! gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            # 刻意 --latest=false: 共享多 target 的 packages tag 不应抢占仓库 Latest;
            # 也不传 --target (共享 tag 落默认分支, 见 Publish firmware release 注释)
            gh release create "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --title "Passwall Packages" \
              --notes "Multi-target passwall packages" --latest=false \
              "${CREATE_TYPE_FLAGS[@]}"
          else
            # 已有 Release: 同步本次运行指定的类型 (默认 release 可纠正历史 draft/prerelease)
            gh release edit "$PACKAGE_TAG" --repo "$PACKAGE_REPO" "${EDIT_TYPE_FLAGS[@]}"
          fi
          for file in "${PACKAGE_FILES[@]}"; do
            [ -f "$file" ] || continue
            upload_asset_retry "$PACKAGE_TAG" "$PACKAGE_REPO" "$file"
          done

          # ── 同包多版本收敛: 每个包名保留最近 KEEP_PKG_VERSIONS 版 (含 .sha256) ──
          # 版本号变化 → 文件名不同 → --clobber 不会覆盖, 只会无限累积
          # (packages-ipq807x 曾出现 luci-app-passwall 3 版共存)。按资产 updated_at
          # 排序留最新 N 版; 公钥 (.pem/.pub) 与解析失败的文件永不清; 清理失败只
          # 告警不阻塞发布 (写入方自约束, 与 artifacts keep_versions 同模式)。
          # 保留数由 passwall_keep_versions 输入控制 (validate-inputs 已限 [1,30])。
          KEEP_PKG_VERSIONS="${{ inputs.passwall_keep_versions }}"
          if ! gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --json assets \
            --jq '[.assets[] | select(.name | test("\\.(apk|ipk)$"))]' > /tmp/pkg_assets.json 2>/dev/null; then
            echo "::warning::软件包资产列表获取失败, 跳过版本收敛"
          elif [ -s /tmp/pkg_assets.json ] && [ "$(jq 'length' /tmp/pkg_assets.json)" -gt 0 ]; then
            # 包名提取: apk "pkg-1.2.3-r1.apk" → pkg (去最后两段 ver-rN);
            # ipk "pkg_1.2.3-1_arch.ipk" → pkg (去 _ver-rev_arch 段)。
            # 提取失败 (无版本结构) 归 default 组, 永不清。
            jq -r 'sort_by(.updated_at) | reverse
                   | group_by(.name | sub("-[^-]+-r[0-9]+\\.apk$";"") | sub("_[^_]+-[^-]+_[^.]+\\.ipk$";"") | if . == "" then "default" else . end)
                   | .[] | .[ $KEEP_PKG_VERSIONS : ][] | .name' \
              --argjson KEEP_PKG_VERSIONS "$KEEP_PKG_VERSIONS" /tmp/pkg_assets.json > /tmp/pkg_purge.txt || : > /tmp/pkg_purge.txt
            if [ -s /tmp/pkg_purge.txt ]; then
              echo "ℹ️ 软件包版本收敛: 以下 $(wc -l < /tmp/pkg_purge.txt) 个旧版本将被清理 (每包保留 ${KEEP_PKG_VERSIONS} 版)"
              cat /tmp/pkg_purge.txt
              while IFS= read -r old; do
                [ -n "$old" ] || continue
                gh release delete-asset "$PACKAGE_TAG" "$old" --repo "$PACKAGE_REPO" --yes 2>/dev/null \
                  || echo "::warning::清理 $old 失败 (保留, 下轮重试)"
                # 配套 .sha256 同步清理 (存在才清)
                if gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --json assets \
                  --jq --arg s "${old}.sha256" '[.assets[].name] | index($s) != null' | grep -qx true; then
                  gh release delete-asset "$PACKAGE_TAG" "${old}.sha256" --repo "$PACKAGE_REPO" --yes 2>/dev/null || true
                fi
              done < /tmp/pkg_purge.txt
            else
              echo "ℹ️ 软件包版本收敛: 无需清理 (每包 ≤ ${KEEP_PKG_VERSIONS} 版)"
            fi
          fi

      # ════════ SDK / IB 打包与发布 ════════
      # SDK and IB share one per-target release tag. Their indexes stay separate
      # because the two asset types have different consumers.
      - name: 📦 Package SDK & IB tarballs
        if: success() && inputs.publish_sdk_ib == true
        id: sdk_ib
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 Package SDK & IB tarballs         ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          mkdir -p release/sdk release/ib

          # ── 版本号 (多 tarball 共用; 防御: 必须是纯字符串, 残留 make 表达式则显式报错) ──
          SDK_VERSION="${{ steps.apply_config.outputs.source_version }}"
          SDK_ORIG_VER="${{ steps.apply_config.outputs.patched_version }}"
          IB_VERSION="$SDK_VERSION"
          IB_ORIG_VER="$SDK_ORIG_VER"
          for V in "$SDK_VERSION" "$SDK_ORIG_VER"; do
            case "$V" in
              *'('*) echo "::error::apply_config 版本号含 make 表达式: ${V}"; exit 1 ;;
            esac
          done

          # ── SDK: 收集当前独立 target 的全部 tarball 并统一改名。保留多产物
          # 收集能力，索引仍保持现有消费者契约。──
          SDK_NAMES=""
          declare -A SDK_SEEN
          while IFS= read -r TARBALL; do
            [ -n "$TARBALL" ] || continue
            # 上游产物名: <dist>-sdk-[<version>-]<board>[_gcc-<ver>]<suffix>.<host_os>-<host_arch>.tar.{xz,zst}
            # (target/sdk/Makefile 的 SDK_NAME), 故 find 用 *-sdk-*.tar.* 匹配, 兼容两种压缩格式。
            BASE=$(basename "$TARBALL")
            EXT=$(printf '%s' "$BASE" | sed -E 's/.*\.(tar\..*)$/\1/')
            # 优先剥掉上游文件名里的版本前缀 (CONFIG_VERSION_FILENAMES=y 时含 <version>-;
            # 用 patch 后版本号匹配, 与构建期 VERSION_NUMBER 一致), 否则整体提取 (文件名无版本前缀)
            TAIL=$(printf '%s' "$BASE" | sed -E "s/.*-sdk-${SDK_ORIG_VER}-(.*)\.tar\..*/\1/")
            if [ "$TAIL" = "$BASE" ]; then
              TAIL=$(printf '%s' "$BASE" | sed -E 's/.*-sdk-(.*)\.tar\..*/\1/')
            fi
            NEW_NAME="sdk-${IMMWRT_TARGET}-${SDK_VERSION}-${TAIL}.${EXT}"
            # 去重防御: 上游文件名未提供足够区分信息时追加稳定后缀
            if [ -n "${SDK_SEEN[$NEW_NAME]:-}" ]; then
              EMB=$(printf '%s' "$TAIL" | sed -nE "s/.*${IMMWRT_TARGET}-([A-Za-z0-9]+)[_.].*/\1/p")
              if [ -z "$EMB" ]; then EMB="extra${SDK_SEEN[$NEW_NAME]}"; fi
              NEW_NAME="sdk-${IMMWRT_TARGET}-${SDK_VERSION}-${TAIL}-${EMB}.${EXT}"
            fi
            SDK_SEEN[$NEW_NAME]=$(( ${SDK_SEEN[$NEW_NAME]:-0} + 1 ))
            cp "$TARBALL" "release/sdk/${NEW_NAME}"
            # sha256 统一为 ${NEW_NAME}.sha256 两列标准格式 (hash + 空格 + 文件名),
            # 供消费方 sha256sum -c 校验。复制后重算而非复用上游 .sha256sum:
            # 上游文件名/目录前缀可能与新名不一致, 重算保证内容与上传文件名精确匹配
            (cd release/sdk && sha256sum "$NEW_NAME" > "${NEW_NAME}.sha256")
            SDK_NAMES="${SDK_NAMES}${NEW_NAME}"$'\n'
            echo "✅ SDK: ${NEW_NAME}"
          done < <(find bin/targets -type f \( -name '*-sdk-*.tar.xz' -o -name '*-sdk-*.tar.zst' \) | LC_ALL=C sort)
          if [ -z "$SDK_NAMES" ]; then
            echo "::warning::SDK tarball 未生成 (检查 01-base.seed 中 CONFIG_SDK=y)"
          fi

          # ── IB: 同 SDK 逻辑。上游产物名: <dist>-imagebuilder-[<version>-]<board>[_gcc-<ver>].<host_os>-<host_arch>.tar.{xz,zst} ──
          IB_NAMES=""
          declare -A IB_SEEN
          while IFS= read -r TARBALL; do
            [ -n "$TARBALL" ] || continue
            BASE=$(basename "$TARBALL")
            EXT=$(printf '%s' "$BASE" | sed -E 's/.*\.(tar\..*)$/\1/')
            TAIL=$(printf '%s' "$BASE" | sed -E "s/.*-imagebuilder-${IB_ORIG_VER}-(.*)\.tar\..*/\1/")
            if [ "$TAIL" = "$BASE" ]; then
              TAIL=$(printf '%s' "$BASE" | sed -E 's/.*-imagebuilder-(.*)\.tar\..*/\1/')
            fi
            NEW_NAME="ib-${IMMWRT_TARGET}-${IB_VERSION}-${TAIL}.${EXT}"
            if [ -n "${IB_SEEN[$NEW_NAME]:-}" ]; then
              EMB=$(printf '%s' "$TAIL" | sed -nE "s/.*${IMMWRT_TARGET}-([A-Za-z0-9]+)[_.].*/\1/p")
              if [ -z "$EMB" ]; then EMB="extra${IB_SEEN[$NEW_NAME]}"; fi
              NEW_NAME="ib-${IMMWRT_TARGET}-${IB_VERSION}-${TAIL}-${EMB}.${EXT}"
            fi
            IB_SEEN[$NEW_NAME]=$(( ${IB_SEEN[$NEW_NAME]:-0} + 1 ))
            cp "$TARBALL" "release/ib/${NEW_NAME}"
            # sha256 统一为 ${NEW_NAME}.sha256 两列标准格式 (同 SDK 逻辑, mv 后重算)
            (cd release/ib && sha256sum "$NEW_NAME" > "${NEW_NAME}.sha256")
            IB_NAMES="${IB_NAMES}${NEW_NAME}"$'\n'
            echo "✅ IB:  ${NEW_NAME}"
          done < <(find bin/targets -type f \( -name '*-imagebuilder-*.tar.xz' -o -name '*-imagebuilder-*.tar.zst' \) | LC_ALL=C sort)
          if [ -z "$IB_NAMES" ]; then
            echo "::warning::IB tarball 未生成 (检查 01-base.seed 中 CONFIG_IB=y)"
          fi

          # ── 输出: 换行分隔名单; compile-packages 消费方读取索引 .[$v].file ──
          sdk_primary=$(printf '%s\n' "$SDK_NAMES" | head -1)
          ib_primary=$(printf '%s\n' "$IB_NAMES" | head -1)
          sdk_arch=$(printf '%s' "$sdk_primary" | sed -E "s/^sdk-${IMMWRT_TARGET}-${SDK_VERSION}-(.*)\.tar\..*/\1/")
          ib_arch=$(printf '%s' "$ib_primary" | sed -E "s/^ib-${IMMWRT_TARGET}-${IB_VERSION}-(.*)\.tar\..*/\1/")

          {
            echo "sdk_new_names<<SDK_EOF"
            printf '%s\n' "$SDK_NAMES"
            echo "SDK_EOF"
            echo "sdk_primary=${sdk_primary}"
            echo "sdk_version_key=${SDK_VERSION}"
            echo "sdk_arch=${sdk_arch}"
            echo "ib_new_names<<IB_EOF"
            printf '%s\n' "$IB_NAMES"
            echo "IB_EOF"
            echo "ib_primary=${ib_primary}"
            echo "ib_version_key=${IB_VERSION}"
            echo "ib_arch=${ib_arch}"
          } >> "$GITHUB_OUTPUT"

          # ── SDK/IB 目录结构（深度 1）──
          echo ""
          echo "📂 release/sdk/ + release/ib/ 目录结构 (深度 1):"
          echo '```text'
          if command -v tree &>/dev/null; then
            tree -L 1 release/sdk release/ib 2>/dev/null || { ls -al release/sdk; ls -al release/ib; }
          else
            ls -al release/sdk
            ls -al release/ib
          fi
          echo '```'

      # release 目标未指定 (matrix_artifacts_release_repo/tag 为空) 时 SDK/IB tarball
      # 降级为 CI artifact (retention 7 天) 供手动取回; sdk-index.json/ib-index.json
      # 不维护, compile-packages SDK 增量路径不可用。
      - name: Upload SDK/IB artifact
        # SDK/IB 归档体积大, release 目标未指定时才走 artifact (兜底取回),
        # 可经 upload_artifacts=false 关闭
        if: success() && inputs.upload_artifacts && inputs.publish_sdk_ib == true && (steps.sdk_ib.outputs.sdk_primary != '' || steps.sdk_ib.outputs.ib_primary != '')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-sdk-ib-tarballs
          path: |
            openwrt/release/sdk/*.tar.*
            openwrt/release/ib/*.tar.*
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload SDK to release
        if: success() && inputs.publish_sdk_ib == true && steps.sdk_ib.outputs.sdk_primary != '' && inputs.matrix_artifacts_release_repo != '' && inputs.matrix_artifacts_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.matrix_artifacts_release_tag }}"
          REPO="${{ inputs.matrix_artifacts_release_repo }}"
          # 确保 release 存在; 已存在时同步本次运行指定的发布类型。
          # 注意: draft 会让无权限的公开消费者看不到 SDK/IB, 仅在有意的隔离调试时使用。
          # 刻意: artifacts 共享 tag 不传 --latest/--target — 多版本共存、落默认分支,
          # 真正的版本指针由 sdk-index.json/ib-index.json 承担 (compile-packages 消费)。
          CREATE_TYPE_FLAGS=()
          EDIT_TYPE_FLAGS=()
          case "${{ inputs.release_type }}" in
            prerelease) CREATE_TYPE_FLAGS=(--prerelease); EDIT_TYPE_FLAGS=(--prerelease --draft=false) ;;
            draft)      CREATE_TYPE_FLAGS=(--draft);      EDIT_TYPE_FLAGS=(--draft) ;;
            *)          EDIT_TYPE_FLAGS=(--draft=false --prerelease=false) ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "${TAG} Builds" --notes "Unified SDK and IB builds (${IMMWRT_TARGET})" --latest=false \
              "${CREATE_TYPE_FLAGS[@]}"
          else
            gh release edit "$TAG" --repo "$REPO" "${EDIT_TYPE_FLAGS[@]}"
          fi

          upload_asset_retry() {
            local tag="$1"
            local repo="$2"
            shift 2
            local uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" --repo "$repo" "$@" --clobber; then
                uploaded=true
                break
              fi
              echo "⚠️ 资产上传失败 [尝试 ${attempt}/3]: $*，等待 $((attempt * 5)) 秒后重试..."
              sleep $((attempt * 5))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::资产上传失败，已达最大重试次数: $*"
              return 1
            fi
          }

          # ── 当前 target 的 SDK 全量上传 ──
          CURRENT_NAMES=$(cat <<'SDK_NAMES_EOF'
          ${{ steps.sdk_ib.outputs.sdk_new_names }}
          SDK_NAMES_EOF
          )
          while IFS= read -r SDK_NAME; do
            if [ -z "$SDK_NAME" ]; then continue; fi
            SDK_FILE="openwrt/release/sdk/${SDK_NAME}"
            upload_asset_retry "$TAG" "$REPO" "$SDK_FILE" "${SDK_FILE}.sha256"
            echo "📤 SDK 已上传: ${SDK_NAME}"
          done <<< "$CURRENT_NAMES"

          # ── 更新 sdk-index.json ──
          # 版本键只写主文件; compile-packages 读取 .file, 保持现有索引契约。
          PRIMARY="${{ steps.sdk_ib.outputs.sdk_primary }}"
          SDK_FILE="openwrt/release/sdk/${PRIMARY}"
          SDK_SHA="${SDK_FILE}.sha256"
          SHA256=$(awk '{print $1}' "$SDK_SHA")
          mkdir -p /tmp/sdk_index
          (cd /tmp/sdk_index && gh release download "$TAG" --repo "$REPO" --pattern "sdk-index.json" 2>/dev/null) || echo '{}' > /tmp/sdk_index/sdk-index.json
          jq --arg v "${{ steps.sdk_ib.outputs.sdk_version_key }}" \
             --arg f "$PRIMARY" \
             --arg s "$SHA256" \
             --arg src "${{ steps.clone_packages.outputs.sha_full }}" \
             --arg arch "${{ steps.sdk_ib.outputs.sdk_arch }}" \
             --arg ts "$(TZ=$TZ date -Iseconds)" \
             '.[$v] = {file:$f, sha256:$s, source_sha:$src, arch:$arch, built_at:$ts}' \
             /tmp/sdk_index/sdk-index.json > /tmp/sdk_index/sdk-index_new.json
          # 按 version 号排序 + 保留最近 N 个版本 (健壮比较: 数字段按数值, SNAPSHOT=-1, V<数字> 解析数字)
          KEEP=${{ inputs.matrix_artifacts_keep_versions }}
          jq --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            to_entries | sort_by([.key | splits("[.-]") | vtok]) | .[-$n:] | from_entries
          ' /tmp/sdk_index/sdk-index_new.json > /tmp/sdk_index/sdk-index.json
          upload_asset_retry "$TAG" "$REPO" /tmp/sdk_index/sdk-index.json

          # ── 清理旧版本 tarball: 按产物文件名分组, 每组保留 KEEP 个版本 ──
          # 无法从文件名解析分组时归 default 组。
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E "^sdk-${IMMWRT_TARGET}-.*\.tar\.(xz|zst)$" > /tmp/sdk_files.txt || :
          rm -f /tmp/sdk_group_*.txt
          SDK_GROUP_LIST=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            group=$(printf '%s\n' "$f" | sed -nE "s/.*${IMMWRT_TARGET}-([A-Za-z0-9]+)[_.].*/\1/p" | tail -1)
            if [ -z "$group" ]; then group=default; fi
            group_file="/tmp/sdk_group_${group}.txt"
            if [ ! -f "$group_file" ]; then SDK_GROUP_LIST="${SDK_GROUP_LIST}${group}"$'\n'; fi
            printf '%s\n' "$f" >> "$group_file"
          done < /tmp/sdk_files.txt
          while IFS= read -r group; do
            if [ -z "$group" ]; then continue; fi
            group_file="/tmp/sdk_group_${group}.txt"
            KEEP_HEAD=$(jq -Rsr --argjson n "$KEEP" '
              def vtok: if test("^[0-9]+$") then tonumber
                        elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                        elif . == "SNAPSHOT" then -1 else 0 end;
              split("\n") | map(select(length > 0))
              | sort_by([splits("[._-]") | vtok]) | .[-$n:][]
            ' "$group_file")
            while IFS= read -r f; do
              if [ -z "$f" ]; then continue; fi
              if printf '%s\n' "$CURRENT_NAMES" | grep -qxF "$f"; then
                echo "  (保留本次上传: $f)"
              elif printf '%s\n' "$KEEP_HEAD" | grep -qxF "$f"; then
                echo "  (保留: $f)"
              else
                echo "🗑️ 删除旧版本: $f"
                gh release delete-asset "$TAG" --repo "$REPO" "$f" --yes || echo "  ⚠️ 删除失败: $f"
                if gh release delete-asset "$TAG" --repo "$REPO" "$f.sha256" --yes 2>/dev/null; then
                  echo "  🧹 已同步删除 ${f}.sha256"
                else
                  echo "  (无 ${f}.sha256 伴生文件)"
                fi
              fi
            done < "$group_file"
          done <<< "$SDK_GROUP_LIST"

      - name: Upload IB to release
        if: success() && inputs.publish_sdk_ib == true && steps.sdk_ib.outputs.ib_primary != '' && inputs.matrix_artifacts_release_repo != '' && inputs.matrix_artifacts_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.matrix_artifacts_release_tag }}"
          REPO="${{ inputs.matrix_artifacts_release_repo }}"
          # 与 SDK 同一 artifacts tag, 类型同步 (draft 对公开消费者不可见)
          CREATE_TYPE_FLAGS=()
          EDIT_TYPE_FLAGS=()
          case "${{ inputs.release_type }}" in
            prerelease) CREATE_TYPE_FLAGS=(--prerelease); EDIT_TYPE_FLAGS=(--prerelease --draft=false) ;;
            draft)      CREATE_TYPE_FLAGS=(--draft);      EDIT_TYPE_FLAGS=(--draft) ;;
            *)          EDIT_TYPE_FLAGS=(--draft=false --prerelease=false) ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "${TAG} Builds" --notes "Unified SDK and IB builds (${IMMWRT_TARGET})" --latest=false \
              "${CREATE_TYPE_FLAGS[@]}"
          else
            gh release edit "$TAG" --repo "$REPO" "${EDIT_TYPE_FLAGS[@]}"
          fi

          upload_asset_retry() {
            local tag="$1"
            local repo="$2"
            shift 2
            local uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" --repo "$repo" "$@" --clobber; then
                uploaded=true
                break
              fi
              echo "⚠️ 资产上传失败 [尝试 ${attempt}/3]: $*，等待 $((attempt * 5)) 秒后重试..."
              sleep $((attempt * 5))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::资产上传失败，已达最大重试次数: $*"
              return 1
            fi
          }

          # ── 当前 target 的 IB 全量上传 ──
          CURRENT_NAMES=$(cat <<'IB_NAMES_EOF'
          ${{ steps.sdk_ib.outputs.ib_new_names }}
          IB_NAMES_EOF
          )
          while IFS= read -r IB_NAME; do
            if [ -z "$IB_NAME" ]; then continue; fi
            IB_FILE="openwrt/release/ib/${IB_NAME}"
            upload_asset_retry "$TAG" "$REPO" "$IB_FILE" "${IB_FILE}.sha256"
            echo "📤 IB 已上传: ${IB_NAME}"
          done <<< "$CURRENT_NAMES"

          # ── 更新 ib-index.json ──
          # 与 SDK 相同: 版本索引只记录主文件。
          PRIMARY="${{ steps.sdk_ib.outputs.ib_primary }}"
          IB_FILE="openwrt/release/ib/${PRIMARY}"
          IB_SHA="${IB_FILE}.sha256"
          SHA256=$(awk '{print $1}' "$IB_SHA")
          mkdir -p /tmp/ib_index
          (cd /tmp/ib_index && gh release download "$TAG" --repo "$REPO" --pattern "ib-index.json" 2>/dev/null) || echo '{}' > /tmp/ib_index/ib-index.json
          jq --arg v "${{ steps.sdk_ib.outputs.ib_version_key }}" \
             --arg f "$PRIMARY" \
             --arg s "$SHA256" \
             --arg src "${{ steps.clone_packages.outputs.sha_full }}" \
             --arg arch "${{ steps.sdk_ib.outputs.ib_arch }}" \
             --arg ts "$(TZ=$TZ date -Iseconds)" \
             '.[$v] = {file:$f, sha256:$s, source_sha:$src, arch:$arch, built_at:$ts}' \
             /tmp/ib_index/ib-index.json > /tmp/ib_index/ib-index_new.json
          KEEP=${{ inputs.matrix_artifacts_keep_versions }}
          jq --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            to_entries | sort_by([.key | splits("[.-]") | vtok]) | .[-$n:] | from_entries
          ' /tmp/ib_index/ib-index_new.json > /tmp/ib_index/ib-index.json
          upload_asset_retry "$TAG" "$REPO" /tmp/ib_index/ib-index.json

          # ── 清理旧版本 tarball: 按产物文件名分组, 每组保留 KEEP 个版本 ──
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E "^ib-${IMMWRT_TARGET}-.*\.tar\.(xz|zst)$" > /tmp/ib_files.txt || :
          rm -f /tmp/ib_group_*.txt
          IB_GROUP_LIST=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            group=$(printf '%s\n' "$f" | sed -nE "s/.*${IMMWRT_TARGET}-([A-Za-z0-9]+)[_.].*/\1/p" | tail -1)
            if [ -z "$group" ]; then group=default; fi
            group_file="/tmp/ib_group_${group}.txt"
            if [ ! -f "$group_file" ]; then IB_GROUP_LIST="${IB_GROUP_LIST}${group}"$'\n'; fi
            printf '%s\n' "$f" >> "$group_file"
          done < /tmp/ib_files.txt
          while IFS= read -r group; do
            if [ -z "$group" ]; then continue; fi
            group_file="/tmp/ib_group_${group}.txt"
            KEEP_HEAD=$(jq -Rsr --argjson n "$KEEP" '
              def vtok: if test("^[0-9]+$") then tonumber
                        elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                        elif . == "SNAPSHOT" then -1 else 0 end;
              split("\n") | map(select(length > 0))
              | sort_by([splits("[._-]") | vtok]) | .[-$n:][]
            ' "$group_file")
            while IFS= read -r f; do
              if [ -z "$f" ]; then continue; fi
              if printf '%s\n' "$CURRENT_NAMES" | grep -qxF "$f"; then
                echo "  (保留本次上传: $f)"
              elif printf '%s\n' "$KEEP_HEAD" | grep -qxF "$f"; then
                echo "  (保留: $f)"
              else
                echo "🗑️ 删除旧版本: $f"
                gh release delete-asset "$TAG" --repo "$REPO" "$f" --yes || echo "  ⚠️ 删除失败: $f"
                if gh release delete-asset "$TAG" --repo "$REPO" "$f.sha256" --yes 2>/dev/null; then
                  echo "  🧹 已同步删除 ${f}.sha256"
                else
                  echo "  (无 ${f}.sha256 伴生文件)"
                fi
              fi
            done < "$group_file"
          done <<< "$IB_GROUP_LIST"

      - name: Upload published state
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-published-state
          path: build-info.json
          retention-days: 7

      # ───────── 产物与去向 (外部 caller 视角: 产物在哪、怎么下载核验) ─────────
      # 刻意设计: summary 采集是增强功能, continue-on-error + gh 查询失败降级
      # 文案, 绝不阻断构建。发布状态以远端 Release 实际查询为准 (发布步骤
      # 成功与否的权威视图), 查询失败显示「状态未知」并 warning。
      - name: 📦 Deliverables
        id: deliverables
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          release_line() {
            local repo="$1" tag="$2" label="$3"
            [ -n "$repo" ] || return 0
            local json url assets
            if json=$(gh release view "$tag" --repo "$repo" --json url,assets 2>/dev/null); then
              url=$(printf '%s' "$json" | jq -r '.url // empty')
              assets=$(printf '%s' "$json" | jq -r '.assets | length')
              echo "| ${label} | [${tag}](${url}) (${assets} 个资产) |"
            else
              echo "::warning title=deliverables::查询 ${label} Release 失败 (${repo}@${tag}), 显示状态未知"
              echo "| ${label} | 状态未知 (\`${repo}\` @ \`${tag}\`) |"
            fi
          }

          FIRMWARE_TAG="${{ env.RESOLVED_VERSION }}"
          [ -n "${{ inputs.matrix_firmware_release_tag_prefix }}" ] && FIRMWARE_TAG="${{ inputs.matrix_firmware_release_tag_prefix }}-${{ env.RESOLVED_VERSION }}"
          SIGN_MODE="${{ steps.signing_key.outputs.sign_mode || 'none' }}"

          {
            echo ""
            echo "## 📦 产物与去向"
            echo ""
            echo "| 产物 | 去向 |"
            echo "|---|---|"
            release_line "${{ inputs.matrix_release_repo }}" "$FIRMWARE_TAG" "固件 Release"
            release_line "${{ inputs.matrix_passwall_repo }}" "${{ inputs.matrix_passwall_tag }}" "Passwall 包 Release"
            release_line "${{ inputs.matrix_artifacts_release_repo }}" "${{ inputs.matrix_artifacts_release_tag }}" "SDK / IB Release"
            if [ -z "${{ inputs.matrix_release_repo }}" ]; then
              echo "| 固件 | 仅 CI artifact \`${IMMWRT_TARGET}-release\` (7 天, 未配置 release 目标) |"
            fi
            echo "| 构建元数据 | \`${IMMWRT_TARGET}-published-state\` artifact + Release 附带 \`build-info.json\` |"
            if [ "${{ inputs.upload_build_log }}" = "true" ]; then
              echo "| 构建日志 | \`${IMMWRT_TARGET}-build-log\` artifact (分包日志 + check-* 判定输出) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ── 下载/核验指引 (发布成功才有核验对象) ──
          if [ -n "${{ inputs.matrix_release_repo }}" ] && gh release view "$FIRMWARE_TAG" --repo "${{ inputs.matrix_release_repo }}" >/dev/null 2>&1; then
            {
              echo ""
              echo "> 🔽 固件下载: 上表固件 Release 页资产; 校验: 同目录 \`sha256sums\`"
              if [ "$SIGN_MODE" = "usign" ]; then
                echo "> 🔐 签名核验: \`usign -V -P solarflows-usign-public.pub -m sha256sums\` (公钥随 Passwall Packages Release 发布)"
              elif [ "$SIGN_MODE" = "apk" ]; then
                echo "> 🔐 APK 签名公钥: \`solarflows-apk-public.pem\` (随 Passwall Packages Release 发布)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📝 Annotations
        if: always()
        continue-on-error: true
        run: |
          ANNOTATIONS_FILE="${GITHUB_WORKSPACE}/.ci-annotations.md"
          note() {
            printf '%s\n' "$1" >> "$ANNOTATIONS_FILE"
          }
          # 缓存注记: smart 与 clean_cache 下 restore/save/purge 均有活动, 无条件收集
          if [ "${{ steps.cache-tc-restore.outcome || 'skipped' }}" = "failure" ]; then
            note '- 工具链缓存恢复失败，已继续构建。'
          fi
          if [ "${{ steps.cache-cc.outcome || 'skipped' }}" = "failure" ]; then
            note '- ccache 快照恢复失败，已继续构建。'
          fi
          if [ "${{ steps.cache-tc-save.outcome || 'skipped' }}" = "failure" ]; then
            note '- 工具链缓存保存失败，本次固件产物仍可用。'
          fi
          if [ "${{ steps.cache-cc-save.outcome || 'skipped' }}" = "failure" ]; then
            note '- ccache 快照保存失败，本次固件产物仍可用。'
          fi
          if [ "${{ steps.cache-sdk-hostpkg-save.outcome || 'skipped' }}" = "failure" ]; then
            note '- SDK host/tool 快照保存失败，本次固件产物仍可用。'
          fi
          if [ "${{ steps.cache-tc-purge.outcome || 'skipped' }}" = "failure" ]; then
            note '- 工具链缓存清理步骤失败，旧快照已保留。'
          fi
          if [ "${{ steps.cache-cc-purge.outcome || 'skipped' }}" = "failure" ]; then
            note '- ccache 快照清理步骤失败，旧快照已保留。'
          fi
          if [ "${{ steps.cache-hostpkg-purge.outcome || 'skipped' }}" = "failure" ]; then
            note '- SDK hostpkg 快照清理步骤失败，旧快照已保留。'
          fi
          if [ "${{ steps.build.outputs.ccache_wrapper_valid || 'false' }}" != "true" ] && [ "${{ steps.build.outcome || 'skipped' }}" = "success" ]; then
            note '- ccache 包装器校验未通过，未保存 full ccache 快照。'
          fi
          {
            echo ""
            echo "## Annotations"
            if [ -s "$ANNOTATIONS_FILE" ]; then
              cat "$ANNOTATIONS_FILE"
            else
              echo "无非阻断问题。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
