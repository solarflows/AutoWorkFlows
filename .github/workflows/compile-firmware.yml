# Reusable workflow: compile-firmware
# 全量编译 ImmortalWrt 固件 + 产出 SDK / ImageBuilder tarball 上传到 Release
# 由 firmware-build.yml (plan job) 调用，workflow_call 触发
name: Compile Firmware

on:
  workflow_call:
    inputs:
      # ── 矩阵 target 完整描述（已经合并 defaults 后的对象）──
      matrix_target:        { required: true, type: string }
      matrix_repo:          { required: true, type: string }
      matrix_ref:           { required: true, type: string }
      matrix_config:       { required: true, type: string }
      matrix_packages_branch: { required: true, type: string }
      matrix_release_repo:  { required: true, type: string }
      matrix_passwall_repo: { required: true, type: string }
      matrix_passwall_tag:  { required: true, type: string }
      matrix_apk_signing:   { required: true, type: boolean }
      matrix_sdk_release_repo: { required: true, type: string }
      matrix_sdk_release_tag:  { required: true, type: string }
      matrix_ib_release_repo:  { required: true, type: string }
      matrix_ib_release_tag:   { required: true, type: string }
      matrix_ib_keep_versions: { required: true, type: number  }
      matrix_sdk_keep_versions: { required: false, type: number, default: 7 }
      matrix_ib_profile:       { required: false, type: string, default: '' }
      # ── 默认值（workflow 内置;调用方不传则用这里,见 firmware_builder_v2 env）──
      defaults_repo:        { required: false, type: string, default: 'solarflows/AutoWorkflows' }
      packages_feed_repo:   { required: false, type: string, default: 'solarflows/openwrt-packages' }
      packages_feed_name:   { required: false, type: string, default: 'solarflows' }
      # ── 全局上下文 ──
      version:              { required: true, type: string }
      sdk_version:          { required: true, type: string }
      ib_version:           { required: true, type: string }
      cache_strategy:       { required: false, type: string, default: 'smart' }
      free_disk_space:      { required: false, type: boolean, default: false }
      publish_sdk_ib:       { required: false, type: boolean, default: true }
    secrets:
      ACCESS_TOKEN:         { required: true }
      APK_BUILD_KEY:        { required: false }

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile-firmware:
    name: Compile ${{ inputs.matrix_target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    concurrency:
      group: packages-release-${{ inputs.matrix_passwall_repo }}-${{ inputs.matrix_passwall_tag }}
      cancel-in-progress: false
    env:
      # 刻意不叫 TARGET/HOST/ARCH: 这些名字会被 autoconf AX_ENABLE_BUILDDIR 等宏读取,
      # 导致 configure 把 build 树建到 ./$TARGET/ 而非 ./$host/ (libffi 因此 InstallDev 失败)
      IMMWRT_TARGET: ${{ inputs.matrix_target }}
    steps:
      - name: Checkout defaults repo (AutoWorkflows)
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.defaults_repo }}
          path: AutoWorkFlows

      - name: Checkout Source Repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.matrix_repo }}
          ref: ${{ inputs.matrix_ref }}
          path: openwrt
          fetch-depth: 1

      - name: Get source & clone packages
        id: clone_packages
        run: |
          cd openwrt
          SHA=$(git rev-parse --short HEAD)
          SHA_FULL=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "sha_full=${SHA_FULL}" >> $GITHUB_OUTPUT

          git clone --depth 1 https://github.com/${{ inputs.packages_feed_repo }}.git package/${{ inputs.packages_feed_name }} -b ${{ inputs.matrix_packages_branch }}
          PKG_SHA=$(git -C package/${{ inputs.packages_feed_name }} rev-parse --short HEAD)
          PKG_SHA_FULL=$(git -C package/${{ inputs.packages_feed_name }} rev-parse HEAD)
          echo "packages_sha=${PKG_SHA}" >> $GITHUB_OUTPUT
          echo "packages_sha_full=${PKG_SHA_FULL}" >> $GITHUB_OUTPUT

      # ───────── 磁盘空间监控（第 1 阶段：初始状态）─────────
      # 刻意设计: 4 阶段磁盘监控用于诊断空间不足/缓存膨胀, 数据写入 outputs 供最后汇总表
      - name: 💽 Disk space · Initial
        id: disk-1
        run: |
          echo "📊 初始磁盘空间（克隆后，环境准备前）"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "📊 openwrt/ : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"

      - name: Compute toolchain hash
        id: toolchain_hash
        run: |
          HASH=$(git -C openwrt log --pretty=tformat:"%h" -n1 tools toolchain 2>/dev/null || echo "unknown")
          CACHE_STRATEGY="${{ inputs.cache_strategy }}"
          if [ "$CACHE_STRATEGY" = "clean-all" ] || [ "$CACHE_STRATEGY" = "clean-toolchain" ]; then
            HASH="force-${HASH}"
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Prepare Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -y purge firefox 2>/dev/null || true
          sudo -E apt update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      # ───────── 磁盘空间监控（第 2 阶段：环境准备后）─────────
      - name: 💽 Disk space · After env prep
        id: disk-2
        run: |
          echo "📊 环境准备后磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"

      - name: Free Disk Space
        if: inputs.free_disk_space == true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # ───────── 工具链缓存恢复（独立 restore, 仅非 clean 模式）─────────
      # 刻意设计: 拆为独立 restore + save(见 Purge 前) 而非一体式 actions/cache@v5。
      # clean-toolchain/clean-all 时跳过 restore(不下载旧缓存), 实现真正的刷新。
      # save 仅构建成功时触发(if: success()), 避免失败半成品污染缓存 key。
      - name: Restore toolchain cache
        id: cache-tc-restore
        if: inputs.cache_strategy != 'no-cache' && inputs.cache_strategy != 'clean-all' && inputs.cache_strategy != 'clean-toolchain'
        uses: actions/cache/restore@v5
        with:
          key: immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-${{ steps.toolchain_hash.outputs.hash }}
          restore-keys: |
            immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      - name: Restore ccache
        if: inputs.cache_strategy != 'no-cache'
        id: cache-cc
        uses: actions/cache/restore@v5
        with:
          key: immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          restore-keys: |
            immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-
          path: openwrt/.ccache

      # ───────── 缓存恢复与状态上报 ─────────
      # 刻意设计: 诊断性质步骤(v1 遗产), 缓存恢复失败不应阻塞后续构建,
      # 故 continue-on-error: true, 由 ccache Stats 步骤做指标报告
      - name: Verify & report cache status
        if: inputs.cache_strategy != 'no-cache'
        id: cache-refresh
        continue-on-error: true
        run: |
          CACHE_STRATEGY="${{ inputs.cache_strategy }}"
          # clean-toolchain 模式: restore 已跳过(见上一步), 无需 rm -rf
          if [ "$CACHE_STRATEGY" = "clean-all" ] || [ "$CACHE_STRATEGY" = "clean-ccache" ]; then
            command -v ccache &>/dev/null && ccache -C 2>/dev/null || true
            rm -rf openwrt/.ccache 2>/dev/null || true
          fi

          TOOLCHAIN_RESTORED=false
          if [ "$CACHE_STRATEGY" != "clean-all" ] && [ "$CACHE_STRATEGY" != "clean-toolchain" ] \
             && [ -d openwrt/staging_dir ] \
             && [ "$(find openwrt/staging_dir -type d -name stamp -not -path '*target*' 2>/dev/null | head -1)" ]; then
            find openwrt/staging_dir -type d -name stamp -not -path '*target*' 2>/dev/null | while read -r d; do
              find "$d" -type f -exec touch {} +
            done
            if [ -x openwrt/staging_dir/host/bin/ccache ]; then
              for cmd in gcc g++ cc c++; do
                ln -sf ccache "openwrt/staging_dir/host/bin/$cmd" 2>/dev/null || true
              done
            fi
            mkdir -p openwrt/tmp && echo "1" > openwrt/tmp/.build
            TOOLCHAIN_RESTORED=true
          fi
          echo "toolchain_restored=${TOOLCHAIN_RESTORED}" >> $GITHUB_OUTPUT
          echo "toolchain_exact=${{ steps.cache-tc-restore.outputs.cache-hit || 'false' }}" >> $GITHUB_OUTPUT

          CCACHE_RESTORED=false
          if [ "$CACHE_STRATEGY" != "clean-all" ] && [ "$CACHE_STRATEGY" != "clean-ccache" ] \
             && [ -d openwrt/.ccache ] \
             && [ "$(find openwrt/.ccache -type f 2>/dev/null | head -1)" ]; then
            CCACHE_RESTORED=true
          fi
          echo "ccache_restored=${CCACHE_RESTORED}" >> $GITHUB_OUTPUT

      - name: Setup APK Signing Key
        if: inputs.matrix_apk_signing == true
        id: signing_key
        env:
          APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APK_BUILD_KEY" ]; then
            echo "::warning::APK_BUILD_KEY secret 未设置 — 构建系统将生成随机密钥, 设备 apk add 需 --allow-untrusted"
            echo "fingerprint=none" >> $GITHUB_OUTPUT
            exit 0
          fi
          printf '%s' "$APK_BUILD_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > openwrt/private-key.pem
          chmod 600 openwrt/private-key.pem
          sed -i 's/\r$//' openwrt/private-key.pem
          echo "📏 密钥文件: $(wc -c < openwrt/private-key.pem) 字节"

          # ── 私钥格式校验 (恢复 v1): 无效密钥在专门步骤明确报错 ──
          # 刻意设计: 校验失败时输出 ::error:: 但**不退出构建** (通过 if 分支规避 set -e)。
          # 跳过签名让工具链/ccache 缓存正常生成, 修复密钥后下次直接增量构建; 产物标记未签名。
          echo "🔍 验证密钥格式..."
          if openssl ec -in openwrt/private-key.pem -check -noout 2>/dev/null; then
            echo "✅ ECDSA 私钥格式验证通过"
          elif openssl rsa -in openwrt/private-key.pem -check -noout 2>/dev/null; then
            echo "::warning::APK_BUILD_KEY 是 RSA 密钥, ImmortalWrt APK 构建系统默认使用 ECDSA prime256v1"
            echo "::warning::APK 本身支持 RSA, 但若构建系统依赖 ecparam 自动派生公钥则会失败"
            echo "::notice::建议重新生成 ECDSA 密钥: openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
          else
            KEY_HEADER=$(head -c 50 openwrt/private-key.pem 2>/dev/null)
            echo "::error::APK_BUILD_KEY 不是有效的 PEM 格式私钥 (需要 ECDSA prime256v1 或 RSA)"
            echo "::notice::密钥头部: ${KEY_HEADER}"
            echo "::notice::生成 ECDSA 密钥: openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            echo "::notice::本次构建将跳过签名 (产物未签名), 但构建继续以生成工具链/ccache 缓存"
            rm -f openwrt/private-key.pem
            echo "fingerprint=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 派生公钥 (构建系统通过 package/base-files 安装到 /etc/apk/keys/)
          openssl ec -in openwrt/private-key.pem -pubout -out openwrt/public-key.pem 2>/dev/null || \
            openssl rsa -in openwrt/private-key.pem -pubout -out openwrt/public-key.pem
          chmod 644 openwrt/public-key.pem
          echo "✅ 公钥已派生 → openwrt/public-key.pem"
          FP=$(openssl sha256 < openwrt/public-key.pem | awk '{print $NF}')
          echo "fingerprint=${FP}" >> $GITHUB_OUTPUT
          echo "🔑 APK 签名密钥已注入 (公钥 SHA256: ${FP:0:16}...)"

      # ───────── 更新 feeds（源码 + 软件包索引）─────────
      - name: Update Feeds & Packages
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a

          # ── 目录树: 各 feed 是否已 install (排除 .git/中间产物) ──
          # 可选诊断展示: 管道失败(如 head 截断触发 SIGPIPE)不阻断构建
          echo ""
          echo "📂 openwrt/package/ 目录树 (feeds install 后):"
          echo '```text'
          find package -maxdepth 3 \
            -not -path '*/.git/*' -not -path '*/staging_dir*' -not -path '*/build_dir*' \
            -print 2>/dev/null | sort | sed 's|^package|.|' | head -80 || true
          echo '```'

      - name: Apply Configuration
        id: apply_config
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  ⚙️ Apply Configuration               ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          SEED_DIR="../AutoWorkFlows/openwrt-configs/immortalwrt/${{ inputs.matrix_config }}"
          echo "📄 合并种子配置: $SEED_DIR"
          find "$SEED_DIR" -type f -name '*.seed' | sort | while read -r f; do
            echo "  + $(basename "$f")" >&2
            if [ ! -s "$f" ]; then
              echo "    ⚠️ 跳过空文件" >&2
              continue
            fi
            cat "$f"
            [ -z "$(tail -c1 "$f")" ] || echo
            true
          done > .config
          sed -i 's/\r$//; s/\xef\xbb\xbf//g' .config
          echo "✅ 已生成 .config ($(wc -l < .config) 行)"
          echo "📋 ======== 种子配置 (.config) ========"
          cat .config
          echo "🔧 运行 make defconfig (超时 5 分钟)..."
          timeout 300 make defconfig || {
            echo "❌ make defconfig 超时或失败，请检查 .config 语法"
            exit 1
          }
          echo "📋 ======== defconfig 后 .config ========"
          cat .config

          # ── 原始版本号 (patch 前), 用作 SDK/IB tarball 版本标识 ──
          # 陷阱: 不能直接 grep/cut version.mk —— 上游 version.mk 的 VERSION_NUMBER
          # 可能是 make 表达式 (如 $(call qstrip,$(CONFIG_VERSION_NUMBER))), 直接截取
          # 会把表达式当版本号注入后续 shell 脚本 / index.json, 导致 command not
          # found (exit 127)。(见 docs/openwrt-build-pitfalls.md § Make 表达式版本号)
          # 解析顺序: ① .config 的 CONFIG_VERSION_NUMBER (纯字符串)
          #         ② version.mk 首行字面量 (无 $ 表达式)
          #         ③ $(if ...,...,<fallback>) 的兜底字面量 (如 21.02-SNAPSHOT)
          #         ④ 兜底 SNAPSHOT
          VERSION="${{ inputs.version }}"
          ORIG_VER=$(grep -m1 '^CONFIG_VERSION_NUMBER=' .config 2>/dev/null | cut -d'"' -f2 | tr -d '[:space:]' || true)
          if [ -z "$ORIG_VER" ]; then
            LITERAL=$(sed -n 's/^VERSION_NUMBER:=//p' include/version.mk | head -1 | tr -d '[:space:]')
            case "$LITERAL" in
              \$*|*'$('*) ;;                    # make 表达式 → 跳过
              *) ORIG_VER="$LITERAL" ;;
            esac
          fi
          if [ -z "$ORIG_VER" ]; then
            # $(if $(VERSION_NUMBER),$(VERSION_NUMBER),<fallback>) → 取兜底字面量
            FALLBACK=$(sed -n 's/^VERSION_NUMBER:=//p' include/version.mk | sed -n '2p' \
              | sed -E 's/.*,[[:space:]]*([^,()]*)\)[[:space:]]*$/\1/' | tr -d '[:space:]')
            case "$FALLBACK" in
              \$*|*'$('*) ;;                    # 仍是表达式 → 兜底 SNAPSHOT
              *) ORIG_VER="$FALLBACK" ;;
            esac
          fi
          ORIG_VER="${ORIG_VER:-SNAPSHOT}"

          if echo "$ORIG_VER" | grep -qi 'snapshot'; then
            SOURCE_VER="${ORIG_VER}-$(TZ=$TZ date +'%Y%m%d')"
          else
            SOURCE_VER="$ORIG_VER"
          fi
          # patch 后生效版本号 (与下方 version.mk sed 相同变换): 上游 SDK/IB 文件名
          # 由本次构建生成, 内嵌的 <version>- 前缀是 patch 后的值, 需用它匹配剥离
          PATCHED_VER=$(printf '%s' "$ORIG_VER" | sed "s/SNAPSHOT/${VERSION}/g")
          echo "source_version=${SOURCE_VER}" >> $GITHUB_OUTPUT
          echo "original_version=${ORIG_VER}" >> $GITHUB_OUTPUT
          echo "patched_version=${PATCHED_VER}" >> $GITHUB_OUTPUT
          echo "🏷️ source_version: ${SOURCE_VER} | original: ${ORIG_VER} | patched: ${PATCHED_VER}"

          sed -i "/^VERSION_NUMBER:=/s/SNAPSHOT/${VERSION}/g" include/version.mk
          echo "📋 version.mk:"
          grep 'VERSION_NUMBER' include/version.mk || true
          sed -i 's/^IMG_PREFIX_VERNUM:=.*/IMG_PREFIX_VERNUM:=$(call sanitize,$(VERSION_NUMBER))-/' include/image.mk
          echo "📋 image.mk IMG_PREFIX_VERNUM:"
          grep 'IMG_PREFIX_VERNUM' include/image.mk || true

      # ───────── 下载源码包（dl/ 目录）─────────
      # 刻意设计: 并行下载失败时降级单线程重试; 清理 <1KB 的残缺文件(下载失败残留)
      - name: 📥 Download Source Packages
        run: |
          cd openwrt
          export CURL_OPTIONS="--connect-timeout 10 --retry 1 --max-time 180"
          timeout 1800 make download -j$(nproc) || {
            echo "⚠️ make download 并行失败,重试单线程..."
            timeout 3600 make download -j1 || { echo "❌ make download 彻底失败"; exit 1; }
          }
          find dl -size -1024c -print -exec rm -f {} \; 2>/dev/null || true

          # ── dl/ 用统计而非树: 文件上千, 展开无意义 ──
          echo ""
          echo "📂 dl/ 下载缓存: $(find dl -type f 2>/dev/null | wc -l) 个文件, $(du -sh dl 2>/dev/null | cut -f1 || echo N/A)"

      # ───────── 磁盘空间监控（第 3 阶段：编译前）─────────
      - name: 💽 Disk space · Before build
        id: disk-3
        run: |
          echo "📊 编译前磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "  📂 openwrt/        : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ staging_dir/  : $(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ .ccache/      : $(du -sh openwrt/.ccache 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ dl/           : $(du -sh openwrt/dl 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    └─ build_dir/    : $(du -sh openwrt/build_dir 2>/dev/null | cut -f1 || echo 'N/A')"

      - name: 🔨 5. Build Firmware
        id: build
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  🔨 5. Build Firmware                ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          export CCACHE_DIR="$(pwd)/.ccache"
          ccache --max-size 10G
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=sloppiness=file_stat_matches,include_file_mtime,include_file_ctime,time_macros
          if [ "${{ inputs.cache_strategy }}" != "no-cache" ]; then
            export CC="ccache gcc"
            export CXX="ccache g++"
          else
            echo "🔧 no-cache 模式: 不使用 ccache 包装编译 (CONFIG_CCACHE 仍由 seed 控制)"
          fi
          MAKE_EXIT=1
          echo "make_exit=${MAKE_EXIT}" >> $GITHUB_OUTPUT
          START_TIME=$(date +%s)
          set +o pipefail
          # BUILD_LOG=1: 显式声明每包详细日志 (logs/<pkg>/*.txt), 不依赖 .config 的 CONFIG_BUILD_LOG
          make BUILD_LOG=1 -j$(($(nproc) + 1)) -k 2>&1 | tee build.log
          MAKE_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          END_TIME=$(date +%s)
          echo "make_exit=${MAKE_EXIT}" >> $GITHUB_OUTPUT
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "⏱️ 本步骤耗时: $(printf '%dh %dm %ds' $(((END_TIME-START_TIME)/3600)) $((((END_TIME-START_TIME)%3600)/60)) $(((END_TIME-START_TIME)%60)))"

          # ── 目录树: 编译核心产物 bin/targets + bin/packages ──
          # 可选诊断展示: 管道失败(如 head 截断触发 SIGPIPE)不阻断构建
          echo ""
          echo "📂 bin/ 产物目录树 (编译后):"
          echo '```text'
          find bin -maxdepth 5 \
            -not -path '*/staging_dir*' -not -path '*/build_dir*' -not -path '*/tmp*' -not -path '*/.git/*' \
            -print 2>/dev/null | sort | sed 's|^bin|.|' | head -120 || true
          echo '```'

      # ───────── 磁盘空间监控（第 4 阶段：编译后 + 4 阶段汇总表）─────────
      - name: 💽 Disk space · After build
        if: always()
        id: disk-4
        run: |
          echo "📊 编译后磁盘空间"
          df -h / | awk 'NR==1{print} NR==2{print}'
          TOTAL_KB=$(df --output=size / | tail -1)
          TOTAL_GB=$((TOTAL_KB / 1024 / 1024))
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          USED_GB=$((TOTAL_GB - AVAIL_GB))
          USED_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
          echo "total_gb=${TOTAL_GB}" >> $GITHUB_OUTPUT
          echo "used_gb=${USED_GB}" >> $GITHUB_OUTPUT
          echo "avail_gb=${AVAIL_GB}" >> $GITHUB_OUTPUT
          echo "used_pct=${USED_PCT}" >> $GITHUB_OUTPUT
          echo "📊 总容量: ${TOTAL_GB}G | 已用: ${USED_GB}G (${USED_PCT}%) | 可用: ${AVAIL_GB}G"
          echo "  📂 openwrt/        : $(du -sh openwrt 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ staging_dir/  : $(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ .ccache/      : $(du -sh openwrt/.ccache 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    ├─ dl/           : $(du -sh openwrt/dl 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "    └─ build_dir/    : $(du -sh openwrt/build_dir 2>/dev/null | cut -f1 || echo 'N/A')"

          # ── 计算各阶段空间消耗差值 ──
          D1_USED=${{ steps.disk-1.outputs.used_gb || 0 }}
          D2_USED=${{ steps.disk-2.outputs.used_gb || 0 }}
          D3_USED=${{ steps.disk-3.outputs.used_gb || 0 }}
          D4_USED=${USED_GB}
          DELTA_1_2=$((D2_USED - D1_USED))
          DELTA_2_3=$((D3_USED - D2_USED))
          DELTA_3_4=$((D4_USED - D3_USED))
          fmt_delta() { local d=$1; if [ "$d" -ge 0 ]; then echo "+${d}G"; else echo "${d}G"; fi; }

          {
            echo ""
            echo "### 💽 磁盘空间变化"
            echo "| 阶段 | 总容量 | 已用 | 已用% | 阶段消耗 |"
            echo "|------|--------|------|-------|----------|"
            echo "| ① 初始 | ${TOTAL_GB}G | ${D1_USED}G | ${{ steps.disk-1.outputs.used_pct || 'N/A' }}% | — |"
            echo "| ② 环境准备后 | ${TOTAL_GB}G | ${D2_USED}G | ${{ steps.disk-2.outputs.used_pct || 'N/A' }}% | $(fmt_delta $DELTA_1_2) |"
            echo "| ③ 编译前 | ${TOTAL_GB}G | ${D3_USED}G | ${{ steps.disk-3.outputs.used_pct || 'N/A' }}% | $(fmt_delta $DELTA_2_3) |"
            echo "| ④ 编译后 | ${TOTAL_GB}G | ${D4_USED}G | ${USED_PCT}% | $(fmt_delta $DELTA_3_4) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────── 重试编译（并行失败后更新仓库再试, 保留初次日志 logs.1）─────────
      # 刻意设计: 失败后先 git pull 最新源码再重试(上游可能已修),
      # logs/ → logs.1/ 保留初次轮日志用于对比诊断; 单线程轮用 V=sc 输出完整日志
      - name: 🔁 Retry build
        if: always() && !cancelled() && steps.build.outputs.make_exit != '0'
        id: retry
        run: |
          set -euo pipefail
          echo "╔══════════════════════════════════════╗"
          echo "║  🔁 Retry build (更新仓库后重试)      ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          if [ "${{ inputs.cache_strategy }}" != "no-cache" ]; then
            export CC="ccache gcc"
            export CXX="ccache g++"
          fi
          cp build.log build.1.log || echo "⚠️ 备份 build.log 失败: $?"
          rm -rf logs.1
          [ -d logs ] && mv logs logs.1 || echo "ℹ️ 无初次 logs 目录可保留"
          echo "⚠️ 并行编译有错误 → 更新仓库后重试..."
          git pull origin ${{ inputs.matrix_ref }} || echo "⚠️ 源码 pull 失败: $? (可能无远端更新或非分支引用)"
          git -C package/${{ inputs.packages_feed_name }} pull origin ${{ inputs.matrix_packages_branch }} || echo "⚠️ packages pull 失败: $?"
          ./scripts/feeds update -a && ./scripts/feeds install -a
          START_TIME=$(date +%s)
          RETRY_EXIT=1
          set +o pipefail
          make BUILD_LOG=1 -j$(nproc) -k 2>&1 | tee build.log
          RETRY_EXIT=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$RETRY_EXIT" -ne 0 ]; then
            echo "⚠️ 并行重试仍有错误 → 单线程最后一搏 (V=sc 完整日志)..."
            set +o pipefail
            # 刻意设计: 单线程 + V=sc 输出完整编译命令与完整日志,
            # 确保失败包的真实错误(如 configure 具体报错)不会被并行模式截断
            make BUILD_LOG=1 -j1 V=sc -k 2>&1 | tee build.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -o pipefail
          fi
          END_TIME=$(date +%s)
          echo "retry_duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          if [ "$RETRY_EXIT" -ne 0 ]; then
            echo "💥 构建彻底失败 · 请查看 build.log 及 logs/logs.1 目录"
            exit 1
          fi
          echo "✅ 重试完成"

      # ───────── 总耗时汇总 ─────────
      - name: ⏱️ Total Build Duration
        if: always()
        id: total_duration
        run: |
          BUILD_DUR="${{ steps.build.outputs.duration || '0' }}"
          RETRY_DUR="${{ steps.retry.outputs.retry_duration || '0' }}"
          TOTAL_SEC=$((BUILD_DUR + RETRY_DUR))
          echo "duration=${TOTAL_SEC}" >> $GITHUB_OUTPUT
          echo "duration_fmt=$(printf '%dh %dm %ds' $((TOTAL_SEC/3600)) $(((TOTAL_SEC%3600)/60)) $((TOTAL_SEC%60)))" >> $GITHUB_OUTPUT
          echo "⏱️ 总编译耗时: $(printf '%dh %dm %ds' $((TOTAL_SEC/3600)) $(((TOTAL_SEC%3600)/60)) $((TOTAL_SEC%60))) (并行 ${BUILD_DUR}s + 重试 ${RETRY_DUR}s)"

      # ───────── 编译日志统计（仅成功时运行）─────────
      # 刻意设计: 统计工具是必要的分析手段(v1 遗产), 统计每个包的编译耗时,
      # 用于定位最耗时的编译瓶颈。Top5 写入 Summary。
      - name: 📊 Build Log Analysis
        if: success()
        run: |
          cd openwrt

          # 一次性提取所有 compile.txt 末行，再用 awk 分流统计
          TAIL_ALL=$(find logs -name 'compile.txt' -print0 | xargs -0 tail -qn1 2>/dev/null || true)

          TOTAL=$(find logs -name 'compile.txt' 2>/dev/null | wc -l)
          INCOMPLETE=$((TOTAL - $(echo "$TAIL_ALL" | grep -c '^time: ' || true)))
          EMPTY=$(find logs -name 'compile.txt' -size 0 2>/dev/null | wc -l)

          # 耗时提取
          echo "$TAIL_ALL" | grep '^time: ' | awk -F'#' 'NF==4' > build_time_clean.log || true

          # 统计输出到终端日志
          echo "📊 compile.txt: 总计 ${TOTAL}, 未完成 ${INCOMPLETE}, 空 ${EMPTY}"

          # Summary 只保留 Top 5
          {
            echo ""
            echo "### 📊 编译耗时 Top 5"
            echo "\`\`\`"
            awk -F'#' '{
              pkg=$1; sub(/^time: /, "", pkg); sub(/\/compile$/, "", pkg);
              real=$2;
              printf "%8.2fs  %s\n", real, pkg
            }' build_time_clean.log 2>/dev/null | sort -rn 2>/dev/null | head -5 || true
            echo "\`\`\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ───────── ccache 统计与清理（独立步骤，不受构建成败影响）─────────
      # 刻意设计: ccache 命中率/压缩比是判断"缓存是否有效"的关键指标,
      # no-cache 模式跳过本步骤(无缓存可统计)
      - name: 📈 ccache Stats & Cleanup
        if: always() && inputs.cache_strategy != 'no-cache'
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  📈 ccache 统计与压缩测量             ║"
          echo "╚══════════════════════════════════════╝"

          if command -v ccache &>/dev/null && [ -d openwrt/.ccache ]; then
            export CCACHE_DIR="$(pwd)/openwrt/.ccache"

            # ── 磁盘用量 + 压缩大小 ──
            DISK_USAGE_HUMAN=$(du -sh "openwrt/.ccache" 2>/dev/null | cut -f1)
            DISK_USAGE_BYTES=$(du -sb "openwrt/.ccache" 2>/dev/null | awk '{print $1}')
            CC_GZIP_BYTES=$(timeout 60 tar cf - openwrt/.ccache 2>/dev/null | gzip -1 -c | wc -c 2>/dev/null || echo 0)
            CC_GZIP_HUMAN=""
            if [ -n "$CC_GZIP_BYTES" ] && [ "$CC_GZIP_BYTES" -gt 0 ] && [ -n "$DISK_USAGE_BYTES" ] && [ "$DISK_USAGE_BYTES" -gt 0 ]; then
              CC_GZIP_HUMAN=$(numfmt --to=iec "$CC_GZIP_BYTES" 2>/dev/null || echo "${CC_GZIP_BYTES} B")
            fi

            # ── 解析关键指标（兼容 ccache 3.x 旧格式 + 4.x 新格式）──
            CC_RAW=$(ccache -s 2>/dev/null || true)
            HITS_DIRECT=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache hit \(direct\)|Direct):\s*\K[0-9]+' | head -1)
            HITS_PREP=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache hit \(preprocessed\)|Preprocessed):\s*\K[0-9]+' | head -1)
            MISSES=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache miss|Misses):\s*\K[0-9]+' | head -1)
            CACHE_SIZE=$(echo "$CC_RAW" | grep -oP '^\s*(?:cache size \(|Cache size \()G(?:B|iB)\):\s*\K[0-9.]+' | head -1)
            # 如果 4.x 格式的 Direct/Preprocessed/Misses 没抓到，说明可能是其他格式，置空即可
            [ -z "$HITS_DIRECT" ] && HITS_DIRECT="?"
            [ -z "$HITS_PREP" ] && HITS_PREP="?"
            [ -z "$MISSES" ] && MISSES="?"
            [ -z "$CACHE_SIZE" ] && CACHE_SIZE="?"

            # ── 终端日志 ──
            echo "📈 ccache 统计:"
            echo "  Direct hits:   ${HITS_DIRECT}"
            echo "  Preprocessed:  ${HITS_PREP}"
            echo "  Misses:        ${MISSES}"
            echo "  Cache size:    ${CACHE_SIZE}G (disk ${DISK_USAGE_HUMAN}, gzip ~${CC_GZIP_HUMAN})"

            # ── Summary ──
            TC_HIT_LABEL=$([ "${{ steps.cache-refresh.outputs.toolchain_restored || 'false' }}" = "true" ] && echo "✅ 命中" || echo "🔨 重编")
            TC_DISK=$(du -sh openwrt/staging_dir 2>/dev/null | cut -f1 || echo "N/A")
            {
              echo ""
              echo "### 📈 ccache 统计"
              echo "| 项 | Direct hits | Preprocessed | Misses | 缓存大小 | 压缩后 |"
              echo "|---|---|---|---|---|---|"
              echo "| **ccache** | ${HITS_DIRECT} | ${HITS_PREP} | ${MISSES} | ${CACHE_SIZE}G | ~${CC_GZIP_HUMAN} |"
              echo "| **工具链** | ${TC_HIT_LABEL} | — | — | ${TC_DISK} | — |"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ ccache 不可用或无缓存目录, 跳过统计"
          fi

      # ───────── 编译/下载错误诊断（统一处理）─────────
      # 刻意设计: 失败时自动查找失败软件包, 从 error.txt/compile.txt 判定哪个包失败,
      # 避免人工翻 build.log 大海捞针。logs=重试轮, logs.1=初次轮。
      # 权威失败源是 error.txt (make ERROR 宏写入 "ERROR: <pkg> failed to build."):
      # time.pl 无论命令成败都会打印 "time:" 行, 失败日志同样以 "time:" 结尾,
      # 故 compile.txt 末行是否 time: 不能判定失败; 仅保留该检测作为日志被中断(如 OOM)时的兜底。
      - name: 🔍 Build Error Diagnostics
        if: failure()
        run: |
          echo "> 👈 触发/目标/版本等整体计划见 **Plan job Summary**" >> "$GITHUB_STEP_SUMMARY"
          cd openwrt
          FAILED_PKGS=""
          PKG_COUNT=0

          # ── 收集失败包: 先 error.txt 权威源, 再 compile.txt 末行兜底 ──
          for ROOT in logs logs.1; do
            [ -d "$ROOT" ] || continue
            # 1) error.txt 权威源: "   ERROR: package/feeds/packages/libffi failed to build."
            for errfile in $(find "$ROOT" -name 'error.txt' -type f 2>/dev/null | sort); do
              while IFS= read -r line; do
                pkg=$(echo "$line" | sed -n 's/.*ERROR: \(.*\) failed to build.*/\1/p' | sed 's/ \[[^]]*\]$//')
                [ -n "$pkg" ] && FAILED_PKGS="$FAILED_PKGS $pkg"
              done < "$errfile"
            done
            # 2) 兜底: 末行不含 time: 的 compile.txt (日志被中断, 无 error.txt)
            for logfile in $(find "$ROOT" -name 'compile.txt' -type f 2>/dev/null | sort); do
              LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
              if ! echo "$LAST_LINE" | grep -q '^time:'; then
                PKG=$(echo "$logfile" | sed "s|$ROOT/||; s|/compile.txt||")
                FAILED_PKGS="$FAILED_PKGS $PKG"
              fi
            done
          done

          if [ -n "$FAILED_PKGS" ]; then
            # ── 编译阶段失败: 完整输出失败包日志 (不截断/过滤, 仅超大文件保护) ──
            FAILED_PKGS=$(echo "$FAILED_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            PKG_COUNT=$(echo "$FAILED_PKGS" | wc -l)
            echo "## ❌ 编译错误详情" >> "$GITHUB_STEP_SUMMARY"
            echo "共 ${PKG_COUNT} 个软件包编译失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            for pkg in $FAILED_PKGS; do
              echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              # 轮次优先级: logs.1(初次, 完整 configure 错误) > logs(重试轮)
              for LOGROOT in logs.1 logs; do
                [ -d "$LOGROOT" ] || continue
                for LOGFILE in "$LOGROOT/$pkg/compile.txt" "$LOGROOT/$pkg/host-compile.txt" "$LOGROOT/$pkg/download.txt"; do
                  [ -f "$LOGFILE" ] || continue
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "▍$LOGFILE ($( [ "$LOGROOT" = "logs.1" ] && echo 初次构建 || echo 重试 )) ▍" >> "$GITHUB_STEP_SUMMARY"
                  SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                  if [ "$SIZE" -gt 300000 ]; then
                    echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行; 完整内容见 artifact]" >> "$GITHUB_STEP_SUMMARY"
                    tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                  else
                    cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                  fi
                done
              done
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            # ── 无 error.txt/中断日志 → 可能是下载阶段或极早期失败 ──
            HAS_DOWNLOAD_LOGS=false
            HAS_COMPILE_LOGS=false
            for ROOT in logs logs.1; do
              [ -d "$ROOT" ] || continue
              if [ -n "$(find "$ROOT" -name 'download.txt' -type f 2>/dev/null | head -1)" ]; then
                HAS_DOWNLOAD_LOGS=true
              fi
              if [ -n "$(find "$ROOT" -name 'compile.txt' -type f 2>/dev/null | head -1)" ]; then
                HAS_COMPILE_LOGS=true
              fi
            done

            if [ "$HAS_DOWNLOAD_LOGS" = "true" ] && [ "$HAS_COMPILE_LOGS" = "false" ]; then
              # 有 download.txt 但无 compile.txt → 下载阶段失败
              echo "## ❌ 下载失败详情" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"

              FAILED_DOWNLOAD_PKGS=""
              for ROOT in logs logs.1; do
                [ -d "$ROOT" ] || continue
                for logfile in $(find "$ROOT" -name 'download.txt' -type f 2>/dev/null | sort); do
                  LAST_LINE=$(tail -1 "$logfile" 2>/dev/null || true)
                  # 下载成功通常以 time: 结尾, 失败则包含错误信息
                  if ! echo "$LAST_LINE" | grep -q '^time:'; then
                    PKG=$(echo "$logfile" | sed "s|$ROOT/||; s|/download.txt||")
                    FAILED_DOWNLOAD_PKGS="$FAILED_DOWNLOAD_PKGS $PKG"
                  fi
                done
              done

              if [ -n "$FAILED_DOWNLOAD_PKGS" ]; then
                FAILED_DOWNLOAD_PKGS=$(echo "$FAILED_DOWNLOAD_PKGS" | tr ' ' '\n' | sed '/^$/d' | sort -u)
                PKG_COUNT=$(echo "$FAILED_DOWNLOAD_PKGS" | wc -l)
                echo "共 ${PKG_COUNT} 个软件包下载失败" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"

                for pkg in $FAILED_DOWNLOAD_PKGS; do
                  echo "### ❌ ${pkg}" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  for LOGROOT in logs.1 logs; do
                    [ -d "$LOGROOT" ] || continue
                    LOGFILE="$LOGROOT/$pkg/download.txt"
                    [ -f "$LOGFILE" ] || continue
                    SIZE=$(wc -c < "$LOGFILE" 2>/dev/null || echo 0)
                    if [ "$SIZE" -gt 300000 ]; then
                      echo "[日志 ${SIZE} 字节, 超过 300KB 仅显示末尾 1000 行]" >> "$GITHUB_STEP_SUMMARY"
                      tail -1000 "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                    else
                      cat "$LOGFILE" >> "$GITHUB_STEP_SUMMARY"
                    fi
                  done
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                done
              else
                # 兜底: 从 build.log 提取下载失败信息
                FAILED_DOWNLOADS=$(grep -E '(Download failed|make\[[0-9]+\].*\[.*download\].*Error|No rule to make target.*download)' build.log 2>/dev/null | head -30 || true)

                if [ -n "$FAILED_DOWNLOADS" ]; then
                  echo "以下包下载失败：" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  echo "$FAILED_DOWNLOADS" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                else
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            else
              # 无任何日志 → 极早期失败或配置错误
              echo "## ❌ 构建失败详情" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # ── 提示初始构建日志（retry 时保存的 build.1.log）──
          if [ -f build.1.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 📎 初始构建日志（更新仓库前）已保存至 artifact: \`build.1.log\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📋 logs/ 概览" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          TOTAL_COMPILE=$(find logs logs.1 -name 'compile.txt' -type f 2>/dev/null | wc -l)
          TOTAL_DOWNLOAD=$(find logs logs.1 -name 'download.txt' -type f 2>/dev/null | wc -l)
          EMPTY_COMPILE=$(find logs logs.1 -name 'compile.txt' -type f -size 0 2>/dev/null | wc -l)
          EMPTY_DOWNLOAD=$(find logs logs.1 -name 'download.txt' -type f -size 0 2>/dev/null | wc -l)
          echo "编译日志: ${TOTAL_COMPILE} (空: ${EMPTY_COMPILE})"
          echo "下载日志: ${TOTAL_DOWNLOAD} (空: ${EMPTY_DOWNLOAD})"
          echo "失败包:   ${PKG_COUNT}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-build-log
          path: |
            openwrt/build.log
            openwrt/build.1.log
            openwrt/logs/**
            openwrt/logs.1/**
            openwrt/.config
          retention-days: 7
          if-no-files-found: ignore

      # ───────── toolchain/ccache 缓存保存（仅编译成功）─────────
      # 先保存本轮结果，再清理旧 key。编译失败时两个 save 都跳过,
      # 因而不会替换已有缓存；save 失败时 purge 也不会执行。
      - name: Save toolchain cache
        if: success() && inputs.cache_strategy != 'no-cache'
        id: cache-tc-save
        uses: actions/cache/save@v5
        with:
          key: immwrt-v2-toolchain-${{ env.IMMWRT_TARGET }}-${{ steps.toolchain_hash.outputs.hash }}
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/tool*

      - name: Save ccache
        if: success() && inputs.cache_strategy != 'no-cache'
        id: cache-cc-save
        uses: actions/cache/save@v5
        with:
          key: immwrt-v2-ccache-${{ env.IMMWRT_TARGET }}-${{ github.run_id }}
          path: openwrt/.ccache

      # ───────── 清理远端 GitHub Actions 缓存（仅两类 cache 都保存成功）─────────
      # 当前 key 已先保存，清理时明确排除它；清理失败只会暂时多留旧 cache,
      # 不会删除本轮成果或影响已有可用缓存。
      - name: Purge stale GitHub Actions caches
        id: cache-purge
        if: success() && inputs.cache_strategy != 'no-cache' && steps.cache-tc-save.outcome == 'success' && steps.cache-cc-save.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          TC_PREFIX="immwrt-v2-toolchain-${IMMWRT_TARGET}-"
          TC_CURRENT="${TC_PREFIX}${{ steps.toolchain_hash.outputs.hash }}"
          TC_LIST=$(gh cache list --repo "$REPO" --key "$TC_PREFIX" --limit 100 --json id,key,createdAt)
          TC_RC=$?
          TC_IDS=""
          if [ "$TC_RC" -eq 0 ]; then
            TC_IDS=$(echo "$TC_LIST" | jq -r --arg current "$TC_CURRENT" '[.[] | select(.key != $current)] | .[].id')
          fi
          if [ "$TC_RC" -ne 0 ]; then
            echo "⚠️ 获取工具链缓存列表失败 (rc=${TC_RC}), 保留旧缓存" >&2
          elif [ -n "$TC_IDS" ]; then
            echo "$TC_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO" \
              || echo "⚠️ 部分工具链缓存删除失败, 本轮成果仍已保存" >&2
          else
            echo "ℹ️ 无旧工具链缓存"
          fi

          CC_PREFIX="immwrt-v2-ccache-${IMMWRT_TARGET}-"
          CC_CURRENT="${CC_PREFIX}${{ github.run_id }}"
          CC_LIST=$(gh cache list --repo "$REPO" --key "$CC_PREFIX" --limit 100 --json id,key,createdAt)
          CC_RC=$?
          CC_IDS=""
          if [ "$CC_RC" -eq 0 ]; then
            CC_IDS=$(echo "$CC_LIST" | jq -r --arg current "$CC_CURRENT" '[.[] | select(.key != $current)] | .[].id')
          fi
          if [ "$CC_RC" -ne 0 ]; then
            echo "⚠️ 获取 ccache 列表失败 (rc=${CC_RC}), 保留旧缓存" >&2
          elif [ -n "$CC_IDS" ]; then
            echo "$CC_IDS" | xargs -r -P4 -I{} gh cache delete {} --repo "$REPO" \
              || echo "⚠️ 部分 ccache 删除失败, 本轮成果仍已保存" >&2
          else
            echo "ℹ️ 无旧 ccache 缓存"
          fi

      # ════════════ 产物打包 ════════════
      # 刻意设计: 打包后输出 release/ 根目录结构(深度1), 便于人工快速核验产物完整性
      - name: 📦 Package firmware artifacts
        if: success()
        run: |
          cd openwrt
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 Package firmware artifacts        ║"
          echo "╚══════════════════════════════════════╝"
          mkdir -p release/firmware
          find bin/targets -type f -not -path "*/packages/*" -exec cp {} release/firmware/ \; 2>/dev/null || true
          mkdir -p release/passwall
          find bin/packages -name "*passwall*.ipk" -o -name "*passwall*.apk" -exec cp {} release/passwall/ \; 2>/dev/null || true
          DEPS=(chinadns-ng dns2socks geoview haproxy hysteria ipt2socks microsocks naiveproxy \
                shadowsocks-rust-sslocal shadowsocksr-libev simple-obfs shadow-tls sing-box \
                tcping tuic-client v2ray-geoip v2ray-geosite v2ray-plugin xray-core)
          for dep in "${DEPS[@]}"; do
            find bin/packages \( -name "*${dep}*.ipk" -o -name "*${dep}*.apk" \) -exec cp {} release/passwall/ \; 2>/dev/null || true
          done
          if [ -f public-key.pem ]; then
            cp public-key.pem release/passwall/solarflows-apk-public.pem
          fi
          (cd release && tar czf ../${IMMWRT_TARGET}-release.tar.gz .)

          # ── 产物完整目录树 (替换原 tree -L 1: ubuntu runner 无 tree 命令, 且深度1不完整) ──
          # 纯 find 实现, 无外部依赖; release/ 是最终交付物, 展开到最深
          # 可选诊断展示: 管道失败不阻断构建
          echo ""
          echo "📂 release/ 完整目录结构:"
          echo '```text'
          find release -print 2>/dev/null | sort | sed "s|^release|.|" | head -200 || true
          echo '```'
          echo ""
          echo "📦 产物汇总:"
          echo "  固件:    $(find release/firmware -type f 2>/dev/null | wc -l) 个文件, $(du -sh release/firmware 2>/dev/null | cut -f1)"
          echo "  Passwall: $(find release/passwall -type f 2>/dev/null | wc -l) 个文件, $(du -sh release/passwall 2>/dev/null | cut -f1)"
          echo "  tarball: $(ls -lh ${IMMWRT_TARGET}-release.tar.gz 2>/dev/null | awk '{print $5}')"

      - name: Generate build info
        if: success()
        id: build-info-step
        run: |
          PKG_FORMAT="${{ inputs.matrix_apk_signing == true && 'apk' || 'ipk' }}"

          # ── 从编译产物 feeds.buildinfo 提取各 feed 版本 (恢复 v1 功能) ──
          # solarflows 软件包是直接 clone 到 package/solarflows/ (非 src-git feed),
          # 不在 feeds.buildinfo 中, 故表格末尾手动附加一行 (用 packages_sha_full)。
          FEEDS_INFO=""
          FEEDS_MD_JSON=""
          # 存在性探测: feeds.buildinfo 可能不存在 (上游未生成), 属预期; || true 防 head 截断 SIGPIPE
          FW_FEEDS_FILE=$(find openwrt/bin/targets -name "feeds.buildinfo" 2>/dev/null | head -1 || true)
          if [ -f "$FW_FEEDS_FILE" ] && [ -s "$FW_FEEDS_FILE" ]; then
            # 兼容 src-git 与 src-git-full, 跳过 # 注释行/空行
            if grep -Eq '^src-git(-full)?\b' "$FW_FEEDS_FILE" 2>/dev/null; then
              FEEDS_INFO=$(jq -Rs '.' "$FW_FEEDS_FILE")
              FEEDS_MD_RAW=$(awk '{
                if ($0 ~ /^#/ || $0 ~ /^[[:space:]]*$/) next
                n=split($NF,a,"^"); url=a[1]; hash=a[2]
                if (hash == "") hash="-"
                sub(/\.git$/,"",url)
                printf "| [%s](%s/tree/%s) | `%s` |\n", $2, url, hash, hash
              }' "$FW_FEEDS_FILE")
              # 手动附加 solarflows 软件包行 (printf 生成真实换行, 避免 YAML 块多行字面量)
              SOLARFLOWS_ROW="| [solarflows](${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.clone_packages.outputs.packages_sha_full }}\` |"
              if [ -n "$FEEDS_MD_RAW" ]; then
                FEEDS_MD_RAW=$(printf '%s\n%s' "$FEEDS_MD_RAW" "$SOLARFLOWS_ROW")
              else
                FEEDS_MD_RAW="$SOLARFLOWS_ROW"
              fi
              if [ -n "$FEEDS_MD_RAW" ]; then
                FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
              else
                echo "⚠️ feeds.buildinfo 格式异常, 无法解析 feed 版本"
                FEEDS_MD_JSON='""'
              fi
            else
              echo "⚠️ feeds.buildinfo 内容不完整 (无 src-git 条目), 仅记录 solarflows"
              FEEDS_INFO='""'
              FEEDS_MD_RAW="| [solarflows](${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.clone_packages.outputs.packages_sha_full }}\` |"
              FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
            fi
          else
            echo "⚠️ feeds.buildinfo 缺失, 仅记录 solarflows"
            FEEDS_INFO='""'
            FEEDS_MD_RAW="| [solarflows](${{ inputs.packages_feed_repo }}/tree/${{ inputs.matrix_packages_branch }}) | \`${{ steps.clone_packages.outputs.packages_sha_full }}\` |"
            FEEDS_MD_JSON=$(echo "$FEEDS_MD_RAW" | jq -Rs '.')
          fi

          cat > build-info.json <<JSONEOF
          {
            "target": "${IMMWRT_TARGET}",
            "config": "${{ inputs.matrix_config }}",
            "source_repo": "${{ inputs.matrix_repo }}",
            "source_ref": "${{ inputs.matrix_ref }}",
            "source_sha": "${{ steps.clone_packages.outputs.sha_full }}",
            "packages_repo": "${{ inputs.packages_feed_repo }}",
            "packages_branch": "${{ inputs.matrix_packages_branch }}",
            "packages_sha": "${{ steps.clone_packages.outputs.packages_sha_full }}",
            "feeds_info": ${FEEDS_INFO},
            "feeds_md": ${FEEDS_MD_JSON},
            "duration_sec": "${{ steps.total_duration.outputs.duration }}",
            "duration_fmt": "${{ steps.total_duration.outputs.duration_fmt }}",
            "toolchain_hit": "${{ steps.cache-refresh.outputs.toolchain_restored || 'false' }}",
            "toolchain_exact": "${{ steps.cache-refresh.outputs.toolchain_exact || 'false' }}",
            "ccache_hit": "${{ steps.cache-refresh.outputs.ccache_restored || 'false' }}",
            "signing_key_fingerprint": "${{ steps.signing_key.outputs.fingerprint || 'none' }}",
            "release_repo": "${{ inputs.matrix_release_repo }}",
            "passwall_repo": "${{ inputs.matrix_passwall_repo }}",
            "passwall_tag": "${{ inputs.matrix_passwall_tag }}",
            "release_tag": "${{ inputs.version }}",
            "build_mode": "firmware",
            "packages_format": "${PKG_FORMAT}",
            "timestamp": "$(TZ=${TZ} date +'%Y-%m-%d %H:%M:%S')"
          }
          JSONEOF

          # ── Summary Feed 版本 ──
          {
            echo ""
            echo "### 📌 Feed 版本"
            echo ""
            echo "| Feed | 版本 |"
            echo "|------|------|"
            printf '%s\n' "$FEEDS_MD_JSON" | jq -r '.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        if: success()
        run: |
          SHA_SHORT="${{ steps.clone_packages.outputs.sha }}"
          # 从 build-info.json 读取 Feed 表格 (含 solarflows 行), 软件包版本不再单列, 避免重复
          # jq -r 已解码 JSON 字符串, 空值输出空串由 -n 过滤
          FEEDS_MD_JSON=$(jq -r '.feeds_md // empty' build-info.json)
          {
            echo "## ${IMMWRT_TARGET} Build"
            echo ""
            echo "**源码**: [${{ inputs.matrix_ref }}](https://github.com/${{ inputs.matrix_repo }}) @ [${SHA_SHORT}](https://github.com/${{ inputs.matrix_repo }}/commit/${{ steps.clone_packages.outputs.sha_full }})"
            echo "**编译耗时**: ${{ steps.total_duration.outputs.duration_fmt }}"
            if [ -n "$FEEDS_MD_JSON" ]; then
              echo ""
              echo "### 📌 Feed 版本"
              echo ""
              echo "| Feed | 版本 |"
              echo "|------|------|"
              printf '%s\n' "$FEEDS_MD_JSON"
            fi
            echo ""
            echo "---"
            echo "ℹ️ 完整构建报告请查看 GitHub Actions Summary。"
          } > release-body.md

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-release
          path: openwrt/${{ env.IMMWRT_TARGET }}-release.tar.gz
          retention-days: 7

      - name: Upload passwall artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-passwall
          path: openwrt/release/passwall
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build info
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-build-info
          path: |
            build-info.json
            release-body.md
          retention-days: 7

      - name: Publish firmware release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ inputs.version }}"
          RELEASE_REPO="${{ inputs.matrix_release_repo }}"
          FIRMWARE_DIR="openwrt/release/firmware"
          [ -d "$FIRMWARE_DIR" ] && [ -n "$(find "$FIRMWARE_DIR" -maxdepth 1 -type f -print -quit)" ] || {
            echo "::error::固件目录为空，拒绝创建空 Release"
            exit 1
          }
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" "$FIRMWARE_DIR"/* --clobber
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --title "${IMMWRT_TARGET} Build ${RELEASE_TAG}" --notes-file release-body.md --draft=false
          else
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --target "${{ steps.clone_packages.outputs.sha_full }}" \
              --title "${IMMWRT_TARGET} Build ${RELEASE_TAG}" --notes-file release-body.md "$FIRMWARE_DIR"/*
          fi

      - name: Publish Passwall packages
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="openwrt/release/passwall"
          mapfile -t PACKAGE_FILES < <(find "$PACKAGE_DIR" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.pem' \) 2>/dev/null)
          if [ "${#PACKAGE_FILES[@]}" -eq 0 ]; then
            echo "::warning::无 Passwall 包可发布 (编译失败或未配置)"
            exit 0
          fi
          PACKAGE_REPO="${{ inputs.matrix_passwall_repo }}"
          PACKAGE_TAG="${{ inputs.matrix_passwall_tag }}"
          if gh release view "$PACKAGE_TAG" --repo "$PACKAGE_REPO" >/dev/null 2>&1; then
            gh release upload "$PACKAGE_TAG" --repo "$PACKAGE_REPO" "${PACKAGE_FILES[@]}" --clobber
          else
            gh release create "$PACKAGE_TAG" --repo "$PACKAGE_REPO" --title "Passwall Packages" \
              --notes "Multi-target passwall packages" --latest=false "${PACKAGE_FILES[@]}"
          fi

      # ════════ SDK / IB 打包与发布 (v2 新增) ════════
      # 刻意设计: SDK/IB 以 release tag (sdk-<target> / ib-<target>) 存储多版本,
      # 同名版本 --clobber 替换, 异名版本按版本号保留最近 KEEP 组 (index.json 追踪)。
      - name: 📦 Package SDK & IB tarballs
        if: success() && inputs.publish_sdk_ib == true
        id: sdk_ib
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  📦 Package SDK & IB tarballs         ║"
          echo "╚══════════════════════════════════════╝"
          cd openwrt
          mkdir -p release/sdk release/ib

          # SDK tarball + sha256
          # 上游产物名: <dist>-sdk-[<version>-]<board>[_gcc-<ver>]<suffix>.<host_os>-<host_arch>.tar.{xz,zst}
          # (target/sdk/Makefile 的 SDK_NAME), 故 find 用 *-sdk-*.tar.* 匹配, 兼容两种压缩格式。
          SDK_TARBALL=$(find bin/targets -type f \( -name '*-sdk-*.tar.xz' -o -name '*-sdk-*.tar.zst' \) | head -1)
          if [ -n "$SDK_TARBALL" ]; then
            cp "$SDK_TARBALL" release/sdk/
            # v2 命名: sdk-<target>-<version>-<arch>.tar.{xz,zst} (version 来自 version.mk)
            SDK_VERSION="${{ steps.apply_config.outputs.source_version }}"
            # 防御: 版本号必须是纯字符串, 残留 make 表达式则显式报错 (曾发生 exit 127)
            case "$SDK_VERSION" in
              *'$('*) echo "::error::apply_config.source_version 含 make 表达式: ${SDK_VERSION}"; exit 1 ;;
            esac
            SDK_ORIG_VER="${{ steps.apply_config.outputs.patched_version }}"
            SDK_EXT=$(basename "$SDK_TARBALL" | sed -E 's/.*\.(tar\..*)$/\1/')
            # 优先剥掉上游文件名里的版本前缀 (CONFIG_VERSION_FILENAMES=y 时含 <version>-;
            # 用 patch 后版本号匹配, 与构建期 VERSION_NUMBER 一致), 否则整体提取 (文件名无版本前缀)
            SDK_ARCH=$(basename "$SDK_TARBALL" | sed -E "s/.*-sdk-${SDK_ORIG_VER}-(.*)\.tar\..*/\1/")
            if [ "$SDK_ARCH" = "$(basename "$SDK_TARBALL")" ]; then
              SDK_ARCH=$(basename "$SDK_TARBALL" | sed -E 's/.*-sdk-(.*)\.tar\..*/\1/')
            fi
            SDK_NEW_NAME="sdk-${IMMWRT_TARGET}-${SDK_VERSION}-${SDK_ARCH}.${SDK_EXT}"
            mv "release/sdk/$(basename "$SDK_TARBALL")" "release/sdk/${SDK_NEW_NAME}"

            # sha256 统一为 ${SDK_NEW_NAME}.sha256 两列标准格式 (hash + 空格 + 文件名),
            # 供消费方 sha256sum -c 校验。mv 后重算而非复用上游 .sha256sum:
            # 上游文件名/目录前缀可能与新名不一致, 重算保证内容与上传文件名精确匹配
            (cd release/sdk && sha256sum "$SDK_NEW_NAME" > "${SDK_NEW_NAME}.sha256")
            echo "sdk_new_name=${SDK_NEW_NAME}" >> $GITHUB_OUTPUT
            echo "sdk_version_key=${SDK_VERSION}" >> $GITHUB_OUTPUT
            echo "sdk_arch=${SDK_ARCH}" >> $GITHUB_OUTPUT
            echo "✅ SDK: ${SDK_NEW_NAME}"
          else
            echo "::warning::SDK tarball 未生成 (检查 01-base.seed 中 CONFIG_SDK=y)"
          fi

          # IB tarball + sha256
          # 上游产物名: <dist>-imagebuilder-[<version>-]<board>[_gcc-<ver>].<host_os>-<host_arch>.tar.{xz,zst}
          # (target/imagebuilder/Makefile 的 IB_NAME), find 用 *-imagebuilder-*.tar.* 匹配。
          IB_TARBALL=$(find bin/targets -type f \( -name '*-imagebuilder-*.tar.xz' -o -name '*-imagebuilder-*.tar.zst' \) | head -1)
          if [ -n "$IB_TARBALL" ]; then
            cp "$IB_TARBALL" release/ib/
            IB_VERSION="${{ steps.apply_config.outputs.source_version }}"
            IB_ORIG_VER="${{ steps.apply_config.outputs.patched_version }}"
            IB_EXT=$(basename "$IB_TARBALL" | sed -E 's/.*\.(tar\..*)$/\1/')
            IB_ARCH=$(basename "$IB_TARBALL" | sed -E "s/.*-imagebuilder-${IB_ORIG_VER}-(.*)\.tar\..*/\1/")
            if [ "$IB_ARCH" = "$(basename "$IB_TARBALL")" ]; then
              IB_ARCH=$(basename "$IB_TARBALL" | sed -E 's/.*-imagebuilder-(.*)\.tar\..*/\1/')
            fi
            IB_NEW_NAME="ib-${IMMWRT_TARGET}-${IB_VERSION}-${IB_ARCH}.${IB_EXT}"
            mv "release/ib/$(basename "$IB_TARBALL")" "release/ib/${IB_NEW_NAME}"

            # sha256 统一为 ${IB_NEW_NAME}.sha256 两列标准格式 (同 SDK 逻辑, mv 后重算)
            (cd release/ib && sha256sum "$IB_NEW_NAME" > "${IB_NEW_NAME}.sha256")
            echo "ib_new_name=${IB_NEW_NAME}" >> $GITHUB_OUTPUT
            echo "ib_version_key=${IB_VERSION}" >> $GITHUB_OUTPUT
            echo "ib_arch=${IB_ARCH}" >> $GITHUB_OUTPUT
            echo "✅ IB:  ${IB_NEW_NAME}"
          else
            echo "::warning::IB tarball 未生成 (检查 01-base.seed 中 CONFIG_IB=y)"
          fi

          # ── SDK/IB 目录结构（深度 1）──
          echo ""
          echo "📂 release/sdk/ + release/ib/ 目录结构 (深度 1):"
          echo '```text'
          if command -v tree &>/dev/null; then
            tree -L 1 release/sdk release/ib 2>/dev/null || { ls -al release/sdk; ls -al release/ib; }
          else
            ls -al release/sdk
            ls -al release/ib
          fi
          echo '```'

      - name: Upload SDK to release
        if: success() && inputs.publish_sdk_ib == true && steps.sdk_ib.outputs.sdk_new_name != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TAG="${{ inputs.matrix_sdk_release_tag }}"
          REPO="${{ inputs.matrix_sdk_release_repo }}"
          # 确保 release 存在 (非 draft, 多版本共存)
          gh release view "$TAG" --repo "$REPO" 2>/dev/null || \
            gh release create "$TAG" --repo "$REPO" \
              --title "${TAG} Builds" --notes "Multi-version SDK builds (${IMMWRT_TARGET})" --latest=false
          SDK_FILE="openwrt/release/sdk/${{ steps.sdk_ib.outputs.sdk_new_name }}"
          SDK_SHA="${SDK_FILE}.sha256"
          gh release upload "$TAG" --repo "$REPO" "$SDK_FILE" "$SDK_SHA" --clobber
          echo "📤 SDK 已上传到 ${REPO}@${TAG}"

          # ── 更新 index.json ──
          mkdir -p /tmp/sdk_index
          (cd /tmp/sdk_index && gh release download "$TAG" --repo "$REPO" --pattern "index.json" 2>/dev/null) || echo '{}' > /tmp/sdk_index/index.json
          SHA256=$(cat "$SDK_SHA" | awk '{print $1}')
          jq --arg v "${{ steps.sdk_ib.outputs.sdk_version_key }}" \
             --arg f "${{ steps.sdk_ib.outputs.sdk_new_name }}" \
             --arg s "$SHA256" \
             --arg src "${{ steps.clone_packages.outputs.sha_full }}" \
             --arg arch "${{ steps.sdk_ib.outputs.sdk_arch }}" \
             --arg ts "$(TZ=$TZ date -Iseconds)" \
             '.[$v] = {file:$f, sha256:$s, source_sha:$src, arch:$arch, built_at:$ts}' \
             /tmp/sdk_index/index.json > /tmp/sdk_index/index_new.json
          # 按 version 号排序 + 保留最近 N 个版本 (健壮比较: 数字段按数值, SNAPSHOT=-1, V<数字> 解析数字)
          KEEP=${{ inputs.matrix_sdk_keep_versions }}
          jq --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            to_entries | sort_by([.key | splits("[.-]") | vtok]) | .[-$n:] | from_entries
          ' /tmp/sdk_index/index_new.json > /tmp/sdk_index/index.json
          gh release upload "$TAG" --repo "$REPO" /tmp/sdk_index/index.json --clobber

          # ── 清理旧版本 tarball (同名由 --clobber 替换; 异名按版本号保留最近 KEEP 组) ──
          NEW_FILE="${{ steps.sdk_ib.outputs.sdk_new_name }}"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E "^sdk-${IMMWRT_TARGET}-.*\.tar\.(xz|zst)$" > /tmp/sdk_files.txt || echo "  (当前无历史 SDK tarball, 跳过清理)"
          KEEP_HEAD=$(jq -Rr --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            [inputs] | sort_by([splits("[._-]") | vtok]) | .[-$n:][]
          ' /tmp/sdk_files.txt)
          while read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = "$NEW_FILE" ] && { echo "  (保留本次上传: $f)"; continue; }
            if echo "$KEEP_HEAD" | grep -qxF "$f"; then
              echo "  (保留: $f)"
            else
              echo "🗑️ 删除旧版本: $f"
              gh release delete-asset "$TAG" --repo "$REPO" "$f" --yes || echo "  ⚠️ 删除失败: $f"
              if gh release delete-asset "$TAG" --repo "$REPO" "$f.sha256" --yes 2>/dev/null; then
                echo "  🧹 已同步删除 ${f}.sha256"
              else
                echo "  (无 ${f}.sha256 伴生文件)"
              fi
            fi
          done < /tmp/sdk_files.txt

      - name: Upload IB to release
        if: success() && inputs.publish_sdk_ib == true && steps.sdk_ib.outputs.ib_new_name != ''
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TAG="${{ inputs.matrix_ib_release_tag }}"
          REPO="${{ inputs.matrix_ib_release_repo }}"
          gh release view "$TAG" --repo "$REPO" 2>/dev/null || \
            gh release create "$TAG" --repo "$REPO" \
              --title "${TAG} Builds" --notes "Multi-version ImageBuilder builds (${IMMWRT_TARGET})" --latest=false
          IB_FILE="openwrt/release/ib/${{ steps.sdk_ib.outputs.ib_new_name }}"
          IB_SHA="${IB_FILE}.sha256"
          gh release upload "$TAG" --repo "$REPO" "$IB_FILE" "$IB_SHA" --clobber
          echo "📤 IB 已上传到 ${REPO}@${TAG}"

          # 更新 index.json (同 SDK 逻辑)
          mkdir -p /tmp/ib_index
          (cd /tmp/ib_index && gh release download "$TAG" --repo "$REPO" --pattern "index.json" 2>/dev/null) || echo '{}' > /tmp/ib_index/index.json
          SHA256=$(cat "$IB_SHA" | awk '{print $1}')
          jq --arg v "${{ steps.sdk_ib.outputs.ib_version_key }}" \
             --arg f "${{ steps.sdk_ib.outputs.ib_new_name }}" \
             --arg s "$SHA256" \
             --arg src "${{ steps.clone_packages.outputs.sha_full }}" \
             --arg arch "${{ steps.sdk_ib.outputs.ib_arch }}" \
             --arg ts "$(TZ=$TZ date -Iseconds)" \
             '.[$v] = {file:$f, sha256:$s, source_sha:$src, arch:$arch, built_at:$ts}' \
             /tmp/ib_index/index.json > /tmp/ib_index/index_new.json
          KEEP=${{ inputs.matrix_ib_keep_versions }}
          jq --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            to_entries | sort_by([.key | splits("[.-]") | vtok]) | .[-$n:] | from_entries
          ' /tmp/ib_index/index_new.json > /tmp/ib_index/index.json
          gh release upload "$TAG" --repo "$REPO" /tmp/ib_index/index.json --clobber

          # ── 清理旧版本 tarball (同名由 --clobber 替换; 异名按版本号保留最近 KEEP 组) ──
          NEW_FILE="${{ steps.sdk_ib.outputs.ib_new_name }}"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E "^ib-${IMMWRT_TARGET}-.*\.tar\.(xz|zst)$" > /tmp/ib_files.txt || echo "  (当前无历史 IB tarball, 跳过清理)"
          KEEP_HEAD=$(jq -Rr --argjson n "$KEEP" '
            def vtok: if test("^[0-9]+$") then tonumber
                      elif test("^[Vv][0-9]+$") then (.[1:] | tonumber)
                      elif . == "SNAPSHOT" then -1 else 0 end;
            [inputs] | sort_by([splits("[._-]") | vtok]) | .[-$n:][]
          ' /tmp/ib_files.txt)
          while read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = "$NEW_FILE" ] && { echo "  (保留本次上传: $f)"; continue; }
            if echo "$KEEP_HEAD" | grep -qxF "$f"; then
              echo "  (保留: $f)"
            else
              echo "🗑️ 删除旧版本: $f"
              gh release delete-asset "$TAG" --repo "$REPO" "$f" --yes || echo "  ⚠️ 删除失败: $f"
              if gh release delete-asset "$TAG" --repo "$REPO" "$f.sha256" --yes 2>/dev/null; then
                echo "  🧹 已同步删除 ${f}.sha256"
              else
                echo "  (无 ${f}.sha256 伴生文件)"
              fi
            fi
          done < /tmp/ib_files.txt

      - name: Upload published state
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMMWRT_TARGET }}-published-state
          path: build-info.json
          retention-days: 7
