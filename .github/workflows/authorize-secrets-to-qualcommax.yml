name: "Authorize Secrets to ImmortalWrt-QualcommAX"

on:
  workflow_dispatch:

jobs:
  authorize_keys:
    name: Sync Signing Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Export and authorize signing keys
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          APK_KEY: ${{ secrets.APK_BUILD_KEY }}
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
        run: |
          set -euo pipefail
          echo "🔐 正在向 solarflows/ImmortalWrt-QualcommAX 授予签名权限..."

          if [ -n "$APK_KEY" ]; then
            printf '%s' "$APK_KEY" | gh secret set APK_BUILD_KEY --repo solarflows/ImmortalWrt-QualcommAX
            echo "✅ 已成功向 ImmortalWrt-QualcommAX 写入 APK_BUILD_KEY"
          else
            echo "⚠️ 未在 AutoWorkFlows 找到 APK_BUILD_KEY secret"
          fi

          if [ -n "$USIGN_KEY" ]; then
            printf '%s' "$USIGN_KEY" | gh secret set USIGN_KEY --repo solarflows/ImmortalWrt-QualcommAX
            echo "✅ 已成功向 ImmortalWrt-QualcommAX 写入 USIGN_KEY"
          else
            echo "⚠️ 未在 AutoWorkFlows 找到 USIGN_KEY secret"
          fi

          echo "🎉 签名密钥授权同步完成！ImmortalWrt-QualcommAX 现已完全具备独立证书签名能力。"
