name: v2ray-geodata Updater

concurrency:
  group: v2ray-geodata-updater
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    - cron: '6 6 * * 6'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v2ray-geodataUpdater.yaml'
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GEOVIEW_VERSION: '0.2.6'
      GEOVIEW_SHA256: 'fbd309ba28f36f72c9f3c6a33b87c43136199164215fb7efbab289329193c722'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Fetch and parse data
        id: geo-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/v2ray-geodata"
          rm -rf -- "$WORK_DIR"
          mkdir -p -- "$WORK_DIR/publish" "$WORK_DIR/release"

          curl --fail-with-body --show-error --location --retry 3 --retry-delay 2 \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest" \
            --output "$WORK_DIR/rules-release.json"
          curl --fail-with-body --show-error --location --retry 3 --retry-delay 2 \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/snowie2000/geoview/releases/tags/${GEOVIEW_VERSION}" \
            --output "$WORK_DIR/geoview-release.json"

          jq -e --arg expected '^[0-9]{12}$' '
            . as $release |
            ($release.assets | map(select(.name == "geoip.dat" or .name == "geosite.dat"))) as $data_assets |
            ($release.draft == false and $release.prerelease == false and ($release.tag_name | test($expected))) and
            ($data_assets | map(.name) | sort == ["geoip.dat", "geosite.dat"]) and
            (all($data_assets[]; .digest | test("^sha256:[0-9a-f]{64}$"))) and
            (all($data_assets[];
              .browser_download_url == ("https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/" + $release.tag_name + "/" + .name)))
          ' "$WORK_DIR/rules-release.json" >/dev/null

          jq -e --arg expected "$GEOVIEW_VERSION" --arg sha "$GEOVIEW_SHA256" '
            (.tag_name == $expected and .draft == false and .prerelease == false) and
            ([.assets[] | select(.name == "geoview-linux-amd64")] | length == 1) and
            ([.assets[] | select(.name == "geoview-linux-amd64") | .digest] | .[0] == ("sha256:" + $sha)) and
            ([.assets[] | select(.name == "geoview-linux-amd64") | .browser_download_url] | .[0] == ("https://github.com/snowie2000/geoview/releases/download/" + $expected + "/geoview-linux-amd64"))
          ' "$WORK_DIR/geoview-release.json" >/dev/null

          VERSION=$(jq -r '.tag_name' "$WORK_DIR/rules-release.json")
          GEOIP_URL=$(jq -r '.assets[] | select(.name == "geoip.dat") | .browser_download_url' "$WORK_DIR/rules-release.json")
          GEOSITE_URL=$(jq -r '.assets[] | select(.name == "geosite.dat") | .browser_download_url' "$WORK_DIR/rules-release.json")
          GEOIP_API_SHA=$(jq -r '.assets[] | select(.name == "geoip.dat") | .digest | sub("^sha256:"; "")' "$WORK_DIR/rules-release.json")
          GEOSITE_API_SHA=$(jq -r '.assets[] | select(.name == "geosite.dat") | .digest | sub("^sha256:"; "")' "$WORK_DIR/rules-release.json")
          GEOVIEW_URL="https://github.com/snowie2000/geoview/releases/download/${GEOVIEW_VERSION}/geoview-linux-amd64"
          printf 'VERSION=%s\nGEOIP_URL=%s\nGEOSITE_URL=%s\nGEOIP_API_SHA=%s\nGEOSITE_API_SHA=%s\nGEOVIEW_URL=%s\nWORK_DIR=%s\n' \
            "$VERSION" "$GEOIP_URL" "$GEOSITE_URL" "$GEOIP_API_SHA" "$GEOSITE_API_SHA" "$GEOVIEW_URL" "$WORK_DIR" >> "$GITHUB_ENV"
          printf 'version=%s\ngeoip_api_sha=%s\ngeosite_api_sha=%s\n' "$VERSION" "$GEOIP_API_SHA" "$GEOSITE_API_SHA" >> "$GITHUB_OUTPUT"

      - name: Display results
        run: |
          set -euo pipefail
          echo "版本号: $VERSION"
          echo "GeoIP URL: $GEOIP_URL"
          echo "GeoSite URL: $GEOSITE_URL"

      - name: Download files and compute SHA
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --location --retry 3 --retry-delay 2 "$GEOVIEW_URL" --output "$WORK_DIR/geoview"
          printf '%s  %s\n' "$GEOVIEW_SHA256" "$WORK_DIR/geoview" | sha256sum -c -
          chmod 700 "$WORK_DIR/geoview"

          curl --fail-with-body --show-error --location --retry 3 --retry-delay 2 "$GEOIP_URL" --output "$WORK_DIR/geoip.dat"
          curl --fail-with-body --show-error --location --retry 3 --retry-delay 2 "$GEOSITE_URL" --output "$WORK_DIR/geosite.dat"
          GEOIP_SHA=$(sha256sum "$WORK_DIR/geoip.dat" | awk '{print $1}')
          GEOSITE_SHA=$(sha256sum "$WORK_DIR/geosite.dat" | awk '{print $1}')
          [ "$GEOIP_SHA" = "$GEOIP_API_SHA" ] || { echo "::error::geoip.dat digest mismatch"; exit 1; }
          [ "$GEOSITE_SHA" = "$GEOSITE_API_SHA" ] || { echo "::error::geosite.dat digest mismatch"; exit 1; }
          printf 'GEOIP_SHA=%s\nGEOSITE_SHA=%s\n' "$GEOIP_SHA" "$GEOSITE_SHA" >> "$GITHUB_ENV"
          echo "Downloaded GEOIP SHA: $GEOIP_SHA"
          echo "Downloaded GEOSITE SHA: $GEOSITE_SHA"

      - name: Update patch files
        run: |
          set -euo pipefail
          PATCH_PATH="$GITHUB_WORKSPACE/.github/diy/openwrt-packages/patches/0001-add-v2ray-geodata.patch"
          [ -f "$PATCH_PATH" ] || { echo "::error::Patch file not found: $PATCH_PATH"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]{12}$ ]] || { echo "::error::版本格式无效: $VERSION"; exit 1; }
          [[ "$GEOIP_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::GeoIP SHA 格式无效"; exit 1; }
          [[ "$GEOSITE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::GeoSite SHA 格式无效"; exit 1; }

          echo "Updating patch: $PATCH_PATH"
          echo "  VERSION    = ${VERSION}"
          echo "  GEOIP_SHA  = ${GEOIP_SHA}"
          echo "  GEOSITE_SHA= ${GEOSITE_SHA}"

          sed -i -E "s/^(\+GEO_VER:=).*/\1${VERSION}/" "$PATCH_PATH"
          sed -i -E "/^\+define Download\/geoip-full/,/^\+endef/ s/^(\+  HASH:=).*/\1${GEOIP_SHA}/" "$PATCH_PATH"
          sed -i -E "/^\+define Download\/geosite-full/,/^\+endef/ s/^(\+  HASH:=).*/\1${GEOSITE_SHA}/" "$PATCH_PATH"

          GEO_VER_COUNT=$(awk '/^\+GEO_VER:=/ { count++ } END { print count + 0 }' "$PATCH_PATH")
          GEOIP_FULL_HASH=$(awk '
            /^\+define Download\/geoip-full$/ { in_block=1; next }
            /^\+endef$/ && in_block { in_block=0 }
            in_block && /^\+  HASH:=/ { value=$0; sub(/^\+  HASH:=/, "", value); print value }
          ' "$PATCH_PATH")
          GEOSITE_FULL_HASH=$(awk '
            /^\+define Download\/geosite-full$/ { in_block=1; next }
            /^\+endef$/ && in_block { in_block=0 }
            in_block && /^\+  HASH:=/ { value=$0; sub(/^\+  HASH:=/, "", value); print value }
          ' "$PATCH_PATH")
          [ "$GEO_VER_COUNT" -eq 1 ] || { echo "::error::GEO_VER 字段数量异常: $GEO_VER_COUNT"; exit 1; }
          [ "$GEOIP_FULL_HASH" = "$GEOIP_SHA" ] || { echo "::error::GeoIP full HASH 更新失败"; exit 1; }
          [ "$GEOSITE_FULL_HASH" = "$GEOSITE_SHA" ] || { echo "::error::GeoSite full HASH 更新失败"; exit 1; }

          PATCH_FIXTURE="$WORK_DIR/patch-fixture"
          rm -rf -- "$PATCH_FIXTURE"
          mkdir -p -- "$PATCH_FIXTURE"
          git -C "$PATCH_FIXTURE" init -q
          git -C "$PATCH_FIXTURE" apply --check --whitespace=nowarn "$PATCH_PATH"
          git -C "$PATCH_FIXTURE" apply --whitespace=nowarn "$PATCH_PATH"
          MAKEFILE_BLOB=$(git -C "$PATCH_FIXTURE" hash-object v2ray-geodata/Makefile)
          sed -i -E "s/^index 00000000\.\.[0-9a-f]+$/index 00000000..${MAKEFILE_BLOB}/" "$PATCH_PATH"
          PATCH_BLOB=$(sed -n -E 's/^index 00000000\.\.([0-9a-f]+)$/\1/p' "$PATCH_PATH")
          [ "$PATCH_BLOB" = "$MAKEFILE_BLOB" ] || { echo "::error::Makefile blob index 更新失败"; exit 1; }

          SECOND_FIXTURE="$WORK_DIR/patch-fixture-verify"
          rm -rf -- "$SECOND_FIXTURE"
          mkdir -p -- "$SECOND_FIXTURE"
          git -C "$SECOND_FIXTURE" init -q
          git -C "$SECOND_FIXTURE" apply --check --whitespace=nowarn "$PATCH_PATH"
          git -C "$SECOND_FIXTURE" apply --whitespace=nowarn "$PATCH_PATH"
          VERIFY_BLOB=$(git -C "$SECOND_FIXTURE" hash-object v2ray-geodata/Makefile)
          [ "$VERIFY_BLOB" = "$PATCH_BLOB" ] || { echo "::error::补丁 blob index 二次验证失败"; exit 1; }
          git diff --check -- "$PATCH_PATH"

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📦 v2ray-geodata Update

          | Item | Value |
          |------|-------|
          | Version | \`${VERSION}\` |
          | GeoIP SHA256 | \`${GEOIP_SHA}\` |
          | GeoSite SHA256 | \`${GEOSITE_SHA}\` |
          | Makefile blob | \`${PATCH_BLOB}\` |
          | Patch | \`${PATCH_PATH}\` |
          EOF

      - name: Generate and validate assets
        id: generate_assets
        run: |
          set -euo pipefail
          mkdir -p -- "$WORK_DIR/publish" "$WORK_DIR/release" "$WORK_DIR/raw"

          generate_rule() {
            local output_file="$1"
            local title="$2"
            local description="$3"
            local version_line="$4"
            shift 4
            : > "$output_file"
            while (($#)); do
              local rule_kind="$1"
              local rule_input="$2"
              local rule_list="$3"
              local rule_prefix="$4"
              shift 4
              printf '%s\n' "$rule_kind" >> "$output_file"
              local raw_file="$WORK_DIR/raw/$(basename "$output_file").${RANDOM}"
              "$WORK_DIR/geoview" -type "$rule_input" -input "$WORK_DIR/${rule_input}.dat" -list "$rule_list" > "$raw_file"
              test -s "$raw_file"
              sed "s/^/${rule_prefix}/" "$raw_file" >> "$output_file"
              printf '\n' >> "$output_file"
            done
            printf '[AutoProxy 0.2.9]\n! Title: %s\n! Description: %s\n! Version: %s\n' \
              "$title" "$description" "$version_line" > "$output_file.header"
            cat "$output_file.header" "$output_file" > "$output_file.final"
            printf '%s\n' '!---------------------EOF-----------------------' >> "$output_file.final"
            mv -- "$output_file.final" "$output_file"
            rm -f -- "$output_file.header"
            test -s "$output_file"
          }

          generate_rule "$WORK_DIR/publish/autoproxy.txt" \
            'AutoProxy Rules' 'UnCN as primary rules,CN exceptions and IPs' "$VERSION" \
            '!## UnCN Domains' geosite geolocation-!cn '||' \
            '!## CN Domain Exceptions' geosite cn '@@||' \
            '!## CN IP Ranges' geoip cn '@@' \
            '!## Privite IP Ranges' geoip private '@@'
          generate_rule "$WORK_DIR/publish/autoproxy_lite.txt" \
            'AutoProxy Lite Rules' 'GFW as primary rules,geolocation CN exceptions' "$VERSION" \
            '!## GFW Domains' geosite gfw '||' \
            '!## Privite IP Ranges' geoip private '@@'
          generate_rule "$WORK_DIR/publish/whitelist.txt" \
            'Whitelist Rules' 'Only CN domains and IPs' "$VERSION" \
            '!## CN Domain Exceptions' geosite cn '||' \
            '!## CN IP Ranges' geoip cn '' \
            '!## Privite IP Ranges' geoip private ''
          generate_rule "$WORK_DIR/publish/whitelist_lite.txt" \
            'Whitelist Lite Rules' 'Only geolocation CN domains and IPs' "$VERSION" \
            '!## geolocation CN Domain Exceptions' geosite geolocation-cn '||' \
            '!## Privite IP Ranges' geoip private ''
          generate_rule "$WORK_DIR/publish/blacklist.txt" \
            'Blacklist Rules' 'Only UnCN domains.' "$VERSION" \
            '!## unCN Domains' geosite geolocation-!cn '||' \
            '!## Privite IP Ranges' geoip private '@@'
          generate_rule "$WORK_DIR/publish/blacklist_lite.txt" \
            'blacklist_lite Rules' 'Only GFWList domains.' "$VERSION" \
            '!## GFW Domains' geosite gfw '||' \
            '!## Privite IP Ranges' geoip private '@@'
          generate_rule "$WORK_DIR/publish/smartproxy_whitelist.txt" \
            'Whitelist Rules For SmartProxy' 'Only CN domains and IPs' "$VERSION" \
            '!## CN Domain Exceptions' geosite cn '@@||' \
            '!## Privite IP Ranges' geoip private '@@'

          expected_files=(autoproxy autoproxy_lite whitelist whitelist_lite blacklist blacklist_lite smartproxy_whitelist)
          for asset in "${expected_files[@]}"; do
            file="$WORK_DIR/publish/${asset}.txt"
            test -f "$file" && test -s "$file"
            grep -Fqx "[AutoProxy 0.2.9]" "$file"
            grep -Fqx "! Version: $VERSION" "$file"
            tail -n 1 "$file" | grep -Fqx '!---------------------EOF-----------------------'
          done
          mapfile -t text_assets < <(find "$WORK_DIR/publish" -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sort)
          expected_text_assets=(autoproxy.txt autoproxy_lite.txt blacklist.txt blacklist_lite.txt smartproxy_whitelist.txt whitelist.txt whitelist_lite.txt)
          diff -u <(printf '%s\n' "${expected_text_assets[@]}") <(printf '%s\n' "${text_assets[@]}")
          jq -n \
            --arg version "$VERSION" \
            --arg geoip_url "$GEOIP_URL" \
            --arg geosite_url "$GEOSITE_URL" \
            --arg geoip_api_sha "$GEOIP_API_SHA" \
            --arg geosite_api_sha "$GEOSITE_API_SHA" \
            --arg geoip_sha "$GEOIP_SHA" \
            --arg geosite_sha "$GEOSITE_SHA" \
            --arg geoview_version "$GEOVIEW_VERSION" \
            --arg geoview_sha256 "$GEOVIEW_SHA256" \
            '{version:$version, geoip_url:$geoip_url, geosite_url:$geosite_url,
              geoip_api_sha256:$geoip_api_sha, geosite_api_sha256:$geosite_api_sha,
              geoip_sha256:$geoip_sha, geosite_sha256:$geosite_sha,
              geoview_version:$geoview_version, geoview_sha256:$geoview_sha256}' \
            > "$WORK_DIR/publish/source-metadata.json"
          jq -e --arg version "$VERSION" \
            '.version == $version and .geoip_sha256 == .geoip_api_sha256 and .geosite_sha256 == .geosite_api_sha256' \
            "$WORK_DIR/publish/source-metadata.json" >/dev/null
          test -s "$WORK_DIR/publish/source-metadata.json"

      - name: Generate base64 encoded files
        run: |
          set -euo pipefail
          for file in "$WORK_DIR"/publish/*.txt; do
            base_name=$(basename "$file" .txt)
            base64 "$file" > "$WORK_DIR/release/${base_name}"
            test -s "$WORK_DIR/release/${base_name}"
          done
          cp -- "$WORK_DIR/release"/* "$WORK_DIR/publish/"
          mapfile -t encoded_assets < <(find "$WORK_DIR/release" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_encoded_assets=(autoproxy autoproxy_lite blacklist blacklist_lite smartproxy_whitelist whitelist whitelist_lite)
          diff -u <(printf '%s\n' "${expected_encoded_assets[@]}") <(printf '%s\n' "${encoded_assets[@]}")
          mapfile -t publish_assets < <(find "$WORK_DIR/publish" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_publish_assets=(autoproxy autoproxy.txt autoproxy_lite autoproxy_lite.txt blacklist blacklist.txt blacklist_lite blacklist_lite.txt smartproxy_whitelist smartproxy_whitelist.txt source-metadata.json whitelist whitelist.txt whitelist_lite whitelist_lite.txt)
          diff -u <(printf '%s\n' "${expected_publish_assets[@]}") <(printf '%s\n' "${publish_assets[@]}")

      - name: Publish release assets
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$ACCESS_TOKEN" ] || { echo "::error::GITHUB_TOKEN 未设置，无法发布 release 分支"; exit 1; }
          cd "$WORK_DIR/publish"
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c release
          git add -- .
          git diff --cached --check
          git commit -m "v2ray-geodata: ${VERSION}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACCESS_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          if ! remote_sha=$(git ls-remote origin refs/heads/release); then
            echo "::error::读取 release 分支当前 SHA 失败"
            exit 1
          fi
          expected=$(printf '%s\n' "$remote_sha" | awk 'NR == 1 { print $1 }')
          if [ -n "$expected" ]; then
            lease="--force-with-lease=refs/heads/release:${expected}"
          else
            lease="--force-with-lease=refs/heads/release:"
          fi

          git push --quiet "$lease" -u origin HEAD:refs/heads/release
          echo "✅ release 分支已发布: ${VERSION}"
          echo "### ✅ Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`release\` → \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push main patch
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PATCH_PATH=.github/diy/openwrt-packages/patches/0001-add-v2ray-geodata.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PATCH_PATH"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ℹ️ patch 内容未变化，跳过 main 提交"
            exit 0
          fi
          git commit -m "openwrt-packages[all-tree]:v2ray-geodata: update version to ${VERSION}."

          ASKPASS="$RUNNER_TEMP/git-askpass-main.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACCESS_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          if ! remote_sha=$(git ls-remote origin refs/heads/main); then
            echo "::error::读取 main 分支当前 SHA 失败"
            exit 1
          fi
          expected=$(printf '%s\n' "$remote_sha" | awk 'NR == 1 { print $1 }')
          if [ -n "$expected" ]; then
            lease="--force-with-lease=refs/heads/main:${expected}"
          else
            lease="--force-with-lease=refs/heads/main:"
          fi

          git push --quiet "$lease" origin HEAD:refs/heads/main
          echo "✅ main 已推送: ${VERSION}"
