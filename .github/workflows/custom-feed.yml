name: 自建插件源更新 (Custom Feed Publisher)

on:
  schedule:
    - cron: '0 */12 * * *'  # 每12小时运行一次
  push:
    paths:
      - '.github/workflows/custom-feed.yml'
      - '.github/custom-feed/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      targets:
        description: '要更新的分支，逗号分隔；all 表示全部分支'
        required: false
        default: 'all'
        type: string
      force_refresh:
        description: '强制全量刷新（忽略增量跳过，重新拉取并重构所有插件）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: 准备更新分支
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: 解析目标分支
        id: resolve
        env:
          REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'all' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_TARGETS" = "all" ] || [ -z "$REQUESTED_TARGETS" ]; then
            echo 'targets=["main","qt6","mt798x","qualcommax"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A seen=()
          selected=()
          IFS=',' read -r -a requested <<< "$REQUESTED_TARGETS"
          for target in "${requested[@]}"; do
            target="${target//[[:space:]]/}"
            case "$target" in
              main|qt6|mt798x|qualcommax) ;;
              *)
                echo "::error::不支持的 packages updater 分支: ${target}"
                exit 1
                ;;
            esac
            if [ -z "${seen[$target]+x}" ]; then
              selected+=("$target")
              seen[$target]=1
            fi
          done
          [ "${#selected[@]}" -gt 0 ] || {
            echo "::error::没有可更新的 packages updater 分支"
            exit 1
          }
          TARGETS_JSON=$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "targets=${TARGETS_JSON}" >> "$GITHUB_OUTPUT"

  update:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: custom-feed-${{ matrix.target }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}

    name: 更新 ${{ matrix.target }} 分支

    steps:
      - name: 签出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 配置环境与 Git 凭据
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: 写入 Job Summary 头部
        run: |
          set -euo pipefail
          echo "# 🔄 OpenWRT Packages Updater" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: \`${{matrix.target}}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: \`${{github.event_name}}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **运行时间**: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 克隆与收集代码
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          # 使用 --single-branch 确保只克隆分支而非同名 release tag
          # 避免当仓库中存在与分支同名的 release (如 qualcommax/mt798x) 时产生歧义
          git clone --single-branch --branch "${{ matrix.target }}" https://github.com/solarflows/openwrt-packages.git "${{ matrix.target }}"
          cd "${{ matrix.target }}"

          FORCE_FLAG=""
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event.inputs.force_refresh }}" == "true" ]; then
            echo "🔥 触发源要求强制全量刷新 (push 事件或手动指定 force_refresh)"
            FORCE_FLAG="--force"
            # 强制刷新模式：彻底清理旧工作树，全量重新生成
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          else
            echo "⚡ 启用增量跳过模式 (schedule 定时任务或普通手动触发)"
          fi

          python3 $GITHUB_WORKSPACE/.github/custom-feed/scripts/collect_packages.py \
            --manifest "$GITHUB_WORKSPACE/.github/custom-feed/packages.yaml" \
            --target "${{matrix.target}}" \
            --output-dir . \
            --threads 6 \
            --lockfile packages.lock.json \
            $FORCE_FLAG

      - name: 修改代码
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/${{matrix.target}}
          chmod +x $GITHUB_WORKSPACE/.github/custom-feed/*.sh
          bash $GITHUB_WORKSPACE/.github/custom-feed/convert_translation.sh
          bash $GITHUB_WORKSPACE/.github/custom-feed/create_acl_for_luci.sh -a
          bash $GITHUB_WORKSPACE/.github/custom-feed/modify.sh

      - name: 生成插件来源摘要
        if: always()
        run: |
          set -euo pipefail
          python3 -c "
          import yaml, os
          manifest_path = r'$GITHUB_WORKSPACE/.github/custom-feed/packages.yaml'
          target = '${{matrix.target}}'
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')

          if os.path.exists(manifest_path) and summary_path:
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  data = yaml.safe_load(f)
              packages = [p for p in data.get('packages', []) if target in p.get('targets', [])]
              with open(summary_path, 'a', encoding='utf-8') as sf:
                  sf.write(f'## 📦 {target} 分支插件来源摘要 (共 {len(packages)} 个)\n\n')
                  sf.write('| 插件名称 | 功能描述 | 上游来源 |\n')
                  sf.write('|:--------|:---------|:-----|\n')
                  for p in sorted(packages, key=lambda x: x.get('name', '')):
                      name = p.get('name', '')
                      desc = ' '.join(p.get('description', '').split())
                      repo = p.get('repo', '')
                      repo_display = repo.replace('https://github.com/', '')
                      sf.write(f'| \`{name}\` | {desc} | [{repo_display}]({repo}) |\n')
                  sf.write('\n> 📌 完整插件列表请查看 [README.md](https://github.com/${{github.repository}}#-插件来源)\n')
          "

      - name: 应用补丁
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/${{matrix.target}}

          apply_patch_file() {
            local patch_file="$1"
            local is_temp="$2"
            local patch_name
            patch_name=$(basename "$patch_file")

            # 多文件补丁按 diff --git 头拆分为单文件补丁逐个应用：
            # 跨仓库多文件补丁在增量模式下可能部分应用（部分包重拉、部分跳过），
            # 整体双向探测无法判定，拆分后单文件内不会部分应用，双向探测恢复适用。
            local split_dir="$PWD/.split_$$"
            rm -rf "$split_dir" 2>/dev/null || true
            mkdir -p "$split_dir"
            awk '/^diff --git /{n++; file=sprintf("%s/%03d.patch", d, n)} n{print > file}' d="$split_dir" "$patch_file" 2>/dev/null

            local any_applied=0 any_skipped=0 any_conflict=0
            local f
            for f in "$split_dir"/*.patch; do
              [ -e "$f" ] || continue

              # 1. 检测目标软件包目录是否存在于当前 target 工作区
              local target_pkg
              target_pkg=$(awk '/^(---|\+\+\+) [ab]\// {split($2, a, "/"); print a[2]; exit}' "$f")
              if [ -n "$target_pkg" ] && [ ! -d "$target_pkg" ]; then
                any_skipped=1
                continue
              fi

              # 2. 正向应用（未打过补丁或包已拉取新版本）；失败时立即清理
              #    patch 产生的 .rej/.orig（reversed hunk 与冲突均会写 .rej）
              if patch -d './' -p1 -E --forward --batch --no-backup-if-mismatch < "$f" >/dev/null 2>&1; then
                any_applied=1
              # 3. 反向检测（该文件在增量模式下被跳过，已处于打过补丁状态）
              elif patch -R -d './' -p1 -E --batch --no-backup-if-mismatch --dry-run < "$f" >/dev/null 2>&1; then
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                any_skipped=1
              # 4. 正向与反向均失败，判定为真实冲突
              else
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                any_conflict=1
              fi
            done
            rm -rf "$split_dir" 2>/dev/null || true

            if [ "$any_conflict" = "1" ]; then
              if [ "$is_temp" = "true" ]; then
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                echo "::warning::临时补丁冲突，跳过且不提交: $patch_name"
                return 0
              else
                echo "::error::补丁冲突或目标文件校验失败: $patch_name"
                return 1
              fi
            fi

            if [ "$any_applied" = "1" ]; then
              echo "✅ 成功应用补丁: $patch_name"
            else
              echo "⚡ [增量跳过] 补丁已处于应用状态: $patch_name"
            fi
            return 0
          }

          # 应用目标专属补丁
          PATCH_DIR="$GITHUB_WORKSPACE/.github/custom-feed/patches/${{matrix.target}}"
          if [ ! -d "$PATCH_DIR" ]; then
            echo "ℹ️ 无目标专用补丁目录，跳过: $PATCH_DIR"
          else
            while IFS= read -r -d '' f; do
              apply_patch_file "$f" "false"
            done < <(find "$PATCH_DIR" -type f -name '*.patch' ! -name 'temp*' -print0 | sort -z)
            while IFS= read -r -d '' f; do
              apply_patch_file "$f" "true"
            done < <(find "$PATCH_DIR" -type f -name 'temp*.patch' -print0 | sort -z)
          fi

      - name: 应用全局补丁
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/${{matrix.target}}

          apply_patch_file() {
            local patch_file="$1"
            local is_temp="$2"
            local patch_name
            patch_name=$(basename "$patch_file")

            # 多文件补丁按 diff --git 头拆分为单文件补丁逐个应用（同目标专属补丁逻辑）
            local split_dir="$PWD/.split_$$"
            rm -rf "$split_dir" 2>/dev/null || true
            mkdir -p "$split_dir"
            awk '/^diff --git /{n++; file=sprintf("%s/%03d.patch", d, n)} n{print > file}' d="$split_dir" "$patch_file" 2>/dev/null

            local any_applied=0 any_skipped=0 any_conflict=0
            local f
            for f in "$split_dir"/*.patch; do
              [ -e "$f" ] || continue

              local target_pkg
              target_pkg=$(awk '/^(---|\+\+\+) [ab]\// {split($2, a, "/"); print a[2]; exit}' "$f")
              if [ -n "$target_pkg" ] && [ ! -d "$target_pkg" ]; then
                any_skipped=1
                continue
              fi

              if patch -d './' -p1 -E --forward --batch --no-backup-if-mismatch < "$f" >/dev/null 2>&1; then
                any_applied=1
              elif patch -R -d './' -p1 -E --batch --no-backup-if-mismatch --dry-run < "$f" >/dev/null 2>&1; then
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                any_skipped=1
              else
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                any_conflict=1
              fi
            done
            rm -rf "$split_dir" 2>/dev/null || true

            if [ "$any_conflict" = "1" ]; then
              if [ "$is_temp" = "true" ]; then
                find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete 2>/dev/null || true
                echo "::warning::全局临时补丁冲突，跳过且不提交: $patch_name"
                return 0
              else
                echo "::error::全局补丁冲突或目标文件校验失败: $patch_name"
                return 1
              fi
            fi

            if [ "$any_applied" = "1" ]; then
              echo "✅ 成功应用全局补丁: $patch_name"
            else
              echo "⚡ [增量跳过] 全局补丁已处于应用状态: $patch_name"
            fi
            return 0
          }

          # 应用全局补丁
          PATCH_DIR="$GITHUB_WORKSPACE/.github/custom-feed/patches"
          while IFS= read -r -d '' f; do
            apply_patch_file "$f" "false"
          done < <(find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' ! -name 'temp*' -print0 | sort -z)
          while IFS= read -r -d '' f; do
            apply_patch_file "$f" "true"
          done < <(find "$PATCH_DIR" -maxdepth 1 -type f -name 'temp*.patch' -print0 | sort -z)

      - name: 应用叠加层
        uses: ./.github/actions/apply-overlay
        with:
          overlay-base-dir: ${{ github.workspace }}/.github/custom-feed/overlay
          target: ${{ matrix.target }}
          working-directory: ${{ matrix.target }}
          commit: "false"

      - name: 生成分支专属 README
        run: |
          set -euo pipefail
          python3 $GITHUB_WORKSPACE/.github/custom-feed/scripts/generate_readme.py \
            --manifest "$GITHUB_WORKSPACE/.github/custom-feed/packages.yaml" \
            --template "$GITHUB_WORKSPACE/.github/custom-feed/readme-template.md" \
            --output "$GITHUB_WORKSPACE/${{matrix.target}}/README.md" \
            --target "${{matrix.target}}" \
            --lockfile "$GITHUB_WORKSPACE/${{matrix.target}}/packages.lock.json"

      - name: 提交代码
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/${{ matrix.target }}"
          [ -n "$ACCESS_TOKEN" ] || {
            echo "::error::ACCESS_TOKEN 未设置，无法推送 packages feed"
            exit 1
          }
          if [ "${{ github.event_name }}" == "schedule" ]; then
            commit_message="⏲ Schedule update-$(TZ='Asia/Shanghai' date -d now)"
          else
            commit_message="🔗 Trigger update-$(TZ='Asia/Shanghai' date -d now)"
          fi
          # 添加文件到工作区
          git add -A
          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::发现未处理的 .rej 文件，拒绝提交"
            exit 1
          fi

          # 检查是否有需要提交的更改
          if [ -n "$(git status --porcelain)" ]; then
            # 统计变更
            added=$(git diff --cached --numstat | awk '{s+=$1} END {print s}')
            removed=$(git diff --cached --numstat | awk '{s+=$2} END {print s}')
            files_changed=$(git diff --cached --numstat | wc -l)
            expected_sha=$(git rev-parse HEAD)

            whitespace_report=$(mktemp)
            whitespace_error=$(mktemp)
            if git diff --cached --check > "$whitespace_report" 2> "$whitespace_error"; then
              :
            else
              whitespace_status=$?
              if [ "$whitespace_status" -ne 2 ] || [ -s "$whitespace_error" ]; then
                cat "$whitespace_error" >&2
                cat "$whitespace_report" >&2
                echo "::error::检查暂存区空白时发生 Git 错误（退出码: $whitespace_status），拒绝提交"
                rm -f "$whitespace_report" "$whitespace_error"
                exit 1
              else
                cat "$whitespace_report" >&2
                echo "::warning::暂存区包含 trailing whitespace，保留原始内容继续提交"
              fi
            fi
            rm -f "$whitespace_report" "$whitespace_error"

            # 提交更改
            git commit -m "$commit_message"
            echo "Commit successful. Pushing changes to the repository."

            # 生成型分支仍允许覆盖远端历史，但必须锁定 clone 时的远端 SHA。
            # 远端在重试期间发生变化时直接失败，避免覆盖人工提交或其他运行结果。
            retry_push() {
              local expected="$1"
              local branch="$2"
              local push_url="https://github.com/solarflows/openwrt-packages.git"
              local lease current attempt
              lease="--force-with-lease=refs/heads/${branch}:${expected}"
              for attempt in 1 2 3; do
                if git push --quiet "$push_url" "$lease" "HEAD:refs/heads/${branch}"; then
                  return 0
                fi
                current=$(git ls-remote "$push_url" "refs/heads/${branch}" | awk 'NR == 1 {print $1}') || {
                  echo "::error::读取远端分支失败，停止推送"
                  return 1
                }
                if [ "$current" = "$(git rev-parse HEAD)" ]; then
                  echo "✅ 远端已包含本次提交"
                  return 0
                fi
                if [ "$current" != "$expected" ]; then
                  echo "::error::远端分支已变化，拒绝覆盖: refs/heads/${branch}"
                  return 1
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::推送失败，10 秒后重试 (${attempt}/3)..."
                  sleep 10
                fi
              done
              return 1
            }

            retry_push "$expected_sha" "${{matrix.target}}"

            # 输出统计到 Summary
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ✅ 提交成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **分支**: \`${{matrix.target}}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **变更文件数**: $files_changed" >> $GITHUB_STEP_SUMMARY
            echo "- **新增行数**: +$added" >> $GITHUB_STEP_SUMMARY
            echo "- **删除行数**: -$removed" >> $GITHUB_STEP_SUMMARY
            echo "- **提交信息**: $commit_message" >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes to commit. Skipping the push step."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ℹ️ 无变更" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "本次运行未检测到任何变更，跳过提交。" >> $GITHUB_STEP_SUMMARY
          fi
