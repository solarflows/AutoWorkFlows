# ════════════════════════════════════════════════════════════════════════
# ImmortalWrt Builder — unified SDK firmware orchestrator
# 通过 reusable workflow 调用 compile-firmware.yml (全量编译),
# compile-packages.yml (SDK-only 或 SDK 编译 + IB 重打包).
# 默认值统一在本文件 env + 各 reusable workflow 的 inputs.default 中定义;
# targets.json 仅保存每个 target 的差异化配置.
# ════════════════════════════════════════════════════════════════════════
name: ImmortalWrt Builder - Unified SDK Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择构建目标 (all 表示全部目标)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'both'
          - 'mt798x'
          - 'ipq60xx'
          - 'ipq807x'
      trigger:
        description: '触发模式'
        required: false
        default: 'smart'
        type: choice
        options:
          - 'smart'           # 智能检测 (自动选择最快构建路径)
          - 'full'            # 全量编译 (固件 + SDK + IB)
          - 'sdk-packages'    # 仅用 SDK 编译软件包
      cache_strategy:
        description: '缓存策略 (非 smart 策略强制全量编译)'
        required: false
        default: 'smart'
        type: choice
        options:
          - 'smart'            # 使用工具链 + ccache 缓存
          - 'clean-toolchain'  # 不用工具链缓存, ccache 正常
          - 'clean-ccache'     # 不用 ccache, 工具链缓存正常
          - 'clean-all'        # 两者都清空重建
          - 'no-cache'         # 不持久化 Actions Cache,仍允许构建内 ccache
      skip_upstream:
        description: '跳过上游同步 (节省时间)'
        required: false
        default: false
        type: boolean
      free_disk_space:
        description: '清理磁盘空间 (仅 build-firmware)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '18 22 * * 0'  # 每周日 22:18 UTC = 北京时间每周一 06:18

# 全局固定并发组: 任意时刻全仓库只允许一个 unified run 执行, 后续触发自动排队。
# 防止短时间重复触发两个 run 并行 (会同时写 artifacts-* tag 与 packages tag, 污染远端仓库)。
concurrency:
  group: firmware-build-v2
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ── 全局默认值（唯一权威来源）──────────────
  # targets.json 不再存放 defaults 块;所有缺省值由这里 + reusable workflow
  # 的 inputs.default 提供.改动默认值只需改本段 + build/*.yml 的 input 定义.
  PACKAGES_FEED_REPO:  solarflows/openwrt-packages
  PACKAGES_FEED_NAME:  solarflows
  ARTIFACTS_RELEASE_REPO: solarflows/AutoWorkflows
  ARTIFACTS_KEEP_VERSIONS: 7

jobs:
  # ════════════════════ plan: 决策与调度 ════════════════════
  plan:
    name: Plan build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      firmware_matrix_json:     ${{ steps.decision.outputs.firmware_matrix_json }}
      sdk_ib_matrix_json:       ${{ steps.decision.outputs.sdk_ib_matrix_json }}
      packages_matrix_json:     ${{ steps.decision.outputs.packages_matrix_json }}
      version:                  ${{ steps.version.outputs.version }}
      has_firmware:             ${{ steps.decision.outputs.has_firmware }}
      has_sdk_ib:               ${{ steps.decision.outputs.has_sdk_ib }}
      has_packages:             ${{ steps.decision.outputs.has_packages }}
      cache_strategy:              ${{ steps.decision.outputs.cache_strategy }}
    steps:
      - name: Checkout AutoWorkflows (sparse)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          sparse-checkout: |
            openwrt-configs/immortalwrt
          path: AutoWorkFlows

      - name: Resolve packages updater targets
        id: updater-targets
        run: |
          set -euo pipefail
          SELECTED_TARGET="${{ github.event.inputs.target || 'all' }}"
          TARGETS_FILE="AutoWorkFlows/openwrt-configs/immortalwrt/targets.json"
          if [ "$SELECTED_TARGET" = "both" ] || [ "$SELECTED_TARGET" = "all" ]; then
            UPDATER_TARGETS=$(jq -r '.targets | map(.packages_branch // .target) | unique | join(",")' "$TARGETS_FILE")
          else
            UPDATER_TARGETS=$(jq -r --arg selected "$SELECTED_TARGET" \
              '[.targets[] | select(.target == $selected) | (.packages_branch // .target)] | unique | join(",")' \
              "$TARGETS_FILE")
          fi
          [ -n "$UPDATER_TARGETS" ] || {
            echo "::error::未找到目标 ${SELECTED_TARGET} 对应的 packages updater 分支"
            exit 1
          }
          echo "targets=${UPDATER_TARGETS}" >> "$GITHUB_OUTPUT"
          echo "📦 本次只更新插件 feed 分支: ${UPDATER_TARGETS}"

      # ── 触发上游同步工作流 (可跳过) ──
      # 刻意设计: gh workflow run 不返回 run ID, 故记录触发前时间戳, 触发后轮询
      # 直到出现 created_at 晚于该时刻的新 run (最大 30s)。避免 sleep 竞态:
      # 若 5s 内 run 记录未创建或旧 run 恰好更晚, 会错拿旧 run ID 导致 watch 等错对象。
      - name: Trigger custom-feed
        if: github.event.inputs.skip_upstream != 'true'
        id: trigger-updater
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 触发 custom-feed..."
          BEFORE=$(date +%s)
          echo "before_ts=${BEFORE}" >> $GITHUB_OUTPUT
          gh workflow run custom-feed.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f targets="${{ steps.updater-targets.outputs.targets }}"
          RUN_ID=""
          for i in $(seq 1 10); do
            # gh 的 --jq 只接受单个表达式, 不支持 --argjson/--arg;
            # 时间戳是纯数字, 直接嵌入表达式 (双引号内不做路径名展开, [] 安全)
            if ! RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow custom-feed.yml --limit 20 \
              --json databaseId,createdAt,headBranch,event --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${BEFORE} and .headBranch == \"${{ github.ref_name }}\" and .event == \"workflow_dispatch\")] | .[0].databaseId // empty"); then
              echo "::error::查询 custom-feed run 失败"
              exit 1
            fi
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          if [ -n "$RUN_ID" ]; then
            echo "updater_id=$RUN_ID" >> $GITHUB_OUTPUT
            echo "✅ Updater run: $RUN_ID"
          else
            echo "⚠️ 未在 30s 内发现新的 Updater run (等待步骤会补查)"
          fi

      # ── 触发 upstream-sync (一定触发, 无 12h 去重) ──
      # 刻意设计: 每次 full 构建都触发一次 upstream-sync, 不依据上次成功时间去重,
      # 确保源码同步 (sync_lede 等) 不因上次成功时间而遗漏。
      - name: Trigger upstream-sync
        if: github.event.inputs.skip_upstream != 'true' && github.event.inputs.trigger != 'sdk-packages'
        id: trigger-sync
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 触发 upstream-sync..."
          BEFORE=$(date +%s)
          echo "before_ts=${BEFORE}" >> $GITHUB_OUTPUT
          gh workflow run upstream-sync.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
          RUN_ID=""
          for i in $(seq 1 10); do
            # gh 的 --jq 只接受单个表达式, 不支持 --argjson/--arg; 时间戳直接嵌入
            if ! RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow upstream-sync.yml --limit 20 \
              --json databaseId,createdAt,headBranch,event --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${BEFORE} and .headBranch == \"${{ github.ref_name }}\" and .event == \"workflow_dispatch\")] | .[0].databaseId // empty"); then
              echo "::error::查询 upstream-sync run 失败"
              exit 1
            fi
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          if [ -n "$RUN_ID" ]; then
            echo "sync_id=$RUN_ID" >> $GITHUB_OUTPUT
            echo "✅ Sync run: $RUN_ID"
          else
            echo "⚠️ 未在 30s 内发现新的 Sync run (等待步骤会补查)"
          fi

      - name: Purge stale draft releases
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          STALE_IDS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft and (.name | test("Build V")))] | .[].id' 2>/dev/null || true)
          if [ -n "$STALE_IDS" ]; then
            for ID in $STALE_IDS; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$ID" 2>/dev/null || true
            done
            echo "🧹 清理 $(echo $STALE_IDS | wc -w) 个 stale draft"
          else
            echo "✅ 无 stale draft"
          fi

      - name: Wait for upstream workflows
        if: github.event.inputs.skip_upstream != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE_TS="${{ steps.trigger-updater.outputs.before_ts || 0 }}"
          SYNC_BEFORE_TS="${{ steps.trigger-sync.outputs.before_ts || 0 }}"
          UPDATER_ID="${{ steps.trigger-updater.outputs.updater_id }}"
          SYNC_ID="${{ steps.trigger-sync.outputs.sync_id }}"
          WAIT_FOR_SYNC="${{ github.event.inputs.trigger != 'sdk-packages' }}"
          # 触发步骤轮询超时 (30s) 时, 这里用触发时间戳补查一次; 此时 run 必然已创建
          if [ -z "$UPDATER_ID" ] && [ -n "$BEFORE_TS" ] && [ "$BEFORE_TS" != "0" ]; then
            echo "🔎 触发步骤未取到 Updater run ID, 补查..."
            for i in $(seq 1 10); do
              if ! UPDATER_ID=$(gh run list --repo ${{ github.repository }} --workflow custom-feed.yml --limit 20 \
                --json databaseId,createdAt,headBranch,event --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${BEFORE_TS} and .headBranch == \"${{ github.ref_name }}\" and .event == \"workflow_dispatch\")] | .[0].databaseId // empty"); then
                echo "::error::补查 custom-feed run 失败"
                exit 1
              fi
              [ -n "$UPDATER_ID" ] && break
              sleep 3
            done
          fi
          if [ -n "$UPDATER_ID" ]; then
            if timeout 3600 gh run watch "$UPDATER_ID" --repo ${{ github.repository }} --interval 5 --exit-status; then
              echo "✅ updater 完成"
            else
              echo "::error::updater 失败或超时，停止构建"
              exit 1
            fi
          else
            echo "::error::updater run ID 未获取，停止构建"
            exit 1
          fi
          if [ "$WAIT_FOR_SYNC" = "true" ] && [ -z "$SYNC_ID" ] && [ -n "$SYNC_BEFORE_TS" ] && [ "$SYNC_BEFORE_TS" != "0" ]; then
            echo "🔎 触发步骤未取到 upstream-sync run ID, 补查..."
            for i in $(seq 1 10); do
              if ! SYNC_ID=$(gh run list --repo ${{ github.repository }} --workflow upstream-sync.yml --limit 20 \
                --json databaseId,createdAt,headBranch,event --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${SYNC_BEFORE_TS} and .headBranch == \"${{ github.ref_name }}\" and .event == \"workflow_dispatch\")] | .[0].databaseId // empty"); then
                echo "::error::补查 upstream-sync run 失败"
                exit 1
              fi
              [ -n "$SYNC_ID" ] && break
              sleep 3
            done
          fi
          if [ "$WAIT_FOR_SYNC" != "true" ]; then
            echo "⏭️ sdk-packages 模式不触发或等待 upstream-sync"
          elif [ -n "$SYNC_ID" ]; then
            if timeout 3600 gh run watch "$SYNC_ID" --repo ${{ github.repository }} --interval 5 --exit-status; then
              echo "✅ sync 完成"
            else
              echo "::error::sync 失败或超时，停止构建"
              exit 1
            fi
          else
            echo "::error::sync run ID 未获取，停止构建"
            exit 1
          fi

      # ── 版本号生成 ──
      - name: Set build version
        id: version
        run: |
          NOW=$(TZ=${{ env.TZ }} date +'%Y-%m-%d %H:%M:%S')
          VERSION="V$(echo "$NOW" | awk '{gsub(/[:-]/," "); split($0,a," "); printf "%s%s%s", substr(a[1],3), a[2], a[3]}')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # ── 恢复构建状态 (跨 run 持久化上次构建 SHA) ──
      # 刻意设计: 用 Repository Variable 单份存储 (替代 v1 的 immwrt-state-* 缓存 key)。
      # actions/cache 不可变, 每 run 一个新 key 会累积挤占 10GB 配额; Variable 天然单份、
      # 无配额、零清理逻辑。并发由全局 concurrency group 保证同一时刻只有一个 v2 run。
      # ⚠️ 写 Variable 必须用 PAT (GITHUB_TOKEN 仅能读, 不能创建/修改 repository variables)。
      - name: Restore build state
        id: cache-build-state
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          STATE=$(gh api "repos/${{ github.repository }}/actions/variables/IMMWRT_BUILD_STATE" \
            --jq '.value // empty' 2>/dev/null || true)
          if [ -n "$STATE" ]; then
            echo "$STATE" > build-state.json
            echo "📦 构建状态已从 Variable 加载 ($(jq 'keys | length' build-state.json 2>/dev/null || echo 0) 个 target)"
          else
            echo "📦 无构建状态 Variable (首次构建)"
            echo '{}' > build-state.json
          fi
          cat build-state.json

      # ── 加载目标 + SHA 状态检查 + 上游变更范围检测 ──
      - name: Load targets & check changes
        id: load-targets
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set +e
          TARGET_FILTER="${{ github.event.inputs.target || 'all' }}"
          JSON_FILE="AutoWorkFlows/openwrt-configs/immortalwrt/targets.json"
          [ -f "$JSON_FILE" ] || { echo "::error::targets.json 不存在"; exit 1; }

          # ── 过滤目标 + 应用 workflow 内置默认值 (jq `//` 兜底所有缺省字段) ──
          # 默认值来源: 本文件 env (PACKAGES_FEED_REPO / ...)
          # targets.json 不再包含 defaults 块,只存每个 target 的差异化字段.
          FILTERED=$(jq -c --arg t "$TARGET_FILTER" \
            --arg pkg_repo "${{ env.PACKAGES_FEED_REPO }}" \
            --arg pkg_name "${{ env.PACKAGES_FEED_NAME }}" \
            --arg artifacts_repo "${{ env.ARTIFACTS_RELEASE_REPO }}" \
            --argjson artifacts_keep "${{ env.ARTIFACTS_KEEP_VERSIONS }}" '
            if $t == "both" or $t == "all" then .targets
            else [.targets[] | select(.target == $t)] end |
            map(. + {
              packages_branch:   (.packages_branch   // .target),
              packages_feed_repo: (.packages_feed_repo // $pkg_repo),
              packages_feed_name: (.packages_feed_name // $pkg_name),
              standard_packages_repo: (.standard_packages_repo // "solarflows/packages"),
              standard_packages_branch: (.standard_packages_branch // "master"),
              release_repo:      (.release_repo      // .repo),
              # 固件 release tag 统一为 <target>-<version> (分支/目标 + 版本):
              # 同仓库多 target (ipq60xx/ipq807x) 必须分开 release, 否则同名资产
              # (config.buildinfo/seed/manifest) 互相覆盖; mt798x 此前用裸 V* 与
              # ipq 系不统一。默认前缀 = target 名, 显式配置优先。
              firmware_release_tag_prefix: (.firmware_release_tag_prefix // .target),
              passwall_repo:     (.passwall_repo     // $pkg_repo),
              passwall_tag:      (.passwall_tag      // "packages"),
              sdk_packages:      (.sdk_packages      // "*"),
              artifacts_release_repo: (.artifacts_release_repo // $artifacts_repo),
              artifacts_release_tag:  (.artifacts_release_tag  // ("artifacts-" + .target)),
              artifacts_keep_versions: (.artifacts_keep_versions // $artifacts_keep)
            })
          ' "$JSON_FILE")
          echo "$FILTERED" > /tmp/filtered_targets.json

          echo "📋 加载 $(echo "$FILTERED" | jq 'length') 个目标 (过滤: $TARGET_FILTER)"

          # ── 加载 build-state.json ──
          if [ -f build-state.json ]; then
            echo "📦 缓存状态已加载 ($(jq 'keys | length' build-state.json) 个 target)"
          else
            echo "📦 无缓存状态 (首次构建)"
            echo '{}' > build-state.json
          fi

          # ── SHA 检测（per-target，不能由一个 target 短路其他 target）──
          : > /tmp/change_report.txt
          : > /tmp/target_stage.jsonl

          for MATRIX_TARGET in $(echo "$FILTERED" | jq -r '.[].target'); do
            SRC_STATUS="—"; PKG_STATUS="—"; STD_PKG_STATUS="—"; KERNEL_STATUS="—"
            SOURCE_CHANGED=false; PACKAGES_CHANGED=false; STANDARD_PACKAGES_CHANGED=false; KERNEL_CHANGED=false

            CURR_REPO=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .repo')
            CURR_REF=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .ref')
            CURR_PKG_BRANCH=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .packages_branch')
            CURR_PKG_REPO=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .packages_feed_repo')
            CURR_STD_PKG_REPO=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .standard_packages_repo')
            CURR_STD_PKG_BRANCH=$(echo "$FILTERED" | jq -r --arg t "$MATRIX_TARGET" '.[] | select(.target == $t) | .standard_packages_branch')

            CURR_SRC=$(git ls-remote "https://github.com/${CURR_REPO}" "${CURR_REF}" 2>/dev/null | cut -f1 | head -1)
            if [ -z "$CURR_SRC" ]; then
              echo "::error::[${MATRIX_TARGET}] 无法读取源码仓库 ${CURR_REPO}@${CURR_REF}"
              exit 1
            fi
            LAST_SRC=$(jq -r ".\"${MATRIX_TARGET}\".source_sha // empty" build-state.json)
            SRC_TREE_SAME=false
            if [ -n "$LAST_SRC" ] && [ "$LAST_SRC" != "$CURR_SRC" ]; then
              CURR_SRC_TREE=$(gh api "repos/${CURR_REPO}/commits/${CURR_SRC}" --jq '.commit.tree.sha' 2>/dev/null || true)
              LAST_SRC_TREE=$(gh api "repos/${CURR_REPO}/commits/${LAST_SRC}" --jq '.commit.tree.sha' 2>/dev/null || true)
              if [ -n "$CURR_SRC_TREE" ] && [ -n "$LAST_SRC_TREE" ] && [ "$CURR_SRC_TREE" = "$LAST_SRC_TREE" ]; then
                SRC_TREE_SAME=true
              fi
            fi

            if [ -n "$LAST_SRC" ] && [ "$LAST_SRC" = "$CURR_SRC" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 源码未变更 (${CURR_SRC:0:7})"
              SRC_STATUS="✅ 未变更"
            elif [ "$SRC_TREE_SAME" = "true" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 源码仅提交元数据变动，内容树未变更 (${CURR_SRC_TREE:0:7})"
              SRC_STATUS="✅ 树未变更"
            else
              echo "  🔵 [${MATRIX_TARGET}] 源码变更: ${LAST_SRC:-无} → ${CURR_SRC:0:7}"
              SOURCE_CHANGED=true
              SRC_STATUS="🔵 变更"

              # ── 上游变更范围检测 (compare API 优先,本地浅克隆兜底) ──
              if [ -n "$LAST_SRC" ]; then
                echo "    🔍 [${MATRIX_TARGET}] 检测变更范围..."
                CHANGED_PATHS=""

                # 方案 A: GitHub compare API (无需登录,公开仓库可用)
                CHANGED_PATHS=$(gh api "repos/${CURR_REPO}/compare/${LAST_SRC}...${CURR_SRC}" \
                                 --jq '.files[].filename' 2>/dev/null || true)
                if [ -n "$CHANGED_PATHS" ]; then
                  echo "    ✅ compare API 命中 ($(echo "$CHANGED_PATHS" | wc -l) 个文件)"
                else
                  echo "    ⚠️ compare API 失败 (commit 可能有强推删除)"
                fi

                # 方案 B: 本地浅克隆 diff 兜底 (无认证,适合公开仓库)
                if [ -z "$CHANGED_PATHS" ]; then
                  echo "    🔄 熔断到本地 diff..."
                  TMPD=$(mktemp -d)
                  if git clone --depth=1 --branch="${CURR_REF}" "https://github.com/${CURR_REPO}" "$TMPD/src" 2>/dev/null; then
                    cd "$TMPD/src"
                    git fetch --depth=1 origin "$LAST_SRC" 2>/dev/null
                    if git cat-file -e "${LAST_SRC}" 2>/dev/null; then
                      CHANGED_PATHS=$(git diff --name-only "${LAST_SRC}..HEAD" 2>/dev/null)
                      [ -n "$CHANGED_PATHS" ] && echo "    ✅ 本地 diff 命中 ($(echo "$CHANGED_PATHS" | wc -l) 个文件)"
                    else
                      echo "    ⚠️ 本地 fetch last_sha 失败 (commit 已被 GC)"
                    fi
                    cd - >/dev/null
                  else
                    echo "    ⚠️ 本地克隆失败"
                  fi
                  rm -rf "$TMPD"
                fi

                # 判定 kernel/toolchain 范围
                if [ -n "$CHANGED_PATHS" ]; then
                  KERNEL_COUNT=$(echo "$CHANGED_PATHS" | grep -E '^(target/linux|toolchain|config/|include/|rules\.mk|make\.mk|package/kernel/)' | wc -l)
                  if [ "$KERNEL_COUNT" -gt 0 ]; then
                    echo "    🔴 检测到 kernel/toolchain 范围变更 (${KERNEL_COUNT} 个文件)"
                    KERNEL_CHANGED=true
                    KERNEL_STATUS="🔴 变更"
                  else
                    echo "    🟢 仅 feed/package 范围变更"
                    KERNEL_STATUS="🟢 仅 package"
                  fi
                else
                  # API 和本地都失败 → 保守降级到全量
                  echo "    ⚪ 变更范围不可测,降级为 kernel 变更处理"
                  KERNEL_CHANGED=true
                  KERNEL_STATUS="🔴 不可测"
                fi
              else
                # 首次构建,无 last_src → 必然走全量
                KERNEL_CHANGED=true
                KERNEL_STATUS="🔴 首次构建"
              fi
            fi

            CURR_PKG=$(git ls-remote "https://github.com/${CURR_PKG_REPO}.git" "${CURR_PKG_BRANCH}" 2>/dev/null | cut -f1 | head -1)
            if [ -z "$CURR_PKG" ]; then
              echo "::error::[${MATRIX_TARGET}] 无法读取插件 feed ${CURR_PKG_REPO}@${CURR_PKG_BRANCH}"
              exit 1
            fi
            LAST_PKG=$(jq -r ".\"${MATRIX_TARGET}\".packages_sha // empty" build-state.json)
            if [ -n "$LAST_PKG" ] && [ "$LAST_PKG" = "$CURR_PKG" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 软件包未变更 (${CURR_PKG:0:7})"
              PKG_STATUS="✅ 未变更"
            else
              echo "  🟡 [${MATRIX_TARGET}] 软件包变更: ${LAST_PKG:-无} → ${CURR_PKG:0:7}"
              PACKAGES_CHANGED=true
              PKG_STATUS="🟡 变更"
            fi
            CURR_STD_PKG=$(git ls-remote "https://github.com/${CURR_STD_PKG_REPO}.git" "${CURR_STD_PKG_BRANCH}" 2>/dev/null | cut -f1 | head -1)
            if [ -z "$CURR_STD_PKG" ]; then
              echo "::error::[${MATRIX_TARGET}] 无法读取标准 packages feed ${CURR_STD_PKG_REPO}@${CURR_STD_PKG_BRANCH}"
              exit 1
            fi
            LAST_STD_PKG=$(jq -r ".\"${MATRIX_TARGET}\".standard_packages_sha // empty" build-state.json)
            STD_TREE_SAME=false
            if [ -n "$LAST_STD_PKG" ] && [ "$LAST_STD_PKG" != "$CURR_STD_PKG" ]; then
              CURR_STD_TREE=$(gh api "repos/${CURR_STD_PKG_REPO}/commits/${CURR_STD_PKG}" --jq '.commit.tree.sha' 2>/dev/null || true)
              LAST_STD_TREE=$(gh api "repos/${CURR_STD_PKG_REPO}/commits/${LAST_STD_PKG}" --jq '.commit.tree.sha' 2>/dev/null || true)
              if [ -n "$CURR_STD_TREE" ] && [ -n "$LAST_STD_TREE" ] && [ "$CURR_STD_TREE" = "$LAST_STD_TREE" ]; then
                STD_TREE_SAME=true
              fi
            fi

            if [ -n "$LAST_STD_PKG" ] && [ "$LAST_STD_PKG" = "$CURR_STD_PKG" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 标准 packages feed 未变更 (${CURR_STD_PKG:0:7})"
              STD_PKG_STATUS="✅ 未变更"
            elif [ "$STD_TREE_SAME" = "true" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 标准 packages feed 仅提交元数据变动，内容树未变更 (${CURR_STD_TREE:0:7})"
              STD_PKG_STATUS="✅ 树未变更"
            else
              echo "  🟠 [${MATRIX_TARGET}] 标准 packages feed 变更: ${LAST_STD_PKG:-无} → ${CURR_STD_PKG:0:7}"
              STANDARD_PACKAGES_CHANGED=true
              STD_PKG_STATUS="🟠 变更"
            fi

            # ── 目标配置文件变更检测 (seed 种子目录 + targets.json 配置定义) ──
            # 使用原始 targets.json（不含 jq 默认值注入）+ 绝对路径，与 executor
            # 侧公式一致。CURR_CFG 会一并传入 executor 写入 build-info.json，
            # 再由 persist-state 回写 state，确保 plan→exec→persist 闭环一致。
            CURR_TARGET_CFG=$(jq -c --arg t "$MATRIX_TARGET" '.targets[] | select(.target == $t)' "$JSON_FILE" 2>/dev/null || echo "")
            CURR_CFG=$( (echo "$CURR_TARGET_CFG"; find "${GITHUB_WORKSPACE}/AutoWorkFlows/openwrt-configs/immortalwrt/${MATRIX_TARGET}" -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) | sha256sum | cut -d' ' -f1 )
            LAST_CFG=$(jq -r ".\"${MATRIX_TARGET}\".config_sha // empty" build-state.json)
            CONFIG_CHANGED=false
            if [ -n "$LAST_CFG" ] && [ "$LAST_CFG" = "$CURR_CFG" ]; then
              echo "  ✅ [${MATRIX_TARGET}] 目标配置未变更 (${CURR_CFG:0:7})"
              CFG_STATUS="✅ 未变更"
            elif [ -n "$LAST_CFG" ]; then
              echo "  🟣 [${MATRIX_TARGET}] 目标配置变更: ${LAST_CFG:0:7} → ${CURR_CFG:0:7}"
              CONFIG_CHANGED=true
              CFG_STATUS="🟣 变更"
            else
              echo "  🟣 [${MATRIX_TARGET}] 目标配置无历史指纹 (${CURR_CFG:0:7})，确立基准走全量"
              CONFIG_CHANGED=true
              CFG_STATUS="🟣 无基准"
            fi

            # per-target 中间结果落盘: 本 step (SHA/config 检测) 与包级检测 step 拆分后
            # (GitHub 单 step run: 块 21000 字符上限, 见 pitfalls 文档), 循环内 shell
            # 变量跨 step 不可见, 经 /tmp/target_stage.jsonl 传递。
            # -c 必需: jq 对多行 filter 字面量会保留多行形态 pretty-print 输出
            # (run 36226606223: 每 target 写 22 行碎片, 下游 while read 逐行读出
            #  非法 JSON), -c 强制单行紧凑 JSONL。
            jq -nc --arg t "$MATRIX_TARGET" \
              --arg curr_repo "$CURR_REPO" --arg curr_src "$CURR_SRC" \
              --arg curr_pkg "$CURR_PKG" --arg curr_cfg "$CURR_CFG" \
              --arg curr_pkg_branch "$CURR_PKG_BRANCH" --arg curr_pkg_repo "$CURR_PKG_REPO" \
              --arg curr_std_pkg_repo "$CURR_STD_PKG_REPO" --arg last_std_pkg "$LAST_STD_PKG" --arg curr_std_pkg "$CURR_STD_PKG" \
              --arg src_status "$SRC_STATUS" --arg pkg_status "$PKG_STATUS" --arg std_pkg_status "$STD_PKG_STATUS" \
              --arg kernel_status "$KERNEL_STATUS" --arg cfg_status "$CFG_STATUS" \
              --argjson src_changed "$SOURCE_CHANGED" --argjson pkg_changed "$PACKAGES_CHANGED" \
              --argjson std_pkg_changed "$STANDARD_PACKAGES_CHANGED" --argjson kernel_changed "$KERNEL_CHANGED" \
              --argjson config_changed "$CONFIG_CHANGED" \
              '{target:$t, curr_repo:$curr_repo, curr_src:$curr_src, curr_pkg:$curr_pkg, curr_cfg:$curr_cfg,
                curr_pkg_branch:$curr_pkg_branch, curr_pkg_repo:$curr_pkg_repo, curr_std_pkg_repo:$curr_std_pkg_repo,
                last_std_pkg:$last_std_pkg, curr_std_pkg:$curr_std_pkg,
                src_status:$src_status, pkg_status:$pkg_status, std_pkg_status:$std_pkg_status,
                kernel_status:$kernel_status, cfg_status:$cfg_status,
                src_changed:$src_changed, pkg_changed:$pkg_changed, std_pkg_changed:$std_pkg_changed,
                kernel_changed:$kernel_changed, config_changed:$config_changed}' \
              >> /tmp/target_stage.jsonl
          done

          {
            echo "### 🔍 变更检测 stage 1（SHA / config）"
            echo ""
            echo "| 目标 | 源码 | 插件 feed | 标准 packages | 内核/Toolchain | 目标配置 |"
            echo "|---|---|---|---|---|---|"
            while IFS='|' read -r t s p sp k c; do
              echo "| \`${t}\` | ${s} | ${p} | ${sp} | ${k} | ${c} |"
            done < /tmp/change_report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 包级变更检测（tree SHA 真值锁）──
      # step 拆分原因: 单 step run: 块超 GitHub 21000 字符上限触发 422,
      # 见 docs/openwrt-build-pitfalls.md § 单 step run: 块超 21000 字符触发 workflow 解析 422。
      # 输入: /tmp/target_stage.jsonl (上一 step 逐 target 落盘的 SHA/config 检测结果)。
      # 输出: /tmp/target_pkg_stage.jsonl (sdk_packages + 撤销后的变更标记)。
      - name: Detect package-level changes
        id: pkg-detect
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set +e
          CURR_TRIGGER="${{ github.event.inputs.trigger || 'smart' }}"
          : > /tmp/target_pkg_stage.jsonl
          : > /tmp/pkg_report.txt
          while IFS= read -r STAGE; do
            [ -n "$STAGE" ] || continue
            MATRIX_TARGET=$(echo "$STAGE" | jq -r '.target')
            CURR_REPO=$(echo "$STAGE" | jq -r '.curr_repo')
            CURR_SRC=$(echo "$STAGE" | jq -r '.curr_src')
            CURR_PKG_BRANCH=$(echo "$STAGE" | jq -r '.curr_pkg_branch')
            CURR_PKG_REPO=$(echo "$STAGE" | jq -r '.curr_pkg_repo')
            CURR_STD_PKG_REPO=$(echo "$STAGE" | jq -r '.curr_std_pkg_repo')
            LAST_STD_PKG=$(echo "$STAGE" | jq -r '.last_std_pkg')
            CURR_STD_PKG=$(echo "$STAGE" | jq -r '.curr_std_pkg')
            PACKAGES_CHANGED=$(echo "$STAGE" | jq -r '.pkg_changed')
            STANDARD_PACKAGES_CHANGED=$(echo "$STAGE" | jq -r '.std_pkg_changed')
            PKG_STATUS=$(echo "$STAGE" | jq -r '.pkg_status')
            UPSTREAM_FEEDS_CHANGED=false
            FEEDS_UNMEASURABLE=false
            TEMP_CHANGED=""
            CHANGED_PACKAGES_FINAL="*"
            if [ "$CURR_TRIGGER" = "smart" ]; then
              # ── a. custom feed 目录树表（trees API 一次拿全部顶层目录，per-branch 缓存）──
              # 缓存路径带 GITHUB_RUN_ID: 同一 plan job 内多 target 共享（qualcomm 双目标
              # 共用 qualcommax 分支），跨 run 失效——自托管 runner 复用 /tmp 也不会读到旧值。
              TREES_CACHE="/tmp/feed-trees-${CURR_PKG_BRANCH}-${GITHUB_RUN_ID}.json"
              if [ ! -f "$TREES_CACHE" ]; then
                gh api "repos/${CURR_PKG_REPO}/git/trees/${CURR_PKG_BRANCH}" \
                  --jq '[.tree[] | select(.type == "tree") | {(.path): .sha}] | add // {}' \
                  > "$TREES_CACHE" 2>/dev/null || echo '{}' > "$TREES_CACHE"
              fi
              CURR_TREES=$(cat "$TREES_CACHE")

              # ── b. custom feed 变更包（目录 tree SHA 对比，新增/变化/删除均计入）──
              if [ "$PACKAGES_CHANGED" = "true" ]; then
                echo "  🔍 [${MATRIX_TARGET}] custom feed 目录树对比..."
                LAST_TREES=$(jq -r ".\"${MATRIX_TARGET}\".feed_trees // {}" build-state.json)
                for pkg_name in $(echo "$CURR_TREES" | jq -r 'keys[]'); do
                  curr_tree=$(echo "$CURR_TREES" | jq -r --arg p "$pkg_name" '.[$p]')
                  last_tree=$(echo "$LAST_TREES" | jq -r --arg p "$pkg_name" '.[$p] // empty')
                  if [ -z "$last_tree" ] || [ "$last_tree" != "$curr_tree" ]; then
                    TEMP_CHANGED="$TEMP_CHANGED $pkg_name"
                  fi
                done
                for pkg_name in $(echo "$LAST_TREES" | jq -r 'keys[]'); do
                  echo "$CURR_TREES" | jq -e --arg p "$pkg_name" 'has($p)' >/dev/null 2>&1 || TEMP_CHANGED="$TEMP_CHANGED $pkg_name"
                done
              fi

              # ── c. 变更 feed 的包级 diff（compare → 包名，剔除 custom feed 覆盖）──
              # 包名取法兼容两类 feed 布局: openwrt/packages 与 luci 为 分类/包/... (取
              # 第 2 级), routing/telephony/video 为 包/... (取第 1 级)。
              # 设计取舍: 根级非包文件 (Config.in/README 等, NF==1) 变更不计入包集合，
              # 认为不影响包产物——若 diff 仅含此类文件，汇总阶段会撤销该 feed 的变更信号。
              feed_diff_to_pkgs() {
                local FD_REPO="$1" FD_BASE="$2" FD_TIP="$3"
                local FD_PATHS f_path pkg_name
                FD_PATHS=$(gh api "repos/${FD_REPO}/compare/${FD_BASE}...${FD_TIP}" --jq '.files[].filename' 2>/dev/null || true)
                if [ -z "$FD_PATHS" ]; then
                  return 1
                fi
                for f_path in $FD_PATHS; do
                  pkg_name=$(echo "$f_path" | awk -F/ 'NF >= 3 {print $2; next} NF == 2 {print $1}')
                  [ -n "$pkg_name" ] || continue
                  if ! echo "$CURR_TREES" | jq -e --arg p "$pkg_name" 'has($p)' >/dev/null 2>&1; then
                    TEMP_CHANGED="$TEMP_CHANGED $pkg_name"
                  fi
                done
                return 0
              }
              if [ "$STANDARD_PACKAGES_CHANGED" = "true" ]; then
                echo "  🔍 [${MATRIX_TARGET}] 标准 packages 包级 diff..."
                if [ -z "$LAST_STD_PKG" ]; then
                  # 无基线 (新 target 首建): 与 config_sha 无基准同语义, 全量建基线;
                  # 不能以空 base 调 compare (URL 无效, 会误报「超 250 文件」误导排障)。
                  echo "  🔴 [${MATRIX_TARGET}] 标准 packages 无历史基线, 确立基准走全量"
                  FEEDS_UNMEASURABLE=true
                elif ! feed_diff_to_pkgs "$CURR_STD_PKG_REPO" "$LAST_STD_PKG" "$CURR_STD_PKG"; then
                  echo "  ⚪ [${MATRIX_TARGET}] 标准 packages diff 不可测 (可能超 250 文件)"
                  FEEDS_UNMEASURABLE=true
                fi
              fi
              CONF_KEY=$(printf '%s@%s' "$CURR_REPO" "$CURR_SRC" | sha256sum | cut -c1-12)
              FEEDS_CONF_CACHE="/tmp/feeds-conf-${CONF_KEY}-${GITHUB_RUN_ID}.txt"
              if [ ! -f "$FEEDS_CONF_CACHE" ]; then
                gh api -H "Accept: application/vnd.github.raw+json" \
                  "repos/${CURR_REPO}/contents/feeds.conf.default?ref=${CURR_SRC}" \
                  > "$FEEDS_CONF_CACHE" 2>/dev/null || : > "$FEEDS_CONF_CACHE"
              fi
              # ── 上游 feed 基线闸门: feeds_sha 只由 executor 构建后回写, 若无基线还判
              # "无变更" 会永久 skip → 基线永远建立不起来 → 上游 luci 无限漂移不触发。
              # 与 config_sha 无基准同语义: 强制全量建基线 (打破 skip 死锁)。
              if ! jq -e ".\"${MATRIX_TARGET}\".feeds_sha | type == \"object\"" build-state.json >/dev/null 2>&1; then
                echo "  🔴 [${MATRIX_TARGET}] 上游 feed 无历史基线, 确立基准走全量"
                FEEDS_UNMEASURABLE=true
              fi
              if [ -s "$FEEDS_CONF_CACHE" ]; then
                while read -r feed_name feed_url feed_branch; do
                  [ -n "$feed_name" ] || continue
                  LAST_FEED_SHA=$(jq -r ".\"${MATRIX_TARGET}\".feeds_sha[\"${feed_name}\"] // empty" build-state.json)
                  [ -z "$LAST_FEED_SHA" ] && continue
                  CURR_FEED_SHA=$(git ls-remote "$feed_url" "${feed_branch:-HEAD}" 2>/dev/null | cut -f1 | head -1)
                  [ -z "$CURR_FEED_SHA" ] && continue
                  if [ "$CURR_FEED_SHA" != "$LAST_FEED_SHA" ]; then
                    UPSTREAM_FEEDS_CHANGED=true
                    echo "  🔵 [${MATRIX_TARGET}] 上游 feed ${feed_name} 变更: ${LAST_FEED_SHA:0:7} → ${CURR_FEED_SHA:0:7}"
                    feed_repo=$(echo "$feed_url" | sed -E 's|^https://github.com/||; s|\.git$||')
                    if ! feed_diff_to_pkgs "$feed_repo" "$LAST_FEED_SHA" "$CURR_FEED_SHA"; then
                      echo "  ⚪ [${MATRIX_TARGET}] ${feed_name} diff 不可测 (可能超 250 文件)"
                      FEEDS_UNMEASURABLE=true
                    fi
                  fi
                done < <(sed -nE -e 's|^src-git[[:space:]]+([^[:space:]]+)[[:space:]]+([^[:space:]]+);([^[:space:]]+)$|\1 \2 \3|p' \
                                 -e 's|^src-git[[:space:]]+([^[:space:]]+)[[:space:]]+([^[:space:];]+)$|\1 \2|p' \
                                 "$FEEDS_CONF_CACHE" | awk '$1 != "packages"')
              else
                # conf 不可读 → 无法比对上游 feed, 与 kernel 检测「不可测降级」同模式,
                # 保守回退全量而非静默跳过 (静默跳过 = 重新引入上游 feed 漏检盲区)。
                echo "  ⚪ [${MATRIX_TARGET}] feeds.conf.default 不可读, 上游 feed 检测不可测"
                FEEDS_UNMEASURABLE=true
              fi

              # ── d. 汇总：空集撤销信号，非空走 sdk.config 交集路由 ──
              # FEEDS_UNMEASURABLE 也须进入汇总: 无基线/conf 不可测时即使各 feed HEAD
              # 均未变, 也要走全量建基线 (否则 skip 死锁, 基线永远写不回)。
              if [ "$PACKAGES_CHANGED" = "true" ] || [ "$STANDARD_PACKAGES_CHANGED" = "true" ] || [ "$UPSTREAM_FEEDS_CHANGED" = "true" ] || [ "$FEEDS_UNMEASURABLE" = "true" ]; then
                TEMP_CHANGED=$(echo "$TEMP_CHANGED" | xargs | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
                if [ "$FEEDS_UNMEASURABLE" = "true" ]; then
                  echo "  🔴 [${MATRIX_TARGET}] feed diff 不可测, 回退全量"
                  PKG_STATUS="🔴 不可测"
                  CHANGED_PACKAGES_FINAL="*"
                  PACKAGES_CHANGED=true
                elif [ -n "$TEMP_CHANGED" ]; then
                  # 变更包集合非空: 统一信号走包级路由（标准/上游 feed 的变更已折入集合）
                  PACKAGES_CHANGED=true
                  # 求变更包 ∩ sdk.config 包的交集: SDK 只能编译 sdk.config 清单内的包
                  # (package 目录已固化); 不在清单内的包 (如 tailscale/wrtbwmon) 只能
                  # 由全量编译产出, 变更时需升级为全量而非 SDK 增量。
                  CONFIG_FILE="${GITHUB_WORKSPACE}/AutoWorkFlows/openwrt-configs/immortalwrt/${MATRIX_TARGET}/sdk.config"
                  SDK_CONFIG_PKGS=$(if [ -f "$CONFIG_FILE" ]; then
                    grep -E '^CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]*=[ym]$' "$CONFIG_FILE" | sed -E 's/CONFIG_PACKAGE_(.*)=[ym]/\1/' | sed 's/luci-i18n-[^ ]*//g' | tr '\n' ' ' | sed 's/^ *//;s/ *$//'
                  else echo ""; fi)
                  OUTSIDE_SDK=""
                  INTERSECT=""
                  for pkg_name in $TEMP_CHANGED; do
                    if echo " $SDK_CONFIG_PKGS " | grep -q " $pkg_name "; then
                      INTERSECT="$INTERSECT $pkg_name"
                    else
                      OUTSIDE_SDK="$OUTSIDE_SDK $pkg_name"
                    fi
                  done
                  INTERSECT=$(echo "$INTERSECT" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
                  OUTSIDE_SDK=$(echo "$OUTSIDE_SDK" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
                  if [ -n "$OUTSIDE_SDK" ]; then
                    echo "  🔴 [${MATRIX_TARGET}] $(echo "$OUTSIDE_SDK" | wc -w) 个变更包不在 sdk.config 内 (${OUTSIDE_SDK}) → 升级全量编译"
                    # 保持 PACKAGES_CHANGED=true: 变更包集合已确认具体包变了;
                    # Stage 2 会根据 sdk_packages="*" 把本 target 路由到全量固件编译。
                    PKG_STATUS="🟠 需全量"
                    CHANGED_PACKAGES_FINAL="*"
                  else
                    echo "  🟡 [${MATRIX_TARGET}] $(echo "$INTERSECT" | wc -w) 个包变更: ${INTERSECT}"
                    CHANGED_PACKAGES_FINAL="$INTERSECT"
                    PKG_STATUS="🟡 $(echo "$INTERSECT" | wc -w)个"
                  fi
                else
                  echo "  ✅ [${MATRIX_TARGET}] 包级指纹一致——撤销 feed 级变更信号"
                  # 撤销语义含两类情况: ① 各 feed HEAD 未变; ② HEAD 变了但 diff 仅含
                  # 根级非包文件或被 custom feed 覆盖的包——均视为不影响构建输入。
                  PACKAGES_CHANGED=false
                  STANDARD_PACKAGES_CHANGED=false
                  PKG_STATUS="✅ 包级一致"
                  CHANGED_PACKAGES_FINAL=""
                fi
              fi
            fi
            # per-target 包级结果落盘: 变量随循环结束丢失, finalize step 从此文件读取
            # -c 必需: 同 stage 1, 强制单行紧凑 JSONL (run 36226606223 教训)
            jq -nc --arg t "$MATRIX_TARGET" \
              --arg sdk_pkgs "$CHANGED_PACKAGES_FINAL" --arg pkg_status "$PKG_STATUS" \
              --argjson pkg_changed "$PACKAGES_CHANGED" --argjson std_pkg_changed "$STANDARD_PACKAGES_CHANGED" \
              '{target:$t, sdk_packages:$sdk_pkgs, pkg_status:$pkg_status, pkg_changed:$pkg_changed, std_pkg_changed:$std_pkg_changed}' \
              >> /tmp/target_pkg_stage.jsonl
            echo "${MATRIX_TARGET}|${PKG_STATUS}|${CHANGED_PACKAGES_FINAL}" >> /tmp/pkg_report.txt
          done < /tmp/target_stage.jsonl

          {
            echo "### 🔍 变更检测 stage 2（包级指纹）"
            echo ""
            echo "| 目标 | 包级状态 | sdk_packages |"
            echo "|---|---|---|"
            while IFS='|' read -r t p s; do
              echo "| \`${t}\` | ${p} | \`${s}\` |"
            done < /tmp/pkg_report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # ── IB 参数提取 + 最终变更汇总 ──
      # 组装 target_changes.json (决策 step 的输入): stage 1 (SHA/config) + stage 2
      # (包级) 合并, sdk_packages 与撤销后的变更标记以 stage 2 输出为准。
      - name: Extract IB params & finalize changes
        id: finalize-changes
        run: |
          set +e
          echo '[]' > /tmp/target_changes.json
          while IFS= read -r STAGE; do
            [ -n "$STAGE" ] || continue
            MATRIX_TARGET=$(echo "$STAGE" | jq -r '.target')
            CURR_SRC=$(echo "$STAGE" | jq -r '.curr_src')
            CURR_PKG=$(echo "$STAGE" | jq -r '.curr_pkg')
            CURR_STD_PKG=$(echo "$STAGE" | jq -r '.curr_std_pkg')
            CURR_CFG=$(echo "$STAGE" | jq -r '.curr_cfg')
            SOURCE_CHANGED=$(echo "$STAGE" | jq -r '.src_changed')
            KERNEL_CHANGED=$(echo "$STAGE" | jq -r '.kernel_changed')
            CONFIG_CHANGED=$(echo "$STAGE" | jq -r '.config_changed')
            PKG_STAGE=$(jq -c --arg t "$MATRIX_TARGET" 'select(.target == $t)' /tmp/target_pkg_stage.jsonl)
            if [ -z "$PKG_STAGE" ]; then
              # stage 2 对每个 stage 1 条目必然落盘一行; 缺失即上游 step 逻辑断裂, 快速失败
              echo "::error::[${MATRIX_TARGET}] 缺少包级检测阶段结果, 中止"
              exit 1
            fi
            IB_PACKAGES=""; IB_PROFILES=""

            # ── 提取 IB packages 与 profiles（从 seed 文件在 plan 侧预计算，executor 直接收）──
            # seed 已在 sparse checkout 中；提取公式与 executor 原逻辑一致，
            # 使 executor 的 Build firmware via IB 步骤从"自算"改为"忠实执行"。
            SEED_DIR="${GITHUB_WORKSPACE}/AutoWorkFlows/openwrt-configs/immortalwrt/${MATRIX_TARGET}"
            if [ -d "$SEED_DIR" ]; then
              IB_PACKAGES=$(find "$SEED_DIR" -type f -name '*.seed' -print0 | xargs -0 cat | \
                grep -E '^CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]+=y$' | \
                sed -E 's/CONFIG_PACKAGE_([^=]+)=y/\1/' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
              IB_EXCLUDES=$(find "$SEED_DIR" -type f -name '*.seed' -print0 | xargs -0 cat | \
                grep -E '^# CONFIG_PACKAGE_[a-z0-9][a-z0-9+._-]+ is not set$' | \
                sed -E 's/^# CONFIG_PACKAGE_([^ ]+) is not set$/-\1/' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
              IB_PACKAGES="${IB_PACKAGES} ${IB_EXCLUDES}"
              IB_PACKAGES=$(echo "$IB_PACKAGES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
              IB_PROFILES=$(grep -hoE '^CONFIG_TARGET_(DEVICE_)?[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_-]+=y$' "$SEED_DIR"/*.seed 2>/dev/null | \
                sed -E 's/^CONFIG_TARGET_(DEVICE_)?.*_DEVICE_([^=]+)=y/\2/' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
            fi

            # 包级结果合入: sdk_packages 与撤销后的变更标记以 stage 2 输出为准
            SDK_PKGS_FINAL=$(echo "$PKG_STAGE" | jq -r '.sdk_packages')
            PKG_CHANGED_FINAL=$(echo "$PKG_STAGE" | jq -r '.pkg_changed')
            STD_PKG_CHANGED_FINAL=$(echo "$PKG_STAGE" | jq -r '.std_pkg_changed')
            jq --arg t "$MATRIX_TARGET" --arg src "$CURR_SRC" --arg pkg "$CURR_PKG" --arg std_pkg "$CURR_STD_PKG" \
              --arg cfg "$CURR_CFG" \
              --arg sdk_pkgs "$SDK_PKGS_FINAL" \
              --arg ib_pkgs "$IB_PACKAGES" --arg ib_profiles "$IB_PROFILES" \
              --argjson src_changed "$SOURCE_CHANGED" --argjson pkg_changed "$PKG_CHANGED_FINAL" \
              --argjson standard_packages_changed "$STD_PKG_CHANGED_FINAL" \
              --argjson kernel_changed "$KERNEL_CHANGED" \
              --argjson config_changed "$CONFIG_CHANGED" \
              '. + [{target:$t, current_source_sha:$src, current_packages_sha:$pkg, current_standard_packages_sha:$std_pkg, current_config_sha:$cfg, sdk_packages:$sdk_pkgs, ib_packages:$ib_pkgs, ib_profiles:$ib_profiles, source_changed:$src_changed, packages_changed:$pkg_changed, standard_packages_changed:$standard_packages_changed, kernel_changed:$kernel_changed, config_changed:$config_changed}]' \
              /tmp/target_changes.json > /tmp/target_changes.new
            mv /tmp/target_changes.new /tmp/target_changes.json
          done < /tmp/target_stage.jsonl

      # ── 决策信号: 综合 trigger + 变更检测结果 ──
      - name: Decide build mode
        id: decision
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TRIGGER="${{ github.event.inputs.trigger || 'smart' }}"
          CACHE_STRATEGY="${{ github.event.inputs.cache_strategy || 'smart' }}"
          case "$CACHE_STRATEGY" in
            smart|clean-toolchain|clean-ccache|clean-all|no-cache) ;;
            *)
              echo "::warning::未知缓存策略 '$CACHE_STRATEGY', 回退到 smart"
              CACHE_STRATEGY=smart
              ;;
          esac
          echo "cache_strategy=$CACHE_STRATEGY" >> "$GITHUB_OUTPUT"
          FILTERED=$(cat /tmp/filtered_targets.json)
          CHANGES=$(cat /tmp/target_changes.json)
          echo '[]' > /tmp/target_plan.json

          probe_index() {
            local KIND="$1" TAG="$2" REPO="$3" INDEX_NAME="$4" MATRIX_TARGET="$5"
            local PROBE_DIR="/tmp/${KIND}-probe-${MATRIX_TARGET}"
            rm -rf "$PROBE_DIR"
            mkdir -p "$PROBE_DIR"
            if ! gh release download "$TAG" --repo "$REPO" --pattern "$INDEX_NAME" -D "$PROBE_DIR"; then
              echo "::warning::[${MATRIX_TARGET}] 无法下载 ${REPO}@${TAG} 的 ${INDEX_NAME}"
              return 1
            fi
            if ! jq -e '
              if type == "object" then
                [to_entries[] | select(.value.file != null and .value.file != "")]
                | sort_by(.value.built_at)
                | last
                | select(. != null
                         and (.value.sha256 // "") != ""
                         and (.value.source_sha // "") != "")
              else empty end
            ' "$PROBE_DIR/$INDEX_NAME" > "$PROBE_DIR/selected.json"; then
              echo "::warning::[${MATRIX_TARGET}] ${INDEX_NAME} 没有完整的 file/sha256/source_sha 记录"
              return 1
            fi
            local ARTIFACT_FILE
            ARTIFACT_FILE=$(jq -r '.value.file' "$PROBE_DIR/selected.json")
            if ! gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets | map(.name) | contains([\"${ARTIFACT_FILE}\", \"${ARTIFACT_FILE}.sha256\"])" \
              | grep -qx true; then
              echo "::warning::[${MATRIX_TARGET}] ${INDEX_NAME} 指向的 ${ARTIFACT_FILE} 或校验文件不存在"
              return 1
            fi
          }

          for MATRIX_TARGET in $(echo "$FILTERED" | jq -r '.[].target'); do
            TARGET_CONFIG=$(echo "$FILTERED" | jq -c --arg t "$MATRIX_TARGET" '.[] | select(.target==$t)')
            CHANGE=$(echo "$CHANGES" | jq -c --arg t "$MATRIX_TARGET" '.[] | select(.target==$t)')
            SRC_CHANGED=$(echo "$CHANGE" | jq -r '.source_changed')
            PKG_CHANGED=$(echo "$CHANGE" | jq -r '.packages_changed')
            STANDARD_PKG_CHANGED=$(echo "$CHANGE" | jq -r '.standard_packages_changed')
            CONFIG_CHANGED=$(echo "$CHANGE" | jq -r '.config_changed // false')
            SDK_READY=true; IB_READY=true
            SHOULD_FW=false; SHOULD_SDK_IB=false; SHOULD_SDK_PKGS=false
            SHOULD_PUB_FW=false; SHOULD_PUB_PKGS=false
            BUILD_MODE=skip

            ARTIFACTS_TAG=$(echo "$TARGET_CONFIG" | jq -r '.artifacts_release_tag')
            ARTIFACTS_REPO=$(echo "$TARGET_CONFIG" | jq -r '.artifacts_release_repo')

            need_sdk=false
            need_ib=false
            # Non-default cache strategies are a routing decision, not an executor
            # fallback: they always use the full-build workflow so its cache
            # maintenance can perform the requested clean/rebuild operation.
            if [ "$CACHE_STRATEGY" = "smart" ]; then
              if [ "$TRIGGER" = "sdk-packages" ] && [ "$STANDARD_PKG_CHANGED" = "false" ]; then
                need_sdk=true
              elif [ "$TRIGGER" = "smart" ]; then
                # 标准/上游 feed 的变更已在 Stage 1 折入变更包集合 (packages_changed),
                # 由 sdk.config 交集统一路由, 不再一刀切排除增量路径。
                if [ "$SRC_CHANGED" = "false" ] && [ "$PKG_CHANGED" = "true" ] && [ "$CONFIG_CHANGED" = "false" ]; then
                  # Package-only changes use the existing SDK and IB together.
                  need_sdk=true
                  need_ib=true
                fi
              fi

              if [ "$need_sdk" = "true" ] && ! probe_index sdk "$ARTIFACTS_TAG" "$ARTIFACTS_REPO" sdk-index.json "$MATRIX_TARGET"; then
                SDK_READY=false
              fi
              if [ "$need_ib" = "true" ] && ! probe_index ib "$ARTIFACTS_TAG" "$ARTIFACTS_REPO" ib-index.json "$MATRIX_TARGET"; then
                IB_READY=false
              fi
              if [ "$need_sdk" = "true" ] && [ "$need_ib" = "true" ] && \
                 [ "$SDK_READY" = "true" ] && [ "$IB_READY" = "true" ]; then
                SDK_VERSION_KEY=$(jq -r '.key' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
                IB_VERSION_KEY=$(jq -r '.key' "/tmp/ib-probe-${MATRIX_TARGET}/selected.json")
                SDK_SOURCE_SHA=$(jq -r '.value.source_sha' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
                IB_SOURCE_SHA=$(jq -r '.value.source_sha' "/tmp/ib-probe-${MATRIX_TARGET}/selected.json")
                if [ "$SDK_VERSION_KEY" != "$IB_VERSION_KEY" ] || [ "$SDK_SOURCE_SHA" != "$IB_SOURCE_SHA" ]; then
                  echo "::warning::[${MATRIX_TARGET}] 最新 SDK/IB 版本或源码不一致,升级为全量编译"
                  SDK_READY=false
                  IB_READY=false
                fi
              fi
            fi

            if [ "$CACHE_STRATEGY" != "smart" ]; then
              echo "ℹ️ [${MATRIX_TARGET}] cache_strategy=${CACHE_STRATEGY},强制全量编译"
              SHOULD_FW=true; SHOULD_PUB_FW=true
            elif [ "$TRIGGER" = "full" ]; then
              SHOULD_FW=true; SHOULD_PUB_FW=true
            elif [ "$CONFIG_CHANGED" = "true" ] && [ "$TRIGGER" = "smart" ]; then
              echo "🟣 [${MATRIX_TARGET}] 目标配置文件已更新，smart 模式触发全量编译"
              SHOULD_FW=true; SHOULD_PUB_FW=true
            elif [ "$TRIGGER" = "sdk-packages" ]; then
              if [ "$SDK_READY" = "true" ]; then
                SHOULD_SDK_PKGS=true; SHOULD_PUB_PKGS=true
              else
                echo "⚠️ [${MATRIX_TARGET}] SDK 不存在,升级为全量编译"
                SHOULD_FW=true; SHOULD_PUB_FW=true
              fi
            else
              if [ "$SRC_CHANGED" = "false" ] && [ "$PKG_CHANGED" = "false" ]; then
                :
              elif [ "$SRC_CHANGED" = "false" ] && [ "$PKG_CHANGED" = "true" ]; then
                PLANNED_PKGS=$(echo "$CHANGE" | jq -r '.sdk_packages // "*"')
                if [ "$PLANNED_PKGS" = "*" ]; then
                  # 包级指纹判定需全量 (变更包不在 sdk.config 内, Stage 1 设 sdk_packages="*")
                  echo "🟠 [${MATRIX_TARGET}] 变更包不在 sdk.config 内,升级全量编译"
                  SHOULD_FW=true; SHOULD_PUB_FW=true
                elif [ "$SDK_READY" = "true" ] && [ "$IB_READY" = "true" ]; then
                  SHOULD_SDK_PKGS=true; SHOULD_SDK_IB=true
                  SHOULD_PUB_PKGS=true; SHOULD_PUB_FW=true
                else
                  echo "⚠️ [${MATRIX_TARGET}] SDK 或 IB 不存在,升级为全量编译"
                  SHOULD_FW=true; SHOULD_PUB_FW=true
                fi
              else
                # Any source change invalidates the incremental SDK/IB path.
                SHOULD_FW=true; SHOULD_PUB_FW=true
              fi
            fi

            if [ "$SHOULD_FW" = "true" ]; then BUILD_MODE=firmware
            elif [ "$SHOULD_SDK_IB" = "true" ]; then BUILD_MODE=sdk-ib
            elif [ "$SHOULD_SDK_PKGS" = "true" ]; then BUILD_MODE=packages
            fi

            # ── P2: plan 下传 SDK/IB 文件解析 (executor 不再自行选文件) ──
            # probe_index 成功时 selected.json 已含 {key: 版本, value: {file, sha256, source_sha}};
            # 未探测 (skip/firmware 模式) 时字段留空, 不写入 plan。
            SDK_FILE=""; SDK_VERSION=""; SDK_SHA256=""; SDK_SOURCE_SHA=""; IB_FILE=""; IB_VERSION=""
            if [ -f "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json" ]; then
              SDK_FILE=$(jq -r '.value.file // empty' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
              SDK_VERSION=$(jq -r '.key // empty' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
              SDK_SHA256=$(jq -r '.value.sha256 // empty' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
              SDK_SOURCE_SHA=$(jq -r '.value.source_sha // empty' "/tmp/sdk-probe-${MATRIX_TARGET}/selected.json")
            fi
            if [ -f "/tmp/ib-probe-${MATRIX_TARGET}/selected.json" ]; then
              IB_FILE=$(jq -r '.value.file // empty' "/tmp/ib-probe-${MATRIX_TARGET}/selected.json")
              IB_VERSION=$(jq -r '.key // empty' "/tmp/ib-probe-${MATRIX_TARGET}/selected.json")
            fi

            jq --argjson config "$TARGET_CONFIG" --arg mode "$BUILD_MODE" \
              --argjson sdk_ready "$SDK_READY" --argjson ib_ready "$IB_READY" \
              --argjson fw "$SHOULD_FW" --argjson sdk_ib "$SHOULD_SDK_IB" --argjson pkgs "$SHOULD_SDK_PKGS" \
              --argjson pub_fw "$SHOULD_PUB_FW" --argjson pub_pkgs "$SHOULD_PUB_PKGS" \
              --argjson change "$CHANGE" \
              --arg planned_pkgs "$(echo "$CHANGE" | jq -r '.sdk_packages // "*"')" \
              --arg sdk_file "$SDK_FILE" --arg sdk_version "$SDK_VERSION" \
              --arg sdk_sha256 "$SDK_SHA256" --arg sdk_source_sha "$SDK_SOURCE_SHA" \
              --arg ib_file "$IB_FILE" --arg ib_version "$IB_VERSION" \
              '. + [$config + $change + {sdk_packages:$planned_pkgs, sdk_ready:$sdk_ready, ib_ready:$ib_ready, build_mode:$mode, build_firmware:$fw, build_sdk_ib:$sdk_ib, build_sdk_pkgs:$pkgs, publish_firmware:$pub_fw, publish_pkgs:$pub_pkgs}
                + (if $sdk_file != "" then {sdk_file:$sdk_file} else {} end)
                + (if $sdk_version != "" then {sdk_version:$sdk_version} else {} end)
                + (if $sdk_sha256 != "" then {sdk_sha256:$sdk_sha256} else {} end)
                + (if $sdk_source_sha != "" then {sdk_source_sha:$sdk_source_sha} else {} end)
                + (if $ib_file != "" then {ib_file:$ib_file} else {} end)
                + (if $ib_version != "" then {ib_version:$ib_version} else {} end)]' \
              /tmp/target_plan.json > /tmp/target_plan.new
            mv /tmp/target_plan.new /tmp/target_plan.json
          done

          PLAN=$(jq -c . /tmp/target_plan.json)
          HAS_FW=$(echo "$PLAN" | jq -r 'any(.[]; .build_firmware)')
          HAS_PKGS=$(echo "$PLAN" | jq -r 'any(.[]; .build_sdk_pkgs and (.build_sdk_ib | not))')
          HAS_SDK_IB=$(echo "$PLAN" | jq -r 'any(.[]; .build_sdk_ib)')
          PUB_FW=$(echo "$PLAN" | jq -r 'any(.[]; .publish_firmware)')
          PUB_PKGS=$(echo "$PLAN" | jq -r 'any(.[]; .publish_pkgs)')
          echo "firmware_matrix_json=$(echo "$PLAN" | jq -c '[.[] | select(.build_firmware)]')" >> $GITHUB_OUTPUT
          echo "sdk_ib_matrix_json=$(echo "$PLAN" | jq -c '[.[] | select(.build_sdk_ib)]')" >> $GITHUB_OUTPUT
          echo "packages_matrix_json=$(echo "$PLAN" | jq -c '[.[] | select(.build_sdk_pkgs and (.build_sdk_ib | not))]')" >> $GITHUB_OUTPUT
          echo "has_firmware=$(echo "$PLAN" | jq -r 'any(.[]; .build_firmware)')" >> $GITHUB_OUTPUT
          echo "has_sdk_ib=$HAS_SDK_IB" >> $GITHUB_OUTPUT
          echo "has_packages=$HAS_PKGS" >> $GITHUB_OUTPUT

          TARGETS=$(echo "$FILTERED" | jq -r '.[].target' | tr '\n' ' ' | sed 's/ $//')
          VER="${{ steps.version.outputs.version }}"
          {
            echo "## 🎯 Build Decision"
            echo ""
            echo "**触发**: \`${TRIGGER}\` | **目标**: \`${{ github.event.inputs.target || 'all' }}\` | **缓存**: \`${CACHE_STRATEGY}\`"
            echo ""
            echo "**计划版本**: \`${VER}\`"
            echo ""
            echo "**构建目标**: \`${TARGETS}\`"
            echo ""
            echo "| 目标 | 源码 | 插件 feed | 标准 packages | Kernel | SDK | IB | 模式 |"
            echo "|---|---|---|---|---|---|---|---|"
            echo "$PLAN" | jq -r '.[] | "| `\(.target)` | \(.source_changed) | \(.packages_changed) | \(.standard_packages_changed) | \(.kernel_changed) | \(.sdk_ready) | \(.ib_ready) | `\(.build_mode)` |"'
            echo ""
            echo "### 📦 本次工作内容"
            echo ""
            if [ "$HAS_FW" = "true" ]; then
              echo "- 🔨 **compile-firmware**: 全量编译固件 + 生成 SDK/IB 上传 (同一 artifacts-* tag)"
            fi
            if [ "$HAS_SDK_IB" = "true" ]; then
              echo "- 📦 **SDK + IB**: 同一工作流编译软件包并生成增量固件"
            fi
            if [ "$HAS_PKGS" = "true" ]; then
              echo "- 📦 **compile-packages**: 基于 SDK 增量编译软件包 → packages tag"
            fi
            if [ "$PUB_FW" = "true" ]; then
              echo "- 🚀 **release**: 发布固件到 \`${VER}\` release"
            fi
            if [ "$PUB_PKGS" = "true" ]; then
              echo "- 🚀 **release**: 发布软件包到 packages tag"
            fi
            if [ "$HAS_FW" != "true" ] && [ "$HAS_SDK_IB" != "true" ] && [ "$HAS_PKGS" != "true" ]; then
              echo "- ⏭️ **无构建任务** (无变更或模式不匹配)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════ run-firmware (全量编译) ════════════════════
  run-firmware:
    name: Compile Firmware / ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_firmware == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.firmware_matrix_json) }}
    uses: ./.github/workflows/compile-firmware.yml
    with:
      defaults_ref:               ${{ github.ref }}
      matrix_target:             ${{ matrix.target }}
      matrix_repo:               ${{ matrix.repo }}
      matrix_ref:                ${{ matrix.ref }}
      matrix_packages_branch:    ${{ matrix.packages_branch }}
      standard_packages_repo:     ${{ matrix.standard_packages_repo }}
      standard_packages_branch:   ${{ matrix.standard_packages_branch }}
      matrix_release_repo:       ${{ matrix.release_repo }}
      matrix_firmware_release_tag_prefix: ${{ matrix.firmware_release_tag_prefix }}
      matrix_passwall_repo:      ${{ matrix.passwall_repo }}
      matrix_passwall_tag:        ${{ matrix.passwall_tag }}
      matrix_artifacts_release_repo: ${{ matrix.artifacts_release_repo }}
      matrix_artifacts_release_tag:  ${{ matrix.artifacts_release_tag }}
      matrix_artifacts_keep_versions: ${{ matrix.artifacts_keep_versions }}
      matrix_config_sha:          ${{ matrix.current_config_sha }}
      packages_feed_repo:        ${{ matrix.packages_feed_repo }}
      packages_feed_name:        ${{ matrix.packages_feed_name }}
      version:                   ${{ needs.plan.outputs.version }}
      cache_strategy:            ${{ needs.plan.outputs.cache_strategy }}
      free_disk_space:           ${{ github.event.inputs.free_disk_space == 'true' }}
      publish_sdk_ib:             true
    secrets:
      ACCESS_TOKEN:         ${{ secrets.ACCESS_TOKEN }}
      APK_BUILD_KEY:        ${{ secrets.APK_BUILD_KEY }}
      USIGN_KEY:            ${{ secrets.USIGN_KEY }}
    concurrency:
      group: compile-fw-${{ matrix.target }}-${{ needs.plan.outputs.version }}
      cancel-in-progress: false

  # ════════════════════ run-sdk-ib (SDK 编译 + IB 重打包) ════════════════════
  run-sdk-ib:
    name: SDK + IB / ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_sdk_ib == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.sdk_ib_matrix_json) }}
    uses: ./.github/workflows/compile-packages.yml
    with:
      defaults_ref:               ${{ github.ref }}
      matrix_target:             ${{ matrix.target }}
      matrix_packages_branch:    ${{ matrix.packages_branch }}
      standard_packages_repo:     ${{ matrix.standard_packages_repo }}
      standard_packages_branch:   ${{ matrix.standard_packages_branch }}
      matrix_release_repo:       ${{ matrix.release_repo }}
      matrix_firmware_release_tag_prefix: ${{ matrix.firmware_release_tag_prefix }}
      matrix_passwall_repo:      ${{ matrix.passwall_repo }}
      matrix_passwall_tag:       ${{ matrix.passwall_tag }}
      matrix_artifacts_release_repo: ${{ matrix.artifacts_release_repo }}
      matrix_artifacts_release_tag:  ${{ matrix.artifacts_release_tag }}
      matrix_build_sdk_ib:       true
      # sdk-ib 只重编变更包 (plan 计算 ∩ sdk.config 范围)，IB 基线保留其余包的旧版本
      matrix_sdk_packages:     ${{ matrix.sdk_packages }}
      ib_packages:             ${{ matrix.ib_packages }}
      ib_profiles:             ${{ matrix.ib_profiles }}
      # P2: SDK/IB 文件解析由 plan 完成, executor 透传 (本地回退仅兜底)
      matrix_sdk_file:         ${{ matrix.sdk_file }}
      matrix_sdk_version:      ${{ matrix.sdk_version }}
      matrix_sdk_sha256:       ${{ matrix.sdk_sha256 }}
      matrix_sdk_source_sha:   ${{ matrix.sdk_source_sha }}
      matrix_ib_file:          ${{ matrix.ib_file }}
      matrix_ib_version:       ${{ matrix.ib_version }}
      matrix_config_sha:          ${{ matrix.current_config_sha }}
      packages_feed_repo:        ${{ matrix.packages_feed_repo }}
      packages_feed_name:        ${{ matrix.packages_feed_name }}
      version:                   ${{ needs.plan.outputs.version }}
      cache_strategy:            ${{ needs.plan.outputs.cache_strategy }}
    secrets:
      ACCESS_TOKEN:         ${{ secrets.ACCESS_TOKEN }}
      APK_BUILD_KEY:        ${{ secrets.APK_BUILD_KEY }}
      USIGN_KEY:            ${{ secrets.USIGN_KEY }}
    concurrency:
      group: repack-ib-${{ matrix.target }}-${{ needs.plan.outputs.version }}
      cancel-in-progress: false

  # ════════════════════ run-packages (SDK 编译软件包) ════════════════════
  run-packages:
    name: Compile Packages / ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.packages_matrix_json) }}
    uses: ./.github/workflows/compile-packages.yml
    with:
      defaults_ref:               ${{ github.ref }}
      matrix_target:             ${{ matrix.target }}
      matrix_packages_branch:    ${{ matrix.packages_branch }}
      standard_packages_repo:     ${{ matrix.standard_packages_repo }}
      standard_packages_branch:   ${{ matrix.standard_packages_branch }}
      matrix_passwall_repo:      ${{ matrix.passwall_repo }}
      matrix_firmware_release_tag_prefix: ${{ matrix.firmware_release_tag_prefix }}
      matrix_passwall_tag:       ${{ matrix.passwall_tag }}
      matrix_artifacts_release_repo: ${{ matrix.artifacts_release_repo }}
      matrix_artifacts_release_tag:  ${{ matrix.artifacts_release_tag }}
      matrix_sdk_packages:       ${{ matrix.sdk_packages }}
      # P2: SDK 文件解析由 plan 完成, executor 透传 (本地回退仅兜底)
      matrix_sdk_file:           ${{ matrix.sdk_file }}
      matrix_sdk_version:        ${{ matrix.sdk_version }}
      matrix_sdk_sha256:         ${{ matrix.sdk_sha256 }}
      matrix_sdk_source_sha:     ${{ matrix.sdk_source_sha }}
      matrix_config_sha:          ${{ matrix.current_config_sha }}
      packages_feed_repo:        ${{ matrix.packages_feed_repo }}
      packages_feed_name:        ${{ matrix.packages_feed_name }}
      version:                   ${{ needs.plan.outputs.version }}
      cache_strategy:            ${{ needs.plan.outputs.cache_strategy }}
    secrets:
      ACCESS_TOKEN:         ${{ secrets.ACCESS_TOKEN }}
      APK_BUILD_KEY:        ${{ secrets.APK_BUILD_KEY }}
      USIGN_KEY:            ${{ secrets.USIGN_KEY }}
    concurrency:
      group: compile-pkgs-${{ matrix.target }}-${{ needs.plan.outputs.version }}
      cancel-in-progress: false

  # ════════════════════ persist-state: 仅合并已发布构建状态 ════════════════════
  # 发布在各 reusable executor 内完成；本 job 只持久化其中已成功发布的 target SHA。
  persist-state:
    name: Persist build state
    needs: [plan, run-firmware, run-sdk-ib, run-packages]
    if: |
      always() &&
      !cancelled() &&
      (
        (needs.plan.outputs.has_firmware == 'true' && needs.run-firmware.result != 'skipped' && needs.run-firmware.result != 'cancelled') ||
        (needs.plan.outputs.has_sdk_ib == 'true' && needs.run-sdk-ib.result != 'skipped' && needs.run-sdk-ib.result != 'cancelled') ||
        (needs.plan.outputs.has_packages == 'true' && needs.run-packages.result != 'skipped' && needs.run-packages.result != 'cancelled')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download published-state artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: published-state
          pattern: '*-published-state'
          # 刻意不加 merge-multiple: true! 各 executor 上传的内部文件都是 build-info.json,
          # merge-multiple 会把它们解压到同一目录导致同名文件互相覆盖
          # (run 31878516045 只合并到 1 个 target, qualcommax 状态丢失)。
          # 保留 artifact 子目录, 由 Merge 步骤 find 遍历 (见下)。

      - name: Merge published build state
        id: merge-state
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          STATE=$(gh api "repos/${{ github.repository }}/actions/variables/IMMWRT_BUILD_STATE" \
            --jq '.value // "{}"' 2>/dev/null || echo '{}')
          echo "$STATE" | jq -e 'type == "object"' >/dev/null 2>&1 || STATE='{}'
          printf '%s\n' "$STATE" > build-state.json

          MERGED_COUNT=0
          # download-artifact 保留 artifact 名子目录 (published-state/<artifact-name>/build-info.json),
          # find 遍历所有 artifact 的 build-info.json, 免疫同名覆盖与 artifact 数量变化。
          while IFS= read -r info; do
            [ -f "$info" ] || continue
            STATE_TARGET=$(jq -r '.target // empty' "$info" 2>/dev/null)
            SRC_SHA=$(jq -r '.source_sha // empty' "$info" 2>/dev/null)
            PKG_SHA=$(jq -r '.packages_sha // empty' "$info" 2>/dev/null)
            STD_PKG_REPO=$(jq -r '.standard_packages_repo // empty' "$info" 2>/dev/null)
            STD_PKG_BRANCH=$(jq -r '.standard_packages_branch // empty' "$info" 2>/dev/null)
            STD_PKG_SHA=$(jq -r '.standard_packages_sha // empty' "$info" 2>/dev/null)
            CFG_SHA=$(jq -r '.config_sha // empty' "$info" 2>/dev/null)
            FEED_TREES_JSON=$(jq -c '.feed_trees // {}' "$info" 2>/dev/null || echo '{}')
            FEEDS_SHA_JSON=$(jq -c '.feeds_sha // {}' "$info" 2>/dev/null || echo '{}')
            [ -z "$STATE_TARGET" ] && continue
            echo "ℹ️ 合并状态来自 $(basename "$(dirname "$info")") → ${STATE_TARGET}"
            jq --arg target "$STATE_TARGET" --arg src "$SRC_SHA" --arg pkg "$PKG_SHA" \
              --arg std_pkg_repo "$STD_PKG_REPO" --arg std_pkg_branch "$STD_PKG_BRANCH" --arg std_pkg_sha "$STD_PKG_SHA" \
              --arg cfg "$CFG_SHA" \
              --argjson feed_trees "$FEED_TREES_JSON" \
              --argjson feeds_sha "$FEEDS_SHA_JSON" \
              --arg mode "$(jq -r '.build_mode // "unknown"' "$info" 2>/dev/null)" \
              --arg now "$(date +'%Y-%m-%d %H:%M:%S')" \
              '.[$target] = (((.[$target] // {})
                + (if $src != "" then {source_sha:$src} else {} end)
                + (if $pkg != "" then {packages_sha:$pkg} else {} end)
                + (if $std_pkg_repo != "" then {standard_packages_repo:$std_pkg_repo} else {} end)
                + (if $std_pkg_branch != "" then {standard_packages_branch:$std_pkg_branch} else {} end)
                + (if $std_pkg_sha != "" then {standard_packages_sha:$std_pkg_sha} else {} end)
                + (if $cfg != "" then {config_sha:$cfg} else {} end)
                + (if ($feed_trees | length) > 0 then {feed_trees:$feed_trees} else {} end)
                + (if ($feeds_sha | length) > 0 then {feeds_sha:$feeds_sha} else {} end)
                + {last_build:$now, last_mode:$mode}) | del(.packages))' \
              build-state.json > build-state.new
            mv build-state.new build-state.json
            MERGED_COUNT=$((MERGED_COUNT + 1))
          done < <(find published-state -name 'build-info.json' -type f 2>/dev/null | sort)
          echo "merged_count=${MERGED_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$MERGED_COUNT" -eq 0 ]; then
            echo "::notice::没有成功 target 的 published-state artifact,跳过状态写入"
          else
            echo "✅ 已合并 ${MERGED_COUNT} 个成功 target 的发布状态"
          fi
          cat build-state.json

      - name: Persist state to Repository Variable
        if: steps.merge-state.outputs.merged_count != '0'
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # jq -c 输出紧凑 JSON (保留字符串内部空格, 如 last_build 时间戳), 避免 tr 误删
          STATE_VAL=$(jq -c . build-state.json 2>/dev/null || cat build-state.json)
          # Variable 值 ≤48KB, build-state.json 仅几百字节, 安全。
          if gh api "repos/${{ github.repository }}/actions/variables/IMMWRT_BUILD_STATE" --jq .name &>/dev/null; then
            gh api -X PATCH "repos/${{ github.repository }}/actions/variables/IMMWRT_BUILD_STATE" \
              -f name=IMMWRT_BUILD_STATE -f value="$STATE_VAL" 2>/dev/null && \
              echo "✅ 已更新 IMMWRT_BUILD_STATE Variable" || \
              echo "⚠️ Variable 更新失败 (需 PAT 的 repo 权限, 不影响本次构建)"
          else
            gh api -X POST "repos/${{ github.repository }}/actions/variables" \
              -f name=IMMWRT_BUILD_STATE -f value="$STATE_VAL" 2>/dev/null && \
              echo "✅ 已创建 IMMWRT_BUILD_STATE Variable" || \
              echo "⚠️ Variable 创建失败 (需 PAT 的 repo 权限, 不影响本次构建)"
          fi
