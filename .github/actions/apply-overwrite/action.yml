name: "Apply Overwrite"
description: "应用 global 与 target 专属文件覆盖层，并自动提交变动"

inputs:
  overwrite-base-dir:
    description: "覆盖层根目录路径（应包含 global 与各个 target 子目录）"
    required: true
  target:
    description: "当前构建目标名称（可选，如 mt798x, qualcommax 等）"
    required: false
    default: ""
  working-directory:
    description: "目标代码仓库工作目录"
    required: false
    default: "."
  commit-prefix:
    description: "Git 提交信息前缀"
    required: false
    default: "apply overwrite"
  commit:
    description: "是否自动执行 git commit 提交变更 (true/false)"
    required: false
    default: "true"

outputs:
  overwrite-applied:
    description: "是否有覆盖层变动被应用/提交 (true/false)"
    value: ${{ steps.overwrite.outputs.changed }}

runs:
  using: "composite"
  steps:
    - name: 应用文件覆盖层
      id: overwrite
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        BASE_DIR="${{ inputs.overwrite-base-dir }}"
        TARGET="${{ inputs.target }}"
        PREFIX="${{ inputs.commit-prefix }}"
        SHOULD_COMMIT="${{ inputs.commit }}"
        has_changed=false

        apply_dir() {
          local dir="$1"
          local desc="$2"
          if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "::group::应用覆盖层: $desc ($dir)"
            local count=0
            while IFS= read -r -d '' f; do
              local rel="${f#"$dir"/}"
              mkdir -p "$(dirname "$rel")"
              cp -f "$f" "$rel"
              echo "覆写: $rel"
              count=$((count + 1))
            done < <(find "$dir" -type f -print0 | sort -z)

            if [ "$SHOULD_COMMIT" = "true" ]; then
              git status -s
              if [ -n "$(git status --porcelain)" ]; then
                git add -A -- ':!AutoWorkFlows' ':!.github'
                git diff --cached --raw 2>/dev/null | awk '$2 ~ /^160000/ || $1 ~ /^:160000/ {print $6}' | xargs -r git rm --cached -f 2>/dev/null || true
                if ! git diff --cached --quiet; then
                  git commit -m "${PREFIX}: ${desc}"
                  echo "✅ 成功提交覆盖层变更: $desc"
                  has_changed=true
                fi
              else
                echo "ℹ️ 覆盖层无内容变更: $desc"
              fi
            else
              echo "ℹ️ 跳过自动提交 (commit=false)，已覆写 $count 个文件: $desc"
              if [ "$count" -gt 0 ]; then
                has_changed=true
              fi
            fi
            echo "::endgroup::"
          fi
        }

        apply_dir "${BASE_DIR}/global" "global 覆盖层"
        if [ -n "$TARGET" ]; then
          apply_dir "${BASE_DIR}/${TARGET}" "${TARGET} 覆盖层"
        fi

        echo "changed=${has_changed}" >> "$GITHUB_OUTPUT"
